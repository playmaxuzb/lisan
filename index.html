رِمٌ لَكِنَّهُ عَادِلٌ.|Мой начальник строгий, но справедливый.\nعِنْدَنَا اجْتِمَاعٌ فِي السَّاعَةِ الْعَاشِرَةِ.|У нас совещание в десять часов.\nيَجِبُ أَنْ أُنْهِيَ التَّقْرِيرَ قَبْلَ الْجُمُعَةِ.|Мне нужно закончить отчёт к пятнице.\nأَرْسَلْتُ سِيرَتِي الذَّاتِيَّةَ إِلَى خَمْسِ شَرِكَاتٍ.|Я отправил резюме в пять компаний.\nدُعِيتُ إِلَى مُقَابَلَةِ عَمَلٍ.|Меня пригласили на собеседование.\nهَلْ لَدَيْكَ خِبْرَةٌ فِي الْعَمَلِ؟|У вас есть опыт работы?\nكَمِ الرَّاتِبُ فِي هَذَا الْمَنْصِبِ؟|Какая зарплата на этой должности?\nسَآخُذُ إِجَازَةً فِي يُولْيُو.|Я беру отпуск в июле.\nزُمَلَائِي وُدُّودُونَ جِدًّا.|Мои коллеги очень дружелюбные.\nحَقَّقَتْ مَسِيرَةً مِهْنِيَّةً جَيِّدَةً.|Она сделала хорошую карьеру.\nأَدْرُسُ فِي السَّنَةِ الثَّالِثَةِ.|Я учусь на третьем курсе.\nغَدًا عِنْدِي امْتِحَانٌ فِي التَّارِيخِ.|Завтра у меня экзамен по истории.\nنَجَحْتُ فِي الِامْتِحَانِ بِعَلَامَةٍ مُمْتَازَةٍ!|Я сдал экзамен на пятёрку!\nالْمُحَاضِرُ يَشْرَحُ بِوُضُوحٍ شَدِيدٍ.|Преподаватель очень понятно объясняет.\nأَسْكُنُ فِي سَكَنٍ طُلَّابِيٍّ.|Я живу в общежитии.\nأَحْتَاجُ قَامُوسًا جَيِّدًا.|Мне нужен хороший словарь.\nأُرِيدُ أَنْ أُصْبِحَ مُتَرْجِمًا.|Я хочу стать переводчиком.\nأَيُّ مَادَّةٍ تُعْجِبُكَ أَكْثَرَ مِنْ غَيْرِهَا؟|Какой предмет тебе нравится больше всего?\nمِنْ دُونِ مَعْرِفَةٍ يَصْعُبُ إِيجَادُ عَمَلٍ.|Без знаний трудно найти работу.\nعِنْدِي حَسَاسِيَّةٌ مِنَ الْمُكَسَّرَاتِ.|У меня аллергия на орехи.\nوَصَفَ لِي الطَّبِيبُ دَوَاءً.|Врач выписал мне лекарство.\nتَنَاوَلْ هَذَا الدَّوَاءَ بَعْدَ الْأَكْلِ.|Принимайте это лекарство после еды.\nيَجِبُ أَنْ أُجْرِيَ تَحْلِيلَ دَمٍ.|Мне надо сдать анализ крови.\nعِنْدَ جَدِّي ضَغْطُ دَمٍ مُرْتَفِعٌ.|У дедушки высокое давление.\nكَسَرَ رِجْلَهُ وَهُوَ يَتَزَلَّجُ.|Он сломал ногу, катаясь на лыжах.\nالتَّدْخِينُ مُضِرٌّ بِالصِّحَّةِ.|Курить вредно для здоровья.\nأُمَارِسُ التَّمَارِينَ كُلَّ صَبَاحٍ.|Я делаю зарядку каждое утро.\nأَنَا أَتَّبِعُ حِمْيَةً، لِذَلِكَ لَا آكُلُ الْحَلْوَى.|Я на диете, поэтому не ем сладкое.\nاعْتَنِ بِنَفْسِكَ!|Берегите себя!\nنَسِيتُ كَلِمَةَ مُرُورِ بَرِيدِي.|Я забыл пароль от почты.\nنَزِّلْ هَذَا التَّطْبِيقَ، إِنَّهُ مُفِيدٌ جِدًّا.|Скачай это приложение, оно очень полезное.\nنَفِدَتْ بَطَّارِيَّةُ هَاتِفِي.|У меня сел телефон.\nأَيْنَ يُمْكِنُنِي شَحْنُ هَاتِفِي؟|Где можно зарядить телефон?\nأَرْسِلْ لِي الْمِلَفَّ بِالْبَرِيدِ.|Пришли мне файл по почте.\nالْإِنْتَرْنِتْ ضَعِيفٌ هُنَا.|Здесь плохо работает интернет.\nلَا تَنْسَ أَنْ تَحْفَظَ الْمُسْتَنَدَ.|Не забудь сохранить документ.\nأَقْرَأُ الْأَخْبَارَ غَالِبًا فِي شَبَكَاتِ التَّوَاصُلِ.|Я часто читаю новости в соцсетях.\nهِيَ صَبُورَةٌ جِدًّا.|Она очень терпеливая.\nأَخِي عَنِيدٌ مِثْلَ الْحِمَارِ.|Мой брат упрямый, как осёл.\nلَا تَكُنْ كَسُولًا هَكَذَا!|Не будь таким ленивым!\nأَنَا مُتَوَتِّرٌ قَبْلَ الْعَرْضِ.|Я нервничаю перед выступлением.\nكَانَتْ مَسْرُورَةً جِدًّا بِالْهَدِيَّةِ.|Она была в восторге от подарка.\nأَنَا خَجِلٌ مِنْ تَصَرُّفِي.|Мне стыдно за своё поведение.\nلَسْتُ غَاضِبًا مِنْكَ.|Я на тебя не сержусь.\nدَعَوْنَا مِئَةَ ضَيْفٍ إِلَى حَفْلِ الزِّفَافِ.|Мы пригласили на свадьбу сто гостей.\nأُهَنِّئُكَ بِعِيدِ مِيلَادِكَ!|Поздравляю тебя с днём рождения!\nتَشَاجَرَا بِسَبَبِ أَمْرٍ تَافِهٍ.|Они поссорились из-за пустяка.\nنَحْنُ أَصْدِقَاءُ مُنْذُ الطُّفُولَةِ.|Мы дружим с детства.\nشُكْرًا عَلَى دَعْمِكَ.|Спасибо за поддержку.\nأَعْتَذِرُ، كُنْتُ مُخْطِئًا.|Прошу прощения, я был неправ.\nأُرِيدُ أَنْ أَفْتَحَ حِسَابًا فِي الْبَنْكِ.|Я хочу открыть счёт в банке.\nكَمْ سِعْرُ صَرْفِ الدُّولَارِ الْيَوْمَ؟|Какой сегодня курс доллара?\nأَدْفَعُ إِيجَارَ الشَّقَّةِ كُلَّ شَهْرٍ.|Я плачу за квартиру каждый месяц.\nنَدَّخِرُ لِشِرَاءِ سَيَّارَةٍ جَدِيدَةٍ.|Мы копим на новую машину.\nأَنْفَقْتُ كُلَّ النُّقُودِ.|Я потратил все деньги.\nهَلْ يُمْكِنُكَ أَنْ تُقْرِضَنِي؟|Ты можешь дать мне в долг?\nالصَّرَّافُ الْآلِيُّ لَا يَعْمَلُ.|Банкомат не работает.\nنَسْتَأْجِرُ شَقَّةً فِي وَسَطِ الْمَدِينَةِ.|Мы снимаем квартиру в центре.\nبَيْتُنَا فِي الطَّابِقِ الْخَامِسِ.|Наш дом на пятом этаже.\nالْمِصْعَدُ مُعَطَّلٌ مَرَّةً أُخْرَى.|Лифт опять сломан.\nيُرَمِّمُونَ الشَّقَّةَ.|В квартире делают ремонт.\nانْتَقَلْنَا إِلَى حَيٍّ جَدِيدٍ.|Мы переехали в новый район.\nعِنْدَنَا تَدْفِئَةٌ جَيِّدَةٌ فِي الشِّتَاءِ.|Зимой у нас хорошее отопление.\nإِذَا كَانَ عِنْدِي وَقْتٌ سَأَتَّصِلُ بِكَ.|Если будет время, я тебе позвоню.\nأَظُنُّ أَنَّكَ عَلَى حَقٍّ.|Я думаю, что ты прав.\nأَنَا لَسْتُ مُوَافِقًا.|Я не согласен.\nيَبْدُو لِي أَنَّهَا سَتُمْطِرُ.|Мне кажется, что будет дождь.\nآمُلُ أَنْ يَكُونَ كُلُّ شَيْءٍ بِخَيْرٍ.|Я надеюсь, что всё будет хорошо.\nأَحْلُمُ مُنْذُ زَمَنٍ بِزِيَارَةِ الْيَابَانِ.|Я давно мечтаю побывать в Японии.\nاشْرَحْ مِنْ فَضْلِكَ مَرَّةً أُخْرَى.|Объясни, пожалуйста, ещё раз.\nلَا أَتَذَكَّرُ أَيْنَ تَرَكْتُ الْمَفَاتِيحَ.|Я не помню, где оставил ключи.\nعَرَضَ عَلَيَّ الْمُسَاعَدَةَ.|Он предложил мне помощь.\nرَفَضَتِ الدَّعْوَةَ.|Она отказалась от приглашения.\nيَجِبُ أَنْ نَتَّفِقَ عَلَى مَوْعِدٍ.|Нам надо договориться о встрече.\nأَذْهَبُ إِلَى الْعَمَلِ مَشْيًا كُلَّ يَوْمٍ.|Я каждый день хожу на работу пешком.\nأَنَا ذَاهِبٌ إِلَى الْمَتْجَرِ الْآنَ.|Сейчас я иду в магазин.\nذَهَبْنَا إِلَى قَازَانَ بِالسَّيَّارَةِ.|Мы ездили в Казань на машине.\nعَادَ إِلَى الْبَيْتِ مُتَأَخِّرًا.|Он пришёл домой поздно.\nلَقَدْ قَرَأْتُ هَذَا الْكِتَابَ.|Я уже прочитал эту книгу.\nكُنْتُ أَقْرَأُ طُوَالَ الْمَسَاءِ.|Я читал весь вечер.\nسَأَفْعَلُ ذَلِكَ غَدًا.|Я сделаю это завтра.\nبَحَثَ عَنْ عَمَلٍ طَوِيلًا وَأَخِيرًا وَجَدَ.|Он долго искал работу и наконец нашёл.\nلَا يُوجَدُ بَحْرٌ فِي مَدِينَتِنَا.|В нашем городе нет моря.\nيُعْجِبُنِي عَمَلِي الْجَدِيدُ.|Мне нравится моя новая работа.\nأَحْتَاجُ إِلَى وَقْتٍ أَكْثَرَ.|Мне нужно больше времени.\nسَأَتَّصِلُ بِأُمِّي فِي الْمَسَاءِ.|Я позвоню маме вечером.\nسَاعِدْنِي مِنْ فَضْلِكَ.|Помоги мне, пожалуйста.\nأَهْتَمُّ بِالتَّارِيخِ.|Я интересуюсь историей.\nهِيَ تُمَارِسُ الرَّقْصَ.|Она занимается танцами.\nأَكْتُبُ بِالْقَلَمِ.|Я пишу ручкой.\nأَشْرَبُ الشَّايَ بِاللَّيْمُونِ.|Я пью чай с лимоном.\nمَاذَا تَفْعَلُ فِي وَقْتِ فَرَاغِكَ؟|Чем ты занимаешься в свободное время?\nأُحِبُّ التَّجَوُّلَ فِي الْمَدِينَةِ الْقَدِيمَةِ.|Мне нравится гулять по старому городу.\nلِتَتَعَلَّمَ لُغَةً يَجِبُ أَنْ تَتَدَرَّبَ كَثِيرًا.|Чтобы выучить язык, нужно много практиковаться.\nأَرْتَكِبُ أَخْطَاءً لَكِنِّي لَا أَخَافُ مِنَ الْكَلَامِ.|Я делаю ошибки, но не боюсь говорить.","grammar":[{"title":"Отрицание","body":"<table><tr><th>Частица</th><th>Время</th><th>Пример</th></tr>\n<tr><td>[[لَا]]</td><td>настоящее</td><td>[[لَا أَفْهَمُ]] я не понимаю</td></tr>\n<tr><td>[[لَمْ]]</td><td>прошедшее (+ форма настоящего!)</td><td>[[لَمْ أَذْهَبْ]] я не пошёл</td></tr>\n<tr><td>[[لَنْ]]</td><td>будущее</td><td>[[لَنْ أَذْهَبَ]] я не пойду</td></tr>\n<tr><td>[[مَا]]</td><td>прошедшее (разговорно)</td><td>[[مَا ذَهَبْتُ]] я не пошёл</td></tr>\n<tr><td>[[لَيْسَ]]</td><td>именное предложение</td><td>[[لَيْسَ عِنْدِي]] у меня нет</td></tr></table>","ex":"لَمْ أَفْهَمْ.|Я не понял.\nلَنْ أَنْسَى.|Я не забуду.\nلَيْسَ هُنَا.|Его здесь нет.","quiz":[["«Я не пошёл» (с لم):","لَمْ أَذْهَبْ","لَمْ ذَهَبْتُ","لَا ذَهَبْتُ"],["«Я не пойду»:","لَنْ أَذْهَبَ","لَمْ أَذْهَبْ","لَيْسَ أَذْهَبُ"]]},{"title":"Будущее время","body":"<p>К глаголу настоящего времени добавляется приставка [[سَـ]] или частица [[سَوْفَ]]:</p>\n<p>[[سَأَكْتُبُ]] = [[سَوْفَ أَكْتُبُ]] я напишу.</p>\n<p class=\"tip\">[[سَوْفَ]] звучит чуть более отдалённо или торжественно.</p>","ex":"سَأَتَّصِلُ بِكَ غَدًا.|Я позвоню тебе завтра.\nسَوْفَ نُسَافِرُ فِي الصَّيْفِ.|Мы поедем летом.","quiz":[["«Я буду читать»:","سَأَقْرَأُ","قَرَأْتُ","لَمْ أَقْرَأْ"]]},{"title":"Идафа (сопряжённая конструкция)","body":"<p>Аналог русского родительного падежа: «книга <b>студента</b>». Первое слово — без артикля и без танвина, второе — в родительном падеже:</p>\n<p>[[كِتَابُ الطَّالِبِ]] книга студента. [[بَابُ الْبَيْتِ]] дверь дома.</p>\n<p class=\"tip\">Первое слово становится определённым благодаря второму, поэтому артикль ему не нужен.</p>","ex":"مَدِينَةُ طَشْقَنْدَ|город Ташкент\nكَلِمَةُ الْمُرُورِ|пароль (букв. «слово прохода»)","quiz":[["«Дверь дома»:","بَابُ الْبَيْتِ","الْبَابُ الْبَيْتُ","بَابٌ بَيْتٌ"]]},{"title":"Двойственное число","body":"<p>В арабском есть особая форма для <b>двух</b> предметов: окончание [[ـَانِ]] (в именительном) или [[ـَيْنِ]] (в остальных падежах).</p>\n<p>[[كِتَابٌ]] книга → [[كِتَابَانِ]] две книги. [[سَاعَةٌ]] час → [[سَاعَتَانِ]] / [[سَاعَتَيْنِ]] два часа.</p>","ex":"عِنْدِي أَخَوَانِ.|У меня два брата.\nرَأَيْتُ طَالِبَيْنِ.|Я видел двух студентов.","quiz":[["«Две книги»:","كِتَابَانِ","كُتُبٌ","كِتَابٌ اثْنَانِ"]]}],"readings":[{"title":"عَمَلُ الْأَحْلَامِ","tr":"Работа мечты","sents":"بَحَثَ صَدِيقِي سِيرْغِي عَنْ عَمَلٍ مُدَّةً طَوِيلَةً.|Мой друг Сергей долго искал работу.\nأَرْسَلَ سِيرَتَهُ الذَّاتِيَّةَ إِلَى عَشْرِ شَرِكَاتٍ، لَكِنْ لَمْ يَرُدَّ أَحَدٌ.|Он отправил резюме в десять компаний, но никто не ответил.\nأَخِيرًا دُعِيَ إِلَى مُقَابَلَةِ عَمَلٍ.|Наконец его пригласили на собеседование.\nكَانَ قَلِقًا جِدًّا، لَكِنَّهُ أَجَابَ عَنْ كُلِّ الْأَسْئِلَةِ.|Он очень волновался, но ответил на все вопросы.\nبَعْدَ أُسْبُوعٍ اتَّصَلُوا بِهِ وَعَرَضُوا عَلَيْهِ الْوَظِيفَةَ.|Через неделю ему позвонили и предложили работу.\nالْآنَ يَعْمَلُ مُبَرْمِجًا وَهُوَ سَعِيدٌ جِدًّا.|Сейчас он работает программистом и очень счастлив.","gloss":"بحث|искал\nصديقي|мой друг\nسيرغي|Сергей\nعمل|работа\nمدة|в течение\nطويلة|долгого (времени)\nأرسل|отправил\nسيرته|его биографию\nالذاتية|(резюме = сира затийя)\nعشر|десять\nشركات|компаний\nلكن|но\nلم|не (прош. вр.)\nيرد|ответил\nأحد|кто-либо\nأخيرا|наконец\nدعي|был приглашён\nمقابلة|собеседование\nقلقا|взволнованным\nلكنه|но он\nأجاب|ответил\nالأسئلة|вопросы\nأسبوع|неделя\nاتصلوا|позвонили\nبه|ему\nوعرضوا|и предложили\nعليه|ему\nالوظيفة|должность, работа\nيعمل|работает\nمبرمجا|программистом\nسعيد|счастлив"},{"title":"يَوْمُ الْعَمَلِ الْأَوَّلُ","tr":"Первый рабочий день","sents":"يَوْمُ الْعَمَلِ الْأَوَّلُ مُثِيرٌ دَائِمًا.|Первый рабочий день — это всегда волнительно.\nوَصَلْتُ إِلَى الْمَكْتَبِ قَبْلَ الْجَمِيعِ، فِي الثَّامِنَةِ.|Я пришёл в офис раньше всех, в восемь часов.\nاسْتَقْبَلَنِي الْمُدِيرُ وَعَرَّفَنِي إِلَى زُمَلَائِي.|Меня встретил начальник и познакомил с коллегами.\nكَانَ الْجَمِيعُ وُدُّودِينَ جِدًّا.|Все были очень дружелюбными.\nأَرَوْنِي مَكَانَ عَمَلِي وَالْحَاسُوبَ.|Мне показали моё рабочее место и компьютер.\nفِي الْبِدَايَةِ قَرَأْتُ الْمُسْتَنَدَاتِ وَدَرَسْتُ الْمَشَارِيعَ.|Сначала я читал документы и изучал проекты.\nفِي الْغَدَاءِ ذَهَبْنَا مَعًا إِلَى الْمَطْعَمِ.|В обед мы вместе пошли в столовую.\nبَعْدَ الْغَدَاءِ كَانَ عِنْدَنَا اجْتِمَاعٌ.|После обеда у нас было совещание.\nكُنْتُ مُتَوَتِّرًا قَلِيلًا لَكِنَّ كُلَّ شَيْءٍ مَرَّ بِخَيْرٍ.|Я немного нервничал, но всё прошло хорошо.\nفِي الْمَسَاءِ كُنْتُ مُتْعَبًا لَكِنِّي رَاضٍ.|Вечером я устал, но был доволен.\nأَظُنُّ أَنَّ الْمَكَانَ سَيُعْجِبُنِي.|Я думаю, что мне здесь понравится.","gloss":""},{"title":"نَمَطُ حَيَاةٍ صِحِّيٌّ","tr":"Здоровый образ жизни","sents":"يُفَكِّرُ كَثِيرٌ مِنَ النَّاسِ الْيَوْمَ فِي صِحَّتِهِمْ.|Сейчас многие люди думают о здоровье.\nيَنْصَحُ الْأَطِبَّاءُ بِالْحَرَكَةِ أَكْثَرَ.|Врачи советуют больше двигаться.\nمِنَ الْمُفِيدِ الْمَشْيُ نِصْفَ سَاعَةٍ يَوْمِيًّا عَلَى الْأَقَلِّ.|Полезно ходить пешком хотя бы полчаса в день.\nمِنَ الْمُهِمِّ أَيْضًا أَنْ نَأْكُلَ بِشَكْلٍ صَحِيحٍ.|Также важно правильно питаться.\nيَجِبُ أَكْلُ الْمَزِيدِ مِنَ الْخُضَارِ وَالْفَوَاكِهِ.|Нужно есть больше овощей и фруктов.\nالْأَفْضَلُ شُرْبُ الْمَاءِ لَا الْمَشْرُوبَاتِ الْحُلْوَةِ.|Лучше пить воду, а не сладкие напитки.\nالنَّوْمُ أَيْضًا مُهِمٌّ جِدًّا.|Сон тоже очень важен.\nيَحْتَاجُ الشَّخْصُ الْبَالِغُ إِلَى النَّوْمِ سَبْعَ إِلَى ثَمَانِي سَاعَاتٍ.|Взрослому человеку нужно спать семь-восемь часов.\nوَطَبْعًا لَا يَنْبَغِي التَّدْخِينُ.|И, конечно, не надо курить.\nالصِّحَّةُ أَهَمُّ شَيْءٍ.|Здоровье — это самое главное.","gloss":""},{"title":"كَيْفَ أَتَعَلَّمُ الرُّوسِيَّةَ","tr":"Как я учу русский","sents":"أَتَعَلَّمُ اللُّغَةَ الرُّوسِيَّةَ مُنْذُ سَنَةٍ.|Я учу русский язык уже год.\nفِي الْبِدَايَةِ كَانَ الْأَمْرُ صَعْبًا جِدًّا.|Сначала было очень трудно.\nلَمْ أَفْهَمْ حَالَاتِ الْإِعْرَابِ وَكُنْتُ أَخْلِطُ النِّهَايَاتِ.|Я не понимал падежи и путал окончания.\nثُمَّ بَدَأْتُ أَسْتَمِعُ إِلَى الْبُودْكَاسْتَاتِ كُلَّ يَوْمٍ.|Потом я начал каждый день слушать подкасты.\nأُشَاهِدُ أَيْضًا الْأَفْلَامَ مَعَ التَّرْجَمَةِ.|Я также смотрю фильмы с субтитрами.\nسَاعَدَنِي أَصْدِقَائِي الرُّوسُ كَثِيرًا.|Мне очень помогли мои русские друзья.\nيُصَحِّحُونَ أَخْطَائِي وَلَا يَضْحَكُونَ.|Они исправляют мои ошибки и не смеются.\nالْآنَ أَسْتَطِيعُ الْكَلَامَ فِي الْمَتْجَرِ وَفِي الْعَمَلِ.|Теперь я могу говорить в магазине и на работе.\nالْأَهَمُّ أَلَّا تَخَافَ مِنَ الْأَخْطَاءِ.|Главное — не бояться ошибок.","gloss":""}],"dialogues":[{"title":"У врача","lines":"A|صَبَاحُ الْخَيْرِ. مِمَّ تَشْكُو؟|Доброе утро. На что жалуетесь?\nB|عِنْدِي أَلَمٌ فِي الْحَلْقِ وَصُدَاعٌ.|У меня болит горло и голова.\nA|مُنْذُ مَتَى؟|Как давно?\nB|مُنْذُ ثَلَاثَةِ أَيَّامٍ. وَكَانَتْ عِنْدِي حُمَّى أَمْسِ.|Три дня. А вчера была температура.\nA|اِفْتَحْ فَمَكَ مِنْ فَضْلِكَ. نَعَمْ، الْحَلْقُ أَحْمَرُ.|Откройте рот, пожалуйста. Да, горло красное.\nB|هَلْ هَذَا خَطِيرٌ؟|Это серьёзно?\nA|لَا، لَا تَقْلَقْ. سَأَكْتُبُ لَكَ دَوَاءً.|Нет, не волнуйтесь. Я выпишу вам лекарство.\nB|كَيْفَ آخُذُهُ؟|Как его принимать?\nA|ثَلَاثَ مَرَّاتٍ يَوْمِيًّا بَعْدَ الْأَكْلِ.|Три раза в день после еды.\nB|شُكْرًا يَا دُكْتُورُ!|Спасибо, доктор!"},{"title":"Собеседование","lines":"A|حَدِّثْنِي عَنْ نَفْسِكَ مِنْ فَضْلِكَ.|Расскажите о себе, пожалуйста.\nB|اسْمِي عُمَرُ. أَنَا مُبَرْمِجٌ وَلَدَيَّ خِبْرَةُ خَمْسِ سَنَوَاتٍ.|Меня зовут Омар. Я програмист, у меня пять лет опыта.\nA|لِمَاذَا تُرِيدُ الْعَمَلَ عِنْدَنَا؟|Почему вы хотите работать у нас?\nB|شَرِكَتُكُمْ مَشْهُورَةٌ، وَمَشَارِيعُكُمْ تَهُمُّنِي.|Ваша компания известная, и мне интересны ваши проекты.\nA|مَا نِقَاطُ قُوَّتِكَ؟|Какие у вас сильные стороны?\nB|أَنَا مَسْؤُولٌ وَأَتَعَلَّمُ بِسُرْعَةٍ.|Я ответственный и быстро учусь.\nA|مَتَى يُمْكِنُكَ أَنْ تَبْدَأَ؟|Когда вы можете начать?\nB|مِنَ الشَّهْرِ الْقَادِمِ.|Со следующего месяца.\nA|حَسَنًا. سَنَتَّصِلُ بِكَ.|Хорошо. Мы вам позвоним."},{"title":"В банке","lines":"A|مَرْحَبًا! أُرِيدُ أَنْ أَفْتَحَ حِسَابًا.|Здравствуйте! Я хочу открыть счёт.\nB|حَسَنًا. جَوَازُ سَفَرِكَ مِنْ فَضْلِكَ.|Хорошо. Ваш паспорт, пожалуйста.\nA|تَفَضَّلْ. وَهَلْ يُمْكِنُنِي الْحُصُولُ عَلَى الْبِطَاقَةِ فَوْرًا؟|Вот. А карту можно получить сразу?\nB|لَا، سَتَكُونُ الْبِطَاقَةُ جَاهِزَةً بَعْدَ أُسْبُوعٍ.|Нет, карта будет готова через неделю.\nA|كَمْ تُكَلِّفُ الْخِدْمَةُ؟|Сколько стоит обслуживание?\nB|السَّنَةُ الْأُولَى مَجَّانِيَّةٌ.|Первый год бесплатно.\nA|مُمْتَازٌ. وَأَيْضًا: هَلْ يُمْكِنُنِي تَبْدِيلُ الدُّولَارَاتِ؟|я могу поменять доллары?\nB|نَعَمْ، الصُّنْدُوقُ عَلَى الْيَسَارِ.|Да, касса слева."},{"title":"Проблема в квартире","lines":"A|أَلُو، هَلْ أَنْتَ صَاحِبُ الشَّقَّةِ؟|Алло, это хозяин квартиры?\nB|نَعَمْ، أَسْمَعُكَ.|Да, слушаю вас.\nA|التَّدْفِئَةُ لَا تَعْمَلُ عِنْدَنَا، وَالشَّقَّةُ بَارِدَةٌ جِدًّا.|У нас не работает отопление, в квартире очень холодно.\nB|فَهِمْتُ. مُنْذُ مَتَى؟|Понятно. Давно?\nA|مُنْذُ مَسَاءِ الْأَمْسِ.|Со вчерашнего вечера.\nB|سَأُرْسِلُ عَامِلَ صِيَانَةٍ غَدًا صَبَاحًا.|Я пришлю мастера завтра утром.\nA|أَلَا يُمْكِنُ الْيَوْمَ؟|А сегодня никак нельзя?\nB|سَأُحَاوِلُ. سَأُعَاوِدُ الِاتِّصَالَ بِكَ بَعْدَ سَاعَةٍ.|Попробую. Я перезвоню вам через час."}]},"B2":{"vocab":[{"t":"Общество и экономика","w":"🏙️|مُجْتَمَعٌ|общество\n🏛️|حُكُومَةٌ|правительство\n⚖️|قَانُونٌ|закон\n🗳️|اِنْتِخَابَاتٌ|выборы\n📉|اِقْتِصَادٌ|экономика\n🧑‍💼|بَطَالَةٌ|безработица"},{"t":"Экология и СМИ","w":"🌳|بِيئَةٌ|окружающая среда\n🏭|تَلَوُّثٌ|загрязнение\n🌍|مُنَاخٌ|климат\n⚡|طَاقَةٌ|энергия\n📰|أَخْبَارٌ|новости\n🗞️|صَحِيفَةٌ|газета\n📝|مَقَالَةٌ|статья\n📢|إِعْلَانٌ|реклама"},{"t ُشْكِلَةِ.|Нам нужно найти решение этой проблемы.\nأَعْتَقِدُ أَنَّ التَّعْلِيمَ مِفْتَاحُ النَّجَاحِ.|Я считаю, что образование — ключ к успеху.\nسَتُجْرَى الِانْتِخَابَاتُ فِي الْعَامِ الْقَادِمِ.|Выборы пройдут в следующем году.\nأَهْتَمُّ بِالسِّيَاسَةِ.|Я интересуюсь политикой.\nيَعْمَلُ صَحَفِيًّا.|Он работает журналистом.\nلِهَذَا الْأُسْلُوبِ مَزَايَا وَعُيُوبٌ.|У этого подхода есть плюсы и минусы.\nقِرَاءَةُ الْكُتُبِ مُفِيدَةٌ.|Чтение книг полезно.\nالْمُعَلِّمَةُ الَّتِي تُدَرِّسُنَا لَطِيفَةٌ.|Учительница, которая нас учит, добрая.\nأَوَدُّ أَنْ أَحْجِزَ طَاوِلَةً لِشَخْصَيْنِ.|Я бы хотел забронировать столик на двоих.\nلَوْ كُنْتُ أَعْرِفُ لَأَخْبَرْتُكَ.|Если бы я знал, я бы тебе сказал.\nكَثِيرٌ مِنَ النَّاسِ يَعْمَلُونَ الْآنَ مِنَ الْبَيْتِ.|Многие люди сейчас работают из дома.\nحَسَبَ رَأْيِ الْخُبَرَاءِ سَيَنْمُو الِاقْتِصَادُ.|По мнению экспертов, экономика будет расти.\nالْأَسْعَارُ تَرْتَفِعُ أَسْرَعَ مِنَ الرَّوَاتِبِ.|Цены растут быстрее, чем зарплаты.\nالْبَطَالَةُ بَيْنَ الشَّبَابِ مُشْكِلَةٌ خَطِيرَةٌ.|Безработица среди молодёжи — серьёзная проблема.\nتُخَصِّصُ الْمَدِينَةُ أَمْوَالًا لِحَدَائِقَ جَدِيدَةٍ.|Город выделяет деньги на новые парки.\nلِهَذَا النَّهْجِ إِيجَابِيَّاتٌ وَسَلْبِيَّاتٌ.|У этого подхода есть и плюсы, и минусы.\nمِنْ جِهَةٍ هَذَا مُرِيحٌ، وَمِنْ جِهَةٍ أُخْرَى مُكْلِفٌ.|С одной стороны, это удобно, с другой — дорого.\nلِتُحَسِّنَ لُغَتَكَ يَجِبُ أَنْ تَتَكَلَّمَ كَثِيرًا.|Чтобы улучшить язык, нужно много говорить.\nالطَّالِبُ الَّذِي نَجَحَ فِي الِامْتِحَانِ رَاضٍ.|Студент, который сдал экзамен, доволен.\nالْكِتَابُ الَّذِي أَقْرَؤُهُ مُمْتِعٌ جِدًّا.|Книга, которую я читаю, очень интересная.\nهَذِهِ هِيَ الْمَدِينَةُ الَّتِي وُلِدْتُ فِيهَا.|Это город, где я родился.\nبُنِيَ الْجِسْرُ فِي الْقَرْنِ الْمَاضِي.|Мост был построен в прошлом веке.\nأُرْسِلَتِ الرِّسَالَةُ أَمْسِ.|Письмо было отправлено вчера.\nالْمَتْجَرُ مُغْلَقٌ لِلتَّرْمِيمِ.|Магазин закрыт на ремонт.\nلَا يُدَخَّنُ هُنَا.|Здесь не курят.\nالْتَقَيْنَا بِالْأَصْدِقَاءِ فِي وَسَطِ الْمَدِينَةِ.|Мы встретились с друзьями в центре.\nأَهْتَمُّ بِالسِّيَاسَةِ وَالِاقْتِصَادِ.|Я интересуюсь политикой и экономикой.\nيَعْمَلُ صَحَفِيًّا فِي جَرِيدَةٍ كَبِيرَةٍ.|Он работает журналистом в крупной газете.\nيَجِبُ أَنْ يَتَحَمَّلَ كُلُّ شَخْصٍ مَسْؤُولِيَّةَ أَفْعَالِهِ.|Каждый должен нести ответственность за свои поступки.\nيَجِبُ أَنْ يَكُونَ الْقَانُونُ وَاحِدًا لِلْجَمِيعِ.|Закон должен быть один для всех.\nيَجِبُ أَنْ نَحْمِيَ الطَّبِيعَةَ لِلْأَجْيَالِ الْقَادِمَةِ.|Мы должны беречь природу для будущих поколений.\nيَزْدَادُ عَدَدُ النَّاسِ الَّذِينَ يَفْرِزُونَ النُّفَايَاتِ.|Всё больше людей сортируют мусор.\nأَصْبَحَتِ الطَّاقَةُ الشَّمْسِيَّةُ أَرْخَصَ.|Солнечная энергия стала дешевле.\nتَضَرَّرَ الْمَحْصُولُ بِسَبَبِ الْجَفَافِ.|Из-за засухи пострадал урожай.\nيُحَذِّرُ الْعُلَمَاءُ مِنْ تَغَيُّرِ الْمُنَاخِ.|Учёные предупреждают об изменении климата.\nأُحَاوِلُ أَنْ أَسْتَخْدِمَ الْبِلَاسْتِيكَ أَقَلَّ.|Я стараюсь меньше пользоваться пластиком.\nلَا تُصَدِّقْ كُلَّ مَا يُكْتَبُ فِي الْإِنْتَرْنِتْ.|Не верьте всему, что пишут в интернете.\nتَحَقَّقْ دَائِمًا مِنْ مَصْدَرِ الْمَعْلُومَاتِ.|Всегда проверяйте источник информации.\nأَجْرَى الصَّحَفِيُّ مُقَابَلَةً مَعَ الْوَزِيرِ.|Журналист взял интервью у министра.\nانْتَشَرَ هَذَا الْخَبَرُ بِسُرْعَةٍ.|Эта новость быстро распространилась.\nحَقَّقَتِ الشَّرِكَةُ رِبْحًا كَبِيرًا.|Компания получила большую прибыль.\nالضَّرَائِبُ فِي هَذَا الْبَلَدِ مُرْتَفِعَةٌ.|Налоги в этой стране высокие.\nالْمُنَافَسَةُ فِي السُّوقِ شَدِيدَةٌ جِدًّا.|Конкуренция на рынке очень жёсткая.\nوَقَّعُوا عَقْدًا مُهِمًّا.|Они подписали важный договор.\nأُرِيدُ أَنْ أَفْتَحَ مَشْرُوعِي الْخَاصَّ.|Я хочу открыть свой бизнес.\nالطَّلَبُ عَلَى هَذِهِ السِّلْعَةِ يَتَزَايَدُ.|Спрос на этот товар растёт.\nالذَّكَاءُ الِاصْطِنَاعِيُّ يُغَيِّرُ حَيَاتَنَا.|Искусственный интеллект меняет нашу жизнь.\nيُجْرِي الْعُلَمَاءُ تَجْرِبَةً جَدِيدَةً.|Учёные проводят новый эксперимент.\nغَيَّرَ هَذَا الِاخْتِرَاعُ الْعَالَمَ.|Это изобретение изменило мир.\nطَارَ الْإِنْسَانُ إِلَى الْفَضَاءِ لِأَوَّلِ مَرَّةٍ عَامَ أَلْفٍ وَتِسْعِمِئَةٍ وَوَاحِدٍ وَسِتِّينَ.|Человек впервые полетел в космос в тысяча девятьсот шестьдесят первом году.\nكُنَّا فِي مَعْرِضٍ لِلْفَنِّ الْمُعَاصِرِ.|Мы были на выставке современного искусства.\nتَرَكَ الْعَرْضُ الْمَسْرَحِيُّ فِيَّ انْطِبَاعًا قَوِيًّا.|Спектакль произвёл на меня сильное впечатление.\nتُعْجِبُنِي رِوَايَاتُ تُولْسْتُوي.|Мне нравятся романы Толстого.\nأَخْرَجَ هَذَا الْفِيلْمَ مُخْرِجٌ مَشْهُورٌ.|Этот фильм снял известный режиссёр.\nالْهَنْدَسَةُ الْمِعْمَارِيَّةُ فِي هَذِهِ الْمَدِينَةِ مُتَنَوِّعَةٌ جِدًّا.|Архитектура этого города очень разнообразная.\nيَجِبُ الْحِفَاظُ عَلَى التُّرَاثِ الثَّقَافِيِّ.|Нужно беречь культурное наследие.\nالضَّغْطُ النَّفْسِيُّ يُؤَثِّرُ عَلَى الصِّحَّةِ.|Стресс влияет на здоровье.\nلَا تُوجَدُ عَلَاقَاتٌ جَيِّدَةٌ مِنْ دُونِ ثِقَةٍ.|Без доверия нет хороших отношений.\nتَشْعُرُ بِالْوَحْدَةِ فِي الْمَدِينَةِ الْكَبِيرَةِ.|Она чувствует одиночество в большом городе.\nالدَّافِعُ هُوَ الْأَهَمُّ فِي الدِّرَاسَةِ.|Мотивация — это главное в учёбе.\nأَنَا مُمْتَنٌّ لَكَ عَلَى الْمُسَاعَدَةِ.|Я благодарен тебе за помощь.\nنَاقَشْنَا كُلَّ تَفَاصِيلِ الْمَشْرُوعِ.|Мы обсудили все детали проекта.\nلِنُقَارِنْ هَذَيْنِ الْخِيَارَيْنِ.|Давайте сравним эти два варианта.\nيُنْكِرُ ذَنْبَهُ.|Он отрицает свою вину.\nأَدْعَمُ هَذِهِ الْفِكْرَةَ تَمَامًا.|Я полностью поддерживаю эту идею.\nيَجِبُ زِيَادَةُ عَدَدِ الْمَسَاحَاتِ الْخَضْرَاءِ.|Нужно увеличить количество зелёных зон.\nنُحَاوِلُ تَقْلِيلَ النَّفَقَاتِ.|Мы стараемся сокращать расходы.\nمِنَ الصَّعْبِ إِقْنَاعُهُ.|Его трудно убедить.\nالْوُقُوفُ مَمْنُوعٌ هُنَا.|Здесь запрещено парковаться.\nحَقَّقْنَا هَدَفَنَا.|Мы достигли своей цели.\nالْجَوْدَةُ أَهَمُّ مِنَ الْكَمِّيَّةِ.|Качество важнее количества.\nكُلُّ شَيْءٍ يَعْتَمِدُ عَلَى الظُّرُوفِ.|Всё зависит от обстоятельств.\nبِصَرَاحَةٍ، هَذَا لَا يُعْجِبُنِي.|Если честно, мне это не нравится.\nعَلَى حَدِّ عِلْمِي، لَقَدْ سَافَرَ.|Насколько я знаю, он уехал.\nبِفَضْلِ مُسَاعَدَةِ أَصْدِقَائِي نَجَحْتُ.|Благодаря помощи друзей я справился.\nرَغْمَ الْمَطَرِ خَرَجْنَا لِلتَّنَزُّهِ.|Несмотря на дождь, мы пошли гулять.\nكُلَّمَا قَرَأْتَ أَكْثَرَ عَرَفْتَ أَكْثَرَ.|Чем больше читаешь, тем больше знаешь.\nمِمَّ أَنْتَ مُسْتَاءٌ؟|Чем ты недоволен?\nيَبْدُو لِي أَنَّكَ تُبَالِغُ.|Мне кажется, ты преувеличиваешь.\nلَسْتُ مُتَأَكِّدًا أَنَّ هَذَا صَحِيحٌ.|Я не уверен, что это правда.\nالْمَسْأَلَةُ أَنَّ وَقْتَنَا قَلِيلٌ.|Дело в том, что у нас мало времени.\nقَالَ إِنَّهُ سَيَأْتِي لَاحِقًا.|Он сказал, что придёт позже.\nسَأَلَتْ أَيْنَ أَعْمَلُ.|Она спросила, где я работаю.\nطَلَبْتُ مِنْهُ أَنْ يُغْلِقَ النَّافِذَةَ.|Я попросил его закрыть окно.\nأُرِيدُ أَنْ تَكُونَ سَعِيدًا.|Я хочу, чтобы ты был счастлив.\nمِنَ الْمُهِمِّ أَنْ يَكُونَ الْجَمِيعُ فِي الْمَوْعِدِ.|Важно, чтобы все были вовремя.\nكُنْتُ أَسْكُنُ سَابِقًا فِي قَرْيَةٍ.|Раньше я жил в деревне.\nاعْتَادَتْ عَلَى الْبَرْدِ.|Она привыкла к холоду.\nلَا أَسْتَطِيعُ أَبَدًا التَّعَوُّدَ عَلَى الْعَمَلِ الْجَدِيدِ.|Я никак не могу привыкнуть к новой работе.\nتَعْمَلُ فِي الْمَجَالِ الْخَيْرِيِّ.|Она занимается благотворительностью.\nجَدِّي يَتَقَاضَى مَعَاشًا تَقَاعُدِيًّا.|Мой дед получает пенсию.\nتَنْتَقِلُ التَّقَالِيدُ مِنْ جِيلٍ إِلَى جِيلٍ.|Традиции передаются из поколения в поколение.\nسُكَّانُ الْمَدِينَةِ يَتَزَايَدُونَ بِسُرْعَةٍ.|Население города быстро растёт.\nأَنَا مَعَ الْمُسَاوَاةِ فِي الْحُقُوقِ.|Я стою за равноправие.\nلَوْ كُنْتُ مَكَانَكَ لَوَافَقْتُ.|Если бы я был на твоём месте, я бы согласился.\nعُرِضَتْ عَلَيَّ تَرْقِيَةٌ.|Мне предложили повышение.\nالْعَمَلُ عَنْ بُعْدٍ لَا يُنَاسِبُ الْجَمِيعَ.|Удалённая работа подходит не всем.\nيَعْمَلُ بِلَا عُطَلٍ وَقَدْ تَعِبَ.|Он работает без выходных и уже устал.\nلِتَجَنُّبِ الِاحْتِرَاقِ الْوَظِيفِيِّ يَجِبُ أَنْ تَرْتَاحَ.|Чтобы избежать выгорания, нужно отдыхать.\nأَعْدَدْتُ عَرْضًا تَقْدِيمِيًّا لِلْعُمَلَاءِ.|Я подготовил презентацию для клиентов.\nأَعْطَانِي مُرْشِدِي نَصِيحَةً مُفِيدَةً.|Мой наставник дал мне полезный совет.\nأَكْتُبُ طَلَبَ إِجَازَةٍ.|Я пишу заявление на отпуск.\nجَذَبَتْ شَرِكَتُنَا النَّاشِئَةُ اسْتِثْمَارَاتٍ.|Наш стартап привлёк инвестиции.\nهَذَا أَكْبَرُ إِنْجَازَاتِي.|Это моё самое большое достижение.\nأَوْلَوِيَّتِي الرَّئِيسِيَّةُ الْآنَ هِيَ الْعَائِلَةُ.|Сейчас мой главный приоритет — семья.\nهَلْ صَحِيحٌ أَنَّكَ سَتَتْرُكُ الشَّرِكَةَ؟|Правда ли, что ты уходишь из компании?\nهِيَ أَذْكَى بِكَثِيرٍ مِمَّا تَبْدُو.|Она намного умнее, чем кажется.\nكُلَّمَا بَدَأْتَ أَبْكَرَ كَانَ أَفْضَلَ.|Чем раньше начнёшь, тем лучше.\nتَوَصَّلْنَا إِلَى أَنَّ الْخُطَّةَ تَحْتَاجُ إِلَى تَغْيِيرٍ.|Мы пришли к выводу, что план нужно изменить.","grammar":[{"title":"Ломаное множественное число","body":"<p>Большинство арабских существительных образуют множественное число не окончанием, а <b>изменением гласных внутри корня</b>. Эти формы нужно запоминать вместе со словом:</p>\n<table><tr><th>Ед. ч.</th><th>Мн. ч.</th><th>Перевод</th></tr>\n<tr><td>[[كِتَابٌ]]</td><td>[[كُتُبٌ]]</td><td>книги</td></tr>\n<tr><td>[[بَيْتٌ]]</td><td>[[بُيُوتٌ]]</td><td>дома</td></tr>\n<tr><td>[[وَلَدٌ]]</td><td>[[أَوْلَادٌ]]</td><td>мальчики</td></tr>\n<tr><td>[[صَدِيقٌ]]</td><td>[[أَصْدِقَاءُ]]</td><td>друзья</td></tr>\n<tr><td>[[مَدِينَةٌ]]</td><td>[[مُدُنٌ]]</td><td>города</td></tr></table>\n<p class=\"tip\">Правильное мн. ч.: ‎-ӯна (мужской род, о людях) — [[مُعَلِّمُونَ]]; ‎-а̄т (женский род) — [[مُعَلِّمَاتٌ]].</p>","ex":"عِنْدِي كُتُبٌ كَثِيرَةٌ.|У меня много книг.\nهَؤُلَاءِ أَصْدِقَائِي.|Это мои друзья.","quiz":[["Мн. ч. от [[كِتَابٌ]]:","كُتُبٌ","كِتَابَاتٌ","كِتَابُونَ"],["Мн. ч. от [[مَدِينَةٌ]]:","مُدُنٌ","مَدِينَاتٌ","مَدِينُونَ"]]},{"title":"Относительные местоимения","body":"<p>«Который» в арабском согласуется с определяемым словом:</p>\n<table><tr><th></th><th>Ед. ч.</th><th>Мн. ч.</th></tr>\n<tr><td>Мужской</td><td>[[الَّذِي]]</td><td>[[الَّذِينَ]]</td></tr>\n<tr><td>Женский</td><td>[[الَّتِي]]</td><td>—</td></tr></table>\n<p>Используется только после <b>определённого</b> существительного: [[الرَّجُلُ الَّذِي...]] мужчина, который...</p>","ex":"الْكِتَابُ الَّذِي قَرَأْتُهُ مُمْتِعٌ.|Книга, которую я прочитал, интересная.\nالْبِنْتُ الَّتِي تَعْمَلُ هُنَا ذَكِيَّةٌ.|Девушка, которая здесь работает, умная.","quiz":[["الْمَرْأَةُ ___ تَسْكُنُ هُنَا","الَّتِي","الَّذِي","الَّذِينَ"],["الطُّلَّابُ ___ نَجَحُوا","الَّذِينَ","الَّتِي","الَّذِي"]]},{"title":"Условие: لَوْ и إِذَا","body":"<p>[[إِذَا]] — реальное условие: [[إِذَا دَرَسْتَ نَجَحْتَ.]] Если будешь заниматься, сдашь.</p>\n<p>[[لَوْ]] — нереальное условие, вторая часть часто с [[لَـ]]: [[لَوْ كُنْتُ غَنِيًّا لَاشْتَرَيْتُ بَيْتًا.]] Если бы я был богат, купил бы дом.</p>","ex":"إِذَا أَمْطَرَتْ بَقِينَا فِي الْبَيْتِ.|Если пойдёт дождь, останемся дома.","quiz":[["Нереальное условие («если бы») выражается частицей:","لَوْ","إِذَا","لَمْ"]]}],"readings":[{"title":"مَدِينَةُ الْمُسْتَقْبَلِ","tr":"Город будущего","sents":"كَيْفَ سَتَكُونُ مَدِينَةُ الْمُسْتَقْبَلِ؟|Каким будет город будущего?\nيَعْتَقِدُ كَثِيرٌ مِنَ الْخُبَرَاءِ أَنَّهَا سَتَضُمُّ مَسَاحَاتٍ خَضْرَاءَ أَكْثَرَ وَسَيَّارَاتٍ أَقَلَّ.|Многие эксперты считают, что в нём будет больше зелени и меньше машин.\nسَيَتَنَقَّلُ النَّاسُ بِالسَّيَّارَاتِ الْكَهْرَبَائِيَّةِ وَالدَّرَّاجَاتِ.|Люди будут передвигаться на электромобилях и велосипедах.\nلَكِنَّ بَعْضَ النُّقَّادِ يَقُولُونَ إِنَّ هَذِهِ التِّقْنِيَّاتِ مُكْلِفَةٌ جِدًّا لِلدُّوَلِ الْفَقِيرَةِ.|Но некоторые критики говорят, что эти технологии слишком дороги для бедных стран.\nالْمُهِمُّ أَنْ تُبْنَى الْمَدِينَةُ مِنْ أَجْلِ الْإِنْسَانِ.|Главное — чтобы город строился для человека.","gloss":"كيف|как, каким\nستكون|будет\nمدينة|город\nالمستقبل|будущее\nيعتقد|считает\nكثير|многие\nالخبراء|эксперты\nأنها|что она\nستضم|будет включать\nمساحات|пространства\nخضراء|зелёные\nأكثر|больше\nوسيارات|и машин\nأقل|меньше\nسيتنقل|будут передвигаться\nالناس|люди\nبالسيارات|на машинах\nالكهربائية|электрических\nوالدراجات|и велосипедах\nلكن|но\nبعض|некоторые\nالنقاد|критики\nيقولون|говорят\nإن|что\nالتقنيات|технологии\nمكلفة|дорогие\nللدول|для стран\nالفقيرة|бедных\nالمهم|главное\nتبنى|строился\nأجل|ради (من أجل = ради)\nالإنسان|человек"},{"title":"مَدِينَةُ الْمُسْتَقْبَلِ","tr":"Город будущего","sents":"كَيْفَ سَتَكُونُ مَدِينَةُ الْمُسْتَقْبَلِ؟|Каким будет город будущего?\nيَرَى كَثِيرٌ مِنَ الْخُبَرَاءِ أَنَّهَا سَتَضُمُّ خُضْرَةً أَكْثَرَ وَسَيَّارَاتٍ أَقَلَّ.|Многие эксперты считают, что в нём будет больше зелени и меньше машин.\nسَيَتَنَقَّلُ النَّاسُ بِالسَّيَّارَاتِ الْكَهْرَبَائِيَّةِ وَالدَّرَّاجَاتِ.|Люди будут ездить на электромобилях и велосипедах.\nسَتَحْصُلُ الْبُيُوتُ عَلَى الطَّاقَةِ مِنَ الشَّمْسِ وَالرِّيَاحِ.|Дома будут получать энергию от солнца и ветра.\nسَتَتَحَكَّمُ أَنْظِمَةٌ ذَكِيَّةٌ فِي الْإِضَاءَةِ وَالتَّدْفِئَةِ.|Умные системы будут управлять светом и теплом.\nغَيْرَ أَنَّ لِهَذِهِ الْفِكْرَةِ مُنْتَقِدِينَ أَيْضًا.|Однако у этой идеи есть и критики.\nيَقُولُونَ إِنَّ هَذِهِ التِّقْنِيَاتِ مُكْلِفَةٌ جِدًّا.|Они говорят, что такие технологии слишком дорогие.\nإِلَى جَانِبِ ذَلِكَ، لَيْسَ الْجَمِيعُ مُسْتَعِدِّينَ لِتَغْيِيرِ عَادَاتِهِمْ.|Кроме того, не все готовы менять привычки.\nمِنَ الصَّعْبِ الْقَوْلُ مَنْ عَلَى حَقٍّ.|Сложно сказать, кто прав.\nلَكِنَّ أَمْرًا وَاحِدًا وَاضِحٌ: يَجِبُ أَنْ تَكُونَ الْمَدِينَةُ مُرِيحَةً لِلنَّاسِ.|Но ясно одно: город должен быть удобным для людей.","gloss":""},{"title":"شَبَكَاتُ التَّوَاصُلِ","tr":"Социальные сети","sents":"أَصْبَحَتْ شَبَكَاتُ التَّوَاصُلِ جُزْءًا مِنْ حَيَاتِنَا.|Социальные сети стали частью нашей жизни.\nتُسَاعِدُنَا عَلَى التَّوَاصُلِ مَعَ الْأَصْدِقَاءِ الَّذِينَ يَسْكُنُونَ بَعِيدًا.|Они помогают общаться с друзьями, которые живут далеко.\nنَعْرِفُ الْأَخْبَارَ أَسْرَعَ مِنْ قَبْلُ.|Мы узнаём новости быстрее, чем раньше.\nغَيْرَ أَنَّ لِشَبَكَاتِ التَّوَاصُلِ جَانِبًا سَلْبِيًّا أَيْضًا.|Однако у соцсетей есть и обратная сторона.\nيَقْضِي كَثِيرُونَ عِدَّةَ سَاعَاتٍ يَوْمِيًّا عَلَى هَوَاتِفِهِمْ.|Многие проводят в телефоне по нескольку часов в день.\nهَذَا يُؤَثِّرُ عَلَى النَّوْمِ وَالدِّرَاسَةِ وَالْمِزَاجِ.|Это влияет на сон, учёбу и настроение.\nإِلَى جَانِبِ ذَلِكَ، هُنَاكَ أَخْبَارٌ كَاذِبَةٌ كَثِيرَةٌ عَلَى الشَّبَكَةِ.|Кроме того, в сети много фейков.\nيَنْصَحُ عُلَمَاءُ النَّفْسِ بِأَخْذِ اسْتِرَاحَاتٍ.|Психологи советуют делать перерывы.\nمَثَلًا، يُمْكِنُ عَدَمُ أَخْذِ الْهَاتِفِ إِلَى غُرْفَةِ النَّوْمِ.|Например, можно не брать телефон в спальню.\nالْأَهَمُّ أَنْ نَتَذَكَّرَ أَنَّ الْحَيَاةَ لَا تَجْرِي عَلَى الشَّاشَةِ.|Главное — помнить, что жизнь происходит не на экране.","gloss":""},{"title":"الْمُتَطَوِّعُونَ","tr":"Волонтёры","sents":"صَدِيقَتِي آنْيَا تَتَطَوَّعُ فِي مَأْوًى لِلْحَيَوَانَاتِ.|Моя подруга Аня работает волонтёром в приюте для животных.\nتَذْهَبُ إِلَى هُنَاكَ كُلَّ سَبْتٍ.|Она приходит туда каждую субботу.\nتُطْعِمُ آنْيَا الْكِلَابَ وَتَتَمَشَّى مَعَهَا وَتُنَظِّفُ.|Аня кормит собак, гуляет с ними и убирает.\nلَا يَدْفَعُونَ لَهَا مَالًا مُقَابِلَ ذَلِكَ.|За это ей не платят деньги.\nلَكِنَّهَا تَقُولُ إِنَّهَا تَحْصُلُ عَلَى مَا هُوَ أَكْثَرُ بِكَثِيرٍ: الْفَرَحِ.|Но она говорит, что получает гораздо больше — радость.\nبِفَضْلِ الْمُتَطَوِّعِينَ تَجِدُ حَيَوَانَاتٌ كَثِيرَةٌ بَيْتًا جَدِيدًا.|Благодаря волонтёрам многие животные находят новый дом.\nفِي الشَّهْرِ الْمَاضِي أَقْنَعَتْنِي آنْيَا أَيْضًا.|В прошлом месяце Аня уговорила и меня.\nالْآنَ نَذْهَبُ إِلَى هُنَاكَ مَعًا.|Теперь мы ходим туда вместе.\nفَهِمْتُ أَنَّ مُسَاعَدَةَ الْآخَرِينَ سَعَادَةٌ.|Я понял, что помогать другим — это счастье.","gloss":""}],"dialogues":[{"title":"Собеседование","lines":"A|حَدِّثْنَا قَلِيلًا عَنْ نَفْسِكَ.|Расскажите немного о себе.\nB|تَخَرَّجْتُ فِي الِاقْتِصَادِ، وَعَمِلْتُ خَمْسَ سَنَوَاتٍ فِي شَرِكَةٍ دَوْلِيَّةٍ.|Я окончил экономический и пять лет работал в международной компании.\nA|لِمَاذَا تُرِيدُ الْعَمَلَ عِنْدَنَا؟|Почему вы хотите работать у нас?\nB|يَهُمُّنِي مَجَالُكُمْ، وَأُرِيدُ أَنْ أَتَطَوَّرَ.|Мне интересна ваша сфера, и я хочу развиваться.\nA|مَا نِقَاطُ قُوَّتِكَ؟|Какие у вас сильные стороны?\nB|أَنَا مَسْؤُولٌ، وَأُجِيدُ الْعَمَلَ ضِمْنَ فَرِيقٍ.|Я ответственный и хорошо работаю в команде.\nA|شُكْرًا. سَنَتَوَاصَلُ مَعَكَ خِلَالَ أُسْبُوعٍ.|Спасибо. Мы свяжемся с вами в течение недели."},{"title":"Спор: город или деревня?","lines":"A|أَوَدُّ أَنْ أَعِيشَ فِي الرِّيفِ. هُنَاكَ هُدُوءٌ وَهَوَاءٌ نَقِيٌّ.|Я бы хотел жить в деревне. Там тихо и чистый воздух.\nB|لَكِنَّ الْفُرَصَ فِي الْمَدِينَةِ أَكْثَرُ.|Но в городе больше возможностей.\nA|مِثْلَ مَاذَا؟|Каких, например?\nB|الْعَمَلُ وَالْمَدَارِسُ الْجَيِّدَةُ وَالْمُسْتَشْفَيَاتُ وَالْمَسَارِحُ.|Работа, хорошие школы, больницы, театры.\nA|أُوَافِقُ، لَكِنْ فِي الْمَدِينَةِ ضَغْطٌ وَازْدِحَامٌ كَثِيرٌ.|Согласен, но в городе много стресса и пробок.\nB|هَذَا صَحِيحٌ. رُبَّمَا الْأَفْضَلُ أَنْ نَعِيشَ فِي الضَّاحِيَةِ؟|Это правда. Может, лучше всего жить в пригороде?\nA|فِكْرَةٌ جَيِّدَةٌ! الطَّبِيعَةُ قَرِيبَةٌ وَالْمَدِينَةُ لَيْسَتْ بَعِيدَةً.|Хорошая идея! И природа рядом, и город недалеко.\nB|إِذَنْ اتَّفَقْنَا.|Вот и договорились."},{"title":"После фильма","lines":"A|إِذَنْ، كَيْفَ وَجَدْتَ الْفِيلْمَ؟|Ну как тебе фильм?\nB|بِصَرَاحَةٍ، كُنْتُ أَتَوَقَّعُ أَكْثَرَ.|Честно говоря, я ожидал большего.\nA|حَقًّا؟ أَمَّا أَنَا فَأَعْجَبَنِي. أَدَّى الْمُمَثِّلُونَ أَدْوَارَهُمْ بِشَكْلٍ رَائِعٍ.|Правда? А мне понравилось. Актёры играли прекрасно.\nB|أُوَافِقُ عَلَى ذَلِكَ. لَكِنَّ الْقِصَّةَ كَانَتْ مُتَوَقَّعَةً جِدًّا.|С этим я согласен. Но сюжет был слишком предсказуемым.\nA|لَكِنَّ النِّهَايَةَ كَانَتْ غَيْرَ مُتَوَقَّعَةٍ.|Зато концовка неожиданная.\nB|رُبَّمَا. وَالْمُوسِيقَى كَانَتْ جَيِّدَةً أَيْضًا.|Пожалуй. Музыка тоже была хорошая.\nA|فِي الْمَرَّةِ الْقَادِمَةِ أَنْتَ تَخْتَارُ الْفِيلْمَ.|В следующий раз ты выбираешь фильм.\nB|اتَّفَقْنَا!|Договорились!"},{"title":"Интервью","lines":"A|أَخْبِرْنَا، كَيْفَ بَدَأْتَ مَشْرُوعَكَ؟|Расскажите, как вы начали свой бизнес?\nB|بَدَأَ ّرُ اللُّغَةُ بِاسْتِمْرَارٍ.|Как известно, язык постоянно меняется.\nإِذَنْ، يُمْكِنُ الِاسْتِنْتَاجُ بِأَنَّ الْفَرَضِيَّةَ تَأَكَّدَتْ.|Итак, можно сделать вывод, что гипотеза подтвердилась.\nأَثَارَ كَلَامُهُ الشُّكُوكَ.|Его слова вызвали сомнения.\nتَبْقَى الْمَسْأَلَةُ مَفْتُوحَةً.|Вопрос остаётся открытым.\nالْبَيَانَاتُ لَا تُؤَكِّدُ هَذِهِ النَّظَرِيَّةَ.|Данные не подтверждают эту теорию.\nمِنَ الضَّرُورِيِّ أَخْذُ كُلِّ الْعَوَامِلِ بِعَيْنِ الِاعْتِبَارِ.|Необходимо учитывать все факторы.\nيُقَدِّمُ الْمُؤَلِّفُ حُجَجًا مُقْنِعَةً.|Автор приводит убедительные аргументы.\nمِنْ وِجْهَةِ نَظَرٍ اقْتِصَادِيَّةٍ، هَذَا أَمْرٌ مَحْفُوفٌ بِالْمَخَاطِرِ.|С точки зрения экономики, это рискованно.\nتَسْعَى الشَّرِكَةُ إِلَى التَّنْمِيَةِ الْمُسْتَدَامَةِ.|Компания стремится к устойчивому развитию.\nاتُّخِذَ الْقَرَارُ بِالْإِجْمَاعِ.|Решение было принято единогласно.\nتَوَصَّلَ الطَّرَفَانِ إِلَى حَلٍّ وَسَطٍ.|Стороны пришли к компромиссу.\nاسْتَمَرَّتِ الْمُفَاوَضَاتُ طُوَالَ اللَّيْلِ.|Переговоры продлились всю ночь.\nكُلَّمَا عَرَفْنَا أَكْثَرَ، ظَهَرَتْ أَسْئِلَةٌ أَكْثَرَ.|Чем больше мы знаем, тем больше вопросов возникает.\nنَتِيجَةً لِلْأَزْمَةِ فَقَدَ كَثِيرُونَ وَظَائِفَهُمْ.|Вследствие кризиса многие потеряли работу.\nقُوبِلَتْ كَلِمَتُهُ بِالتَّصْفِيقِ.|Его выступление было встречено апплодисментами.\nلَا يَسَعُنَا إِلَّا أَنْ نُوَافِقَ عَلَى هَذَا الْقَوْلِ.|Нельзя не согласиться с этим утверждением.\nتَتَمَتَّعُ بِقُدُرَاتٍ بَارِزَةٍ.|Она обладает выдающимися способностями.\nلَوْلَا الْمَطَرُ لَذَهَبْنَا خَارِجَ الْمَدِينَةِ.|Если бы не дождь, мы бы поехали за город.\nأَمَامَنَا حَلُّ عَدَدٍ مِنَ الْمَسَائِلِ الْمُعَقَّدَةِ.|Нам предстоит решить ряд сложных задач.\nقَالَتْ ذَلِكَ بِسُخْرِيَةٍ خَفِيفَةٍ.|Она сказала это с лёгкой иронией.\nمَوْقِفُهُ يَسْتَحِقُّ الِاحْتِرَامَ.|Его позиция вызывает уважение.\nالْبَيَانَاتُ الَّتِي حُصِلَ عَلَيْهَا تَحْتَاجُ إِلَى تَحَقُّقٍ.|Полученные данные нуждаются в проверке.\nهَذَا مُجَرَّدُ تَفْسِيرٍ وَاحِدٍ مِنَ التَّفْسِيرَاتِ الْمُمْكِنَةِ.|Это лишь одна из возможных интерпретаций.\nيَتَطَرَّقُ الْمُؤَلِّفُ إِلَى مَشَاكِلَ اجْتِمَاعِيَّةٍ مُهِمَّةٍ.|Автор затрагивает важные социальные проблемы.\nتُرْجِمَ الْكِتَابُ إِلَى عِشْرِينَ لُغَةً.|Книга была переведена на двадцать языков.\nلَمْ يُشَخِّصِ الْأَطِبَّاءُ الْمَرَضَ فَوْرًا.|Врачи поставили диагноз не сразу.\nالْوِقَايَةُ أَرْخَصُ مِنَ الْعِلَاجِ.|Профилактика дешевле лечения.\nتَتَطَلَّبُ الْأَمْرَاضُ الْمُزْمِنَةُ مُتَابَعَةً دَائِمَةً.|Хронические болезни требуют постоянного контроля.\nيَدْخُلُ الْقَانُونُ حَيِّزَ التَّنْفِيذِ فِي الْأَوَّلِ مِنْ يَنَايِرَ.|Закон вступает в силу с первого января.\nأَصْدَرَ الْقَاضِي حُكْمًا بِالْبَرَاءَةِ.|Суд вынес оправдательный приговор.\nالْبَيَانَاتُ الشَّخْصِيَّةُ لِلْعُمَلَاءِ مَحْمِيَّةٌ.|Личные данные клиентов находятся под защитой.\nلِكُلِّ مُوَاطِنٍ الْحَقُّ فِي التَّعْلِيمِ.|Каждый гражданин имеет право на образование.\nالْتَقَى السَّفِيرُ بِوَزِيرِ الْخَارِجِيَّةِ.|Посол встретился с министром иностранных дел.\nوَقَّعَ الطَّرَفَانِ اتِّفَاقِيَّةَ تَعَاوُنٍ.|Стороны подписали соглашение о сотрудничестве.\nتَلَقَّى السُّكَّانُ مُسَاعَدَاتٍ إِنْسَانِيَّةً.|Жители получили гуманитарную помощь.\nالِاسْتِثْمَارُ فِي التَّعْلِيمِ يُؤْتِي ثِمَارَهُ.|Инвестиции в образование окупаются.\nأَعْلَنَتِ الشَّرِكَةُ عَنِ انْدِمَاجِهَا مَعَ مُنَافِسٍ.|Компания объявила о слиянии с конкурентом.\nرِبْحِيَّةُ الْمَشْرُوعِ مَوْضِعُ تَسَاؤُلٍ.|Рентабельность проекта под вопросом.\nرَاجَعْنَا اسْتِرَاتِيجِيَّتَنَا.|Мы пересмотрели нашу стратегию.\nالِابْتِكَارُ مُحَرِّكُ الِاقْتِصَادِ.|Инновации — двигатель экономики.\nتَجَاوَبَتِ الْإِدَارَةُ مَعَنَا.|Руководство пошло нам навстречу.\nيَجِبُ خَفْضُ التَّكَالِيفِ.|Нужно снизить издержки.\nتَجَاوَزَتْ نَتَائِجُ الْعَامِ التَّوَقُّعَاتِ.|Итоги года превзошли ожидания.\nيَتَمَيَّزُ بِأُفُقٍ وَاسِعٍ.|Он отличается широким кругозором.\nكَانَ خِطَابُهَا وَاضِحًا وَمَنْطِقِيًّا.|Её речь была ясной и логичной.\nيَصْعُبُ عَلَيَّ أَنْ أُوَافِقَكَ.|Мне трудно с вами согласиться.\nاسْمَحْ لِي أَنْ أُعَبِّرَ عَنْ وِجْهَةِ نَظَرِي.|Позвольте мне высказать свою точку зрения.\nأُفَضِّلُ أَنْ نُنَاقِشَ هَذَا لَاحِقًا.|Я бы предпочёл обсудить это позже.\nلَا يَجُوزُ اسْتِخْلَاصُ النَّتَائِجِ بِنَاءً عَلَى مِثَالٍ وَاحِدٍ.|Нельзя делать выводы на основе одного примера.\nالسُّؤَالُ هُوَ كَيْفَ نُنَفِّذُ ذَلِكَ.|Вопрос в том, как это осуществить.\nشَرَعَتْ فِي الْعَمَلِ بِحَمَاسٍ.|Она принялась за работу с энтузиазмом.\nنَحْنُ مُضْطَرُّونَ إِلَى تَأْجِيلِ الِاجْتِمَاعِ.|Мы вынуждены отложить встречу.\nيَصْعُبُ الْمُبَالَغَةُ فِي تَقْدِيرِ إِسْهَامِهِ فِي الْعِلْمِ.|Его вклад в науку трудно переоценить.\nمَعَ تَطَوُّرِ التِّقْنِيَاتِ يَتَغَيَّرُ الْمُجْتَمَعُ أَيْضًا.|По мере развития технологий меняется и общество.\nبَلْ إِنَّ الْأَسْعَارَ تَسْتَمِرُّ فِي الِارْتِفَاعِ.|Более того, цены продолжают расти.\nعَلَى وَجْهِ الْخُصُوصِ، الْحَدِيثُ عَنِ الشَّبَابِ.|В частности, речь идёт о молодёжи.\nعَلَى الْعَكْسِ، كَانَ رَاضِيًا جِدًّا.|Напротив, он был очень доволен.\nفِي نِهَايَةِ الْمَطَافِ كُلُّ شَيْءٍ يَتَوَقَّفُ عَلَيْنَا.|В конечном счёте всё зависит от нас.\nتَتَكَلَّمُ الْعَرَبِيَّةَ دُونَ لَكْنَةٍ.|Она говорит по-арабски без акцента.\nاعْتَدْتُ أَنْ أُعَبِّرَ عَنْ أَفْكَارِي بِوُضُوحٍ.|Я привык выражать мысли чётко.\nلَا يَنْبَغِي الِاسْتِهَانَةُ بِمُقَاوَمَةِ التَّغْيِيرِ.|Не стоит недооценивать сопротивление переменам.\nلَا يُمْكِنُ تَبْرِيرُ تَصَرُّفِهِ.|Его поступок нельзя оправдать.\nوَاجَهْنَا صُعُوبَاتٍ غَيْرَ مُتَوَقَّعَةٍ.|Мы столкнулись с непредвиденными трудностями.\nمِثْلُ هَذِهِ الْحَالَاتِ لَيْسَتْ نَادِرَةً.|Подобные случаи не редкость.\nتَغَيَّرَتْ آرَاؤُهُ مَعَ الْوَقْتِ.|Его взгляды со временем изменились.\nتَمَيَّزَتْ دَائِمًا بِحِسِّ الدُّعَابَةِ.|Она всегда отличалась чувством юмора.\nأُقَدِّرُ رَأْيَكَ كَثِيرًا.|Я высоко ценю ваше мнение.\nهَذَا الْمَوْضُوعُ يَتَطَلَّبُ نِقَاشًا مُنْفَصِلًا.|Эта тема требует отдельного обсуждения.\nجَاءَتْ نَتَائِجُ الِاسْتِطْلَاعِ غَيْرَ مُتَوَقَّعَةٍ.|Результаты опроса оказались неожиданными.\nنَنْطَلِقُ مِنْ أَنَّ كُلَّ الْمُشَارِكِينَ مُوَافِقُونَ.|Мы исходим из того, что все участники согласны.\nهَاتَانِ الظَّاهِرَتَانِ مُرْتَبِطَتَانِ ارْتِبَاطًا وَثِيقًا.|Эти два явления тесно связаны.\nكَشَفَ الْعُلَمَاءُ عَنْ نَمَطٍ مُنْتَظِمٍ.|Учёные выявили закономерность.\nالْحَيَاةُ لَيْسَتْ عَمَلًا فَقَطْ.|Жизнь — это не только работа.\nلَمْ يَسْمَحْ لَهُ ضَمِيرُهُ بِالْكَذِبِ.|Совесть не позволила ему солгать.\nالْحِكْمَةُ تَأْتِي مَعَ الْخِبْرَةِ.|Мудрость приходит с опытом.\nالْحَقِيقَةُ فِي مَكَانٍ مَا فِي الْوَسَطِ.|Истина где-то посередине.\nيُؤَدِّي التَّحَضُّرُ إِلَى نُمُوِّ الْمُدُنِ.|Урбанизация ведёт к росту городов.\nطَالَتِ الرَّقْمَنَةُ كُلَّ مَجَالَاتِ الْحَيَاةِ.|Цифровизация затронула все сферы жизни.\nيَزْدَادُ الْأَمْنُ السِّيبْرَانِيُّ أَهَمِّيَّةً.|Кибербезопасность становится всё актуальнее.\nشَيْخُوخَةُ السُّكَّانِ تَحَدٍّ لِلِاقْتِصَادِ.|Старение населения — вызов для экономики.\nالتَّسَامُحُ أَسَاسُ التَّعَايُشِ السِّلْمِيِّ.|Толерантность — основа мирного сосуществования.\nلَا يُمْكِنُ النُّمُوُّ دُونَ بُنْيَةٍ تَحْتِيَّةٍ مُتَطَوِّرَةٍ.|Без развитой инфраструктуры рост невозможен.\nقُوبِلَ الْإِصْلَاحُ بِرُدُودِ فِعْلٍ مُتَبَايِنَةٍ.|Реформа была встречена неоднозначно.\nيَلْعَبُ الْمُجْتَمَعُ الْمَدَنِيُّ دَوْرًا مُهِمًّا.|Гражданское общество играет важную роль.\nالتَّمْيِيزُ غَيْرُ مَقْبُولٍ.|Дискриминация недопустима.\nأَثَّرَ الرُّكُودُ الِاقْتِصَادِيُّ عَلَى قِطَاعَاتٍ كَثِيرَةٍ.|Экономический спад затронул многие отрасли.\nتَرْتَفِعُ نِسْبَةُ الْمُتَعَلِّمِينَ بَيْنَ السُّكَّانِ بِاسْتِمْرَارٍ.|Грамотность населения постоянно растёт.\nتَخْتَلِفُ آرَاءُ الْخُبَرَاءِ.|Эксперты расходятся во мнениях.\nسَاعَدَ التَّضَامُنُ عَلَى تَجَاوُزِ الْأَزْمَةِ.|Солидарность помогла преодолеть кризис.\nوَقَعَ ضَحِيَّةً لِلدِّعَايَةِ.|Он стал жертвой пропаганды.\nيَتَطَلَّبُ انْدِمَاجُ الْمُهَاجِرِينَ وَقْتًا.|Интеграция мигрантов требует времени.\nالتَّفَاعُلُ مَعَ الْعُمَلَاءِ مِفْتَاحُ النَّجَاحِ.|Взаимодействие с клиентами — ключ к успеху.\nلَا يُمْكِنُ اخْتِزَالُ كُلِّ شَيْءٍ فِي الِاقْتِصَادِ.|Нельзя сводить всё к экономике.\nهَذِهِ الْمُشْكِلَةُ ذَاتُ طَابَعٍ مَنْهَجِيٍّ.|Данная проблема носит системный характер.\nنَسْتَرْشِدُ بِمَبْدَأِ الِانْفِتَاحِ.|Мы руководствуемся принципом открытости.\nوَفِي الْخِتَامِ أَوَدُّ أَنْ أَشْكُرَ جَمِيعَ الْمُشَارِكِينَ.|Подводя итог, хочу поблагодарить всех участников.","grammar":[{"title":"Страдательный залог","body":"<p>Страдательный залог образуется <b>сменой гласных</b>:</p>\n<table><tr><th>Время</th><th>Действительный</th><th>Страдательный</th></tr>\n<tr><td>Прошедшее (у—и)</td><td>[[كَتَبَ]] написал</td><td>[[كُتِبَ]] был написан</td></tr>\n<tr><td>Настоящее (у—а)</td><td>[[يَكْتُبُ]] пишет</td><td>[[يُكْتَبُ]] пишется</td></tr></table>\n<p class=\"tip\">Исполнитель действия в арабском страдательном обычно не называется.</p>","ex":"بُنِيَتِ الْمَدْرَسَةُ عَامَ أَلْفَيْنِ.|Школа была построена в 2000 году.\nيُقَالُ إِنَّهُ مَشْهُورٌ.|Говорят, что он знаменит.","quiz":[["«Было написано (письмо)»:","كُتِبَتْ","كَتَبَتْ","تَكْتُبُ"],["Страдательная форма от [[يَكْتُبُ]]:","يُكْتَبُ","يَكْتُبُ","كَتَبَ"]]},{"title":"إِنَّ и её «сёстры»","body":"<p>Частицы [[إِنَّ]] (поистине), [[أَنَّ]] (что), [[لَكِنَّ]] (но), [[كَأَنَّ]] (как будто), [[لَعَلَّ]] (может быть), [[لَيْتَ]] (о, если бы) ставят подлежащее в <b>винительный падеж</b> (окончание ‎-а):</p>\n<p>[[الْعِلْمُ نُورٌ]] → [[إِنَّ الْعِلْمَ نُورٌ]] Поистине, знание — свет.</p>","ex":"لَعَلَّ الْجَوَّ جَمِيلٌ غَدًا.|Возможно, завтра будет хорошая погода.\nأَعْرِفُ أَنَّ الْأَمْرَ صَعْبٌ.|Я знаю, что дело трудное.","quiz":[["إِنَّ ___ نُورٌ","الْعِلْمَ","الْعِلْمُ","الْعِلْمِ"]]}],"readings":[{"title":"الْقِرَاءَةُ فِي الْعَصْرِ الرَّقْمِيِّ","tr":"Чтение в цифровую эпоху","sents":"يَشْكُو كَثِيرُونَ فِي الْآوِنَةِ الْأَخِيرَةِ مِنْ أَنَّ النَّاسَ تَوَقَّفُوا عَنِ الْقِرَاءَةِ.|В последнее время многие жалуются, что люди перестали читать.\nغَيْرَ أَنَّ الدِّرَاسَاتِ تَكْشِفُ صُورَةً أَكْثَرَ تَعْقِيدًا.|Однако исследования показывают более сложную картину.\nنَحْنُ لَا نَقْرَأُ أَقَلَّ، لَكِنَّنَا نَقْرَأُ بِطَرِيقَةٍ مُخْتَلِفَةٍ: بِسُرْعَةٍ وَعَلَى الشَّاشَاتِ.|Мы читаем не меньше, но иначе: быстро и с экранов.\nوَبِالتَّالِي فَإِنَّ مَا يَتَضَرَّرُ لَيْسَ كَمِّيَّةَ الْقِرَاءَةِ بَلْ عُمْقَهَا.|Следовательно, страдает не количество, а глубина чтения.","gloss":"يشكو|жалуется\nكثيرون|многие\nالآونة|время (в последнее время)\nالأخيرة|последнее\nالناس|люди\nتوقفوا|перестали\nالقراءة|чтение\nغير|однако (غير أن)\nالدراسات|исследования\nتكشف|раскрывают\nصورة|картину\nأكثر|более\nتعقيدا|сложную\nنقرأ|читаем\nأقل|меньше\nلكننا|но мы\nبطريقة|способом\nمختلفة|другим\nبسرعة|быстро\nالشاشات|экраны\nوبالتالي|следовательно\nفإن|то\nيتضرر|страдает\nليس|не\nكمية|количество\nبل|а, но\nعمقها|её глубина"},{"title":"الْقِرَاءَةُ فِي الْعَصْرِ الرَّقْمِيِّ","tr":"Чтение в цифровую эпоху","sents":"يَشْكُو كَثِيرُونَ مُؤَخَّرًا مِنْ أَنَّ النَّاسَ تَوَقَّفُوا عَنِ الْقِرَاءَةِ.|В последнее время многие жалуются, что люди перестали читать.\nغَيْرَ أَنَّ الدِّرَاسَاتِ تُظْهِرُ صُورَةً أَكْثَرَ تَعْقِيدًا.|Однако исследования показывают более сложную картину.\nنَحْنُ لَا نَقْرَأُ أَقَلَّ مِنْ ذِي قَبْلُ، لَكِنَّنَا نَقْرَأُ بِشَكْلٍ مُخْتَلِفٍ.|Мы читаем не меньше, чем раньше, но читаем иначе.\nأَصْبَحَتِ النُّصُوصُ أَقْصَرَ وَالِانْتِبَاهُ أَكْثَرَ تَشَتُّتًا.|Тексты стали короче, а внимание — рассеяннее.\nوَبِالتَّالِي فَإِنَّ الَّذِي يَتَضَرَّرُ لَيْسَ كَمِّيَّةَ الْقِرَاءَةِ بَلْ عُمْقَهَا.|Таким образом, страдает не количество, а глубина чтения.\nيُؤَكِّدُ الْعُلَمَاءُ أَنَّ الْقُدْرَةَ عَلَى التَّرْكِيزِ مَهَارَةٌ.|Учёные подчёркивают, что умение сосредоточиться — это навык.\nوَمِثْلَ أَيِّ مَهَارَةٍ، يَجِبُ تَدْرِيبُهَا.|Как и любой навык, его нужно тренировать.\nمَثَلًا، مِنَ الْمُفِيدِ قِرَاءَةُ الْكُتُبِ الْوَرَقِيَّةِ دُونَ هَاتِفٍ بِالْقُرْبِ.|Например, полезно читать бумажные книги без телефона рядом.\nبِشَكْلٍ عَامٍّ، التِّقْنِيَاتُ الرَّقْمِيَّةُ لَيْسَتْ ضَارَّةً فِي حَدِّ ذَاتِهَا.|В целом, цифровые технологии сами по себе не вредны.\nكُلُّ شَيْءٍ يَعْتَمِدُ عَلَى كَيْفِيَّةِ اسْتِخْدَامِنَا لَهَا.|Всё зависит от того, как мы их используем.","gloss":""},{"title":"التَّنْمِيَةُ الْمُسْتَدَامَةُ","tr":"Устойчивое развитие","sents":"ظَهَرَ مَفْهُومُ التَّنْمِيَةِ الْمُسْتَدَامَةِ فِي نِهَايَةِ الْقَرْنِ الْعِشْرِينَ.|Понятие устойчивого развития появилось в конце двадцатого века.\nجَوْهَرُهُ بَسِيطٌ: تَلْبِيَةُ احْتِيَاجَاتِ الْيَوْمِ دُونَ الْإِضْرَارِ بِالْأَجْيَالِ الْقَادِمَةِ.|Его сущность проста: удовлетворять потребности сегодняшнего дня, не вредя будущим поколениям.\nغَيْرَ أَنَّ ذَلِكَ تَبَيَّنَ فِي الْوَاقِعِ أَنَّهُ أَصْعَبُ بِكَثِيرٍ.|Однако на практике это оказалось намного сложнее.\nكَثِيرًا مَا يَتَعَارَضُ النُّمُوُّ الِاقْتِصَادِيُّ مَعَ حِمَايَةِ الطَّبِيعَةِ.|Экономический рост часто вступает в противоречие с охраной природы.\nوَمَعَ ذَلِكَ، تُطَبِّقُ دُوَلٌ كَثِيرَةٌ تِقْنِيَاتٍ «خَضْرَاءَ».|Тем не менее многие страны внедряют «зелёные» технологии.\nتَأْخُذُ الشَّرِكَاتُ أَيْضًا الْعَوَامِلَ الْبِيئِيَّةَ فِي الِاعْتِبَارِ.|Компании тоже учитывают экологические факторы.\nلَا شَكَّ أَنَّهُ لَنْ يَكُونَ هُنَاكَ نَجَاحٌ مِنْ دُونِ مُشَارَكَةِ كُلِّ وَاحِدٍ مِنَّا.|Безусловно, без участия каждого из нас успеха не будет.","gloss":""},{"title":"فَنُّ الْجِدَالِ","tr":"Искусство спорить","sents":"الْقُدْرَةُ عَلَى الْجِدَالِ مِنْ أَهَمِّ الْقُدُرَاتِ فِي الْعَالَمِ الْمُعَاصِرِ.|Умение спорить — одно из важнейших в современном мире.\nهَدَفُ الْجِدَالِ لَيْسَ هَزِيمَةَ الْمُحَاوِرِ بَلِ الِاقْتِرَابَ مِنَ الْحَقِيقَةِ.|Цель спора — не победить собеседника, а приблизиться к истине.\nقَبْلَ كُلِّ شَيْءٍ، يَجِبُ الْإِصْغَاءُ إِلَى الْمُحَاوِرِ بِانْتِبَاهٍ.|Прежде всего, нужно внимательно выслушать оппонента.\nبَعْدَ ذَلِكَ يَنْبَغِي تَقْدِيمُ الْحُجَجِ لَا الْعَوَاطِفِ.|Затем следует приводить аргументы, а не эмоции.\nمِنَ الْمُهِمِّ التَّمْيِيزُ بَيْنَ الْحَقَائِقِ وَالْآرَاءِ.|Важно отличать факты от мнений.\nإِذَا كُنْتَ مُخْطِئًا فَاعْتَرِفْ بِذَلِكَ، فَهَذَا عَلَامَةُ قُوَّةٍ لَا ضَعْفٍ.|Если вы неправы, признайте это — это признак силы, а не слабости.\nفِي نِهَايَةِ الْمَطَافِ يُثْرِي الْجِدَالُ الْجَيِّدُ الطَّرَفَيْنِ.|В конечном счёте хороший спор обогащает обе стороны.","gloss":""}],"dialogues":[{"title":"Дискуссия: удалённая работа","lines":"A|مَا رَأْيُكَ فِي الْعَمَلِ عَنْ بُعْدٍ؟|Что ты думаешь об удалённой работе?\nB|مِنْ نَاحِيَةٍ، يُوَفِّرُ الْوَقْتَ.|С одной стороны, это экономит время.\nB|وَمِنْ نَاحِيَةٍ أُخْرَى، يَفْتَقِدُ النَّاسُ التَّوَاصُلَ الْمُبَاشِرَ.|С другой стороны, людям не хватает живого общения.\nA|لَكِنَّ الدِّرَاسَاتِ تُظْهِرُ أَنَّ الْإِنْتَاجِيَّةَ تَرْتَفِعُ.|Но исследования показывают, что продуктивность растёт.\nB|رُبَّمَا. وَمَعَ ذَلِكَ لَيْسَ الْجَمِيعُ قَادِرًا عَلَى تَنْظِيمِ نَفْسِهِ.|Возможно. Тем не менее не все способны себя организовать.\nA|أُوَافِقُكَ. يَبْدُو أَنَّ النِّظَامَ الْهَجِينَ هُوَ الْأَفْضَلُ.|Согласен. Похоже, гибридный формат — лучший."},{"title":"Дискуссия об ИИ","lines":"A|كَيْفَ تُقَيِّمُ تَأْثِيرَ الذَّكَاءِ الِاصْطِنَاعِيِّ عَلَى سُوقِ الْعَمَلِ؟|Как вы оцениваете влияние искусственного интеллекта на рынок труда?\nB|مِنْ جِهَةٍ، يُؤَتْمِتُ الْمَهَامَّ الرُّوتِينِيَّةَ.|С одной стороны, он автоматизирует рутинные задачи.\nB|وَمِنْ جِهَةٍ أُخْرَى، تَظْهَرُ مِهَنٌ جَدِيدَةٌ.|С другой стороны, появляются новые профессии.\nA|لَكِنْ لَيْسَ الْجَمِيعُ سَيَتَمَكَّنُ مِنْ إِعَادَةِ التَّأْهِيلِ.|Но не все успеют переучиться.\nB|لِهَذَا السَّبَبِ تَحْدِيدًا يَجِبُ أَنْ تَسْتَثْمِرَ الدَّوْلَةُ فِي التَّعْلِيمِ.|Именно поэтому государство должно вкладывать в образование.\nA|أُوَافِقُ، غَيْرَ أَنَّ ذَلِكَ يَتَطَلَّبُ وَقْتًا.|Согласен, однако это требует времени.\nB|بِلَا شَكٍّ. لِذَلِكَ يَجِبُ أَنْ نَبْدَأَ الْيَوْمَ.|Безусловно. Поэтому начинать надо уже сегодня."},{"title":"Деловая встреча","lines":"A|أَقْتَرِحُ أَنْ نَنْتَقِلَ إِلَى الْمَسْأَلَةِ الرَّئِيسِيَّةِ.|Предлагаю перейти к главному вопросу.\nB|نَعَمْ، لِنُنَاقِشْ شُرُوطَ الْعَقْدِ.|Да, давайте обсудим условия договора.\nA|مَوَاعِيدُ التَّوْرِيدِ لَا تُنَاسِبُنَا.|Нас не устраивают сроки поставки.\nB|يُمْكِنُنَا تَقْصِيرُهَا بِأُسْبُوعٍ.|Мы можем сократить их на неделю.\nA|وَمَاذَا عَنِ السِّعْرِ؟|А что насчёт цены?\nB|عِنْدَ الطَّلَبِيَّةِ الْكَبِيرَةِ نَحْنُ مُسْتَعِدُّونَ لِتَقْدِيمِ تَخْفِيضٍ.|При крупном заказе мы готовы предоставить скидку.\nA|فِي هَذِهِ الْحَالَةِ يُمْكِنُنَا تَوْقِيعُ الِاتِّفَاقِ.|В таком случае мы можем подписать соглашение.\nB|مُمْتَازٌ. سَأُعِدُّ الْمُسْتَنَدَاتِ بِحُلُولِ الْغَدِ.|Отлично. Я подготовлю документы к завтрашнему дню."},{"title":"О литературе","lines":"A|أَيَّ كِتَابٍ تَقْرَأُ الْآنَ؟|Какую книгу вы сейчас читаете?\nB|أُعِيدُ قِرَاءَةَ «الْجَرِيمَةِ وَالْعِقَابِ».|Перечитываю «Преступление и наказание».\nA|أَلَيْسَتْ قَاتِمَةً جِدًّا؟|Не слишком ли мрачно?\nB|قَاتِمَةٌ لَكِنَّهَا عَمِيقَةٌ. فِي كُلِّ مَرَّةٍ أَجِدُ شَيْئًا جَدِيدًا.|Мрачно, но глубоко. Каждый раз нахожу что-то новое.\nA|مَا الَّذِي يَجْذِبُكَ فِيهَا أَكْثَرَ؟|Что вас в ней больше всего привлекает?\nB|نَفْسِيَّةُ الشَّخْصِيَّاتِ وَالْأَسْئِلَةُ الْأَبَدِيَّةُ عَنِ الضَّمِيرِ.|Психология героев и вечные вопросы о совести.\nA|رُبَّمَا عَلَيَّ أَنَا أَيْضًا أَنْ أُعِيدَ قِرَاءَتَهَا.|Пожалуй, и мне стоит её перечитать."}]},"C2":{"vocab":[{"t":"Пословицы","w":"⏳|الْوَقْتُ كَالسَّيْفِ إِنْ لَمْ تَقْطَعْهُ قَطَعَكَ|Время — как меч: не разрубишь его — оно разрубит тебя\n💪|مَنْ جَدَّ وَجَدَ|Кто старается — тот находит\n🗝️|الصَّبْرُ مِفْتَاحُ الْفَرَجِ|Терпение — ключ к облегчению\n🏘️|الْجَارُ قَبْلَ الدَّارِ|Сначала выбирай соседа, потом дом\n🧠|الْعَقْلُ السَّلِيمُ فِي الْجِسْمِ السَّلِيمِ|В здоровом теле — здоровый дух\n🐎|لِكُلِّ جَوَادٍ كَبْوَةٌ|И на старуху бывает проруха\n👏|يَدٌ وَاحِدَةٌ لَا تُصَفِّقُ|Одной рукой не хлопнешь\n🪨|الْعِلْمُ فِي الصِّغَرِ كَالنَّقْشِ عَلَى الْحَجَرِ|Знание в детстве — как резьба на камне\n🔄|رُبَّ ضَارَّةٍ نَافِعَةٌ|Нет худа без добра\n💬|خَيْرُ الْكَلَامِ مَا قَلَّ وَدَ عُودُ يَوْمًا.|О, если бы молодость однажды вернулась!\nكَأَنَّ الْقَمَرَ مِصْبَاحٌ فِي السَّمَاءِ.|Луна словно светильник в небе.\nإِذَا كَانَ الْكَلَامُ مِنْ فِضَّةٍ فَالسُّكُوتُ مِنْ ذَهَبٍ.|Если слово — серебро, то молчание — золото.\nلَا يَعْرِفُ الشَّوْقَ إِلَّا مَنْ يُكَابِدُهُ.|Тоску знает лишь тот, кто её испытывает.\nلَمْ يَفْهَمِ الْجَمِيعُ سُخْرِيَتَهُ.|Его ирония была понятна не всем.\nيَسْتَخْدِمُ الْمُؤَلِّفُ الْمَعْنَى الضِّمْنِيَّ بِبَرَاعَةٍ.|Автор мастерски использует подтекст.\nمَهْمَا قُلْتَ فَهُوَ مُحِقٌّ.|Что ни говори, а он прав.\nلَيْسَ بَسِيطًا إِطْلَاقًا كَمَا يَبْدُو.|Он отнюдь не так прост, как кажется.\nأَدْهَشَ كَرَمُهَا الْجَمِيعَ.|Её великодушие поразило всех.\nبَدَتْ كَلِمَاتُهُ كَعِتَابٍ.|Его слова прозвучали как упрёк.\nتَظَاهَرَتْ بِأَنَّهَا لَمْ تُلَاحِظْ شَيْئًا.|Она притворилась, что ничего не заметила.\nخَبَا الْأَلَمُ مَعَ الْوَقْتِ.|Со временем боль угасла.\nلَمْ يَسْتَطِعْ أَبَدًا أَنْ يَتَقَبَّلَ الْخَسَارَةَ.|Он так и не смог смириться с потерей.\nمِنَ الْمُسْتَحِيلِ إِدْرَاكُ كُلِّ شَيْءٍ دُفْعَةً وَاحِدَةً.|Невозможно постичь всё сразу.\nكَانَ السُّخْطُ وَاضِحًا فِي صَوْتِهِ.|В его голосе звучало негодование.\nغَمَرَنِي الْحَنِينُ إِلَى الْوَطَنِ.|Меня охватила тоска по родине.\nتَمَيَّزَ خِطَابُهَا بِالْأَنَاقَةِ.|Её речь отличалась изяществом.\nأَمَامَنَا مُعْضِلَةٌ صَعْبَةٌ.|Перед нами стоит сложная дилемма.\nهُنَا تَكْمُنُ الْمُفَارَقَةُ.|В этом и заключается парадокс.\nحَدَثَتِ التَّغَيُّرَاتُ شَيْئًا فَشَيْئًا.|Перемены происходили исподволь.\nذَكَرَ ذَلِكَ عَرَضًا فَقَطْ.|Он упомянул об этом лишь вскользь.\nبِالْكَادِ سَيَلْحَقُونَ بِالْمَوْعِدِ.|Вряд ли они успеют к сроку.\nدَرَسَ الْمَسْأَلَةَ بِدِقَّةٍ تَامَّةٍ.|Он изучил вопрос досконально.\nسَعَى النَّاسُ إِلَى الْحُرِّيَّةِ مُنْذُ الْقِدَمِ.|Испокон веков люди стремились к свободе.\nتُدْهِشُ اللَّوْحَةُ بِأَلْوَانِهَا.|Картина поражает своим колоритом.\nتُعَدُّ هَذِهِ اللَّوْحَةُ تُحْفَةً فَنِّيَّةً.|Это полотно считается шедевром.\nتَأْتِي ذُرْوَةُ الرِّوَايَةِ فِي الْفَصْلِ الْأَخِيرِ.|Кульминация романа приходится на последнюю главу.\nجَاءَتِ الْخَاتِمَةُ غَيْرَ مُتَوَقَّعَةٍ.|Развязка оказалась неожиданной.\nالرَّاوِي لَا يُثِيرُ الثِّقَةَ.|Рассказчик не вызывает доверия.\nيُمْكِنُ اسْتِئْنَافُ قَرَارِ الْمَحْكَمَةِ.|Решение суда можно обжаловать.\nفُوِّضَتِ الصَّلَاحِيَّاتُ إِلَى النَّائِبِ.|Полномочия были делегированы заместителю.\nالشَّفَافِيَّةُ أَسَاسُ الثِّقَةِ.|Прозрачность — основа доверия.\nالْبِيرُوقْرَاطِيَّةُ تُعِيقُ أَيَّ إِصْلَاحَاتٍ.|Бюрократия тормозит любые реформы.\nغَيَّرَتْ هَذِهِ السَّابِقَةُ الْمُمَارَسَةَ الْقَضَائِيَّةَ.|Этот прецедент изменил судебную практику.\nمَا زَالَ الْكَوْنُ يُخْفِي أَسْرَارًا كَثِيرَةً.|Вселенная по-прежнему хранит много тайн.\nرَصَدَ الْعُلَمَاءُ شُذُوذًا غَرِيبًا.|Учёные зафиксировали странную аномалию.\nالتَّطَوُّرُ عَمَلِيَّةٌ بَطِيئَةٌ لَكِنَّهَا لَا تَتَوَقَّفُ.|Эволюция — медленный, но неукротимый процесс.\nأَصَالَةُ الْمَخْطُوطَةِ مَوْضِعُ شَكٍّ.|Подлинность рукописи вызывает сомнения.\nقِيلَ وَفُعِلَ.|Сказано — сделано.\nالصَّبَاحُ أَحْكَمُ مِنَ الْمَسَاءِ.|Утро вечера мудренее.\nلَيْسَ كُلُّ مَا يَلْمَعُ ذَهَبًا.|Не всё то золото, что блестит.\nمَنْ تَأَنَّى نَالَ مَا تَمَنَّى.|Тише едешь — дальше будешь.\nلَا نَجَاحَ بِلَا تَعَبٍ.|Без труда не вытащишь и рыбку из пруда.\nالصَّبْرُ وَالْعَمَلُ يَتَغَلَّبَانِ عَلَى كُلِّ شَيْءٍ.|Терпение и труд всё перетрут.\nسَكَتَ عَمْدًا.|Он нарочно промолчал.\nتَطَرَّقَتْ سَهْوًا إِلَى مَوْضُوعٍ حَسَّاسٍ.|Она невзначай задела больную тему.\nلَا يَبْقَى لَنَا إِلَّا أَنْ نَأْمُلَ الْأَفْضَلَ.|Нам остаётся лишь уповать на лучшее.\nنَحْنُ نَحْصُدُ ثِمَارَ قَرَارَاتِنَا.|Мы пожинаем плоды своих решений.\nدَافَعَ عَنْ وِجْهَةِ نَظَرِهِ حَتَّى النِّهَايَةِ.|Он отстаивал свою точку зрения до конца.\nيَحْتَاجُ اسْتِيعَابُ الْمَاضِي إِلَى وَقْتٍ.|Чтобы осмыслить прошлое, нужно время.\nطَغَى نَجَاحُهَا عَلَى جَمِيعِ الْمُنَافِسِينَ.|Её успех затмил всех конкурентов.\nسُلُوكُهُ يَقْتَرِبُ مِنَ الْوَقَاحَةِ.|Его поведение граничит с грубостью.\nمَهْمَا حَاوَلْتَ لَنْ تُرْضِيَ الْجَمِيعَ.|Как ни старайся, всем не угодишь.\nوَفَوْقَ ذَلِكَ تَأَخَّرَ أَيْضًا.|Мало того, он ещё и опоздал.\nالْمُهِمُّ أَنْ يَمُرَّ كُلُّ شَيْءٍ بِسَلَاسَةٍ.|Лишь бы всё прошло гладко.\nلَيْسَ أَنِّي مُعَارِضٌ، لَكِنْ عِنْدِي شُكُوكٌ.|Не то чтобы я был против, но сомнения есть.\nمَا إِنْ دَخَلَ حَتَّى سَكَتَ الْجَمِيعُ.|Стоило ему войти, как все замолчали.\nمَهْمَا حَدَثَ سَأَكُونُ بِجَانِبِكَ.|Что бы ни случилось, я буду рядом.\nتَكَلَّمَتْ كَأَنَّ شَيْئًا لَمْ يَحْدُثْ.|Она говорила так, будто ничего не произошло.\nعَلَى حَدِّ عِلْمِي، الْمَسْأَلَةُ قَدْ حُسِمَتْ.|Насколько мне известно, вопрос уже решён.\nفِي النِّهَايَةِ عَادَ كُلُّ شَيْءٍ إِلَى مَكَانِهِ.|В конце концов всё встало на свои места.\nوَمَعَ ذَلِكَ بَقِيَتْ مَسَائِلُ دُونَ حَلٍّ.|Тем не менее, остались нерешённые вопросы.\nيَصْعُبُ الْمُبَالَغَةُ فِي تَقْدِيرِ إِسْهَامِهِ.|Его вклад трудно переоценить.\nحَقًّا، الْحِكْمَةُ لَا تَعْرِفُ حُدُودًا.|Поистине, мудрость не знает границ.\nبَقِيَتْ رَاسِخَةً فِي قَنَاعَاتِهَا.|Она осталась непоколебимой в своих убеждениях.\nكَانَ غُرُورُهُ سَبَبَ هَلَاكِهِ.|Тщеславие его и погубило.\nكَانَ إِعْجَابُهُ بِنَفْسِهِ يُزْعِجُ زُمَلَاءَهُ.|Его самодовольство раздражало коллег.\nفِي هَذَا الِاخْتِيَارِ لَا يُوجَدُ مُحِقٌّ وَلَا مُخْطِئٌ.|В этом выборе нет ни правых, ни виноватых.\nالْمُسْتَقْبَلُ يَكْتَنِفُهُ الْغُمُوضُ.|Будущее окутано неопределённостью.\nتَنَوُّعُ الْآرَاءِ ثَرْوَةٌ.|Многообразие мнений — это богатство.\nهَذَا الْكِتَابُ ثَمَرَةُ عَمَلِ سَنَوَاتٍ طَوِيلَةٍ.|Эта книга — плод многолетнего труда.\nتَبْدُو كَلِمَاتُ الشَّاعِرِ جَدِيدَةً.|Слова поэта звучат по-новому.\nفِكْرَةٌ وَاحِدَةٌ لَا تُفَارِقُنِي.|Мне не даёт покоя одна мысль.\nلَمْ تُفْسِدْهُ الشُّهْرَةُ.|Слава его не испортила.\nتَرَاسَلْنَا مُدَّةً طَوِيلَةً.|Мы долго вели переписку.\nإِرَادَةُ الْحَيَاةِ أَقْوَى مِنَ الْخَوْفِ.|Воля к жизни сильнее страха.\nنَجَوْا مِنَ الْكَارِثَةِ بِأُعْجُوبَةٍ.|Они чудом избежали беды.\nكَانَ خِطَابُهُ مَلِيئًا بِالِاقْتِبَاسَاتِ.|Его речь изобиловала цитатами.\nرُبَّمَا كَانَ ذَلِكَ خَيْرًا.|Наверное, это было к лучшему.\nسَنَرَى مَعَ الْوَقْتِ.|Поживём — увидим.\nلَمْ يَعْرِفْ حَمَاسُهُ حُدُودًا.|Его рвение не знало границ.\nكُلُّ شَيْءٍ فِي هَذَا الْعَالَمِ فَانٍ.|Всё в этом мире бренно.\nنَفِدَ صَبْرُهَا.|Её терпение иссякло.\nكَشَفَتْ مُخَطَّطَهُ.|Она разгадала его замысел.\nبَعْدَ أَنْ وَازَنَ بَيْنَ الْإِيجَابِيَّاتِ وَالسَّلْبِيَّاتِ رَفَضَ.|Взвесив все «за» и «против», он отказался.\nتَمَلَّكَنِي هَاجِسٌ غَرِيبٌ.|Мною овладело странное предчувствие.\nبَدَتِ الْمَدِينَةُ وَهْمِيَّةً فِي الْغَسَقِ.|В сумерках город выглядел призрачным.\nالسَّعَادَةُ عَابِرَةٌ كَمَطَرِ الرَّبِيعِ.|Счастье мимолётно, как весенний дождь.\nتَمَيَّزَ ذَوْقُهُ بِالرُّقِيِّ.|Его вкус отличался изысканностью.\nالشَّفَقَةُ لَيْسَتْ ضَعْفًا.|Сострадание — это не слабость.\nأَفْضَتْ إِلَيْهِ بِأَفْكَارِهَا الدَّفِينَةِ.|Она поверила ему свои сокровенные мысли.\nذَهَبَتْ كُلُّ جُهُودِهِ سُدًى.|Все его усилия оказались тщетными.\nنَنْحَنِي إِجْلَالًا أَمَامَ مَوْهِبَتِهِ.|Мы преклоняемся перед его талантом.\nحَلَّ سُكُونُ مَا قَبْلَ الْفَجْرِ.|Наступило предрассветное безмолвие.\nاخْتَارَ سَبِيلَهُ مُنْذُ شَبَابِهِ.|Он выбрал свою стезю ещё в юности.\nتَحْفَظُ الْحَوْلِيَّاتُ ذِكْرَى تِلْكَ الْأَحْدَاثِ.|Летопись хранит память о тех событиях.\nمُهِمَّتُنَا أَنْ نُؤَدِّيَ وَاجِبَنَا.|Наше дело — исполнить свой долг.\nهَذَا الْكِتَابُ تَشَابُكٌ لِلْأَقْدَارِ.|В этой книге хитросплетение судеб.\nكَانَ خِطَابُهُ مُشَوَّشًا.|Его речь была сумбурной.\nجَاءَهُ إِلْهَامٌ مُفَاجِئٌ.|Ему пришло озарение.\nالْجَمَالُ سَيُنْقِذُ الْعَالَمَ.|Красота спасёт мир.\nالْحَيَاةُ لَيْسَتْ نُزْهَةً.|Жизнь прожить — не поле перейти.\nأَنْ تَأْتِيَ مُتَأَخِّرًا خَيْرٌ مِنْ أَلَّا تَأْتِيَ.|Лучше поздно, чем никогда.\nالْغَرِيقُ يَتَعَلَّقُ بِقَشَّةٍ.|Утопающий хватается за соломинку.\nلَا دُخَانَ بِلَا نَارٍ.|Нет дыма без огня.\nلِلْعَمَلِ وَقْتُهُ وَلِلَّهْوِ سَاعَتُهُ.|Делу время, потехе час.\nالصَّدِيقُ وَقْتَ الضِّيقِ.|Люди познаются в беде.\nالْقُوَّةُ فِي الْحَقِّ.|Сила в правде.","grammar":[{"title":"Частица قَدْ","body":"<p>[[قَدْ]] меняет смысл в зависимости от времени глагола:</p>\n<p><b>+ прошедшее</b> = «уже» (подтверждение): [[قَدْ وَصَلَ]] он уже прибыл.</p>\n<p><b>+ настоящее</b> = «иногда, может быть»: [[قَدْ يَتَأَخَّرُ]] он может опоздать.</p>","ex":"قَدْ فَهِمْتُ.|Я (уже) понял.\nقَدْ تُمْطِرُ غَدًا.|Завтра, возможно, пойдёт дождь.","quiz":[["[[قَدْ]] + прошедшее время означает:","уже","может быть","никогда"]]},{"title":"Восклицание: مَا أَفْعَلَ","body":"<p>Восклицательная конструкция «как же...!»: [[مَا]] + [[أَفْعَلَ]] + существительное в винительном падеже:</p>\n<p>[[مَا أَجْمَلَ السَّمَاءَ!]] Как прекрасно небо! [[مَا أَصْعَبَ هَذَا!]] Как же это трудно!</p>","ex":"مَا أَطْيَبَ هَذَا الطَّعَامَ!|Как вкусна эта еда!","quiz":[["«Как прекрасно небо!»:","مَا أَجْمَلَ السَّمَاءَ!","مَا جَمِيلٌ السَّمَاءُ!","السَّمَاءُ أَجْمَلُ!"]]}],"readings":[{"title":"فَنُّ الْإِيجَازِ","tr":"Искусство краткости","sents":"قَالَ الْعَرَبُ قَدِيمًا: خَيْرُ الْكَلَامِ مَا قَلَّ وَدَلَّ.|Арабы издревле говорили: лучшая речь — краткая и ясная.\nوَفِي زَمَنِ الرَّسَائِلِ السَّرِيعَةِ يَبْدُو هَذَا الْقَوْلُ أَكْثَرَ صِدْقًا مِنْ أَيِّ وَقْتٍ مَضَى.|А во времена быстрых сообщений эта мысль звучит правдивее, чем когда-либо.\nفَالْإِيجَازُ لَيْسَ فَقْرًا فِي اللُّغَةِ، بَلْ هُوَ احْتِرَامٌ لِوَقْتِ السَّامِعِ.|Ведь краткость — не бедность языка, а уважение ко времени слушателя.","gloss":"قال|сказали\nالعرب|арабы\nقديما|издревле\nخير|лучшая\nالكلام|речь\nقل|мало\nودل|и ясно указало\nزمن|время, эпоха\nالرسائل|сообщения\nالسريعة|быстрые\nيبدو|кажется\nالقول|изречение\nصدقا|правдивым\nأي|любой\nوقت|время\nمضى|прошедшее\nفالإيجاز|ведь краткость\nالإيجاز|краткость\nفقرا|бедностью\nاللغة|язык\nاحترام|уважение\nلوقت|ко времени\nالسامع|слушателя"},{"title":"فَنُّ الصَّمْتِ","tr":"Искусство молчать","sents":"يُقَالُ إِنَّ الْكَلَامَ مِنْ فِضَّةٍ وَالسُّكُوتَ مِنْ ذَهَبٍ.|Говорят, что слово — серебро, а молчание — золото.\nفِي عَصْرِ الرَّسَائِلِ اللَّامُتَنَاهِيَةِ يَبْدُو هَذَا الْمَثَلُ تَحَدِّيًا تَقْرِيبًا.|В эпоху бесконечных сообщений эта пословица звучит почти как вызов.\nنُسَارِعُ إِلَى الرَّدِّ وَالتَّعْلِيقِ وَإِبْدَاءِ الرَّأْيِ.|Мы спешим ответить, прокомментировать, высказаться.\nوَنَادِرًا مَا نَتَسَاءَلُ هَلْ كَانَ ذَلِكَ يَسْتَحِقُّ.|И редко задумываемся, стоило ли.\nوَمَعَ ذَلِكَ فَإِنَّ الْقُدْرَةَ عَلَى السُّكُوتِ فِي الْوَقْتِ الْمُنَاسِبِ عَلَامَةُ نُضْجٍ لَا ضَعْفٍ.|Между тем умение вовремя промолчать — признак не слабости, а зрелости.\nيَمْنَحُ الصَّمْتُ وَقْتًا لِاسْتِيعَابِ مَا سُمِعَ.|Молчание даёт время осмыслить услышанное.\nيَتَبَيَّنُ أَنَّ الْإِصْغَاءَ لَا يَقِلُّ أَهَمِّيَّةً عَنِ الْكَلَامِ.|Оказывается, слушать — не менее важно, чем говорить.\nلَيْسَ مِنْ قَبِيلِ الصُّدْفَةِ أَنَّ حُكَمَاءَ كُلِّ الْعُصُورِ قَدَّرُوا قِلَّةَ الْكَلَامِ.|Не случайно мудрецы всех эпох ценили немногословность.","gloss":""},{"title":"عَنِ التَّرْجَمَةِ","tr":"О переводе","sents":"التَّرْجَمَةُ لَيْسَتْ مُجَرَّدَ اسْتِبْدَالٍ لِلْكَلِمَاتِ.|Перевод — это не простая замена слов.\nكُلُّ لُغَةٍ تَحْمِلُ فِي ذَاتِهَا رُؤْيَةً خَاصَّةً لِلْعَالَمِ.|Каждый язык хранит в себе особое видение мира.\nالتَّعَابِيرُ الِاصْطِلَاحِيَّةُ وَالتَّلَاعُبُ بِالْأَلْفَاظِ وَالْمَعْنَى الضِّمْنِيُّ، كُلُّ ذَلِكَ يَصْعُبُ تَرْجَمَتُهُ.|Идиомы, игра слов, подтекст — всё это с трудом поддаётся переводу.\nيُضْطَرُّ الْمُتَرْجِمُ إِلَى الِاخْتِيَارِ بَيْنَ الدِّقَّةِ وَالْجَمَالِ.|Переводчику приходится выбирать между точностью и красотой.\nلَيْسَ عَبَثًا أَنْ يُقَالَ إِنَّ الْمُتَرْجِمَ مُؤَلِّفٌ مُشَارِكٌ.|Не случайно говорят, что переводчик — соавтор.\nالتَّرْجَمَةُ الْجَيِّدَةُ تَحْفَظُ لَا الْمَعْنَى فَحَسْبُ بَلْ رُوحَ الْأَصْلِ أَيْضًا.|Хороший перевод сохраняет не только смысл, но и дух оригинала.\nلِهَذَا السَّبَبِ تَحْدِيدًا تُتَرْجَمُ الْكُتُبُ الْعَظِيمَةُ مَرَّةً بَعْدَ مَرَّةٍ.|Именно поэтому великие книги переводят снова и снова.","gloss":""},{"title":"ذَاكِرَةُ الْمَكَانِ","tr":"Память места","sents":"هُنَاكَ مُدُنٌ تَعِيشُ فِينَا طَوِيلًا بَعْدَ أَنْ نُغَادِرَهَا.|Есть города, которые живут в нас долго после того, как мы их покинули.\nرَائِحَةُ الْمَطَرِ فِي شَارِعٍ قَدِيمٍ، وَرَنِينُ الْأَجْرَاسِ، وَصَوْتُ تَاجِرٍ فِي السُّوقِ.|Запах дождя на старой улице, звон колоколов, голос торговца на рынке.\nكُلُّ ذَلِكَ يَطْفُو فَجْأَةً فِي الذَّاكِرَةِ.|Всё это внезапно всплывает в памяти.\nالْحَنِينُ لَيْسَ مُجَرَّدَ شَوْقٍ إِلَى الْمَاضِي.|Ностальгия — это не просто тоска по прошлому.\nإِنَّهُ مُحَاوَلَةٌ لِاسْتِعَادَةِ جُزْءٍ مِنْ ذَاتِكَ بَقِيَ هُنَاكَ.|Это попытка вернуть часть себя, которая осталась там.\nعِنْدَمَا نَعُودُ إِلَى هُنَاكَ بَعْدَ سَنَوَاتٍ، كَثِيرًا مَا لَا نَتَعَرَّفُ عَلَى الْمَدِينَةِ وَلَا عَلَى أَنْفُسِنَا.|Возвращаясь туда спустя годы, мы часто не узнаём ни города, ни себя.\nوَمَعَ ذَلِكَ يَمْنَحُ هَذَا اللِّقَاءُ طُمَأْنِينَةً غَرِيبَةً.|И всё же эта встреча дарит странное умиротворение.","gloss":""}],"dialogues":[{"title":"Разговор о романе","lines":"A|هَلْ أَنْهَيْتَ الرِّوَايَةَ؟|Ты дочитал роман?\nB|نَعَمْ. بِصَرَاحَةٍ، النِّهَايَةُ حَيَّرَتْنِي.|Да. Честно говоря, финал меня озадачил.\nA|الْكَاتِبُ يُحِبُّ أَنْ يَتْرُكَ الْأُمُورَ مُعَلَّقَةً.|Автор любит оставлять всё недосказанным.\nB|بِالضَّبْطِ. كُلُّ شَيْءٍ قَائِمٌ عَلَى الْمَعْنَى الضِّمْنِيِّ.|Именно. Всё держится на подтексте.\nA|لَكِنْ مَا أَجْمَلَ لُغَتَهُ!|Но как прекрасен его язык!\nB|صَدَقْتَ.|Ты прав."},{"title":"Разговор о романе","lines":"A|إِذَنْ، هَلْ أَنْهَيْتَ الرِّوَايَةَ؟|Ну что, дочитал роман?\nB|أَنْهَيْتُهَا. بِصَرَاحَةٍ، النِّهَايَةُ أَرْبَكَتْنِي.|Дочитал. Честно говоря, финал меня обескуражил.\nA|نَعَمْ فِعْلًا، الْمُؤَلِّفُ يُحِبُّ تَرْكَ الْأُمُورِ مُعَلَّقَةً.|Да уж, автор любит недоговорённости.\nB|بِالضَّبْطِ. كُلُّ شَيْءٍ قَائِمٌ عَلَى الْمَعْنَى الضِّمْنِيِّ.|Вот-вот. Всё держится на подтексте.\nA|لَكِنْ يَا لَهَا مِنْ لُغَةٍ! لَا يُمْكِنُ التَّوَقُّفُ عَنِ الْقِرَاءَةِ.|Зато язык какой! Не оторваться.\nB|هَذَا صَحِيحٌ، لَا جِدَالَ.|Что правда, то правда."},{"title":"Размолвка","lines":"A|هَلْ مَا زِلْتَ مُسْتَاءً مِنِّي؟|Ты на меня ещё обижен?\nB|لَسْتُ مُسْتَاءً بِقَدْرِ مَا أَنَا خَائِبُ الْأَمَلِ.|Не то чтобы обижен, скорее разочарован.\nA|أَفْهَمُ. انْفَعَلْتُ وَقُلْتُ مَا لَا يَنْبَغِي.|Я понимаю. Я погорячился и сказал лишнее.\nB|الْكَلِمَةُ إِذَا خَرَجَتْ لَا تَعُودُ.|Слово — не воробей, вылетит — не поймаешь.\nA|أَعْرِفُ. سَامِحْنِي مِنْ فَضْلِكَ.|Знаю. Прости меня, пожалуйста.\nB|حَسَنًا، عَفَا اللَّهُ عَمَّا سَلَفَ.|Ладно, кто старое помянет, тому глаз вон.\nA|شُكْرًا. أَنْتَ صَدِيقٌ حَقِيقِيٌّ.|Спасибо. Ты настоящий друг."},{"title":"На выставке","lines":"A|مَا رَأْيُكَ فِي هَذِهِ اللَّوْحَةِ؟|Что скажешь об этом полотне?\nB|الْأَلْوَانُ مُدْهِشَةٌ، لَكِنَّ التَّكْوِينَ مُزْدَحِمٌ فِي رَأْيِي.|Колорит поразительный, но композиция, по-моему, перегружена.\nA|أَمَّا أَنَا فَأَظُنُّ أَنَّ هَذِهِ هِيَ فِكْرَةُ الرَّسَّامِ.|А мне кажется, в этом и замысел художника.\nB|رُبَّمَا. الْفَوْضَى كَانْعِكَاسٍ لِلْعَصْرِ؟|Возможно. Хаос как отражение эпохи?\nA|بِالضَّبْطِ. انْظُرْ إِلَى ضَرَبَاتِ الْفُرْشَاةِ، مَا أَكْثَرَ الْقَلَقِ فِيهَا.|Именно. Посмотри на мазки — сколько в них тревоги.\nB|لَقَدْ أَقْنَعْتَنِي تَقْرِيبًا.|Ты меня почти убедил."}]}}};

const lines = s => String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

const HARAKAT = /[ً-ْٰـ]/g;
function norm(s, tl){

  if (tl==='ru') s = s.replace(/ё/g,'е');

}

  return ''; }

/* ---------- store ---------- */
const Store = {
  d:{passed:{},best:{},weak:{},last:{},settings:{rate:1,volume:1,voice:{}}},
  load(){ try{ const r=localStorage.getItem('lisan.v1'); if(r){ const o=JSON.parse(r); Object.assign(this.d,o); this.d.settings=Object.assign({rate:1,volume:1,voice:{}},o.settings||{}); } }catch(e){} },
  save(){ try{ localStorage.setItem('lisan.v1', JSON.stringify(this.d)); }catch(e){} },
  passed(tr,L){ return !!(this.d.passed[tr]&&this.d.passed[tr][L]); },
  unlocked(tr,i){ if(i===0) return true; for(let k=i-1;k<LEVELS.length;k++) if(this.passed(tr,LEVELS[k])) return true; return false; },
  weak(key){ return this.d.weak[key]||(this.d.weak[key]={}); }
};

/* ---------- speech ---------- */
/* Audio: recorded neural-voice clips (packs per language+level), device voice only as fallback */
const Packs = { data:{}, loading:{},
  key(text, alt){ return (alt?'B|':'')+sayOf(text).trim().toLowerCase(); },
  one(id){ if (this.data[id]) return Promise.resolve(); if (this.loading[id]) return this.loading[id];
    this.loading[id] = fetch('audio/'+id+'.json').then(r=>r.ok?r.json():null).then(j=>{ if(j) this.data[id]=j; }).catch(()=>{}).finally(()=>{ delete this.loading[id]; });
    return this.loading[id]; },
  load(lang, L){ const id=lang+'-'+L; return this.one(id).then(()=>this.one(id+'-w')); },
  async ensure(text, tl, alt){ let c=this.find(text,tl,alt); if (c) return c; const ps=Object.values(this.loading); if (ps.length){ await Promise.all(ps); c=this.find(text,tl,alt); } return c; },
  find(text, tl, alt){ const ks = alt ? [this.key(text,true), this.key(text,false)] : [this.key(text,false)];
    const cur=tl+'-'+S.L; const order = Object.keys(this.data).filter(id=>id.startsWith(tl+'-')).sort((a,b)=> (b.startsWith(cur)) - (a.startsWith(cur)));

    return null; }
};
const audioEl = new Audio(); audioEl.preload='auto'; try{ audioEl.preservesPitch=true; audioEl.mozPreservesPitch=true; audioEl.webkitPreservesPitch=true; }catch(e){}
const Speech = {
  voices:[], chainId:0, pend:null,
  ok: typeof window.speechSynthesis!=='undefined',
  init(){ if(!this.ok) return; const load=()=>{ try{ this.voices = speechSynthesis.getVoices(); }catch(e){} if (S.view==='level' && S.audioOpen) renderAudioSheet(); }; load(); try{ speechSynthesis.addEventListener('voiceschanged',load); }catch(e){ speechSynthesis.onvoiceschanged=load; } },
  list(tl){ return this.voices.filter(v=>(v.lang||'').toLowerCase().replace('_','-').startsWith(tl)); },
  score(v){ let s=0; const n=v.name||''; if(/Google/i.test(n)) s+=5; if(/Natural|Neural|Premium|Enhanced|Online/i.test(n)) s+=6; if(/Milena|Yuri|Katya|Svetlana|Dmitry|Dariya|Samantha|Daniel|Karen|Maged|Laila|Majed|Tarik|Zariyah|Hamed|Mariam|Shakir|Salma/i.test(n)) s+=3; if(/Naayf|Hoda/i.test(n)) s-=2; if(v.localService) s+=1; return s; },
  mode(tl){ const v=Store.d.settings.voice[tl]; if (v && v!=='lisan' && v!=='auto') return 'device'; if (v==='lisan') return 'clip'; return (tl==='ar' && this.autoVoice(tl)) ? 'auto' : 'clip'; },
  autoVoice(tl){ if (!this.ok || this.broken) return null; const L=this.list(tl); if(!L.length) return null; return L.slice().sort((a,b)=>this.score(b)-this.score(a))[0]; },
  voice(tl, alt){ const L=this.list(tl); if(!L.length) return null; const want=Store.d.settings.voice[tl]; let v = L.find(x=>x.voiceURI===want); const sorted=L.slice().sort((a,b)=>this.score(b)-this.score(a)); if(!v) v=sorted[0]; if(alt){ const other = sorted.find(x=>x!==v); return other||v; } return v; },
  stop(){ this.chainId++; try{ audioEl.pause(); }catch(e){} if (this.pend){ const f=this.pend; this.pend=null; f(); } if(this.ok) try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll('.speaking').forEach(e=>e.classList.remove('speaking')); },
  rate(o){ const st=Store.d.settings; return Math.max(.4,Math.min(2,(st.rate||1)*(o.slow?0.65:1))); },
  vol(){ const st=Store.d.settings; return Math.max(0,Math.min(1,st.volume==null?1:st.volume)); },
  playClip(clip, o){

  // resolves true if the device voice actually started speaking
  speakDevice(text, tl, o, watch){

/* ---------- model ---------- */
const cache = {};
function common(tr){ const key='c:'+tr; if(cache[key]) return cache[key]; const {n,t,bank}=TRACKS[tr]; const m={};
  lines(bank.common).forEach(l=>{ const f=l.split('|'); const w=norm(f[0],t); m[w] = t==='en' ? (n==='ar'?f[1]:f[2]) : f[1]; });
  return cache[key]=m; }
function parseSent(l, t, n){ const f=l.split('|'); const src=f[0]; const m = t==='en' ? (n==='ar'?f[1]:f[2]) : f[1]; return {src, t:disp(src), say:sayOf(src), m, pr:pronOf(src,t,n)}; }
function level(tr, L){

  D.vocab.forEach((th,ti)=>{ themes.push(pick(th.t,n)); lines(th.w).forEach(l=>{ const f=l.split('|'); let it;
    if (t==='en') it={e:f[0],src:f[1],m:n==='ar'?f[2]:f[3]}; else it={e:f[0],src:f[1],m:f[2]};
    it.theme=ti; it.t=disp(it.src); it.say=sayOf(it.src); if(!it.pr) it.pr=pronOf(it.src,t,n); it.id=L+':v:'+vocab.length; it.kind='v'; vocab.push(it); }); });
  const sentences = lines(D.sentences).map((l,i)=>Object.assign(parseSent(l,t,n),{id:L+':s:'+i,kind:'s'}));
  const grammar = D.grammar.map((g,gi)=>({title:pick(g.title,n), body:pick(g.body,n), ex:lines(g.ex).map(l=>parseSent(l,t,n)),

  const readings = (D.readings||[]).map(r=>{ const gl={}; lines(r.gloss).forEach(x=>{ const f=x.split('|'); gl[norm(f[0],t)] = t==='en'?(n==='ar'?f[1]:f[2]):f[1]; });

  const dialogues = (D.dialogues||[]).map(d=>({title:pick(d.title,n), lines:lines(d.lines).map(l=>{ const f=l.split('|'); const s=parseSent(f.slice(1).join('|'),t,n); s.who=f[0]; return s; })}));

      if (t==='ru') a={letter:f[0], name:f[1], nameSay:f[1], sound:f[2], ex:f[3], e:f[4], m:f[5]};
      else if (t==='en') a={letter:f[0], name:pick(f[1],n), nameSay:f[0].split(' ')[0]+'.', sound:pick(f[2],n), ex:f[3], e:f[4], m:n==='ar'?f[5]:f[6], expr:n==='ar'?f[7]:f[8]};
      else a={letter:f[0], name:f[1], nameSay:f[7], sound:f[2], forms:f[3], ex:f[4], e:f[5], m:f[6]};
      a.exT=disp(a.ex); a.exSay=sayOf(a.ex); a.expr=pronOf(a.ex,t,n); a.id='A1:l:'+i; a.kind='l'; return a; }); }

/* ---------- state & routing ---------- */

  const L=m[2].toUpperCase(); if (S.L!==L){ S.theme=0; S.letter=0; S.reading=0; S.dialog=0; S.traceIdx=0; S.dictIdx=0; S.copyIdx=0; S.exam=null; S.gramOpen=0; S.flashQ=null; }
  S.L=L; S.view='level'; Packs.load(TRACKS[S.tr].t, L);
  const lv=level(S.tr,L); const tabs=tabList(lv);
  const i=LEVELS.indexOf(L); S.lockedView = !Store.unlocked(S.tr,i);
  S.tab = m[3] && tabs.includes(m[3]) ? m[3] : (S.lockedView?'exam':tabs[0]);

function trackStats(tr){ let w=0,s=0,g=0; LEVELS.forEach(L=>{ const lv=level(tr,L); w+=lv.vocab.length; s+=lv.sentences.length+lv.dialogues.reduce((a,d)=>a+d.lines.length,0)+lv.readings.reduce((a,r)=>a+r.sents.length,0); g+=lv.grammar.length; }); return {w,s,g}; }

let traceState=null;
function setupTrace(){
  const c=$('#trace'); if(!c) return; const lv=level(S.tr,S.L); const items=writeItems(lv); const it=items[S.traceIdx%items.length]; const tl=lv.t;
  const dpr=window.devicePixelRatio||1; const w=c.clientWidth, h=c.clientHeight; c.width=w*dpr; c.height=h*dpr; const ctx=c.getContext('2d'); ctx.scale(dpr,dpr);
  const css=getComputedStyle(document.documentElement); const col=n=>css.getPropertyValue(n).trim();
  const font = S.traceFont==='hand' ? (tl==='ar'?"'Aref Ruqaa'":"'Marck Script'") : (tl==='ar'?"'Amiri'":"'Lora'");

function examPool(lv){
  const g=[]; lv.grammar.forEach(x=>x.quiz.forEach(q=>g.push(q)));
  return {v:lv.vocab, s:lv.sentences, g, l:lv.alphabet||[]};

function prioritized(arr, key, n){
  const weak=Store.weak(key), last=new Set(Store.d.last[key]||[]);
  const w=shuffle(arr.filter(x=>weak[x.id])), fresh=shuffle(arr.filter(x=>!weak[x.id]&&!last.has(x.id))), old=shuffle(arr.filter(x=>!weak[x.id]&&last.has(x.id)));
  const out=[]; const wn=Math.ceil(n*0.5);
  out.push(...w.slice(0,wn)); for (const x of fresh){ if(out.length>=n) break; out.push(x); } for (const x of old){ if(out.length>=n) break; out.push(x); } for (const x of w.slice(wn)){ if(out.length>=n) break; out.push(x); }
  return out.slice(0,n);
}
function distract(pool, correct, getter, n=3){ const tl=TRACKS[S.tr].t; const nm=x=>norm(x.m||'',TRACKS[S.tr].n); const ns=x=>norm(x.say||x.letter||'',tl);
  const seenG=new Set([getter(correct)]), seenM=new Set([nm(correct)]), seenS=new Set([ns(correct)]); const out=[];
  for (const x of shuffle(pool)){ const g=getter(x), m=nm(x), sv=ns(x); if(seenG.has(g)||(m&&seenM.has(m))||(sv&&seenS.has(sv))) continue; seenG.add(g); seenM.add(m); seenS.add(sv); out.push(x); if(out.length>=n) break; }
  return out; }
function buildExam(lv){
  const key=S.tr+':'+S.L, P=examPool(lv), tl=lv.t; const Q=[];
  const plan = lv.alphabet ? {mean:5,rev:3,listen:3,letter:2,sent:2,order:2,spell:1,gram:2} : {mean:5,rev:3,listen:3,sent:2,order:2,spell:2,gram:3};
  const vNeed = plan.mean+plan.rev+plan.listen+plan.spell; const vs = prioritized(P.v,key,vNeed);
  let vi=0; const takeV=()=>vs[vi++];
  for(let i=0;i<plan.mean;i++){ const it=takeV(); if(!it) break; Q.push({type:'mcq',kind:'kMean',item:it, prompt:{word:it.t,say:it.say,emo:''}, opts:shuffle([it,...distract(P.v,it,x=>x.m)]).map(x=>({label:x.m,ok:x===it}))}); }
  for(let i=0;i<plan.rev;i++){ const it=takeV(); if(!it) break; Q.push({type:'mcq',kind:'kRev',item:it, prompt:{text:it.m,emo:it.e}, opts:shuffle([it,...distract(P.v,it,x=>x.say)]).map(x=>({label:x.t,ok:x===it,tgt:1}))}); }
  for(let i=0;i<plan.listen;i++){ const it=takeV(); if(!it) break; Q.push({type:'mcq',kind:'kListen',item:it, prompt:{listen:it.say}, opts:shuffle([it,...distract(P.v,it,x=>x.say)]).map(x=>({label:x.t,ok:x===it,tgt:1}))}); }
  const sp = P.v.filter(x=>!/\s/.test(x.say) && x.say.length<=12); const spells = prioritized(sp.length?sp:P.v,key,plan.spell);
  spells.forEach(it=>Q.push({type:'spell',kind:'kSpell',item:it,prompt:{listen:it.say,emo:it.e}}));
  if (plan.letter && P.l.length){ prioritized(P.l,key,plan.letter).forEach(it=>Q.push({type:'mcq',kind:'kLetter',item:it,prompt:{listen:it.nameSay},opts:shuffle([it,...distract(P.l,it,x=>x.letter)]).map(x=>({label:x.letter,ok:x===it,tgt:1}))})); }
  prioritized(P.s,key,plan.sent).forEach(it=>Q.push({type:'mcq',kind:'kSent',item:it,prompt:{word:it.t,say:it.say,small:1},opts:shuffle([it,...distract(P.s,it,x=>x.m)]).map(x=>({label:x.m,ok:x===it}))}));
  const ord = P.s.filter(x=>{ const n=tokens(x.src).length; return n>=3&&n<=6 && new Set(tokens(x.src).map(w=>w.toLowerCase())).size===n; });
  prioritized(ord.length?ord:P.s,key,plan.order).forEach(it=>{ const tk=tokens(it.src); Q.push({type:'order',kind:'kOrder',item:it,words:tk,pool:shuffle(tk.map((w,i)=>({w,i}))),chosen:[]}); });
  prioritized(P.g,key,plan.gram).forEach(it=>Q.push({type:'mcq',kind:'kGram',item:it,prompt:{gram:it.q},opts:shuffle(it.opts.map((o,i)=>({label:disp(o),ok:i===0,tgt:1})))}));
  while (Q.length<EXAM_N){ const it=P.v[Math.floor(Math.random()*P.v.length)]; Q.push({type:'mcq',kind:'kMean',item:it,prompt:{word:it.t,say:it.say},opts:shuffle([it,...distract(P.v,it,x=>x.m)]).map(x=>({label:x.m,ok:x===it}))}); }
  const first=Q.slice(0,EXAM_N); const out = shuffle(first);

}
