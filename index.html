trong.|هو طويل وقوي.|Он высокий и сильный.\nMy grandfather is old but cheerful.|جدي كبير في السن لكنه مرح.|Мой дедушка старый, но весёлый.\nGrandmother makes a tasty cake.|جدتي تصنع كعكة لذيذة.|Бабушка готовит вкусный торт.\nI don't like to wait.|لا أحب الانتظار.|Я не люблю ждать.\nWait, please.|انتظر من فضلك.|Подожди, пожалуйста.\nOpen the window, please.|افتح النافذة من فضلك.|Открой окно, пожалуйста.\nClose the door.|أغلق الباب.|Закрой дверь.\nSit down, please.|اجلس من فضلك.|Садись, пожалуйста.\nI am going home.|أنا ذاهب إلى البيت.|Я иду домой.\nAre you at home?|هل أنت في البيت؟|Ты дома?\nYes, I am at home.|نعم، أنا في البيت.|Да, я дома.\nNo, I am at work.|لا، أنا في العمل.|Нет, я на работе.\nI call my mom every day.|أتصل بأمي كل يوم.|Я звоню маме каждый день.\nWe love swimming in the sea.|نحب السباحة في البحر.|Мы любим плавать в море.\nIt is hot in summer.|الجو حار في الصيف.|Летом жарко.\nIn winter it is cold and it snows.|في الشتاء يكون الجو باردا ويتساقط الثلج.|Зимой холодно и идёт снег.\nThere are many trees in the forest.|في الغابة أشجار كثيرة.|В лесе много деревьев.\nThe birds are singing.|الطيور تغرد.|Птицы поют.\nI see a mountain.|أرى جبلا.|Я вижу гору.\nToday is Monday.|اليوم هو الاثنين.|Сегодня понедельник.\nTomorrow is Saturday.|غدا السبت.|Завтра суббота.\nI am free on Sunday.|أنا متفرغ يوم الأحد.|Я свободен в воскресенье.\nGood night!|تصبح على خير!|Спокойной ночи!\nEnjoy your meal!|بالهناء والشفاء!|Приятного аппетита!\nHappy birthday!|عيد ميلاد سعيد!|С днём рождения!\nEverything is fine.|كل شيء بخير.|Всё хорошо.\nIt's nothing serious.|لا بأس.|Ничего страшного.","grammar":[{"title":"فعل الكينونة: am / is / are::Глагол to be: am / is / are","body":["<p>على عكس العربية، لا يمكن حذف فعل الكينونة في الإنجليزية. «أنا طالب» = [[I am a student.]]</p>\n<table><tr><th>الضمير</th><th>الفعل</th><th>مختصر</th></tr>\n<tr><td>[[I]]</td><td>[[am]]</td><td>[[I'm]]</td></tr>\n<tr><td>[[he]] / [[she]] / [[it]]</td><td>[[is]]</td><td>[[he's]]</td></tr>\n<tr><td>[[we]] / [[you]] / [[they]]</td><td>[[are]]</td><td>[[we're]]</td></tr></table>\n<p><b>النفي:</b> [[I am not]]، [[she isn't]]، [[they aren't]]. <b>السؤال:</b> نقدّم الفعل: [[Are you a student?]]</p>","<p>В отличие от русского, в английском глагол «быть» в настоящем времени <b>нельзя опускать</b>. «Я студент» = [[I am a student.]]</p>\n<table><tr><th>Местоимение</th><th>Глагол</th><th>Сокращение</th></tr>\n<tr><td>[[I]]</td><td>[[am]]</td><td>[[I'm]]</td></tr>\n<tr><td>[[he]] / [[she]] / [[it]]</td><td>[[is]]</td><td>[[he's]]</td></tr>\n<tr><td>[[we]] / [[you]] / [[they]]</td><td>[[are]]</td><td>[[we're]]</td></tr></table>\n<p><b>Отрицание:</b> [[I am not]], [[she isn't]], [[they aren't]]. <b>Вопрос:</b> глагол выходит вперёд: [[Are you a student?]]</p>"],"ex":"I am a student.|أنا طالب.|Я студент.\nShe is a doctor.|هي طبيبة.|Она врач.\nWe are at home.|نحن في البيت.|Мы дома.\nIs he your brother?|هل هو أخوك؟|Он твой брат?","quiz":[["She ___ a teacher.","is","am","are"],["They ___ my friends.","are","is","am"],["I ___ hungry.","am","is","are"]]},{"title":"أدوات التعريف والتنكير: a / an / the::Артикли: a / an / the","body":["<p><b>[[a]]</b> = نكرة مفرد (قبل حرف ساكن): [[a book]] كتابٌ.</p>\n<p><b>[[an]]</b> = نكرة قبل صوت علّة: [[an apple]]، [[an hour]].</p>\n<p><b>[[the]]</b> = المعرفة، مثل «الـ» في العربية: [[the book]] الكتاب (المعروف لنا).</p>\n<p class=\"tip\">لا نستخدم a/an مع الجمع أو غير المعدود: [[water]]، [[books]].</p>","<p>В русском артиклей нет, поэтому это главная трудность.</p>\n<p><b>[[a]]</b> — «какой-то, один» (перед согласным звуком): [[a book]] — (какая-то) книга.</p>\n<p><b>[[an]]</b> — то же, но перед гласным звуком: [[an apple]], [[an hour]].</p>\n<p><b>[[the]]</b> — «тот самый, известный нам»: [[the book]] — эта (конкретная) книга.</p>\n<p class=\"tip\">С множественным числом и неисчисляемыми a/an не ставим: [[water]], [[books]].</p>"],"ex":"I have a car.|عندي سيارة.|У меня есть машина.\nI eat an apple.|آكل تفاحة.|Я ем яблоко.\nThe car is red.|السيارة حمراء.|Машина красная.","quiz":[["I eat ___ apple.","an","a","the"],["She has ___ dog.","a","an","—"],["___ sun is hot.","The","A","An"]]},{"title":"المضارع البسيط::Present Simple","body":["<p>للعادات والحقائق: [[I work every day.]]</p>\n<p>مع [[he]] / [[she]] / [[it]] نضيف ‎-s للفعل: [[She works.]]</p>\n<p><b>النفي:</b> [[don't]] / [[doesn't]] + الفعل: [[I don't work.]] [[He doesn't work.]]</p>\n<p><b>السؤال:</b> [[Do]] / [[Does]] في البداية: [[Do you work?]] [[Does she work?]]</p>\n<p class=\"tip\">بعد [[doesn't]] و[[does]] يعود الفعل بدون ‎-s.</p>","<p>Для привычек и фактов: [[I work every day.]]</p>\n<p>С [[he]] / [[she]] / [[it]] добавляем ‎-s: [[She works.]]</p>\n<p><b>Отрицание:</b> [[don't]] / [[doesn't]] + глагол: [[I don't work.]] [[He doesn't work.]]</p>\n<p><b>Вопрос:</b> [[Do]] / [[Does]] в начале: [[Do you work?]] [[Does she work?]]</p>\n<p class=\"tip\">После [[doesn't]] и [[does]] глагол без ‎-s.</p>"],"ex":"I drink tea every morning.|أشرب الشاي كل صباح.|Я пью чай каждое утро.\nHe lives in London.|يعيش في لندن.|Он живёт в Лондоне.\nWe don't eat meat.|لا نأكل اللحم.|Мы не едим мясо.\nDoes she speak Russian?|هل تتكلم الروسية؟|Она говорит по-русски?","quiz":[["He ___ in a bank.","works","work","working"],["___ you like coffee?","Do","Does","Are"],["She ___ eat meat.","doesn't","don't","isn't"]]},{"title":"جمع الأسماء::Множественное число","body":["<p>نضيف ‎-s غالباً: [[book]] ← [[books]].</p>\n<p>بعد s، sh، ch، x نضيف ‎-es: [[box]] ← [[boxes]].</p>\n<p>‎-y بعد ساكن ← ‎-ies: [[city]] ← [[cities]].</p>\n<p>جموع شاذة: [[man]] ← [[men]]، [[woman]] ← [[women]]، [[child]] ← [[children]]، [[person]] ← [[people]]، [[foot]] ← [[feet]].</p>","<p>Обычно добавляем ‎-s: [[book]] → [[books]].</p>\n<p>После s, sh, ch, x — ‎-es: [[box]] → [[boxes]].</p>\n<p>‎-y после согласной → ‎-ies: [[city]] → [[cities]].</p>\n<p>Исключения: [[man]] → [[men]], [[woman]] → [[women]], [[child]] → [[children]], [[person]] → [[people]], [[foot]] → [[feet]].</p>"],"ex":"I have two brothers.|عندي أخوان.|У меня два брата.\nThere are three children.|هناك ثلاثة أطفال.|Там трое детей.","quiz":[["جمع [[child]]::Мн. число [[child]]","children","childs","childes"],["جمع [[city]]::Мн. число [[city]]","cities","citys","cityes"],["جمع [[box]]::Мн. число [[box]]","boxes","boxs","boxies"]]},{"title":"ضمائر الملكية::Притяжательные местоимения","body":["<table><tr><th>الضمير</th><th>الملكية</th><th>مثال</th></tr>\n<tr><td>[[I]]</td><td>[[my]]</td><td>[[my book]] كتابي</td></tr>\n<tr><td>[[you]]</td><td>[[your]]</td><td>[[your car]] سيارتك</td></tr>\n<tr><td>[[he]]</td><td>[[his]]</td><td>[[his name]] اسمه</td></tr>\n<tr><td>[[she]]</td><td>[[her]]</td><td>[[her phone]] هاتفها</td></tr>\n<tr><td>[[we]]</td><td>[[our]]</td><td>[[our house]] بيتنا</td></tr>\n<tr><td>[[they]]</td><td>[[their]]</td><td>[[their city]] مدينتهم</td></tr></table>\n<p class=\"tip\">ضمير الملكية يأتي <b>قبل</b> الاسم، عكس العربية.</p>","<table><tr><th>Местоимение</th><th>Притяжательное</th><th>Пример</th></tr>\n<tr><td>[[I]]</td><td>[[my]]</td><td>[[my book]] моя книга</td></tr>\n<tr><td>[[you]]</td><td>[[your]]</td><td>[[your car]] твоя машина</td></tr>\n<tr><td>[[he]]</td><td>[[his]]</td><td>[[his name]] его имя</td></tr>\n<tr><td>[[she]]</td><td>[[her]]</td><td>[[her phone]] её телефон</td></tr>\n<tr><td>[[we]]</td><td>[[our]]</td><td>[[our house]] наш дом</td></tr>\n<tr><td>[[they]]</td><td>[[their]]</td><td>[[their city]] их город</td></tr></table>\n<p class=\"tip\">Форма не меняется по роду: [[my]] = мой, моя, моё, мои.</p>"],"ex":"This is my sister.|هذه أختي.|Это моя сестра.\nWhat's his name?|ما اسمه؟|Как его зовут?\nTheir house is big.|بيتهم كبير.|Их дом большой.","quiz":[["She lost ___ phone (هاتفها::свой телефон).","her","his","their"],["We love ___ city.","our","we","us"]]},{"title":"يوجد: There is / There are::Есть: There is / There are","body":["<p>للتعبير عن وجود شيء في مكان: [[There is]] + مفرد، [[There are]] + جمع.</p>\n<p>[[There is a bank on this street.]] يوجد بنك في هذا الشارع.</p>\n<p>[[There are two cafés near here.]] يوجد مقهيان قرب هنا.</p>\n<p><b>السؤال:</b> [[Is there...?]] / [[Are there...?]]</p>","<p>Чтобы сказать, что что-то где-то находится: [[There is]] + ед. ч., [[There are]] + мн. ч.</p>\n<p>[[There is a bank on this street.]] На этой улице есть банк.</p>\n<p>[[There are two cafés near here.]] Рядом есть два кафе.</p>\n<p><b>Вопрос:</b> [[Is there...?]] / [[Are there...?]]</p>"],"ex":"There is a cat in the garden.|توجد قطة في الحديقة.|В саду кошка.\nAre there any shops here?|هل توجد متاجر هنا؟|Здесь есть магазины?","quiz":[["There ___ three books on the table.","are","is","am"],["___ there a hotel near here?","Is","Are","Do"]]}],"readings":[{"title":"My Family","tr":"عائلتي::Моя семья","sents":"My name is Ahmad.|اسمي أحمد.|Меня зовут Ахмад.\nI am twenty-five years old.|عمري خمسة وعشرون عاماً.|Мне двадцать пять лет.\nI am from Jordan, but now I live in Tashkent.|أنا من الأردن، لكني أعيش الآن في طشقند.|Я из Иордании, но сейчас живу в Ташкенте.\nI have a big family.|عندي عائلة كبيرة.|У меня большая семья.\nMy mother is a teacher, and my father is an engineer.|أمي معلّمة وأبي مهندس.|Моя мама учительница, а папа инженер.\nI have one brother and one sister.|عندي أخ واحد وأخت واحدة.|У меня есть брат и сестра.\nMy brother works in a bank.|أخي يعمل في بنك.|Мой брат работает в банке.\nMy sister is a student.|أختي طالبة.|Моя сестра студентка.\nI love my family very much.|أحب عائلتي كثيراً.|Я очень люблю свою семью.","gloss":"name|اسم|имя\nahmad|أحمد|Ахмад\ntwenty-five|خمسة وعشرون|двадцать пять\nyears|سنوات|лет\nold|العمر (هنا)|(о возрасте)\njordan|الأردن|Иордания\nnow|الآن|сейчас\nlive|أعيش|живу\ntashkent|طشقند|Ташкент\nbig|كبيرة|большая\nfamily|عائلة|семья\nmother|أم|мама\nteacher|معلّمة|учительница\nfather|أب|папа\nengineer|مهندس|инженер\none|واحد|один\nbrother|أخ|брат\nsister|أخت|сестра\nworks|يعمل|работает\nbank|بنك|банк\nstudent|طالبة|студентка\nlove|أحب|люблю\nmuch|كثيراً|сильно"},{"title":"In My Apartment","tr":"في شقتي::В моей квартире","sents":"I live in an apartment in the city center.|أسكن في شقة في وسط المدينة.|Я живу в квартире в центре города.\nThe apartment is not big, but it is bright.|الشقة ليست كبيرة لكنها مضيئة.|Квартира не большая, но светлая.\nThere is a bedroom, a living room, a kitchen and a bathroom.|فيها غرفة نوم وغرفة جلوس ومطبخ وحمام.|Там есть спальня, гостиная, кухня и ванная.\nIn the bedroom there is a bed and a wardrobe.|في غرفة النوم سرير وخزانة.|В спальне стоит кровать и шкаф.\nIn the living room there is a sofa, a table and a TV.|في غرفة الجلوس أريكة وطاولة وتلفاز.|В гостиной есть диван, стол и телевизор.\nMy favorite room is the kitchen.|غرفتي المفضلة هي المطبخ.|Моя любимая комната — кухня.\nThere I make breakfast and drink tea.|هناك أحضر الفطور وأشرب الشاي.|Там я готовлю завтрак и пью чай.\nFrom the window I see a park and trees.|من النافذة أرى حديقة وأشجارا.|Из окна я вижу парк и деревья.\nMy neighbors are quiet and kind.|جيراني هادئون ولطفاء.|Мои соседи тихие и добрые.\nI really like my apartment.|تعجبني شقتي كثيرا.|Мне очень нравится моя квартира.","gloss":""},{"title":"At the Market","tr":"في السوق::На рынке","sents":"On Saturday I go to the market.|يوم السبت أذهب إلى السوق.|В субботу я хожу на рынок.\nThere are a lot of fruits and vegetables there.|هناك فواكه وخضار كثيرة.|Там много фруктов и овощей.\nI buy apples, tomatoes and cucumbers.|أشتري التفاح والطماطم والخيار.|Я покупаю яблоки, помидоры и огурцы.\nThe seller is very kind.|البائع لطيف جدا.|Продавец очень добрый.\n\"Hello! What would you like?\"|يقول: «مرحبا! ماذا تريد؟»|Он говорит: «Здравствуйте! Что вы хотите?»\n\"A kilo of grapes, please.\"|أجيب: «كيلو عنب من فضلك».|Я отвечаю: «Кило винограда, пожалуйста».\nThe grapes are sweet and not expensive.|العنب حلو وليس غاليا.|Виноград сладкий и не дорогой.\nI also buy bread, cheese and honey.|أشتري أيضا الخبز والجبن والعسل.|Я тоже покупаю хлеб, сыр и мёд.\nThen I go home and make a salad.|ثم أذهب إلى البيت وأحضر سلطة.|Потом я иду домой и готовлю салат.","gloss":""},{"title":"My Friend Ivan","tr":"صديقي إيفان::Мой друг Иван","sents":"I have a friend. His name is Ivan.|عندي صديق. اسمه إيفان.|У меня есть друг. Его зовут Иван.\nHe is twenty-eight years old.|عمره ثمانية وعشرون عاما.|Ему двадцать восемь лет.\nIvan lives in Moscow.|يسكن إيفان في موسكو.|Иван живёт в Москве.\nHe works in a bank.|هو يعمل في بنك.|Он работает в банке.\nIvan is tall, he has dark hair.|إيفان طويل، وشعره داكن.|Иван высокий, у него тёмные волосы.\nHe loves sports very much.|هو يحب الرياضة كثيرا.|Он очень любит спорт.\nEvery morning he runs in the park.|كل صباح يركض في الحديقة.|Каждое утро он бегает в парке.\nIn the evening he reads or watches a film.|في المساء يقرأ أو يشاهد فيلما.|Вечером он читает или смотрит фильм.\nIvan has a dog. Its name is Bobik.|عند إيفان كلب. اسمه بوبيك.|У Ивана есть собака. Её зовут Бобик.\nWe often go for walks together.|نتمشى معا غالبا.|Мы часто гуляем вместе.","gloss":""}],"dialogues":[{"title":"تعارف::Знакомство","lines":"A|Hi! I'm Anna. What's your name?|مرحباً! أنا آنا. ما اسمك؟|Привет! Я Анна. Как тебя зовут?\nB|Hi, Anna! I'm Ahmad.|مرحباً يا آنا! أنا أحمد.|Привет, Анна! Я Ахмад.\nA|Nice to meet you. Where are you from?|تشرّفنا. من أين أنت؟|Приятно познакомиться. Откуда ты?\nB|I'm from Jordan. And you?|أنا من الأردن. وأنتِ؟|Я из Иордании. А ты?\nA|I'm from London. Do you speak English well?|أنا من لندن. هل تتكلم الإنجليزية جيداً؟|Я из Лондона. Ты хорошо говоришь по-английски?\nB|A little. I'm learning.|قليلاً. أنا أتعلم.|Немного. Я учусь.\nA|You're doing great!|أنت تقوم بعمل رائع!|У тебя отлично получается!\nB|Thank you!|شكراً!|Спасибо!"},{"title":"في المقهى::В кафе","lines":"A|Hello! What can I get you?|أهلاً! ماذا أحضر لك؟|Здравствуйте! Что вам принести?\nB|A cup of tea, please.|كوب شاي من فضلك.|Чашку чая, пожалуйста.\nA|With milk?|مع حليب؟|С молоком?\nB|No, thanks. And a piece of cake.|لا، شكراً. وقطعة كيك.|Нет, спасибо. И кусок торта.\nA|Anything else?|شيء آخر؟|Что-нибудь ещё?\nB|No, that's all. How much is it?|لا، هذا كل شيء. كم الحساب؟|Нет, это всё. Сколько с меня?\nA|Five dollars.|خمسة دولارات.|Пять долларов.\nB|Here you are.|تفضّل.|Вот, пожалуйста."},{"title":"في المطعم::В ресторане","lines":"A|Good evening! Here is the menu.|مساء الخير! تفضل قائمة الطعام.|Добрый вечер! Вот меню.\nB|Thank you. What do you recommend?|شكرا. بماذا تنصح؟|Спасибо. Что вы советуете?\nA|Today the soup is very tasty.|الحساء اليوم لذيذ جدا.|Сегодня очень вкусный суп.\nB|Good. Soup and a salad, please.|حسنا. حساء وسلطة من فضلك.|Хорошо. Суп и салат, пожалуйста.\nA|What will you drink?|ماذا تشرب؟|Что вы будете пить?\nB|A glass of water and tea.|كأس ماء وشايا.|Стакан воды и чай.\nA|Fine. Anything else?|حسنا. شيء آخر؟|Хорошо. Что-нибудь ещё?\nB|No, thank you. The bill later, please.|لا، شكرا. الحساب بعد ذلك من فضلك.|Нет, спасибо. Потом счёт, пожалуйста."},{"title":"أين الصيدلية؟::Где аптека?","lines":"A|Excuse me, where is the pharmacy?|عفوا، أين الصيدلية؟|Извините, где аптека?\nB|The pharmacy is there, opposite the bank.|الصيدلية هناك، مقابل البنك.|Аптека там, напротив банка.\nA|Is it far?|هل هي بعيدة؟|Это далеко?\nB|No, it's close. Five minutes on foot.|لا، قريبة. خمس دقائق مشيا.|Нет, близко. Пять минут пешком.\nA|Should I go straight?|هل أمشي إلى الأمام؟|Идти прямо?\nB|Yes, straight, then to the right.|نعم، إلى الأمام ثم إلى اليمين.|Да, прямо, потом направо.\nA|Thank you very much!|شكرا جزيلا!|Большое спасибо!\nB|You're welcome!|لا شكر على واجب!|Не за что!"},{"title":"عن العائلة::О семье","lines":"A|Do you have a big family?|هل عائلتك كبيرة؟|У тебя большая семья?\nB|Yes. I have two brothers and a sister.|نعم. عندي أخوان وأخت.|Да. У меня два брата и сестра.\nA|Where do they live?|أين يسكنون؟|Где они живут?\nB|My brothers live in Amman, and my sister lives here.|أخواي يسكنان في عمان، وأختي هنا.|Братья живут в Аммане, а сестра — здесь.\nA|And your parents?|ووالداك؟|А родители?\nB|My parents are also in Amman.|والداي أيضا في عمان.|Родители тоже в Аммане.\nA|Do you miss them?|هل تشتاق إليهم؟|Ты скучае رفة في الفندق.|Я забронировал номер в гостинице.\nSummer is the best season.|الصيف أفضل فصل.|Лето — лучшее время года.\nYesterday I was at the shop.|كنت أمس في المتجر.|Вчера я был в магазине.\nI bought a new jacket.|اشتريت سترة جديدة.|Я купил новую куртку.\nShe bought a red dress.|اشترت فستانا أحمر.|Она купила красное платье.\nHow much are these shoes?|بكم هذا الحذاء؟|Сколько стоят эти туфли?\nThis shirt is too small for me.|هذا القميص صغير علي.|Эта рубашка мне мала.\nDo you have this sweater in another color?|هل عندكم هذه الكنزة بلون آخر؟|У вас есть этот свитер другого цвета?\nCan I pay by card?|هل يمكن الدفع بالبطاقة؟|Можно заплатить картой?\nThere are big discounts today.|هناك تخفيضات كبيرة اليوم.|Сегодня большие скидки.\nI'm looking for a gift for my mom.|أبحث عن هدية لأمي.|Я ищу подарок для мамы.\nI need a bigger size.|أحتاج مقاسا أكبر.|Мне нужен размер побольше.\nWhat's the weather like today?|كيف الطقس اليوم؟|Какая сегодня погода?\nIt's raining today.|إنها تمطر اليوم.|Сегодня идёт дождь.\nTake an umbrella.|خذ مظلة.|Возьми зонтик.\nTomorrow will be sunny.|سيكون الجو مشمسا غدا.|Завтра будет солнечно.\nYesterday there was a strong wind.|كانت هناك ريح قوية أمس.|Вчера был сильный ветер.\nIn winter it's very cold in Moscow.|في الشتاء يكون الجو باردا جدا في موسكو.|Зимой в Москве очень холодно.\nIn summer it's hot in Tashkent.|في الصيف يكون الجو حارا في طشقند.|Летом в Ташкенте жарко.\nMy favorite season is spring.|فصلي المفضل هو الربيع.|Моё любимое время года — весна.\nMy birthday is in May.|عيد ميلادي في مايو.|У меня день рождения в мае.\nIn August we will go to the sea.|في أغسطس سنذهب إلى البحر.|В августе мы поедем на море.\nWhere is my passport?|أين جواز سفري؟|Где мой паспорт?\nI need a ticket to Samarkand.|أحتاج تذكرة إلى سمرقند.|Мне нужен билет до Самарканда.\nThe train leaves at nine o'clock.|ينطلق القطار في الساعة التاسعة.|Поезд отправляется в девять часов.\nThe plane is an hour late.|الطائرة متأخرة ساعة.|Самолёт опаздывает на час.\nWe were at the museum and at the theater.|كنا في المتحف وفي المسرح.|Мы были в музее и в театре.\nI took a lot of photos.|التقطت صورا كثيرة.|Я сделал много фотографий.\nWe stayed at a hotel by the sea.|أقمنا في فندق على البحر.|Мы жили в гостинице у моря.\nI want to go to Russia.|أريد أن أسافر إلى روسيا.|Я хочу поехать в Россию.\nHow do I get to the train station?|كيف أصل إلى محطة القطار؟|Как дойти до вокзала?\nGo straight, then left.|امش إلى الأمام ثم إلى اليسار.|Идите прямо, потом налево.\nThe library is around the corner.|المكتبة عند الزاوية.|Библиотека за углом.\nThe post office is next to the square.|مكتب البريد بجانب الساحة.|Почта рядом с площадью.\nCross the street at the traffic light.|اعبر الشارع عند الإشارة.|Перейдите улицу на светофоре.\nIs it far from here?|هل هو بعيد من هنا؟|Это далеко отсюда?\nMy brother works as a driver.|أخي يعمل سائقا.|Мой брат работает водителем.\nMy friend is a nurse.|صديقتي ممرضة.|Моя подруга — медсестра.\nI want to become a programmer.|أريد أن أصبح مبرمجا.|Я хочу стать программистом.\nWhat do you do for a living?|ماذا تعمل؟|Кем ты работаешь?\nMy father worked as an engineer.|عمل أبي مهندسا.|Мой отец работал инженером.\nOn weekends I play tennis.|في عطلة نهاية الأسبوع ألعب التنس.|По выходным я играю в теннис.\nI go to the gym three times a week.|أذهب إلى النادي ثلاث مرات في الأسبوع.|Я хожу в спортзал три раза в неделю.\nCan you play the guitar?|هل تعرف العزف على القيثارة؟|Ты умеешь играть на гитаре?\nYesterday we watched an interesting film.|شاهدنا أمس فيلما ممتعا.|Вчера мы смотрели интересный фильм.\nOur team won the match.|فاز فريقنا بالمباراة.|Наша команда выиграла матч.\nI love reading detective stories.|أحب قراءة القصص البوليسية.|Я люблю читать детективы.\nMy dad loves fishing.|أبي يحب صيد السمك.|Мой папа любит рыбалку.\nI have a fever.|عندي حمى.|У меня температура.\nMy throat hurts.|حلقي يؤلمني.|У меня болит горло.\nI need to see a doctor.|يجب أن أذهب إلى الطبيب.|Мне нужно к врачу.\nTake a pill and rest.|خذ حبة دواء وارتح.|Прими таблетку и отдохни.\nCall an ambulance!|اتصلوا بالإسعاف!|Вызовите скорую помощь!\nI'm already well.|أنا بخير الآن.|Я уже здоров.\nI wake up at six o'clock.|أستيقظ في الساعة السادسة.|Я просыпаюсь в шесть часов.\nThen I take a shower and have breakfast.|ثم أستحم وأتناول الفطور.|Потом я принимаю душ и завтракаю.\nI leave home at eight.|أخرج من البيت في الثامنة.|Я ухожу из дома в восемь.\nI return home in the evening.|أعود إلى البيت في المساء.|Я возвращаюсь домой вечером.\nI go to bed at eleven.|أذهب إلى النوم في الحادية عشرة.|Я ложусь спать в одиннадцать.\nSorry, I'm late.|آسف، تأخرت.|Извини, я опоздал.\nOn Saturday I clean the apartment.|يوم السبت أنظف الشقة.|В субботу я убираю квартиру.\nWho will wash the dishes?|من سيغسل الصحون؟|Кто будет мыть посуду?\nI take out the trash every evening.|أخرج القمامة كل مساء.|Я выношу мусор каждый вечер.\nMom is ironing shirts.|أمي تكوي القمصان.|Мама гладит рубашки.\nI'm cooking dinner for the whole family.|أحضر العشاء لكل العائلة.|Я готовлю ужин для всей семьи.\nChop the onion and tomatoes.|قطع البصل والطماطم.|Нарежь лук и помидоры.\nThe soup is very salty.|الحساء مالح جدا.|Суп очень солёный.\nThis lemon is very sour.|هذه الليمونة حامضة جدا.|Этот лимон очень кислый.\nWhat is your recipe?|ما وصفتك؟|Какой у тебя рецепт?\nI usually have lunch at a café.|عادة أتغدى في مقهى.|Я обычно обедаю в кафе.\nWe have dinner at seven.|نتعشى في السابعة.|Мы ужинаем в семь.\nMoscow is bigger than Tashkent.|موسكو أكبر من طشقند.|Москва больше, чем Ташкент.\nThis jacket is warmer.|هذه السترة أدفأ.|Эта куртка теплее.\nMy brother is older than me.|أخي أكبر مني.|Мой брат старше меня.\nThe metro is the fastest transport.|المترو أسرع وسيلة نقل.|Метро — самый быстрый транспорт.\nI'm afraid of dogs.|أخاف من الكلاب.|Я боюсь собак.\nDon't worry, everything will be fine.|لا تقلق، سيكون كل شيء بخير.|Не волнуйся, всё будет хорошо.\nI miss home very much.|أشتاق إلى البيت كثيرا.|Я очень скучаю по дому.\nThank you for the gift!|شكرا على الهدية!|Спасибо за подарок!\nI was very surprised.|كنت متفاجئا جدا.|Я был очень удивлён.\nWe met last year.|تعارفنا في العام الماضي.|Мы познакомились в прошлом году.\nWhat will you do in the evening?|ماذا ستفعل في المساء؟|Что ты будешь делать вечером?\nI will watch a TV series.|سأشاهد مسلسلا.|Я буду смотреть сериал.\nLet's meet in the center.|لنلتق في وسط المدينة.|Давай встретимся в центре.\nWhat time are you free?|متى تكون متفرغا؟|Во сколько ты свободен?\nI'll call you later.|سأتصل بك لاحقا.|Я позвоню тебе позже.\nWe often go to the cinema.|نذهب إلى السينما كثيرا.|Мы часто ходим в кино.\nHe is never late.|هو لا يتأخر أبدا.|Он никогда не опаздывает.\nI sometimes cook plov.|أطبخ البلوف أحيانا.|Я иногда готовлю плов.\nYesterday I worked all day.|عملت طوال اليوم أمس.|Вчера я весь день работал.\nI haven't been to Saint Petersburg yet.|لم أزر سانت بطرسبورغ بعد.|Я ещё не был в Санкт-Петербурге.\nWe will live in a new apartment.|سنسكن في شقة جديدة.|Мы будем жить в новой квартире.\nThey moved to another city.|انتقلوا إلى مدينة أخرى.|Они переехали в другой город.\nI forgot my keys at home.|نسيت المفاتيح في البيت.|Я забыл ключи дома.\nDo you remember where we were last year?|هل تتذكر أين كنا في العام الماضي؟|Помнишь, где мы были в прошлом году?\nI slept badly last night.|نمت نوما سيئا الليلة الماضية.|Я плохо спал этой ночью.\nWe need to buy groceries.|يجب أن نشتري المواد الغذائية.|Нам нужно купить продукты.\nMay I see the menu?|هل يمكنني رؤية قائمة الطعام؟|Можно посмотреть меню?\nI want to order a taxi.|أريد أن أطلب سيارة أجرة.|Я хочу заказать такси.\nTake me to the airport, please.|خذني إلى المطار من فضلك.|Отвезите меня в аэропорт, пожалуйста.","grammar":[{"title":"الماضي البسيط::Past Simple","body":["<p>للأحداث المنتهية في الماضي. الأفعال المنتظمة: نضيف ‎-ed: [[work]] ← [[worked]].</p>\n<p>الأفعال الشاذة تُحفظ: [[go]] ← [[went]]، [[eat]] ← [[ate]]، [[see]] ← [[saw]]، [[buy]] ← [[bought]]، [[have]] ← [[had]].</p>\n<p><b>النفي والسؤال:</b> [[didn't]] / [[Did]] + الفعل الأصلي: [[I didn't go.]] [[Did you go?]]</p>","<p>Для завершённых действий в прошлом. Правильные глаголы: + ‎-ed: [[work]] → [[worked]].</p>\n<p>Неправильные нужно выучить: [[go]] → [[went]], [[eat]] → [[ate]], [[see]] → [[saw]], [[buy]] → [[bought]], [[have]] → [[had]].</p>\n<p><b>Отрицание и вопрос:</b> [[didn't]] / [[Did]] + начальная форма: [[I didn't go.]] [[Did you go?]]</p>"],"ex":"I visited London last year.|زرت لندن العام الماضي.|В прошлом году я был в Лондоне.\nWe went to the park.|ذهبنا إلى الحديقة.|Мы ходили в парк.\nDid you see the film?|هل شاهدت الفيلم؟|Ты смотрел фильм?","quiz":[["Yesterday I ___ to the market.","went","go","goes"],["___ you call her?","Did","Do","Was"],["She ___ a new car last week.","bought","buyed","buys"]]},{"title":"المضارع المستمر::Present Continuous","body":["<p>لما يحدث <b>الآن</b>: [[am/is/are]] + الفعل + ‎-ing.</p>\n<p>[[I am reading.]] أنا أقرأ الآن. [[They are playing.]] هم يلعبون.</p>\n<p class=\"tip\">قارن: [[I read every day.]] (عادة) مقابل [[I'm reading now.]] (الآن).</p>","<p>Для того, что происходит <b>сейчас</b>: [[am/is/are]] + глагол + ‎-ing.</p>\n<p>[[I am reading.]] Я (сейчас) читаю. [[They are playing.]] Они играют.</p>\n<p class=\"tip\">Сравните: [[I read every day.]] (привычка) и [[I'm reading now.]] (сейчас).</p>"],"ex":"She is cooking dinner.|هي تطبخ العشاء.|Она готовит ужин.\nWhat are you doing?|ماذا تفعل؟|Что ты делаешь?","quiz":[["Look! It ___ raining.","is","are","does"],["They ___ watching TV now.","are","is","do"]]},{"title":"المستقبل: will و going to::Будущее: will и going to","body":["<p>[[will]] + الفعل: قرار لحظي أو توقّع: [[I'll help you.]]</p>\n<p>[[be going to]] + الفعل: خطة مسبقة: [[I'm going to study medicine.]]</p>","<p>[[will]] + глагол: спонтанное решение или прогноз: [[I'll help you.]]</p>\n<p>[[be going to]] + глагол: заранее принятый план: [[I'm going to study medicine.]]</p>"],"ex":"It will rain tomorrow.|ستمطر غداً.|Завтра будет дождь.\nWe're going to buy a house.|سنشتري بيتاً (خطة).|Мы собираемся купить дом.","quiz":[["I'm tired. I think I ___ go to bed.","will","am","going"],["We are going ___ travel in May.","to","for","will"]]},{"title":"المقارنة::Сравнение","body":["<p>صفات قصيرة: ‎-er + [[than]]: [[big]] ← [[bigger than]].</p>\n<p>صفات طويلة: [[more]] + الصفة: [[more expensive than]].</p>\n<p>التفضيل: [[the]] + ‎-est / [[the most]]: [[the biggest]]، [[the most beautiful]].</p>\n<p>شاذة: [[good]] ← [[better]] ← [[the best]]؛ [[bad]] ← [[worse]] ← [[the worst]].</p>","<p>Короткие: ‎-er + [[than]]: [[big]] → [[bigger than]].</p>\n<p>Длинные: [[more]] + прилагательное: [[more expensive than]].</p>\n<p>Превосходная: [[the]] + ‎-est / [[the most]]: [[the biggest]], [[the most beautiful]].</p>\n<p>Исключения: [[good]] → [[better]] → [[the best]]; [[bad]] → [[worse]] → [[the worst]].</p>"],"ex":"My brother is taller than me.|أخي أطول مني.|Мой брат выше меня.\nThis is the best restaurant in town.|هذا أفضل مطعم في المدينة.|Это лучший ресторан в городе.","quiz":[["Moscow is ___ than Tashkent.","bigger","more big","biggest"],["This is ___ day of my life!","the best","the better","the good"]]}],"readings":[{"title":"A Trip to Samarkand","tr":"رحلة إلى سمرقند::Поездка в Самарканд","sents":"Last Saturday, my friends and I went to Samarkand.|السبت الماضي ذهبت مع أصدقائي إلى سمرقند.|В прошлую субботу мы с друзьями ездили в Самарканд.\nWe took the train, and the trip was two hours long.|ركبنا القطار، واستغرقت الرحلة ساعتين.|Мы ехали на поезде два часа.\nThe weather was great: it was sunny and warm.|كان الطقس رائعاً: مشمساً ودافئاً.|Погода была отличная: солнечно и тепло.\nWe walked around the city and took photos of the old buildings.|تجوّلنا في المدينة وصوّرنا المباني القديمة.|Мы гуляли по городу и фотографировали старые здания.\nThen we ate plov in a restaurant.|ثم أكلنا البلوف في مطعم.|Потом мы ели плов в ресторане.\nIt was delicious!|كان لذيذاً!|Это было очень вкусно!\nIn the evening, we came back to Tashkent.|في المساء عدنا إلى طشقند.|Вечером мы вернулись в Ташкент.\nI will definitely go there again.|سأذهب إلى هناك مرة أخرى بالتأكيد.|Я обязательно поеду туда ещё раз.","gloss":"last|الماضي|прошлый\nsaturday|السبت|суббота\nfriends|الأصدقاء|друзья\nwent|ذهبنا|ездили, пошли\nsamarkand|سمرقند|Самарканд\ntook|ركبنا / أخذنا|сели на, взяли\ntrain|القطار|поезд\ntrip|الرحلة|поездка\ntwo|اثنتان|два\nhours|ساعات|часа\nlong|طويل (مدة)|длиной\nweather|الطقس|погода\ngreat|رائع|отличный\nsunny|مشمس|солнечно\nwarm|دافئ|тепло\nwalked|مشينا / تجوّلنا|гуляли\naround|في أنحاء|по\ncity|المدينة|город\nphotos|صور|фото\nold|القديمة|старые\nbuildings|المباني|здания\nate|أكلنا|ели\nplov|بلوف|плов\nrestaurant|مطعم|ресторан\ndelicious|لذيذ|вкусный\nevening|المساء|вечер\ncame|عدنا / جئنا|вернулись, пришли\nback|رجوعاً|обратно\ndefinitely|بالتأكيد|обязательно\nagain|مرة أخرى|снова"},{"title":"My Weekend","tr":"عطلتي::Мои выходные","sents":"On Saturday I woke up late, at ten o'clock.|يوم السبت استيقظت متأخرا، في الساعة العاشرة.|В субботу я проснулся поздно, в десять часов.\nI had breakfast and called a friend.|تناولت الفطور واتصلت بصديقي.|Я позавтракал и позвонил другу.\nWe decided to go to the park.|قررنا أن نذهب إلى الحديقة.|Мы решили пойти в парк.\nwarm and sunny.|كان الطقس رائعا: دافئا ومشمسا.|Погода была прекрасная: тепло и солнечно.\nIn the park we walked and ate ice cream.|في الحديقة تمشينا وأكلنا المثلجات.|В парке мы гуляли и ели мороженое.\nThen we went to the cinema.|ثم ذهبنا إلى السينما.|Потом мы пошли в кино.\nThe film was funny, and we laughed a lot.|كان الفيلم مضحكا وضحكنا كثيرا.|Фильм был смешной, и мы много смеялись.\nOn Sunday I cleaned the apartment and cooked lunch.|يوم الأحد نظفت الشقة وحضرت الغداء.|В воскресенье я убрал квартиру и приготовил обед.\nIn the evening my parents came to see me.|في المساء جاء والداي لزيارتي.|Вечером ко мне пришли родители.\nWe drank tea and talked about the family.|شربنا الشاي وتحدثنا عن العائلة.|Мы пили чай и говорили о семье.\nIt was a great weekend.|كانت عطلة رائعة.|Это были отличные выходные.","gloss":""},{"title":"At the Airport","tr":"في المطار::В аэропорту","sents":"Last week I flew to Moscow.|في الأسبوع الماضي سافرت بالطائرة إلى موسكو.|На прошлой неделе я летал в Москву.\nI arrived at the airport two hours before the flight.|وصلت إلى المطار قبل الرحلة بساعتين.|Я приехал в аэропорт за два часа до вылета.\nFirst I checked in my suitcase.|أولا سلمت حقيبة السفر.|Сначала я сдал чемодан.\nThen I showed my passport and ticket.|ثم أظهرت جواز السفر والتذكرة.|Потом я показал паспорт и билет.\nThe plane was an hour late.|تأخرت الطائرة ساعة.|Самолёт опоздал на час.\nI sat in a café, drank coffee and read a book.|جلست في مقهى وشربت القهوة وقرأت كتابا.|Я сидел в кафе, пил кофе и читал книгу.\nThe flight lasted three hours.|استغرقت الرحلة ثلاث ساعات.|Полёт продолжался три часа.\nIn Moscow it was cold, it was snowing.|كان الجو باردا في موسكو وكان الثلج يتساقط.|В Москве было холодно, шёл снег.\nGood thing I took a warm jacket!|من الجيد أنني أخذت سترة دافئة!|Хорошо, что я взял тёплую куртку!","gloss":""},{"title":"A Dream Job","tr":"مهنة الأحلام::Профессия мечты","sents":"My sister Leila works as a doctor.|أختي ليلى تعمل طبيبة.|Моя сестра Лейла работает врачом.\nEven at school she wanted to help people.|منذ المدرسة كانت تريد مساعدة الناس.|Ещё в школе она хотела помогать людям.\nShe studied at university for six years.|درست في الجامعة ست سنوات.|Она училась в университете шесть лет.\nNow she works in a big hospital.|الآن تعمل في مستشفى كبير.|Теперь она работает в большой больнице.\nHer working day begins at seven in the morning.|يبدأ يوم عملها في السابعة صباحا.|Её рабочий день начинается в семь утра.\nSometimes she also works at night.|أحيانا تعمل في الليل أيضا.|Иногда она работает и ночью.\nThe work is hard but interesting.|العمل صعب لكنه ممتع.|Работа трудная, но интересная.\nLeila says it is her calling.|تقول ليلى إن هذه رسالتها في الحياة.|Лейла говорит, что это её призвание.","gloss":""}],"dialogues":[{"title":"في متجر الملابس::В магазине одежды","lines":"A|Hello! Can I help you?|مرحباً! هل أساعدك؟|Здравствуйте! Вам помочь?\nB|Yes, I'm looking for a warm jacket.|نعم، أبحث عن سترة دافئة.|Да, я ищу тёплую куртку.\nA|What size are you?|ما مقاسك؟|Какой у вас размер?\nB|Medium, I think.|متوسط على ما أظن.|Думаю, M.\nA|Here you are. This one is very popular.|تفضّل. هذه رائجة جداً.|Вот, пожалуйста. Эта очень популярная.\nB|Can I try it on?|هل يمكنني قياسها؟|Можно примерить?\nA|Of course. The fitting room is over there.|طبعاً. غرفة القياس هناك.|Конечно. Примерочная вон там.\nB|It fits perfectly. How much is it?|تناسبني تماماً. كم سعرها؟|Сидит идеально. Сколько стоит?\nA|It's sixty dollars.|ستون دولاراً.|Шестьдесят долларов.\nB|Great, I'll take it. Can I pay by card?|رائع، سآخذها. هل يمكنني الدفع بالبطاقة؟|Отлично, беру. Можно картой?"},{"title":"في الفندق::В гостинице","lines":"A|Hello! I have a reservation under the name Ahmad.|مرحبا! عندي حجز باسم أحمد.|Здравствуйте! У меня бронь на имя Ахмад.\nB|Good afternoon! Your passport, please.|نهارك سعيد! جواز سفرك من فضلك.|Добрый день! Ваш паспорт, пожалуйста.\nA|Here you are.|تفضل.|Вот, пожалуйста.\nB|Your room is on the third floor. Here is the key.|غرفتك في الطابق الثالث. هذا هو المفتاح.|Ваш номер на третьем этаже. Вот ключ.\nA|What time is breakfast?|متى الفطور؟|Во сколько завтрак?\nB|From seven to ten in the restaurant.|من السابعة حتى العاشرة في المطعم.|С семи до десяти в ресторане.\nA|Is there internet in the room?|هل يوجد إنترنت في الغرفة؟|А в номере есть интернет?\nB|Yes, the password is on the card.|نعم، كلمة المرور على البطاقة.|Да, пароль на карточке.\nA|Thank you!|شكرا!|Спасибо!\nB|Have a nice stay!|إقامة سعيدة!|Приятного отдыха!"},{"title":"خطط للعطلة::Планы на выходные","lines":"A|What are you doing on Saturday?|ماذا ستفعل يوم السبت؟|Что ты делаешь в субботу?\nB|I don't know yet. Why?|لا أعرف بعد. لماذا؟|Пока не знаю. А что?\nA|Let's go to the mountains!|لنذهب إلى الجبال!|Давай пойдём в горы!\nB|Good idea. And what will the weather be like?|فكرة جيدة. وكيف سيكون الطقس؟|Хорошая идея. А какая будет погода?\nA|They say it will be sunny.|يقولون إنه سيكون مشمسا.|Говорят, будет солнечно.\nB|Great! What time shall we meet?|ممتاز! متى نلتقي؟|Отлично! Во сколько встретимся?\nA|At eight in the morning by the metro.|في الثامنة صباحا عند المترو.|В восемь утра у метро.\nB|Agreed. I'll bring water and sandwiches.|اتفقنا. سأحضر الماء والشطائر.|Договорились. Я возьму воду и бутерброды."},{"title":"عند الطبيب::У врача","lines":"A|What's wrong with you?|ما بك؟|Что с вами?\nB|I have a cough and a runny nose.|عندي سعال وزكام.|У меня кашель и насморк.\nA|Do you have a temperature?|هل عندك حمى؟|Температура есть?\nB|Yes, yesterday it was thirty-eight.|نعم، كانت أمس ثمانية وثلاثين.|Да, вчера была тридцать восемь.\nA|It's a cold. Drink a lot of warm tea.|هذا زكام. اشرب كثيرا من الشاي الدافئ.|Это простуда. Пейте много тёплого чая.\nB|Do I need pills?|وهل أحتاج إلى حبوب؟|А таблетки нужно?\nA|Yes, here is a prescription. Three times a day.|نعم، هذه وصفة. ثلاث مرات يوميا.|Да, вот рецепт. Три раза в день.\nB|Thank you, doctor.|شكرا يا دكتور.|Спасибо, доктор."}]},"B1":{"vocab":[{"t":"العمل::Работа","w":"💰|salary|راتب|зарплата|سالَري|сэ́лэри\n👔|boss|مدير|начальник|بوس|бос\n🤝|colleague|زميل|коллега|كوليگ|ко́лиг\n🗂️|job interview|مقابلة عمل|собеседование|جوب إنتَرڤيو|джоб и́нтервью\n🏝️|holiday|إجازة|отпуск|هوليداي|хо́лидэй\n🧠|experience|خبرة|опыт|إكسپيريِنس|икспи́риенс\n📊|meeting|اجتماع|совещание|ميتِنگ|ми́тинг"},{"t":"الصحة::Здоровье","w":"💪|health|صحة|здоровье|هِلث|хэлс\n🤒|illness|مرض|болезнь|إلنِس|и́лнес\n💊|medicine|دواء|лекарство|مِدسِن|мэ́дсин\n🤕|pain|ألم|боль|پين|пэйн\n😷|cough|سعال|кашель|كوف|коф\n🦷|tooth|سنّ|зуб|توث|тус"},{"t":"المشاعر::Эмоции","w":"😢|sad|حزين|грустный|ساد|сэд\n😱|afraid|خائف|испуганный|أفريد|эфрэ́йд\n😠|angry|غاضب|злой|آنگري|э́нгри\n😩|tired|متعب|усталый|تايِرد|та́йэд\n😟|worried|قلق|обеспокоенный|وَريد|уа́рид\n😮|surprised|متفاجئ|удивлённый|سَرپرايزد|сэпра́йзд"},{"t":"التعليم والتكنولوجيا::Учёба и технологии","w":"🏛️|university|جامعة|университет|يونيڤيرسِتي|юниве́рсити\n📝|exam|امتحان|экзамен|إگزام|игзэ́м\n📘|subj ttery is dead.|نفدت بطارية هاتفي.|У меня сел телефон.\nWhere can I charge my phone?|أين يمكنني شحن هاتفي؟|Где можно зарядить телефон?\nSend me the file by email.|أرسل لي الملف بالبريد.|Пришли мне файл по почте.\nThe internet works badly here.|الإنترنت ضعيف هنا.|Здесь плохо работает интернет.\nDon't forget to save the document.|لا تنس أن تحفظ المستند.|Не забудь сохранить документ.\nI often read the news on social networks.|أقرأ الأخبار غالبا في شبكات التواصل.|Я часто читаю новости в соцсетях.\nShe is very patient.|هي صبورة جدا.|Она очень терпеливая.\nMy brother is as stubborn as a donkey.|أخي عنيد مثل الحمار.|Мой брат упрямый, как осёл.\nDon't be so lazy!|لا تكن كسولا هكذا!|Не будь таким ленивым!\nI'm nervous before the performance.|أنا متوتر قبل العرض.|Я нервничаю перед выступлением.\nShe was delighted with the gift.|كانت مسرورة جدا بالهدية.|Она была в восторге от подарка.\nI'm ashamed of my behavior.|أنا خجل من تصرفي.|Мне стыдно за своё поведение.\nI'm not angry with you.|لست غاضبا منك.|Я на тебя не сержусь.\nWe invited a hundred guests to the wedding.|دعونا مئة ضيف إلى حفل الزفاف.|Мы пригласили на свадьбу сто гостей.\nHappy birthday to you!|أهنئك بعيد ميلادك!|Поздравляю тебя с днём рождения!\nThey quarreled over a trifle.|تشاجرا بسبب أمر تافه.|Они поссорились из-за пустяка.\nWe have been friends since childhood.|نحن أصدقاء منذ الطفولة.|Мы дружим с детства.\nThank you for your support.|شكرا على دعمك.|Спасибо за поддержку.\nI apologize, I was wrong.|أعتذر، كنت مخطئا.|Прошу прощения, я был неправ.\nI want to open a bank account.|أريد أن أفتح حسابا في البنك.|Я хочу открыть счёт в банке.\nWhat is the dollar exchange rate today?|كم سعر صرف الدولار اليوم؟|Какой сегодня курс доллара?\nI pay for the apartment every month.|أدفع إيجار الشقة كل شهر.|Я плачу за квартиру каждый месяц.\nWe are saving for a new car.|ندخر لشراء سيارة جديدة.|Мы копим на новую машину.\nI spent all the money.|أنفقت كل النقود.|Я потратил все деньги.\nCan you lend me some money?|هل يمكنك أن تقرضني؟|Ты можешь дать мне в долг?\nThe ATM is not working.|الصراف الآلي لا يعمل.|Банкомат не работает.\nWe rent an apartment in the center.|نستأجر شقة في وسط المدينة.|Мы снимаем квартиру в центре.\nOur home is on the fifth floor.|بيتنا في الطابق الخامس.|Наш дом на пятом этаже.\nThe elevator is broken again.|المصعد معطل مرة أخرى.|Лифт опять сломан.\nThe apartment is being renovated.|يرممون الشقة.|В квартире делают ремонт.\nWe moved to a new district.|انتقلنا إلى حي جديد.|Мы переехали в новый район.\nIn winter we have good heating.|عندنا تدفئة جيدة في الشتاء.|Зимой у нас хорошее отопление.\nIf I have time, I'll call you.|إذا كان عندي وقت سأتصل بك.|Если будет время, я тебе позвоню.\nI think you are right.|أظن أنك على حق.|Я думаю, что ты прав.\nI disagree.|أنا لست موافقا.|Я не согласен.\nIt seems to me that it will rain.|يبدو لي أنها ستمطر.|Мне кажется, что будет дождь.\nI hope everything will be fine.|آمل أن يكون كل شيء بخير.|Я надеюсь, что всё будет хорошо.\nI have long dreamed of visiting Japan.|أحلم منذ زمن بزيارة اليابان.|Я давно мечтаю побывать в Японии.\nPlease explain once more.|اشرح من فضلك مرة أخرى.|Объясни, пожалуйста, ещё раз.\nI don't remember where I left the keys.|لا أتذكر أين تركت المفاتيح.|Я не помню, где оставил ключи.\nHe offered me help.|عرض علي المساعدة.|Он предложил мне помощь.\nShe declined the invitation.|رفضت الدعوة.|Она отказалась от приглашения.\nWe need to arrange a meeting.|يجب أن نتفق على موعد.|Нам надо договориться о встрече.\nI walk to work every day.|أذهب إلى العمل مشيا كل يوم.|Я каждый день хожу на работу пешком.\nI'm going to the shop now.|أنا ذاهب إلى المتجر الآن.|Сейчас я иду в магазин.\nWe drove to Kazan.|ذهبنا إلى قازان بالسيارة.|Мы ездили в Казань на машине.\nHe came home late.|عاد إلى البيت متأخرا.|Он пришёл домой поздно.\nI was reading all evening.|كنت أقرأ طوال المساء.|Я читал весь вечер.\nI'll do it tomorrow.|سأفعل ذلك غدا.|Я сделаю это завтра.\nHe looked for a job for a long time and finally found one.|بحث عن عمل طويلا وأخيرا وجد.|Он долго искал работу и наконец нашёл.\nI don't have time.|ليس عندي وقت.|У меня нет времени.\nThere is no sea in our city.|لا يوجد بحر في مدينتنا.|В нашем городе нет моря.\nI like my new job.|يعجبني عملي الجديد.|Мне нравится моя новая работа.\nI need more time.|أحتاج إلى وقت أكثر.|Мне нужно больше времени.\nI'll call my mom in the evening.|سأتصل بأمي في المساء.|Я позвоню маме вечером.\nHelp me, please.|ساعدني من فضلك.|Помоги мне, пожалуйста.\nI'm interested in history.|أهتم بالتاريخ.|Я интересуюсь историей.\nShe does dancing.|هي تمارس الرقص.|Она занимается танцами.\nI write with a pen.|أكتب بالقلم.|Я пишу ручкой.\nI drink tea with lemon.|أشرب الشاي بالليمون.|Я пью чай с лимоном.\nWhat do you do in your free time?|ماذا تفعل في وقت فراغك؟|Чем ты занимаешься в свободное время?\nI like walking around the old town.|أحب التجول في المدينة القديمة.|Мне нравится гулять по старому городу.\nTo learn a language, you need to practice a lot.|لتتعلم لغة يجب أن تتدرب كثيرا.|Чтобы выучить язык, нужно много практиковаться.\nI make mistakes, but I'm not afraid to speak.|أرتكب أخطاء لكني لا أخاف من الكلام.|Я делаю ошибки, но не боюсь говорить.","grammar":[{"title":"المضارع التام::Present Perfect","body":["<p>[[have/has]] + التصريف الثالث للفعل. يربط الماضي بالحاضر: تجربة، أو نتيجة مهمة الآن.</p>\n<p>[[I have visited Paris.]] زرت باريس (تجربة في حياتي، الوقت غير مهم).</p>\n<p>كلمات مرافقة: [[already]]، [[yet]]، [[ever]]، [[never]]، [[just]]، [[since]]، [[for]].</p>\n<p class=\"tip\">مع زمن محدد في الماضي (yesterday، in 2020) نستخدم Past Simple لا Present Perfect.</p>","<p>[[have/has]] + третья форма глагола. Связывает прошлое с настоящим: опыт или результат, важный сейчас.</p>\n<p>[[I have visited Paris.]] Я был в Париже (опыт, время не важно).</p>\n<p>Слова-маркеры: [[already]], [[yet]], [[ever]], [[never]], [[just]], [[since]], [[for]].</p>\n<p class=\"tip\">С точным временем в прошлом (yesterday, in 2020) — Past Simple, а не Present Perfect.</p>"],"ex":"She has just arrived.|وصلت للتو.|Она только что приехала.\nI have lived here for five years.|أعيش هنا منذ خمس سنوات.|Я живу здесь пять лет.\nHave you finished yet?|هل انتهيت بعد؟|Ты уже закончил?","quiz":[["I ___ never been to Japan.","have","has","am"],["She has ___ her homework.","finished","finish","finishing"],["I ___ him yesterday.","saw","have seen","seen"]]},{"title":"الشرط الأول::First Conditional","body":["<p>شرط واقعي في المستقبل: [[If]] + مضارع بسيط، [[will]] + فعل.</p>\n<p>[[If you study, you will pass.]] إذا درست ستنجح.</p>\n<p class=\"tip\">لا نضع will بعد if: ليس [[If it will rain]] بل [[If it rains]].</p>","<p>Реальное условие в будущем: [[If]] + Present Simple, [[will]] + глагол.</p>\n<p>[[If you study, you will pass.]] Если будешь заниматься, сдашь.</p>\n<p class=\"tip\">После if не ставим will: не [[If it will rain]], а [[If it rains]].</p>"],"ex":"If I have time, I'll help you.|إذا كان لدي وقت سأساعدك.|Если у меня будет время, я тебе помогу.","quiz":[["If it ___, we will stay home.","rains","will rain","rained"],["If you hurry, you ___ catch the bus.","will","would","are"]]},{"title":"الأفعال الناقصة::Модальные глаголы","body":["<table><tr><th>الفعل</th><th>المعنى</th><th>مثال</th></tr>\n<tr><td>[[can]]</td><td>يستطيع</td><td>[[I can swim.]]</td></tr>\n<tr><td>[[must]]</td><td>يجب (إلزام داخلي/قانون)</td><td>[[You must stop.]]</td></tr>\n<tr><td>[[have to]]</td><td>مضطر (ظروف خارجية)</td><td>[[I have to work.]]</td></tr>\n<tr><td>[[should]]</td><td>ينبغي (نصيحة)</td><td>[[You should rest.]]</td></tr>\n<tr><td>[[may]] / [[might]]</td><td>ربما</td><td>[[It might rain.]]</td></tr></table>\n<p>بعدها الفعل بدون [[to]] (ما عدا have to).</p>","<table><tr><th>Глагол</th><th>Значение</th><th>Пример</th></tr>\n<tr><td>[[can]]</td><td>мочь, уметь</td><td>[[I can swim.]]</td></tr>\n<tr><td>[[must]]</td><td>должен (внутренняя необходимость, правило)</td><td>[[You must stop.]]</td></tr>\n<tr><td>[[have to]]</td><td>приходится (обстоятельства)</td><td>[[I have to work.]]</td></tr>\n<tr><td>[[should]]</td><td>следует (совет)</td><td>[[You should rest.]]</td></tr>\n<tr><td>[[may]] / [[might]]</td><td>возможно</td><td>[[It might rain.]]</td></tr></table>\n<p>После них глагол без [[to]] (кроме have to).</p>"],"ex":"You should see a doctor.|ينبغي أن ترى طبيباً.|Тебе стоит сходить к врачу.\nI can't swim.|لا أستطيع السباحة.|Я не умею плавать.","quiz":[["You look tired. You ___ rest.","should","can","might to"],["I ___ speak three languages.","can","must to","should to"]]}],"readings":[{"title":"My Dream Job","tr":"وظيفة الأحلام::Работа мечты","sents":"My friend Sergey looked for a job for a long time.|بحث صديقي سيرغي عن عمل لفترة طويلة.|Мой друг Сергей долго искал работу.\nHe sent his CV to ten companies, but nobody answered.|أرسل سيرته الذاتية إلى عشر شركات، لكن لم يردّ أحد.|Он отправил резюме в десять компаний, но никто не ответил.\nFinally, he was invited to a job interview.|أخيراً دُعي إلى مقابلة عمل.|Наконец его пригласили на собеседование.\nHe was very nervous, but he answered all the questions.|كان متوتراً جداً لكنه أجاب على كل الأسئلة.|Он очень волновался, но ответил на все вопросы.\nA week later, they called him and offered him the job.|بعد أسبوع اتصلوا به وعرضوا عليه الوظيفة.|Через неделю ему позвонили и предложили работу.\nNow Sergey works as a programmer, and he has never been happier.|الآن يعمل سيرغي مبرمجاً، ولم يكن أسعد من ذلك قط.|Теперь Сергей работает программистом и счастлив как никогда.","gloss":"friend|صديق|друг\nsergey|سيرغي|Сергей\nlooked|بحث (looked for)|искал\njob|عمل / وظيفة|работа\nlong|طويل|долгий\ntime|وقت|время\nsent|أرسل|отправил\ncv|سيرة ذاتية|резюме\nten|عشر|десять\ncompanies|شركات|компании\nnobody|لا أحد|никто\nanswered|أجاب|ответил\nfinally|أخيراً|наконец\ninvited|دُعي|приглашён\ninterview|مقابلة|собеседование\nnervous|متوتر|нервный\nquestions|الأسئلة|вопросы\nweek|أسبوع|неделя\nlater|لاحقاً / بعد|спустя\ncalled|اتصلوا|позвонили\noffered|عرضوا|предложили\nworks|يعمل|работает\nprogrammer|مبرمج|программист\nnever|أبداً|никогда\nbeen|كان|был\nhappier|أسعد|счастливее"},{"title":"The First Working Day","tr":"يوم العمل الأول::Первый рабочий день","sents":"The first working day is always exciting.|يوم العمل الأول مثير دائما.|Первый рабочий день — это всегда волнительно.\nI came to the office before everyone, at eight o'clock.|وصلت إلى المكتب قبل الجميع، في الثامنة.|Я пришёл в офис раньше всех, в восемь часов.\nThe boss met me and introduced me to my colleagues.|استقبلني المدير وعرفني إلى زملائي.|Меня встретил начальник и познакомил с коллегами.\nEveryone was very friendly.|كان الجميع ودودين جدا.|Все были очень дружелюбными.\nThey showed me my workplace and computer.|أروني مكان عملي والحاسوب.|Мне показали моё рабочее место и компьютер.\nAt first I read documents and studied projects.|في البداية قرأت المستندات ودرست المشاريع.|Сначала я читал документы и изучал проекты.\nAt lunch we went to the canteen together.|في الغداء ذهبنا معا إلى المطعم.|В обед мы вместе пошли в столовую.\nAfter lunch we had a meeting.|بعد الغداء كان عندنا اجتماع.|После обеда у нас было совещание.\nI was a bit nervous, but everything went well.|كنت متوترا قليلا لكن كل شيء مر بخير.|Я немного нервничал, но всё прошло хорошо.\nIn the evening I was tired but satisfied.|في المساء كنت متعبا لكني راض.|Вечером я устал, но был доволен.\nI think I'm going to like it here.|أظن أن المكان سيعجبني.|Я думаю, что мне здесь понравится.","gloss":""},{"title":"A Healthy Lifestyle","tr":"نمط حياة صحي::Здоровый образ жизни","sents":"Nowadays many people think about their health.|يفكر كثير من الناس اليوم في صحتهم.|Сейчас многие люди думают о здоровье.\nDoctors advise moving more.|ينصح الأطباء بالحركة أكثر.|Врачи советуют больше двигаться.\nIt is useful to walk at least half an hour a day.|من المفيد المشي نصف ساعة يوميا على الأقل.|Полезно ходить пешком хотя бы полчаса в день.\nIt is also important to eat properly.|من المهم أيضا أن نأكل بشكل صحيح.|Также важно правильно питаться.\nYou need to eat more vegetables and fruit.|يجب أكل المزيد من الخضار والفواكه.|Нужно есть больше овощей и фруктов.\nIt's better to drink water, not sweet drinks.|الأفضل شرب الماء لا المشروبات الحلوة.|Лучше пить воду, а не сладкие напитки.\nSleep is also very important.|النوم أيضا مهم جدا.|Сон тоже очень важен.\nAn adult needs to sleep seven to eight hours.|يحتاج الشخص البالغ إلى النوم سبع إلى ثماني ساعات.|Взрослому человеку нужно спать семь-восемь часов.\nAnd, of course, you shouldn't smoke.|وطبعا لا ينبغي التدخين.|И, конечно, не надо курить.\nHealth is the most important thing.|الصحة أهم شيء.|Здоровье — это самое главное.","gloss":""},{"title":"How I Learn Russian","tr":"كيف أتعلم الروسية::Как я учу русский","sents":"I have been learning Russian for a year already.|أتعلم اللغة الروسية منذ سنة.|Я учу русский язык уже год.\nAt first it was very hard.|في البداية كان الأمر صعبا جدا.|Сначала было очень трудно.\nI didn't understand the cases and mixed up the endings.|لم أفهم حالات الإعراب وكنت أخلط النهايات.|Я не понимал падежи и путал окончания.\nThen I started listening to podcasts every day.|ثم بدأت أستمع إلى البودكاستات كل يوم.|Потом я начал каждый день слушать подкасты.\nI also watch films with subtitles.|أشاهد أيضا الأفلام مع الترجمة.|Я также смотрю фильмы с субтитрами.\nMy Russian friends helped me a lot.|ساعدني أصدقائي الروس كثيرا.|Мне очень помогли мои русские друзья.\nThey correct my mistakes and don't laugh.|يصححون أخطائي ولا يضحكون.|Они исправляют мои ошибки и не смеются.\nNow I can speak at the shop and at work.|الآن أستطيع الكلام في المتجر وفي العمل.|Теперь я могу говорить в магазине и на работе.\nThe main thing is not to be afraid of mistakes.|الأهم ألا تخاف من الأخطاء.|Главное — не бояться ошибок.","gloss":""}],"dialogues":[{"title":"عند الطبيب::У врача","lines":"A|Good morning. What's the problem?|صباح الخير. ما المشكلة؟|Доброе утро. На что жалуетесь?\nB|I have a sore throat and a headache.|عندي التهاب في الحلق وصداع.|У меня болит горло и голова.\nA|How long have you had these symptoms?|منذ متى لديك هذه الأعراض؟|Как давно у вас эти симптомы?\nB|For three days. I had a fever yesterday.|منذ ثلاثة أيام. كانت عندي حرارة أمس.|Три дня. Вчера была температура.\nA|Open your mouth, please. Yes, it's red.|افتح فمك من فضلك. نعم، إنه أحمر.|Откройте рот, пожалуйста. Да, горло красное.\nB|Is it serious?|هل هو خطير؟|Это серьёзно?\nA|No, don't worry. I'll give you some medicine.|لا، لا تقلق. سأعطيك دواءً.|Нет, не волнуйтесь. Я выпишу вам лекарство.\nB|How should I take it?|كيف آخذه؟|Как его принимать?\nA|Three times a day after meals. And you should drink a lot of warm water.|ثلاث مرات يومياً بعد الأكل. وينبغي أن تشرب الكثير من الماء الدافئ.|Три раза в день после еды. И пейте много тёплой воды.\nB|Thank you, doctor!|شكراً يا دكتور!|Спасибо, доктор!"},{"title":"مقابلة عمل::Собеседование","lines":"A|Tell me about yourself, please.|حدثني عن نفسك من فضلك.|Расскажите о себе, пожалуйста.\nB|My name is Omar. I'm a programmer with five years of experience.|اسمي عمر. أنا مبرمج ولدي خبرة خمس سنوات.|Меня зовут Омар. Я програмист, у меня пять лет опыта.\nA|Why do you want to work for us?|لماذا تريد العمل عندنا؟|Почему вы хотите работать у нас?\nB|Your company is well known, and I'm interested in your projects.|شركتكم مشهورة، ومشاريعكم تهمني.|Ваша компания известная, и мне интересны ваши проекты.\nA|What are your strengths?|ما نقاط قوتك؟|Какие у вас сильные стороны?\nB|I'm responsible and learn quickly.|أنا مسؤول وأتعلم بسرعة.|Я ответственный и быстро учусь.\nA|When can you start?|متى يمكنك أن تبدأ؟|Когда вы можете начать?\nB|From next month.|من الشهر القادم.|Со следующего месяца.\nA|Good. We will call you.|حسنا. سنتصل بك.|Хорошо. Мы вам позвоним."},{"title":"في البنك::В банке","lines":"A|Hello! I'd like to open an account.|مرحبا! أريد أن أفتح حسابا.|Здравствуйте! Я хочу открыть счёт.\nB|Fine. Your passport, please.|حسنا. جواز سفرك من فضلك.|Хорошо. Ваш паспорт, пожалуйста.\nA|Here. Can I get a card right away?|تفضل. وهل يمكنني الحصول على البطاقة فورا؟|Вот. А карту можно получить сразу?\nB|No, the card will be ready in a week.|لا، ستكون البطاقة جاهزة بعد أسبوع.|Нет, карта будет готова через неделю.\nA|How much does the service cost?|كم تكلف الخدمة؟|Сколько стоит обслуживание?\nB|The first year is free.|السنة الأولى مجانية.|Первый год бесплатно.\nA|Great. One more thing: can I exchange dollars?|ممتاز. وأيضا: هل يمكنني تبديل الدولارات؟|я могу поменять доллары?\nB|Yes, the cash desk is on the left.|نعم، الصندوق على اليسار.|Да, касса слева."},{"title":"مشكلة في الشقة::Проблема в квартире","lines":"A|Hello, is this the landlord?|ألو، هل أنت صاحب الشقة؟|Алло, это хозяин квартиры?\nB|Yes, I'm listening.|نعم، أسمعك.|Да, слушаю вас.\nA|Our heating doesn't work, it's very cold in the apartment.|التدفئة لا تعمل عندنا، والشقة باردة جدا.|У нас не работает отопление, в квартире очень холодно.\nB|I see. For how long?|فهمت. منذ متى؟|Понятно. Давно?\nA|Since yesterday evening.|منذ مساء الأمس.|Со вчерашнего вечера.\nB|I'll send a repairman tomorrow morning.|سأرسل عامل صيانة غدا صباحا.|Я пришлю мастера завтра утром.\nA|Isn't it possible today?|ألا يمكن اليوم؟|А сегодня никак нельзя?\nB|I'll try. I'll call you back in an hour.|سأحاول. سأعاود الاتصال بك بعد ساعة.|Попробую. Я перезвоню вам через час."}]},"B2":{"vocab":[{"t":"المجتمع والاقتصاد::Общество и экономика","w":"🏙️|society|مجتمع|общество|سوسايِتي|сэса́йэти\n🏛️|government|حكومة|правительство|گَڤِرنمِنت|га́вэрнмент\n⚖️|law|قانون|закон|لو|ло\n🗳️|election|انتخابات|выборы|إلِكشِن|илэ́кшн\n📉|economy|اقتصاد|экономика|إيكونومي|ико́номи\n🧑‍💼|unemployment|بطالة|безработица|أنِمپلويمِنت|анимплóймент"},{"t":"البيئة والإعلام::Экология и СМИ","w":"🏭|pollution|تلوّث|загрязнение|پولوشِن|пэлю́шн\n🌍|climate|مناخ|климат|كلايمِت|кла́ймит\n♻️|recycling|إعادة تدوير|переработка|ريسايكلِنگ|риса́йклинг\n📰|news|أخبار|новости|نيوز|ньюз\n📢|advertising|إعلان|реклама|أدڤِرتايزِنگ|э́двертайзинг\n💭|opinion|رأي|мнение|أوپينيِن|эпи́ньен"},{"t":"مفاهيم عامة::Общие понятия","w":"💡|solution|حلّ|решение|سولوشِن|сэлю́шн\n📈|development|تطوّر|развитие|ديڤِلُپمِنت|диве́лопмент\n🧭| كر ذنبه.|Он отрицает свою вину.\nI fully support this idea.|أدعم هذه الفكرة تماما.|Я полностью поддерживаю эту идею.\nThe number of green areas should be increased.|يجب زيادة عدد المساحات الخضراء.|Нужно увеличить количество зелёных зон.\nWe are trying to cut expenses.|نحاول تقليل النفقات.|Мы стараемся сокращать расходы.\nIt's hard to persuade him.|من الصعب إقناعه.|Его трудно убедить.\nParking is prohibited here.|الوقوف ممنوع هنا.|Здесь запрещено парковаться.\nWe achieved our goal.|حققنا هدفنا.|Мы достигли своей цели.\nQuality is more important than quantity.|الجودة أهم من الكمية.|Качество важнее количества.\nEverything depends on the circumstances.|كل شيء يعتمد على الظروف.|Всё зависит от обстоятельств.\nTo be honest, I don't like it.|بصراحة، هذا لا يعجبني.|Если честно, мне это не нравится.\nAs far as I know, he has left.|على حد علمي، لقد سافر.|Насколько я знаю, он уехал.\nThanks to my friends' help, I managed.|بفضل مساعدة أصدقائي نجحت.|Благодаря помощи друзей я справился.\nDespite the rain, we went for a walk.|رغم المطر خرجنا للتنزه.|Несмотря на дождь, мы пошли гулять.\nThe more you read, the more you know.|كلما قرأت أكثر عرفت أكثر.|Чем больше читаешь, тем больше знаешь.\nWhat are you dissatisfied with?|مم أنت مستاء؟|Чем ты недоволен?\nIt seems to me you're exaggerating.|يبدو لي أنك تبالغ.|Мне кажется, ты преувеличиваешь.\nI'm not sure it's true.|لست متأكدا أن هذا صحيح.|Я не уверен, что это правда.\nThe thing is, we don't have much time.|المسألة أن وقتنا قليل.|Дело в том, что у нас мало времени.\nHe said he would come later.|قال إنه سيأتي لاحقا.|Он сказал, что придёт позже.\nShe asked where I work.|سألت أين أعمل.|Она спросила, где я работаю.\nI asked him to close the window.|طلبت منه أن يغلق النافذة.|Я попросил его закрыть окно.\nI want you to be happy.|أريد أن تكون سعيدا.|Я хочу, чтобы ты был счастлив.\nIt's important that everyone is on time.|من المهم أن يكون الجميع في الموعد.|Важно, чтобы все были вовремя.\nI used to live in a village.|كنت أسكن سابقا في قرية.|Раньше я жил в деревне.\nShe got used to the cold.|اعتادت على البرد.|Она привыкла к холоду.\nI just can't get used to the new job.|لا أستطيع أبدا التعود على العمل الجديد.|Я никак не могу привыкнуть к новой работе.\nShe is involved in charity work.|تعمل في المجال الخيري.|Она занимается благотворительностью.\nMy grandfather receives a pension.|جدي يتقاضى معاشا تقاعديا.|Мой дед получает пенсию.\nTraditions are passed down from generation to generation.|تنتقل التقاليد من جيل إلى جيل.|Традиции передаются из поколения в поколение.\nThe city's population is growing fast.|سكان المدينة يتزايدون بسرعة.|Население города быстро растёт.\nI stand for equal rights.|أنا مع المساواة في الحقوق.|Я стою за равноправие.\nIf I were you, I would agree.|لو كنت مكانك لوافقت.|Если бы я был на твоём месте, я бы согласился.\nI was offered a promotion.|عرضت علي ترقية.|Мне предложили повышение.\nRemote work doesn't suit everyone.|العمل عن بعد لا يناسب الجميع.|Удалённая работа подходит не всем.\nHe works without days off and is already tired.|يعمل بلا عطل وقد تعب.|Он работает без выходных и уже устал.\nTo avoid burnout, you need to rest.|لتجنب الاحتراق الوظيفي يجب أن ترتاح.|Чтобы избежать выгорания, нужно отдыхать.\nI prepared a presentation for the clients.|أعددت عرضا تقديميا للعملاء.|Я подготовил презентацию для клиентов.\nMy mentor gave me useful advice.|أعطاني مرشدي نصيحة مفيدة.|Мой наставник дал мне полезный совет.\nI'm writing a leave application.|أكتب طلب إجازة.|Я пишу заявление на отпуск.\nOur startup attracted investment.|جذبت شركتنا الناشئة استثمارات.|Наш стартап привлёк инвестиции.\nThis is my greatest achievement.|هذا أكبر إنجازاتي.|Это моё самое большое достижение.\nNow my main priority is my family.|أولويتي الرئيسية الآن هي العائلة.|Сейчас мой главный приоритет — семья.\nIs it true that you're leaving the company?|هل صحيح أنك ستترك الشركة؟|Правда ли, что ты уходишь из компании?\nShe is much smarter than she seems.|هي أذكى بكثير مما تبدو.|Она намного умнее, чем кажется.\nThe sooner you ___ help us.","would","will","does"]]},{"title":"جمل الصلة::Придаточные определительные","body":["<p>[[who]] للأشخاص، [[which]] للأشياء، [[that]] للاثنين، [[where]] للمكان، [[whose]] للملكية.</p>\n<p>[[The man who lives next door is a doctor.]] الرجل الذي يسكن بجانبنا طبيب.</p>\n<p>[[The car which I bought is red.]] السيارة التي اشتريتها حمراء.</p>","<p>[[who]] — о людях, [[which]] — о предметах, [[that]] — для обоих, [[where]] — о месте, [[whose]] — «чей».</p>\n<p>[[The man who lives next door is a doctor.]] Мужчина, который живёт по соседству, — врач.</p>\n<p>[[The car which I bought is red.]] Машина, которую я купил, красная.</p>"],"ex":"This is the city where I was born.|هذه المدينة التي وُلدت فيها.|Это город, где я родился.","quiz":[["The woman ___ called you is my aunt.","who","which","where"],["This is the house ___ I grew up.","where","who","which"]]}],"readings":[{"title":"The City of the Future","tr":"مدينة المستقبل::Город будущего","sents":"What will the city of the future look like?|كيف ستبدو مدينة المستقبل؟|Каким будет город будущего?\nMany experts believe it will have more green spaces and fewer cars.|يعتقد كثير من الخبراء أنها ستضم مساحات خضراء أكثر وسيارات أقل.|Многие эксперты считают, что в нём будет больше зелени и меньше машин.\nPeople will travel by electric cars and bicycles.|سيتنقل الناس بالسيارات الكهربائية والدراجات.|Люди будут ездить на электромобилях и велосипедах.\nHomes will be powered by the sun and the wind.|ستُزوَّد البيوت بالطاقة من الشمس والريح.|Дома будут получать энергию от солнца и ветра.\nHowever, some critics say these technologies are too expensive for poorer countries.|غير أن بعض المنتقدين يقولون إن هذه التقنيات مكلفة جداً للدول الأفقر.|Однако критики говорят, что эти технологии слишком дороги для бедных стран.\nIt is hard to say who is right, but one thing is clear: a city should be built for people.|من الصعب القول من على حق، لكن أمراً واحداً واضح: يجب أن تُبنى المدينة للناس.|Сложно сказать, кто прав, но ясно одно: город должен строиться для людей.","gloss":"future|المستقبل|будущее\nlook|تبدو|выглядеть\nlike|مثل|как\nexperts|الخبراء|эксперты\nbelieve|يعتقدون|считают\ngreen|خضراء|зелёные\nspaces|مساحات|пространства\nfewer|أقل|меньше\ncars|سيارات|машин\npeople|الناس|люди\ntravel|يتنقّلون|ездить\nelectric|كهربائية|электрические\nbicycles|دراجات|велосипеды\nhomes|البيوت|дома\npowered|مزوّدة بالطاقة|питаться энергией\nsun|الشمس|солнце\nwind|الريح|ветер\nhowever|غير أنّ|однако\ncritics|منتقدون|критики\nsay|يقولون|говорят\ntechnologies|التقنيات|технологии\nexpensive|مكلفة|дорогие\npoorer|الأفقر|более бедные\ncountries|الدول|страны\nhard|صعب|трудно\nright|محق|прав\nthing|شيء / أمر|вещь\nclear|واضح|ясно\nshould|ينبغي|должен\nbuilt|مبنية|построен"},{"title":"The City of the Future","tr":"مدينة المستقبل::Город будущего","sents":"What will the city of the future be like?|كيف ستكون مدينة المستقبل؟|Каким будет город будущего?\nMany experts think it will have more greenery and fewer cars.|يرى كثير من الخبراء أنها ستضم خضرة أكثر وسيارات أقل.|Многие эксперты считают, что в нём будет больше зелени и меньше машин.\nPeople will travel by electric cars and bicycles.|سيتنقل الناس بالسيارات الكهربائية والدراجات.|Люди будут ездить на электромобилях и велосипедах.\nHomes will get energy from the sun and wind.|ستحصل البيوت على الطاقة من الشمس والرياح.|Дома будут получать энергию от солнца и ветра.\nSmart systems will control light and heat.|ستتحكم أنظمة ذكية في الإضاءة والتدفئة.|Умные системы будут управлять светом и теплом.\nHowever, this idea also has critics.|غير أن لهذه الفكرة منتقدين أيضا.|Однако у этой идеи есть и критики.\nThey say such technologies are too expensive.|يقولون إن هذه التقنيات مكلفة جدا.|Они говорят, что такие технологии слишком дорогие.\nBesides, not everyone is ready to change their habits.|إلى جانب ذلك، ليس الجميع مستعدين لتغيير عاداتهم.|Кроме того, не все готовы менять привычки.\nIt's hard to say who is right.|من الصعب القول من على حق.|Сложно сказать, кто прав.\nBut one thing is clear: a city must be comfortable for people.|لكن أمرا واحدا واضح: يجب أن تكون المدينة مريحة للناس.|Но ясно одно: город должен быть удобным для людей.","gloss":""},{"title":"Social Networks","tr":"شبكات التواصل::Социальные сети","sents":"Social networks have become part of our lives.|أصبحت شبكات التواصل جزءا من حياتنا.|Социальные сети стали частью нашей жизни.\nThey help us communicate with friends who live far away.|تساعدنا على التواصل مع الأصدقاء الذين يسكنون بعيدا.|Они помогают общаться с друзьями, которые живут далеко.\nWe learn the news faster than before.|نعرف الأخبار أسرع من قبل.|Мы узнаём новости быстрее, чем раньше.\nHowever, social networks also have a downside.|غير أن لشبكات التواصل جانبا سلبيا أيضا.|Однако у соцсетей есть и обратная сторона.\nMany people spend several hours a day on their phones.|يقضي كثيرون عدة ساعات يوميا على هواتفهم.|Многие проводят в телефоне по нескольку часов в день.\nThis affects sleep, studies and mood.|هذا يؤثر على النوم والدراسة والمزاج.|Это влияет на сон, учёбу и настроение.\nIn addition, there is a lot of fake news online.|إلى جانب ذلك، هناك أخبار كاذبة كثيرة على الشبكة.|Кроме того, в сети много фейков.\nPsychologists advise taking breaks.|ينصح علماء النفس بأخذ استراحات.|Психологи советуют делать перерывы.\nFor example, you can avoid taking the phone into the bedroom.|مثلا، يمكن عدم أخذ الهاتف إلى غرفة النوم.|Например, можно не брать телефон в спальню.\nThe main thing is to remember that life doesn't happen on a screen.|الأهم أن نتذكر أن الحياة لا تجري على الشاشة.|Главное — помнить, что жизнь происходит не на экране.","gloss":""},{"title":"Volunteers","tr":"المتطوعون::Волонтёры","sents":"My friend Anya volunteers at an animal shelter.|صديقتي آنيا تتطوع في مأوى للحيوانات.|Моя подруга Аня работает волонтёром в приюте для животных.\nShe goes there every Saturday.|تذهب إلى هناك كل سبت.|Она приходит туда каждую субботу.\nAnya feeds the dogs, walks them and cleans.|تطعم آنيا الكلاب وتتمشى معها وتنظف.|Аня кормит собак, гуляет с ними и убирает.\nShe is not paid money for this.|لا يدفعون لها مالا مقابل ذلك.|За это ей не платят деньги.\nBut she says she gets much more — joy.|لكنها تقول إنها تحصل على ما هو أكثر بكثير: الفرح.|Но она говорит, что получает гораздо больше — радость.\nThanks to volunteers, many animals find a new home.|بفضل المتطوعين تجد حيوانات كثيرة بيتا جديدا.|Благодаря волонтёрам многие животные находят новый дом.\nLast month Anya talked me into it too.|في الشهر الماضي أقنعتني آنيا أيضا.|В прошлом месяце Аня уговорила и меня.\nNow we go there together.|الآن نذهب إلى هناك معا.|Теперь мы ходим туда вместе.\nI realized that helping others is happiness.|فهمت أن مساعدة الآخرين سعادة.|Я понял, что помогать другим — это счастье.","gloss":""}],"dialogues":[{"title":"مقابلة عمل::Собеседование","lines":"A|Tell me a little about yourself.|حدّثني قليلاً عن نفسك.|Расскажите немного о себе.\nB|I graduated in economics and worked for five years at an international company.|تخرّجت في الاقتصاد وعملت خمس سنوات في شركة دولية.|Я окончил экономический и пять лет работал в международной компании.\nA|Why do you want to work for us?|لماذا تريد العمل لدينا؟|Почему вы хотите работать у нас?\nB|I'm interested in your field, and I want to grow professionally.|يهمّني مجالكم وأريد أن أتطوّر مهنياً.|Мне интересна ваша сфера, и я хочу расти профессионально.\nA|What are your strengths?|ما نقاط قوّتك؟|Какие у вас сильные стороны?\nB|I'm responsible and I work well in a team.|أنا مسؤول وأعمل جيداً ضمن فريق.|Я ответственный и хорошо работаю в команде.\nA|And your weaknesses?|ونقاط ضعفك؟|А слабые стороны?\nB|Sometimes I'm too critical of myself.|أحياناً أنتقد نفسي أكثر من اللازم.|Иногда я слишком критичен к себе.\nA|Thank you. We'll contact you within a week.|شكراً. سنتواصل معك خلال أسبوع.|Спасибо. Мы свяжемся с вами в течение недели."},{"title":"نقاش: المدينة أم الريف؟::Спор: город или деревня?","lines":"A|I would like to live in the countryside. It's quiet there and the air is clean.|أود أن أعيش في الريف. هناك هدوء وهواء نقي.|Я бы хотел жить в деревне. Там тихо и чистый воздух.\nB|But there are more opportunities in the city.|لكن الفرص في المدينة أكثر.|Но в городе больше возможностей.\nA|Such as?|مثل ماذا؟|Каких, например?\nB|Jobs, good schools, hospitals, theaters.|العمل والمدارس الجيدة والمستشفيات والمسارح.|Работа, хорошие школы, больницы, театры.\nA|I agree, but the city has a lot of stress and traffic jams.|أوافق، لكن في المدينة ضغط وازدحام كثير.|Согласен, но в городе много стресса и пробок.\nB|That's true. Maybe it's best to live in the suburbs?|هذا صحيح. ربما الأفضل أن نعيش في الضاحية؟|Это правда. Может, лучше всего жить в пригороде?\nA|Good idea! Nature is nearby and the city isn't far.|فكرة جيدة! الطبيعة قريبة والمدينة ليست بعيدة.|Хорошая идея! И природа рядом, и город недалеко.\nB|So we agree.|إذن اتفقنا.|Вот и договорились."},{"title":"بعد مشاهدة فيلم::После фильма","lines":"A|So how did you like the film?|إذن، كيف وجدت الفيلم؟|Ну как тебе фильм?\nB|To be honest, I expected more.|بصراحة، كنت أتوقع أكثر.|Честно говоря, я ожидал большего.\nA|Really? I liked it. The actors played beautifully.|حقا؟ أما أنا فأعجبني. أدى الممثلون أدوارهم بشكل رائع.|Правда? А мне понравилось. Актёры играли прекрасно.\nB|I agree with that. But the plot was too predictable.|أوافق على ذلك. لكن القصة كانت متوقعة جدا.|С этим я согласен. Но сюжет был слишком предсказуемым.\nA|But the ending was unexpected.|لكن النهاية كانت غير متوقعة.|Зато концовка неожиданная.\nB|Perhaps. The music was good too.|ربما. والموسيقى كانت جيدة أيضا.|Пожалуй. Музыка тоже была хорошая.\nA|Next time you choose the film.|في المرة القادمة أنت تختار الفيلم.|В следующий раз ты выбираешь фильм.\nB|Deal!|اتفقنا!|Договорились!"},{"title":"مقابلة صحفية::Интервью","lines":"A|Tell us, how did you start your business?|أخبرنا، كيف بدأت مشروعك؟|Расскажите, как вы начали свой бизнес?\nB|It all started with a small idea and a big desire.|بدأ كل شيء بفكرة صغيرة ورغبة كبيرة.|Всё началось с маленькой идеи и большого желания.\nA|Was it difficult?|هل كان الأمر صعبا؟|Было трудно?\nB|Very. In the first year we worked at a loss.|جدا. في السنة الأولى عملنا بخسارة.|Очень. Первый год мы работали в убыток.\nA|What helped you not to give up?|ما الذي ساعدك على عدم الاستسلام؟|Что вам помогло не сдаться?\nB|My family's support and faith in my product.|دعم العائلة والإيمان بمنتجي.|Поддержка семьи и вера в свой продукт.\nA|What would you advise young entrepreneurs?|بماذا تنصح رواد الأعمال الشباب؟|Что бы вы посоветовали молодым предпринимателям?\nB|Not to be afraid of mistakes and to learn from them.|ألا يخافوا من الأخطاء وأن يتعلموا منها.|Не бояться ошибок и учиться на них."}]},"C1":{"vocab":[{"t":"أدوات الربط::Связки","w":"↔️|however|غير أنّ|однако|هاوإيڤَر|хауэ́вэ\n⚖️|nevertheless|ومع ذلك|тем не менее|نِڤَرذَلِس|нэвэзэлэ́с\n➡️|therefore|لذلك / بالتالي|следовательно|ذيرفور|зэ́фо\n➕|moreover|علاوة على ذلك|более того|مورأوڤَر|мо́роувэ\n🧱|despite|على الرغم من|несмотря на|ديسپايت|диспа́йт\n🙏|thanks to|بفضل|благодаря|ثانكس تو|сэнкс ту\n🏁|in conclusion|في الختام|в заключение|إن كَنكلوجِن|ин кэнклю́жн"},{"t":"مفاهيم مجرّدة::Абстрактные понятия","w":"📈|trend|اتجاه|тенденция|ترِند|трэнд\n⛓️|consequence|عاقبة|последствие|كونسِكوِنس|ко́нсиквэнс\n🤔|assumption|افتراض|предположение|أسَمپشِن|эса́мпшн\n🔍|evidence|دليل|доказательство|إيڤِدِنس|э́видэнс\n⚔️|contradiction|تناقض|противоречие|كونترَدِكشِن|контрэди́кшн\n🔬|research|بحث|исследование|ريسيرتش|рисёрч\n💎|value|قيمة|ценность|ڤاليو|вэ́лью\n❓|doubt|شك|сомнение|داوت|даут\n👁️|obvious|واضح|очевидный|أوبڤيَس|о́бвиэс\n🧶|complex|معقّد|сложный|كومپلِكس|ко́мплекс\n🔒|inevitable|حتمي|неизбежный|إنِڤِتَبِل|инэ́витэбл\n✍️|emphasize|يؤكّد|подчеркнуть|إمفَسايز|э́мфэсайз\n📏|significant|كبير / ملحوظ|значительный|سِگنِفِكَنت|сигни́фикэнт"},{"t":"مفاهيم أكاديمية::Академическая лексика","w":"📈|tendency|نزعة|тенденция\n🧩|essence|جوهر|сущность\n🏁|conclusion|استنتاج|вывод\n🛤️|approach|منهج|подход\n👀|view|وجهة نظر|взгляд\n🧭|conviction|قناعة|убеждение\n🌀|phenomenon|ظاهرة|явление\n📐|hypothesis|فرضية|гипотеза\n lities.|تتمتع بقدرات بارزة.|Она обладает выдающимися способностями.\nIf it weren't for the rain, we would have gone out of town.|لولا المطر لذهبنا خارج المدينة.|Если бы не дождь, мы бы поехали за город.\nWe have to solve a number of complex tasks.|أمامنا حل عدد من المسائل المعقدة.|Нам предстоит решить ряд сложных задач.\nShe said it with slight irony.|قالت ذلك بسخرية خفيفة.|Она сказала это с лёгкой иронией.\nHis position commands respect.|موقفه يستحق الاحترام.|Его позиция вызывает уважение.\nThe data obtained need to be verified.|البيانات التي حصل عليها تحتاج إلى تحقق.|Полученные данные нуждаются в проверке.\nThis is only one of the possible interpretations.|هذا مجرد تفسير واحد من التفسيرات الممكنة.|Это лишь одна из возможных интерпретаций.\nThe author touches upon important social problems.|يتطرق المؤلف إلى مشاكل اجتماعية مهمة.|Автор затрагивает важные социальные проблемы.\nThe book was translated into twenty languages.|ترجم الكتاب إلى عشرين لغة.|Книга была переведена на двадцать языков.\nThe doctors did not make the diagnosis straight away.|لم يشخص الأطباء المرض فورا.|Врачи поставили диагноз не сразу.\nPrevention is cheaper than treatment.|الوقاية أرخص من العلاج.|Профилактика дешевле лечения.\nChronic diseases require constant monitoring.|تتطلب الأمراض المزمنة متابعة دائمة.|Хронические болезни требуют постоянного контроля.\nThe law comes into force on January first.|يدخل القانون حيز التنفيذ في الأول من يناير.|Закон вступает в силу с первого января.\nThe court delivered a verdict of acquittal.|أصدر القاضي حكما بالبراءة.|Суд вынес оправдательный приговор.\nClients' personal data is protected.|البيانات الشخصية للعملاء محمية.|Личные данные клиентов находятся под защитой.\nEvery citizen has the right to education.|لكل مواطن الحق في التعليم.|Каждый гражданин имеет право на образование.\nThe ambassador met with the foreign minister.|التقى السفير بوزير الخارجية.|Посол встретился с министром иностранных дел.\nThe parties signed a cooperation agreement.|وقع الطرفان اتفاقية
