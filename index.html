<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#E9DDC7"><style>html,body{margin:0}img{max-width:100%}</style>
<title>Lisan Language Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Learn Russian, English and Arabic from A1 to C2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Marck+Script&display=swap">
<style>
/* Layout: a school copybook on warm soft-beige paper — paper sheet, ruled practice areas, ink-blue accent, red margin line marks the level header */
:root{
  --paper:#E9DDC7; --sheet:#F6EDDC; --sheet-2:#EEE2CB; --ink:#33291F; --ink-2:#6B5B49; --ink-3:#998670;
  --rule:#DCCAAC; --rule-2:#CBB592; --blue:#35597A; --blue-soft:#E0E2D9; --blue-ink:#28455F;
  --teal:#2E6F5F; --teal-soft:#DCE6D6; --red:#A9432E; --red-soft:#F1DACD; --green:#3D7036; --green-soft:#DEE7CF;
  --margin:#CF9A82; --amber:#A8701C;
  --f-body:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"Lora","Amiri",Georgia,"Times New Roman",serif;
  --f-ar-disp:"Amiri","Lora",serif;
  --f-hand:"Marck Script","Aref Ruqaa",cursive;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; --shadow:0 1px 0 rgba(24,34,58,.04),0 6px 20px -12px rgba(24,34,58,.25);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1B1713; --sheet:#241F1A; --sheet-2:#2C261F; --ink:#EFE6DA; --ink-2:#C2B5A5; --ink-3:#8F8274;
  --rule:#3A3129; --rule-2:#4B4036; --blue:#9FB3E6; --blue-soft:#2B3142; --blue-ink:#C3D0F2;
  --teal:#72C2B0; --teal-soft:#1E302B; --red:#F0907C; --red-soft:#3A2420; --green:#8FCB84; --green-soft:#223020;
  --margin:#7A4E40; --amber:#E7B25A; --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 24px -14px rgba(0,0,0,.7); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#1B1713; --sheet:#241F1A; --sheet-2:#2C261F; --ink:#EFE6DA; --ink-2:#C2B5A5; --ink-3:#8F8274;
  --rule:#3A3129; --rule-2:#4B4036; --blue:#9FB3E6; --blue-soft:#2B3142; --blue-ink:#C3D0F2;
  --teal:#72C2B0; --teal-soft:#1E302B; --red:#F0907C; --red-soft:#3A2420; --green:#8FCB84; --green-soft:#223020;
  --margin:#7A4E40; --amber:#E7B25A; --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 24px -14px rgba(0,0,0,.7); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink-2)} .small{font-size:.86rem} .mono{font-family:var(--f-mono)}
.tgt{font-family:var(--f-body)}
.tgt-ar{font-family:"Amiri","IBM Plex Sans Arabic",serif;font-size:1.12em;line-height:1.9}
[hidden]{display:none!important}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--sheet) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;text-decoration:none;color:var(--ink);background:none;border:0;padding:0}
.brand .b-ar{font-family:var(--f-ar-disp);font-size:1.5rem}
.brand .b-lat{font-family:var(--f-disp);font-size:1.15rem;font-style:italic;color:var(--blue)}
.brand .b-cy{font-family:var(--f-disp);font-size:1.15rem;color:var(--ink-2)}
.top .sp{flex:1}
.crumbs{display:flex;gap:6px;align-items:center;font-size:.9rem;color:var(--ink-2);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crumbs button{background:none;border:0;padding:4px 2px;color:var(--blue);text-decoration:underline;text-underline-offset:3px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--rule-2);background:var(--sheet);font-size:.92rem}
.iconbtn:hover{border-color:var(--blue);color:var(--blue)}
.iconbtn svg{width:18px;height:18px;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid transparent;background:var(--blue);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn{color:#1B1713}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#1B1713}}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--sheet);color:var(--ink);border-color:var(--rule-2)}
.btn.ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn.sm{min-height:34px;padding:0 12px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.play{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule-2);background:var(--sheet);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--blue)}
.play:hover{background:var(--blue-soft);border-color:var(--blue)}
.play svg{width:18px;height:18px}
.play.slow{color:var(--teal)}
.play.slow:hover{background:var(--teal-soft);border-color:var(--teal)}
.play.speaking{background:var(--blue);color:var(--sheet);border-color:var(--blue)}

/* home */
.hero{padding-block:44px 28px}
.specimen{display:flex;gap:clamp(14px,4vw,40px);align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}
.specimen span{font-size:clamp(3.4rem,11vw,7rem);line-height:.9;font-family:var(--f-disp);color:var(--ink)}
.specimen .s-ar{font-family:var(--f-ar-disp);color:var(--blue)}
.specimen .s-hand{font-family:var(--f-hand);color:var(--teal)}
.hero h1{font-family:var(--f-ar-disp);font-size:clamp(1.7rem,4.2vw,2.6rem);font-weight:700;max-width:22ch}
.hero .h1-ru{font-family:var(--f-disp);font-size:clamp(1.15rem,2.6vw,1.5rem);font-weight:500;color:var(--ink-2);margin-top:8px;max-width:40ch}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:22px;font-family:var(--f-mono);font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-size:1rem}
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;padding-block:8px 36px}
.track{position:relative;text-align:start;display:flex;flex-direction:column;gap:10px;padding:20px 20px 18px;border-radius:14px;border:1px solid var(--rule);background:var(--sheet);box-shadow:var(--shadow);min-width:0;transition:border-color .15s,transform .15s}
.track:hover{border-color:var(--blue);transform:translateY(-2px)}
.track .glyph{font-size:3.2rem;line-height:1;font-family:var(--f-disp);color:var(--blue)}
.track .glyph.ar{font-family:var(--f-ar-disp)}
.track .from{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-family:var(--f-mono)}
.track h3{font-size:1.25rem}
.track .sub{color:var(--ink-2);font-size:.92rem}
.track .bar{height:4px;border-radius:4px;background:var(--rule);overflow:hidden;margin-top:auto}
.track .bar i{display:block;height:100%;background:var(--green)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:18px;padding-block:6px 30px;border-top:1px solid var(--rule)}
.how div{padding-top:16px}
.how h3{font-size:1rem;margin-bottom:4px}
.how p{margin:0;color:var(--ink-2);font-size:.92rem}
.note{border:1px dashed var(--rule-2);border-radius:var(--r);padding:12px 14px;color:var(--ink-2);font-size:.88rem;background:var(--sheet)}

/* track page: level ladder */
.page-h{padding-block:28px 14px}
.page-h h2{font-size:clamp(1.5rem,3.5vw,2.1rem)}
.ladder{display:flex;flex-direction:column;gap:10px;padding-bottom:40px}
.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;text-align:start;padding:16px 18px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);min-width:0}
.lvl:hover{border-color:var(--blue)}
.lvl .code{font-family:var(--f-mono);font-size:1.6rem;font-weight:500;width:3.2ch;color:var(--blue)}
.lvl.locked .code{color:var(--ink-3)}
.lvl .info{min-width:0}
.lvl .info h3{font-size:1.08rem}
.lvl .info p{margin:2px 0 0;color:var(--ink-2);font-size:.9rem}
.lvl .counts{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-3);margin-top:4px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.open{background:var(--blue-soft);color:var(--blue)}
.pill.lock{background:var(--sheet-2);color:var(--ink-3)}
@media (max-width:560px){.lvl{grid-template-columns:auto 1fr}.lvl .pill{grid-column:2;justify-self:start}}

/* level page */
.lvl-head{position:relative;padding-block:22px 0}
.lvl-head .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lvl-head h2{font-size:clamp(1.4rem,3vw,1.9rem);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.lvl-head h2 .code{font-family:var(--f-mono);color:var(--blue);font-weight:500}
.margin-line{height:2px;background:var(--margin);margin-top:14px;opacity:.8}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:10px;border-bottom:1px solid var(--rule)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:999px;border:1px solid transparent;background:none;color:var(--ink-2);font-weight:500;font-size:.95rem}
.tab:hover{color:var(--ink);background:var(--sheet-2)}
.tab.on{background:var(--ink);color:var(--paper)}
.tab.exam{color:var(--red)}
.tab.exam.on{background:var(--red);color:var(--sheet)}
.tab[disabled]{opacity:.35;cursor:not-allowed}
.panel{padding-block:20px 60px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sec-h h3{font-size:1.15rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--rule-2);background:var(--sheet);font-size:.86rem;color:var(--ink-2)}
.chip.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-ink)}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:999px;padding:3px;background:var(--sheet)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:.86rem;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--paper)}

/* letters */
.letter-stage{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:stretch;margin-bottom:20px}
@media (max-width:720px){.letter-stage{grid-template-columns:1fr}}
.ruled{background-color:var(--sheet);background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);border:1px solid var(--rule);border-radius:12px;position:relative;overflow:hidden}
.ruled::before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:44px;width:1.5px;background:var(--margin);opacity:.75}
.big-letter{display:flex;align-items:center;justify-content:center;gap:clamp(16px,5vw,46px);padding:22px 20px 22px 60px;min-height:230px}
[dir="rtl"] .big-letter{padding:22px 60px 22px 20px}
.big-letter .print{font-family:var(--f-disp);font-size:clamp(5rem,15vw,8.5rem);line-height:1;color:var(--ink)}
.big-letter .print.ar{font-family:var(--f-ar-disp)}
.big-letter .hand{font-family:var(--f-hand);font-size:clamp(4.2rem,13vw,7rem);line-height:1;color:var(--blue)}
.letter-info{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet)}
.letter-info .nm{font-size:.82rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-mono)}
.letter-info .snd{font-size:1.02rem}
.letter-info .forms{font-family:var(--f-ar-disp);font-size:1.8rem;letter-spacing:.25em;direction:rtl}
.ex-word{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--sheet-2)}
.ex-word .emo{font-size:2rem}
.ex-word .w{font-size:1.3rem;font-weight:600}
.ltr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.ltr{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-disp);font-size:1.5rem;display:flex;align-items:center;justify-content:center}
.ltr.ar{font-family:var(--f-ar-disp);font-size:1.8rem}
.ltr:hover{border-color:var(--blue)}
.ltr.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* vocab cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);min-width:0;text-align:start;position:relative}
.card:hover{border-color:var(--blue)}
.card .emo{font-size:2.6rem;line-height:1.1}
.card .w{font-size:1.25rem;font-weight:600;overflow-wrap:anywhere}
.card .pr{font-size:.88rem;color:var(--teal);overflow-wrap:anywhere}
.card .m{font-size:.95rem;color:var(--ink-2)}
.card .acts{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.card.weak::after{content:"";position:absolute;top:10px;inset-inline-end:10px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.flash{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.flash-card{min-height:280px;border-radius:16px;border:1px solid var(--rule);background:var(--sheet);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.flash-card .emo{font-size:4.2rem}
.flash-card .w{font-size:1.9rem;font-weight:600}
.flash-card .pr{color:var(--teal)}
.flash-card .m{font-size:1.2rem;color:var(--ink-2)}
.flash .count{text-align:center;font-family:var(--f-mono);font-size:.85rem;color:var(--ink-3)}

/* lists */
.list{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:12px;background:var(--sheet);overflow:hidden}
.li{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 16px;border-top:1px solid var(--rule);align-items:start}
.li:first-child{border-top:0}
.li .btns{display:flex;flex-direction:column;gap:6px}
.li .txt{min-width:0}
.li .t{font-size:1.15rem;font-weight:500}
.li .pr{font-size:.88rem;color:var(--teal);margin-top:2px}
.li .m{color:var(--ink-2);margin-top:2px}
.w{cursor:pointer;border-radius:4px;transition:background .1s}
.txt .w:hover,.reading .w:hover,.bubble .w:hover{background:var(--blue-soft)}
.w.hl{background:var(--blue-soft);box-shadow:0 0 0 2px var(--blue-soft)}
.li.playing{background:var(--blue-soft)}

/* grammar */
.gram{border:1px solid var(--rule);border-radius:12px;background:var(--sheet);margin-bottom:12px;overflow:hidden}
.gram > button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border:0;background:none;text-align:start;font-weight:600;font-size:1.05rem}
.gram > button .n{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-3);font-weight:500}
.gram .body{padding:0 18px 18px;border-top:1px solid var(--rule)}
.gram .body p{max-width:70ch}
.gram table{border-collapse:collapse;width:100%;margin:12px 0;font-size:.95rem}
.tblwrap{overflow-x:auto}
.gram th,.gram td{border:1px solid var(--rule);padding:8px 10px;text-align:start;vertical-align:top}
.gram th{background:var(--sheet-2);font-weight:600;font-size:.88rem}
.gram .tgt{color:var(--blue-ink);font-weight:600;cursor:pointer;border-bottom:1px dotted var(--blue)}
.tip{background:var(--blue-soft);border-inline-start:3px solid var(--blue);padding:10px 12px;border-radius:6px;color:var(--ink)}
.gram h4{margin:18px 0 8px;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-family:var(--f-mono)}
.mini-q{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.mini-q .q{margin-bottom:8px;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:8px 14px;border-radius:999px;border:1px solid var(--rule-2);background:var(--sheet);text-align:start}
.opt:hover{border-color:var(--blue)}
.opt.right{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.opt.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red)}

/* reading */
.reading{font-size:1.25rem;line-height:2.1;padding:22px 22px 22px 62px}
[dir="rtl"] .reading{padding:22px 62px 22px 22px}
.reading.ar{font-family:"Amiri",serif;font-size:1.45rem;line-height:2.2}
.reading .sent{display:inline}
.reading .sent.playing{background:var(--blue-soft);border-radius:4px}
.reading .trl{display:block;font-size:.92rem;line-height:1.6;color:var(--ink-2);font-family:var(--f-body);margin:2px 0 10px}

/* dialogue */
.stage{border:1px solid var(--rule);border-radius:14px;background:var(--sheet);overflow:hidden}
.stage-top{display:flex;justify-content:space-around;align-items:flex-end;gap:16px;padding:18px 16px 10px;background:linear-gradient(to bottom,var(--sheet-2),var(--sheet));border-bottom:1px solid var(--rule)}
.avatar{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.85rem;color:var(--ink-2);transition:transform .2s}
.avatar svg{width:74px;height:74px}
.avatar.talking{transform:translateY(-4px)}
.avatar.talking svg .mouth{animation:talk .22s infinite alternate}
@keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1.2)}}
@media (prefers-reduced-motion:reduce){.avatar.talking svg .mouth{animation:none}.track:hover{transform:none}}
.chat{display:flex;flex-direction:column;gap:12px;padding:18px 16px;max-height:none}
.bubble-row{display:flex;gap:8px;align-items:flex-end}
.bubble-row.B{flex-direction:row-reverse}
.bubble{max-width:min(78%,560px);padding:10px 14px;border-radius:16px;background:var(--blue-soft);border:1px solid transparent;min-width:0}
.bubble-row.A .bubble{border-end-start-radius:4px}
.bubble-row.B .bubble{background:var(--teal-soft);border-end-end-radius:4px}
.bubble .t{font-size:1.1rem}
.bubble .m{font-size:.9rem;color:var(--ink-2);margin-top:4px}
.bubble .pr{font-size:.82rem;color:var(--teal);margin-top:2px}
.bubble.active{border-color:var(--blue)}
.bubble.hidden-line .t{filter:blur(6px);user-select:none}
.your-turn{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--rule);background:var(--amber);background:color-mix(in srgb,var(--amber) 14%,var(--sheet))}

/* writing */
.trace-wrap{display:flex;flex-direction:column;gap:12px}
.trace-canvas{width:100%;height:240px;display:block;touch-action:none;border-radius:12px;border:1px solid var(--rule);background:var(--sheet)}
.dict{display:flex;flex-direction:column;gap:14px;max-width:640px}

по-р+усски «кн+ига»?|كيف نقول «كتاب» بالروسية؟\nЯ уч+у н+овые слов+а.|أتعلم كلمات جديدة.\nМы ч+асто гул+яем в п+арке.|نتمشى غالبا في الحديقة.\nВ+ечером мы см+отрим телев+изор.|في المساء نشاهد التلفاز.\nЯ сплю в+осемь час+ов.|أنام ثماني ساعات.\nН+очью я сплю.|في الليل أنام.\nОн раб+отает в больн+ице.|هو يعمل في مستشفى.\nОн+а раб+отает в шк+оле.|هي تعمل في مدرسة.\nМы +едем на авт+обусе.|نحن ذاهبون بالحافلة.\nЯ +езжу на раб+оту на метр+о.|أذهب إلى العمل بالمترو.\nМагаз+ин р+ядом с д+омом.|المتجر بجانب البيت.\nАпт+ека напр+отив б+анка.|الصيدلية مقابل البنك.\nЯ покуп+аю хлеб и молок+о.|أشتري خبزا وحليبا.\nСк+олько ст+оит хлеб?|بكم الخبز؟\n+Это д+орого.|هذا غال.\n+Это дёшево.|هذا رخيص.\nЯ хоч+у +это.|أريد هذا.\nМне нр+авится +этот цвет.|يعجبني هذا اللون.\nМой люб+имый цвет — с+иний.|لوني المفضل هو الأزرق.\nЯ уст+ал.|أنا متعب.\nЯ г+олоден.|أنا جائع.\nЯ р+ад теб+я в+идеть.|أنا سعيد برؤيتك.\nМне тр+идцать лет.|عمري ثلاثون سنة.\nГде ты раб+отаешь?|أين تعمل؟\nЧто ты д+елаешь?|ماذا تفعل؟\nЯ чит+аю кн+игу.|أقرأ كتابا.\n+Это мой сос+ед.|هذا جاري.\nОн+а +очень д+обрая.|هي لطيفة جدا.\nОн выс+окий и с+ильный.|هو طويل وقوي.\nМой д+едушка ст+арый, но весёлый.|جدي كبير في السن لكنه مرح.\nБ+абушка гот+овит вк+усный торт.|جدتي تصنع كعكة لذيذة.\nЯ не любл+ю ждать.|لا أحب الانتظار.\nПодожд+и, пож+алуйста.|انتظر من فضلك.\nОткр+ой окн+о, пож+алуйста.|افتح النافذة من فضلك.\nЗакр+ой дверь.|أغلق الباب.\nСад+ись, пож+алуйста.|اجلس من فضلك.\nЯ ид+у дом+ой.|أنا ذاهب إلى البيت.\nТы д+ома?|هل أنت في البيت؟\nДа, я д+ома.|نعم، أنا في البيت.\nНет, я на раб+оте.|لا، أنا في العمل.\nЯ звон+ю м+аме к+аждый день.|أتصل بأمي كل يوم.\nМы л+юбим пл+авать в м+оре.|نحب السباحة في البحر.\nЛ+етом ж+арко.|الجو حار في الصيف.\nЗим+ой х+олодно и идёт снег.|في الشتاء يكون الجو باردا ويتساقط الثلج.\nВ л+есе мн+ого дер+евьев.|في الغابة أشجار كثيرة.\nПт+ицы по+ют.|الطيور تغرد.\nЯ в+ижу г+ору.|أرى جبلا.\nСег+одня понед+ельник.|اليوم هو الاثنين.\nЗ+автра субб+ота.|غدا السبت.\nЯ свобод+ен в воскрес+енье.|أنا متفرغ يوم الأحد.\nУв+идимся з+автра!|نراك غدا!\nСпок+ойной н+очи!|تصبح على خير!\nПри+ятного аппет+ита!|بالهناء والشفاء!\nС днём рожд+ения!|عيد ميلاد سعيد!\nВсё хорош+о.|كل شيء بخير.\nНичег+о стр+ашного.|لا بأس.","grammar":[{"title":"لا يوجد فعل «يكون» في الحاضر","body":"<p>في الروسية لا نقول «أنا <b>أكون</b> طالباً». فعل [[быть]] (يكون) يُحذف تماماً في الزمن الحاضر، تماماً مثل الجملة الاسمية في العربية: «أنا طالبٌ».</p>\n<p>بين اسمين نضع أحياناً شَرطة (—) مكان الفعل المحذوف: [[Мо+я м+ама — врач.]]</p>\n<p class=\"tip\">قاعدة سهلة: إذا كانت الجملة العربية اسمية (مبتدأ وخبر)، فالروسية مثلها بلا فعل.</p>","ex":"Я студ+ент.|أنا طالب.\nОн врач.|هو طبيب.\n+Это дом.|هذا بيت.\nМ+ама д+ома.|ماما في البيت.\nМой брат — инжен+ер.|أخي مهندس.","quiz":[["كيف تقول «أنا طالب»؟","Я студ+ент.","Я есть студ+ент.","Я быть студ+ент."],["كيف تقول «هذا بيت»؟","+Это дом.","+Это есть дом.","+Это быть дом."]]},{"title":"الجنس: مذكر، مؤنث، محايد","body":"<p>كل اسم في الروسية له جنس من ثلاثة، ونعرفه غالباً من <b>آخر حرف</b>:</p>\n<table><tr><th>الجنس</th><th>النهاية</th><th>أمثلة</th></tr>\n<tr><td>مذكر</td><td>حرف ساكن، ‎-й</td><td>[[дом]]، [[стол]]، [[чай]]</td></tr>\n<tr><td>مؤنث</td><td>‎-а، ‎-я</td><td>[[м+ама]]، [[кн+ига]]، [[семь+я]]</td></tr>\n<tr><td>محايد</td><td>‎-о، ‎-е</td><td>[[окн+о]]، [[м+оре]]، [[молок+о]]</td></tr></table>\n<p>الكلمات المنتهية بـ <b>ь</b> قد تكون مذكرة أو مؤنثة، فاحفظها مع جنسها: [[дверь]] مؤنث، [[день]] مذكر.</p>\n<p class=\"tip\">انتبه: [[п+апа]] ينتهي بـ ‎-а لكنه مذكر لأن المعنى مذكر.</p>","ex":"Мой дом.|بيتي (مذكر).\nМо+я кн+ига.|كتابي (مؤنث).\nМоё окн+о.|نافذتي (محايد).","quiz":[["ما جنس كلمة [[маш+ина]]؟","مؤنث","مذكر","محايد"],["ما جنس كلمة [[молок+о]]؟","محايد","مذكر","مؤنث"],["ما جنس كلمة [[стол]]؟","مذكر","مؤنث","محايد"]]},{"title":"الضمائر الشخصية وضمائر الملكية","body":"<p>ضمير الملكية (لي، لك...) يتغير حسب جنس الشيء المملوك، لا حسب المالك:</p>\n<table><tr><th>الضمير</th><th>مذكر</th><th>مؤنث</th><th>محايد</th><th>جمع</th></tr>\n<tr><td>[[я]] أنا</td><td>[[мой]]</td><td>[[мо+я]]</td><td>[[моё]]</td><td>[[мо+и]]</td></tr>\n<tr><td>[[ты]] أنت</td><td>[[твой]]</td><td>[[тво+я]]</td><td>[[твоё]]</td><td>[[тво+и]]</td></tr>\n<tr><td>[[мы]] نحن</td><td>[[наш]]</td><td>[[н+аша]]</td><td>[[н+аше]]</td><td>[[н+аши]]</td></tr>\n<tr><td>[[вы]] أنتم</td><td>[[ваш]]</td><td>[[в+аша]]</td><td>[[в+аше]]</td><td>[[в+аши]]</td></tr></table>\n<p>أما [[ег+о]] (له)، [[её]] (لها)، [[их]] (لهم) فلا تتغير أبداً.</p>","ex":"+Это мой телеф+он.|هذا هاتفي.\n+Это мо+я маш+ина.|هذه سيارتي.\n+Это н+аша семь+я.|هذه عائلتنا.\n+Это её дом.|هذا بيتها.","quiz":[["+Это ___ сестр+а.","мо+я","мой","моё"],["+Это ___ окн+о.","моё","мо+я","мой"],["+Это ___ брат.","мой","мо+я","мо+и"]]},{"title":"جمع الأسماء","body":"<table><tr><th>المفرد</th><th>الجمع</th><th>القاعدة</th></tr>\n<tr><td>[[стол]]</td><td>[[стол+ы]]</td><td>مذكر صلب ← ‎-ы</td></tr>\n<tr><td>[[м+ама]]</td><td>[[м+амы]]</td><td>‎-а ← ‎-ы</td></tr>\n<tr><td>[[кн+ига]]</td><td>[[кн+иги]]</td><td>بعد г، к، х، ж، ш، ч، щ نكتب ‎-и</td></tr>\n<tr><td>[[дверь]]</td><td>[[дв+ери]]</td><td>‎-ь، ‎-я ← ‎-и</td></tr>\n<tr><td>[[окн+о]]</td><td>[[+окна]]</td><td>محايد ‎-о ← ‎-а</td></tr>\n<tr><td>[[м+оре]]</td><td>[[мор+я]]</td><td>محايد ‎-е ← ‎-я</td></tr></table>\n<p>جموع شاذة يجب حفظها: [[челов+ек]] ← [[л+юди]]، [[ребёнок]] ← [[д+ети]]، [[друг]] ← [[друзь+я]]، [[брат]] ← [[бр+атья]].</p>","ex":"У мен+я два бр+ата.|عندي أخوان.\nТам д+ети.|هناك أطفال.\n+Это мо+и друзь+я.|هؤلاء أصدقائي.","quiz":[["جمع [[стол]] هو:","стол+ы","стол+и","стол+а"],["جمع [[кн+ига]] هو:","кн+иги","кн+игы","кн+игов"],["جمع [[ребёнок]] هو:","д+ети","ребёнки","реб+ята"]]},{"title":"الفعل المضارع وتصريفه","body":"<p>للأفعال الروسية تصريفان أساسيان في المضارع:</p>\n<table><tr><th>الضمير</th><th>[[чит+ать]] يقرأ (التصريف 1)</th><th>[[говор+ить]] يتكلم (التصريف 2)</th></tr>\n<tr><td>[[я]]</td><td>[[чит+аю]]</td><td>[[говор+ю]]</td></tr>\n<tr><td>[[ты]]</td><td>[[чит+аешь]]</td><td>[[говор+ишь]]</td></tr>\n<tr><td>[[он]] / [[он+а]]</td><td>[[чит+ает]]</td><td>[[говор+ит]]</td></tr>\n<tr><td>[[мы]]</td><td>[[чит+аем]]</td><td>[[говор+им]]</td></tr>\n<tr><td>[[вы]]</td><td>[[чит+аете]]</td><td>[[говор+ите]]</td></tr>\n<tr><td>[[он+и]]</td><td>[[чит+ают]]</td><td>[[говор+ят]]</td></tr></table>\n<p class=\"tip\">المضارع الروسي يعني «أفعل الآن» و«أفعل عادةً» معاً، مثل العربية.</p>","ex":"Я чит+аю кн+игу.|أنا أقرأ كتاباً.\nОн+а говор+ит по-р+усски.|هي تتكلم الروسية.\nМы раб+отаем.|نحن نعمل.\nОн+и жив+ут в Москв+е.|هم يعيشون في موسكو.","quiz":[["Он+а ___ кн+игу.","чит+ает","чит+аю","чит+аем"],["Мы ___ по-р+усски.","говор+им","говор+ит","говор+ю"],["Вы ___ по-англ+ийски?","говор+ите","говор+ишь","говор+ят"]]},{"title":"السؤال والنفي","body":"<p><b>السؤال بنعم/لا:</b> نفس ترتيب الجملة الخبرية، ونرفع نبرة الصوت فقط على الكلمة المسؤول عنها: [[Ты д+ома?]] (هل أنت في البيت؟)</p>\n<p><b>أدوات الاستفهام:</b> [[кто]] من، [[что]] ماذا، [[где]] أين، [[когд+а]] متى، [[как]] كيف، [[почем+у]] لماذا، [[ск+олько]] كم.</p>\n<p><b>النفي:</b> نضع [[не]] قبل الفعل أو الكلمة المنفية: [[Я не зн+аю.]] أما [[нет]] فتعني «لا» كجواب.</p>","ex":"Где ты?|أين أنت؟\nКогд+а ты раб+отаешь?|متى تعمل؟\nПочем+у ты не спишь?|لماذا لا تنام؟\nНет, я не студ+ент.|لا، لست طالباً.","quiz":[["كيف تقول «أنا لا أفهم»؟","Я не поним+аю.","Я нет поним+аю.","Не я поним+аю."],["كلمة «أين» بالروسية:","где","когд+а","как"],["كلمة «لماذا» بالروسية:","почем+у","ск+олько","кто"]]},{"title":"الملكية: «عندي»","body":"<p>لقول «عندي» نستخدم التركيب: [[у]] + الضمير + [[есть]] + الشيء.</p>\n<table><tr><th>عربي</th><th>روسي</th></tr>\n<tr><td>عندي</td><td>[[у мен+я есть]]</td></tr><tr><td>عندك</td><td>[[у теб+я есть]]</td></tr>\n<tr><td>عنده</td><td>[[у нег+о есть]]</td></tr><tr><td>عندها</td><td>[[у неё есть]]</td></tr>\n<tr><td>عندنا</td><td>[[у нас есть]]</td></tr><tr><td>عندهم</td><td>[[у них есть]]</td></tr></table>\n<p class=\"tip\">الشيء المملوك يبقى في حالة الرفع: [[У мен+я есть маш+ина.]]</p>","ex":"У мен+я есть брат.|عندي أخ.\nУ теб+я есть вр+емя?|هل عندك وقت؟\nУ нас есть кот.|عندنا قط.","quiz":[["«عندي سيارة»:","У мен+я есть маш+ина.","Я есть маш+ина.","Мне есть маш+ина."],["«عندنا قط»:","У нас есть кот.","Мы есть кот.","У мы есть кот."]]}],"readings":[{"title":"Мо+я семь+я","tr":"عائلتي","sents":"Мен+я зов+ут Ахм+ад.|اسمي أحمد.\nМне дв+адцать пять лет.|عمري خمسة وعشرون عاماً.\nЯ из Иорд+ании, но сейч+ас я жив+у в Ташк+енте.|أنا من الأردن، لكني أعيش الآن في طشقند.\nУ мен+я больш+ая семь+я.|عندي عائلة كبيرة.\nМо+я м+ама — уч+ительница.|أمي معلّمة.\nМой п+апа — инжен+ер.|أبي مهندس.\nУ мен+я есть брат и сестр+а.|عندي أخ وأخت.\nМой брат раб+отает в б+анке.|أخي يعمل في بنك.\nМо+я сестр+а — студ+ентка.|أختي طالبة.\nЯ +очень любл+ю мо+ю семь+ю.|أحب عائلتي كثيراً.","gloss":"зовут|يُسمّون (меня зовут = اسمي)\nахмад|أحمد\nдвадцать|عشرون\nпять|خمسة\nлет|سنة/سنوات (للعمر)\nиордании|الأردن\nживу|أعيش\nташкенте|طشقند\nбольшая|كبيرة\nсемья|عائلة\nмама|أم / ماما\nучительница|معلّمة\nпапа|أب / بابا\nинженер|مهندس\nбрат|أخ\nсестра|أخت\nработает|يعمل\nбанке|بنك\nстудентка|طالبة\nлюблю|أحب\nсемью|العائلة (مفعول به)"},{"title":"Мой день","tr":"يومي","sents":"Я вста+ю в семь час+ов +утра.|أستيقظ في الساعة السابعة صباحاً.\nЯ пью чай и ем хлеб с с+ыром.|أشرب الشاي وآكل الخبز مع الجبن.\nПот+ом я ид+у на раб+оту.|ثم أذهب إلى العمل.\nЯ раб+отаю в +офисе.|أعمل في مكتب.\nВ+ечером я гот+овлю +ужин.|في المساء أطبخ العشاء.\nПот+ом я чит+аю кн+игу и сл+ушаю м+узыку.|ثم أقرأ كتاباً وأستمع إلى الموسيقى.\nВ од+иннадцать час+ов я сплю.|في الساعة الحادية عشرة أنام.","gloss":"встаю|أستيقظ / أنهض\nсемь|سبعة\nчасов|ساعات\nутра|صباحاً\nпью|أشرب\nчай|شاي\nем|آكل\nхлеб|خبز\nсыром|الجبن (مع)\nиду|أذهب\nработу|العمل\nработаю|أعمل\nофисе|مكتب\nвечером|في المساء\nготовлю|أطبخ / أحضّر\nужин|عشاء\nчитаю|أقرأ\nкнигу|كتاباً\nслушаю|أستمع\nмузыку|الموسيقى\nодиннадцать|أحد عشر\nсплю|أنام"},{"title":"В мо+ей кварт+ире","tr":"في شقتي","sents":"Я жив+у в кварт+ире в ц+ентре г+орода.|أسكن في شقة في وسط المدينة.\nКварт+ира не больш+ая, но св+етлая.|الشقة ليست كبيرة لكنها مضيئة.\nТам есть сп+альня, гост+иная, к+ухня и в+анная.|فيها غرفة نوم وغرفة جلوس ومطبخ وحمام.\nВ сп+альне сто+ит кров+ать и шкаф.|في غرفة النوم سرير وخزانة.\nВ гост+иной есть див+ан, стол и телев+изор.|في غرفة الجلوس أريكة وطاولة وتلفاز.\nМо+я люб+имая к+омната — к+ухня.|غرفتي المفضلة هي المطبخ.\nТам я гот+овлю з+автрак и пью чай.|هناك أحضر الفطور وأشرب الشاي.\nИз окн+а я в+ижу п+арк и дер+евья.|من النافذة أرى حديقة وأشجارا.\nМо+и сос+еди т+ихие и д+обрые.|جيراني هادئون ولطفاء.\nМне +очень нр+авится мо+я кварт+ира.|تعجبني شقتي كثيرا.","gloss":""},{"title":"На р+ынке","tr":"في السوق","sents":"В субб+оту я хож+у на р+ынок.|يوم السبت أذهب إلى السوق.\nТам мн+ого фр+уктов и овощ+ей.|هناك فواكه وخضار كثيرة.\nЯ покуп+аю +яблоки, помид+оры и огурц+ы.|أشتري التفاح والطماطم والخيار.\nПродав+ец +очень д+обрый.|البائع لطيف جدا.\nОн говор+ит: «Здр+авствуйте! Что вы хот+ите?»|يقول: «مرحبا! ماذا تريد؟»\nЯ отвеч+аю: «Кил+о виногр+ада, пож+алуйста».|أجيب: «كيلو عنب من فضلك».\nВиногр+ад сл+адкий и не дорог+ой.|العنب حلو وليس غاليا.\nЯ т+оже покуп+аю хлеб, сыр и мёд.|أشتري أيضا الخبز والجبن والعسل.\nПот+ом я ид+у дом+ой и гот+овлю сал+ат.|ثم أذهب إلى البيت وأحضر سلطة.","gloss":""},{"title":"Мой друг Ив+ан","tr":"صديقي إيفان","sents":"У мен+я есть друг. Ег+о зов+ут Ив+ан.|عندي صديق. اسمه إيفان.\nЕм+у дв+адцать в+осемь лет.|عمره ثمانية وعشرون عاما.\nИв+ан живёт в Москв+е.|يسكن إيفان في موسكو.\nОн раб+отает в б+анке.|هو يعمل في بنك.\nИв+ан выс+окий, у нег+о тёмные в+олосы.|إيفان طويل، وشعره داكن.\nОн +очень л+юбит спорт.|هو يحب الرياضة كثيرا.\nК+аждое +утро он б+егает в п+арке.|كل صباح يركض في الحديقة.\nВ+ечером он чит+ает +или см+отрит фильм.|في المساء يقرأ أو يشاهد فيلما.\nУ Ив+ана есть соб+ака. Её зов+ут Б+обик.|عند إيفان كلب. اسمه بوبيك.\nМы ч+асто гул+яем вм+есте.|نتمشى معا غالبا.","gloss":""}],"dialogues":[{"title":"تعارف","lines":"A|Прив+ет! Мен+я зов+ут +Анна. А теб+я?|مرحباً! اسمي آنا. وأنت؟\nB|Прив+ет! Я Ахм+ад.|مرحباً! أنا أحمد.\nA|Отк+уда ты?|من أين أنت؟\nB|Я из Иорд+ании. А ты?|أنا من الأردن. وأنتِ؟\nA|Я из Москв+ы. Ты говор+ишь по-р+усски?|أنا من موسكو. هل تتكلم الروسية؟\nB|Немн+ого. Я уч+у р+усский яз+ык.|قليلاً. أنا أتعلم اللغة الروسية.\nA|Молод+ец! +Очень при+ятно.|أحسنت! تشرّفنا.\nB|Мне т+оже!|وأنا أيضاً!"},{"title":"في المقهى","lines":"A|Здр+авствуйте! Что вы хот+ите?|أهلاً! ماذا تريد؟\nB|Ч+ашку ч+ая, пож+алуйста.|كوب شاي من فضلك.\nA|С с+ахаром?|مع سكر؟\nB|Нет, без с+ахара. И кус+ок т+орта.|لا، بدون سكر. وقطعة كيك.\nA|Хорош+о. Что-ниб+удь ещё?|حسناً. شيء آخر؟\nB|Нет, спас+ибо. Ск+олько с мен+я?|لا، شكراً. كم الحساب؟\nA|Тр+иста рубл+ей.|ثلاثمئة روبل.\nB|Вот, пож+алуйста.|تفضّل."},{"title":"في المطعم","lines":"A|Д+обрый в+ечер! Вот мен+ю.|مساء الخير! تفضل قائمة الطعام.\nB|Спас+ибо. Что вы сов+етуете?|شكرا. بماذا تنصح؟\nA|Сег+одня +очень вк+усный суп.|الحساء اليوم لذيذ جدا.\nB|Хорош+о. Суп и сал+ат, пож+алуйста.|حسنا. حساء وسلطة من فضلك.\nA|Что вы б+удете пить?|ماذا تشرب؟\nB|Стак+ан вод+ы и чай.|كأس ماء وشايا.\nA|Хорош+о. Что-ниб+удь ещё?|حسنا. شيء آخر؟\nB|Нет, спас+ибо. Пот+ом счёт, пож+алуйста.|لا، شكرا. الحساب بعد ذلك من فضلك."},{"title":"أين الصيدلية؟","lines":"A|Извин+ите, где апт+ека?|عفوا، أين الصيدلية؟\nB|Апт+ека там, напр+отив б+анка.|الصيدلية هناك، مقابل البنك.\nA|+Это далек+о?|هل هي بعيدة؟\nB|Нет, бл+изко. Пять мин+ут пешк+ом.|لا، قريبة. خمس دقائق مشيا.\nA|Идт+и пр+ямо?|هل أمشي إلى الأمام؟\nB|Да, пр+ямо, пот+ом напр+аво.|نعم، إلى الأمام ثم إلى اليمين.\nA|Больш+ое спас+ибо!|شكرا جزيلا!\nB|Не за что!|لا شكر على واجب!"},{"title":"عن العائلة","lines":"A|У теб+я больш+ая семь+я?|هل عائلتك كبيرة؟\nB|Да. У мен+я два бр+ата и сестр+а.|نعم. عندي أخوان وأخت.\nA|Где он+и жив+ут?|أين يسكنون؟\nB|Бр+атья жив+ут в Амм+ане, а сестр+а — здесь.|أخواي يسكنان في عمان، وأختي هنا.\nA|А род+ители?|ووالداك؟\nB|Род+ители т+оже в Амм+ане.|والداي أيضا في عمان.\nA|Ты скуч+аешь по ним?|هل تشتاق إليهم؟\nB|Да, +очень. Я звон+ю им к+аждый день.|نعم، كثيرا. أتصل بهم كل يوم."}]},"A2":{"vocab":[{"t":"الطقس والفصول","w":"🌦️|пог+ода|الطقس\n☀️|с+олнце|شمس\n🌧️|дождь|مطر\n  صغير علي.\nУ вас есть +этот св+итер друг+ого цв+ета?|هل عندكم هذه الكنزة بلون آخر؟\nМ+ожно заплат+ить к+артой?|هل يمكن الدفع بالبطاقة؟\nСег+одня больш+ие ск+идки.|هناك تخفيضات كبيرة اليوم.\nЯ ищ+у под+арок для м+амы.|أبحث عن هدية لأمي.\nМне н+ужен разм+ер поб+ольше.|أحتاج مقاسا أكبر.\nВозьм+и з+онтик.|خذ مظلة.\nЗ+автра б+удет с+олнечно.|سيكون الجو مشمسا غدا.\nВчер+а был с+ильный в+етер.|كانت هناك ريح قوية أمس.\nЗим+ой в Москв+е +очень х+олодно.|في الشتاء يكون الجو باردا جدا في موسكو.\nЛ+етом в Ташк+енте ж+арко.|في الصيف يكون الجو حارا في طشقند.\nМоё люб+имое вр+емя г+ода — весн+а.|فصلي المفضل هو الربيع.\nУ мен+я день рожд+ения в м+ае.|عيد ميلادي في مايو.\nВ +августе мы по+едем на м+оре.|في أغسطس سنذهب إلى البحر.\nГде мой п+аспорт?|أين جواز سفري؟\nМне н+ужен бил+ет до Самарк+анда.|أحتاج تذكرة إلى سمرقند.\nП+оезд отправл+яется в д+евять час+ов.|ينطلق القطار في الساعة التاسعة.\nСамолёт оп+аздывает на час.|الطائرة متأخرة ساعة.\nМы б+ыли в муз+ее и в те+атре.|كنا في المتحف وفي المسرح.\nЯ сд+елал мн+ого фотогр+афий.|التقطت صورا كثيرة.\nМы ж+или в гост+инице у м+оря.|أقمنا في فندق على البحر.\nЯ хоч+у по+ехать в Росс+ию.|أريد أن أسافر إلى روسيا.\nКак дойт+и до вокз+ала?|كيف أصل إلى محطة القطار؟\nИд+ите пр+ямо, пот+ом нал+ево.|امش إلى الأمام ثم إلى اليسار.\nБиблиот+ека за угл+ом.|المكتبة عند الزاوية.\nП+очта р+ядом с пл+ощадью.|مكتب البريد بجانب الساحة.\nПерейд+ите +улицу на светоф+оре.|اعبر الشارع عند الإشارة.\n+Это далек+о отс+юда?|هل هو بعيد من هنا؟\nМой брат раб+отает вод+ителем.|أخي يعمل سائقا.\nМо+я подр+уга — медсестр+а.|صديقتي ممرضة.\nЯ хоч+у стать программ+истом.|أريد أن أصبح مبرمجا.\nКем ты раб+отаешь?|ماذا تعمل؟\nМой от+ец раб+отал инжен+ером.|عمل أبي مهندسا.\nПо в+ыходным я игр+аю в т+еннис.|في عطلة نهاية الأسبوع ألعب التنس.\nТы ум+еешь игр+ать на гит+аре?|هل تعرف العزف على القيثارة؟\nВчер+а мы смотр+ели интер+есный фильм.|شاهدنا أمس فيلما ممتعا.\nН+аша ком+анда в+ыиграла матч.|فاز فريقنا بالمباراة.\nЯ любл+ю чит+ать детект+ивы.|أحب قراءة القصص البوليسية.\nМой п+апа л+юбит рыб+алку.|أبي يحب صيد السمك.\nУ мен+я температ+ура.|عندي حمى.\nУ мен+я бол+ит г+орло.|حلقي يؤلمني.\nМне н+ужно к врач+у.|يجب أن أذهب إلى الطبيب.\nПрим+и табл+етку и отдохн+и.|خذ حبة دواء وارتح.\nВ+ызовите ск+орую п+омощь!|اتصلوا بالإسعاف!\nЯ уж+е здор+ов.|أنا بخير الآن.\nЯ просып+аюсь в шесть час+ов.|أستيقظ في الساعة السادسة.\nПот+ом я приним+аю душ и з+автракаю.|ثم أستحم وأتناول الفطور.\nЯ ухож+у из д+ома в в+осемь.|أخرج من البيت في الثامنة.\nЯ возвращ+аюсь дом+ой в+ечером.|أعود إلى البيت في المساء.\nЯ лож+усь спать в од+иннадцать.|أذهب إلى النوم في الحادية عشرة.\nИзвин+и, я опозд+ал.|آسف، تأخرت.\nВ субб+оту я убир+аю кварт+иру.|يوم السبت أنظف الشقة.\nКто б+удет мыть пос+уду?|من سيغسل الصحون؟\nЯ вынош+у м+усор к+аждый в+ечер.|أخرج القمامة كل مساء.\nМ+ама гл+адит руб+ашки.|أمي تكوي القمصان.\nЯ гот+овлю +ужин для вс+ей семь+и.|أحضر العشاء لكل العائلة.\nНар+ежь лук и помид+оры.|قطع البصل والطماطم.\nСуп +очень солёный.|الحساء مالح جدا.\n+Этот лим+он +очень к+ислый.|هذه الليمونة حامضة جدا.\nКак+ой у теб+я рец+епт?|ما وصفتك؟\nЯ об+ычно об+едаю в каф+е.|عادة أتغدى في مقهى.\nМы +ужинаем в семь.|نتعشى في السابعة.\nМоскв+а б+ольше, чем Ташк+ент.|موسكو أكبر من طشقند.\n+Эта к+уртка тепл+ее.|هذه السترة أدفأ.\nМой брат ст+арше мен+я.|أخي أكبر مني.\nМетр+о — с+амый б+ыстрый тр+анспорт.|المترو أسرع وسيلة نقل.\nЯ бо+юсь соб+ак.|أخاف من الكلاب.\nНе волн+уйся, всё б+удет хорош+о.|لا تقلق، سيكون كل شيء بخير.\nЯ +очень скуч+аю по д+ому.|أشتاق إلى البيت كثيرا.\nСпас+ибо за под+арок!|شكرا على الهدية!\nЯ был +очень удивлён.|كنت متفاجئا جدا.\nМы познак+омились в пр+ошлом год+у.|تعارفنا في العام الماضي.\nЧто ты б+удешь д+елать в+ечером?|ماذا ستفعل في المساء؟\nЯ б+уду смотр+еть сери+ал.|سأشاهد مسلسلا.\nДав+ай встр+етимся в ц+ентре.|لنلتق في وسط المدينة.\nВо ск+олько ты свобод+ен?|متى تكون متفرغا؟\nЯ позвон+ю теб+е п+озже.|سأتصل بك لاحقا.\nМы ч+асто х+одим в кин+о.|نذهب إلى السينما كثيرا.\nОн никогд+а не оп+аздывает.|هو لا يتأخر أبدا.\nЯ иногд+а гот+овлю плов.|أطبخ البلوف أحيانا.\nВчер+а я весь день раб+отал.|عملت طوال اليوم أمس.\nЯ ещё не был в Санкт-Петерб+урге.|لم أزر سانت بطرسبورغ بعد.\nМы б+удем жить в н+овой кварт+ире.|سنسكن في شقة جديدة.\nОн+и пере+ехали в друг+ой г+ород.|انتقلوا إلى مدينة أخرى.\nЯ заб+ыл ключ+и д+ома.|نسيت المفاتيح في البيت.\nП+омнишь, где мы б+ыли в пр+ошлом г+оду?|هل تتذكر أين كنا في العام الماضي؟\nЯ пл+охо спал +этой н+очью.|نمت نوما سيئا الليلة الماضية.\nНам н+ужно куп+ить прод+укты.|يجب أن نشتري المواد الغذائية.\nМ+ожно посмотр+еть мен+ю?|هل يمكنني رؤية قائمة الطعام؟\nЯ хоч+у заказ+ать такс+и.|أريد أن أطلب سيارة أجرة.\nОтвез+ите мен+я в аэроп+орт, пож+алуйста.|خذني إلى المطار من فضلك.","grammar":[{"title":"حالة المفعول به (Винительный падеж)","body":"<p>عندما يقع الفعل على اسم (مفعول به مباشر)، تتغير نهاية الاسم المؤنث:</p>\n<table><tr><th>النهاية</th><th>الرفع</th><th>المفعول به</th></tr>\n<tr><td>‎-а ← ‎-у</td><td>[[м+ама]]</td><td>Я в+ижу [[м+аму]]</td></tr>\n<tr><td>‎-я ← ‎-ю</td><td>[[семь+я]]</td><td>Я любл+ю [[семь+ю]]</td></tr>\n<tr><td>مذكر غير عاقل: لا يتغير</td><td>[[стол]]</td><td>Я в+ижу [[стол]]</td></tr>\n<tr><td>محايد: لا يتغير</td><td>[[окн+о]]</td><td>Я в+ижу [[окн+о]]</td></tr></table>\n<p>المذكر العاقل (إنسان/حيوان) يأخذ ‎-а: [[брат]] ← Я в+ижу [[бр+ата]].</p>\n<p class=\"tip\">نفس الحالة بعد [[в]] و[[на]] عند الحركة نحو مكان: [[Я ид+у в шк+олу.]]</p>","ex":"Я чит+аю кн+игу.|أقرأ كتاباً.\nЯ любл+ю м+узыку.|أحب الموسيقى.\nОн+а ждёт бр+ата.|هي تنتظر أخاها.\nМы ид+ём на раб+оту.|نحن ذاهبون إلى العمل.","quiz":[["Я чит+аю ___.","кн+игу","кн+ига","кн+иги"],["Я в+ижу ___ (أمي).","м+аму","м+ама","м+амы"],["Мы ид+ём в ___.","шк+олу","шк+ола","шк+оле"]]},{"title":"حالة المكان (Предложный падеж)","body":"<p>للإجابة على سؤال [[где?]] (أين؟) نستخدم [[в]] أو [[на]] + الاسم بنهاية ‎<b>-е</b> غالباً:</p>\n<table><tr><th>الكلمة</th><th>أين؟</th></tr>\n<tr><td>[[г+ород]]</td><td>[[в г+ороде]]</td></tr>\n<tr><td>[[шк+ола]]</td><td>[[в шк+оле]]</td></tr>\n<tr><td>[[раб+ота]]</td><td>[[на раб+оте]]</td></tr>\n<tr><td>[[Москв+а]]</td><td>[[в Москв+е]]</td></tr>\n<tr><td>[[Росс+ия]] (‎-ия)</td><td>[[в Росс+ии]]</td></tr></table>\n<p>[[на]] تُستخدم مع: العمل، الشارع، المحطة، الجامعة أحياناً، الحفلات والأحداث: [[на +улице]]، [[на вокз+але]]، [[на конц+ерте]].</p>\n<p>وتُستخدم نفس الحالة بعد [[о]] (عن): [[Мы говор+им о кн+иге.]]</p>","ex":"Я жив+у в Ташк+енте.|أعيش في طشقند.\nОн+а на раб+оте.|هي في العمل.\nКн+ига на стол+е.|الكتاب على الطاولة.\nМы говор+им о пог+оде.|نتكلم عن الطقس.","quiz":[["Я жив+у в ___.","г+ороде","г+ород","г+орода"],["Он+а ___ раб+оте.","на","в","о"],["Мы б+ыли в ___ (روسيا).","Росс+ии","Росс+ия","Росс+ие"]]},{"title":"الزمن الماضي","body":"<p>الماضي سهل جداً: نحذف ‎-ть من المصدر ونضيف نهاية حسب <b>جنس</b> الفاعل وعدده (لا حسب الضمير):</p>\n<table><tr><th>الفاعل</th><th>النهاية</th><th>[[чит+ать]]</th><th>[[быть]] (كان)</th></tr>\n<tr><td>مذكر (я/ты/он)</td><td>‎-л</td><td>[[чит+ал]]</td><td>[[был]]</td></tr>\n<tr><td>مؤنث (я/ты/она)</td><td>‎-ла</td><td>[[чит+ала]]</td><td>[[был+а]]</td></tr>\n<tr><td>محايد (оно)</td><td>‎-ло</td><td>[[чит+ало]]</td><td>[[б+ыло]]</td></tr>\n<tr><td>جمع (мы/вы/они)</td><td>‎-ли</td><td>[[чит+али]]</td><td>[[б+ыли]]</td></tr></table>\n<p class=\"tip\">الرجل يقول [[я чит+ал]] والمرأة تقول [[я чит+ала]].</p>","ex":"Вчер+а я раб+отал.|أمس عملتُ (رجل).\nВчер+а я раб+отала.|أمس عملتُ (امرأة).\nМы б+ыли д+ома.|كنا في البيت.\nОн+а был+а в Москв+е.|كانت في موسكو.","quiz":[["Он+а ___ кн+игу (قرأت).","чит+ала","чит+ал","чит+али"],["Мы ___ д+ома (كنا).","б+ыли","был","б+ыло"],["Вчер+а он ___ (عمل).","раб+отал","раб+отала","раб+отали"]]},{"title":"الزمن المستقبل","body":"<p>للأفعال الناقصة نستخدم [[быть]] بصيغة المستقبل + المصدر:</p>\n<table><tr><th>الضمير</th><th>المستقبل</th></tr>\n<tr><td>[[я]]</td><td>[[б+уду чит+ать]]</td></tr><tr><td>[[ты]]</td><td>[[б+удешь чит+ать]]</td></tr>\n<tr><td>[[он]] / [[он+а]]</td><td>[[б+удет чит+ать]]</td></tr><tr><td>[[мы]]</td><td>[[б+удем чит+ать]]</td></tr>\n<tr><td>[[вы]]</td><td>[[б+удете чит+ать]]</td></tr><tr><td>[[он+и]]</td><td>[[б+удут чит+ать]]</td></tr></table>\n<p class=\"tip\">ستتعلم في B1 أن الأفعال التامة تصنع المستقبل بطريقة أخرى: [[я прочит+аю]] (سأقرأه حتى النهاية).</p>","ex":"З+автра я б+уду раб+отать.|غداً سأعمل.\nМы б+удем ж+ить в Москв+е.|سنعيش في موسكو.\nТы б+удешь чай?|هل ستشرب شاياً؟","quiz":[["З+автра мы ___ раб+отать.","б+удем","б+уду","б+удут"],["Он+и ___ чит+ать.","б+удут","б+удет","б+удешь"]]}],"readings":[{"title":"Поездка в Самарк+анд","tr":"رحلة إلى سمرقند","sents":"В пр+ошлую субб+оту мы с друзь+ями +ездили в Самарк+анд.|يوم السبت الماضي ذهبتُ مع أصدقائي إلى سمرقند.\nМы +ехали на п+оезде два час+а.|سافرنا بالقطار ساعتين.\nПог+ода был+а отл+ичная: св+етило с+олнце, и б+ыло тепл+о.|كان الطقس ممتازاً: الشمس مشرقة والجو دافئ.\nМы гул+яли по г+ороду и фотограф+ировали ст+арые зд+ания.|تجوّلنا في المدينة وصوّرنا المباني القديمة.\nПот+ом мы +ели плов в рестор+ане.|ثم أكلنا البلوف في مطعم.\n+Это б+ыло +очень вк+усно!|كان لذيذاً جداً!\nВ+ечером мы верн+улись в Ташк+ент.|في المساء عدنا إلى طشقند.\nЯ обяз+ательно по+еду туд+а ещё раз.|سأذهب إلى هناك مرة أخرى بالتأكيد.","gloss":"прошлую|الماضية\nсубботу|السبت\nдрузьями|الأصدقاء (مع)\nездили|ذهبنا (بوسيلة نقل)\nсамарканд|سمرقند\nехали|سافرنا / كنا نركب\nпоезде|القطار\nдва|اثنان\nчаса|ساعة/ساعتان\nпогода|الطقس\nотличная|ممتازة\nсветило|كانت تشرق\nсолнце|الشمس\nтепло|دافئ\nгуляли|تجوّلنا / تنزّهنا\nгороду|المدينة (في أنحاء)\nфотографировали|صوّرنا\nстарые|القديمة\nздания|المباني\nели|أكلنا\nплов|بلوف (أرز أوزبكي)\nресторане|مطعم\nвкусно|لذيذ\nвечером|في المساء\nвернулись|عدنا\nташкент|طشقند\nобязательно|بالتأكيد\nпоеду|سأذهب\nтуда|إلى هناك\nраз|مرة"},{"title":"Мо+и в+ыходные","tr":"عطلتي","sents":"В субб+оту я просн+улся п+оздно, в д+есять час+ов.|يوم السبت استيقظت متأخرا، في الساعة العاشرة.\nЯ поз+автракал и позвон+ил др+угу.|تناولت الفطور واتصلت بصديقي.\nМы реш+или пойт+и в п+арк.|قررنا أن نذهب إلى الحديقة.\nПог+ода был+а прекр+асная: тепл+о и с+олнечно.|كان الطقس رائعا: دافئا ومشمسا.\nВ п+арке мы гул+яли и +ели мор+оженое.|في الحديقة تمشينا وأكلنا المثلجات.\nПот+ом мы пошл+и в кин+о.|ثم ذهبنا إلى السينما.\nФильм был смешн+ой, и мы мн+ого сме+ялись.|كان الفيلم مضحكا وضحكنا كثيرا.\nВ воскрес+енье я убр+ал кварт+иру и пригот+овил об+ед.|يوم الأحد نظفت الشقة وحضرت الغداء.\nВ+ечером ко мне пришл+и род+ители.|في المساء جاء والداي لزيارتي.\nМы п+или чай и говор+или о семь+е.|شربنا الشاي وتحدثنا عن العائلة.\n+Это б+ыли отл+ичные в+ыходные.|كانت عطلة رائعة.","gloss":""},{"title":"В аэроп+орту","tr":"في المطار","sents":"На пр+ошлой нед+еле я лет+ал в Москв+у.|في الأسبوع الماضي سافرت بالطائرة إلى موسكو.\nЯ при+ехал в аэроп+орт за два час+а до в+ылета.|وصلت إلى المطار قبل الرحلة بساعتين.\nСнач+ала я сдал чемод+ан.|أولا سلمت حقيبة السفر.\nПот+ом я показ+ал п+аспорт и бил+ет.|ثم أظهرت جواز السفر والتذكرة.\nСамолёт опозд+ал на час.|تأخرت الطائرة ساعة.\nЯ сид+ел в каф+е, пил к+офе и чит+ал кн+игу.|جلست في مقهى وشربت القهوة وقرأت كتابا.\nПолёт продолж+ался три час+а.|استغرقت الرحلة ثلاث ساعات.\nВ Москв+е б+ыло х+олодно, шёл снег.|كان الجو باردا في موسكو وكان الثلج يتساقط.\nХорош+о, что я взял тёплую к+уртку!|من الجيد أنني أخذت سترة دافئة!","gloss":""},{"title":"Проф+ессия мечт+ы","tr":"مهنة الأحلام","sents":"Мо+я сестр+а Л+ейла раб+отает врач+ом.|أختي ليلى تعمل طبيبة.\nЕщё в шк+оле он+а хот+ела помог+ать л+юдям.|منذ المدرسة كانت تريد مساعدة الناس.\nОн+а уч+илась в университ+ете шесть лет.|درست في الجامعة ست سنوات.\nТеп+ерь он+а раб+отает в больш+ой больн+ице.|الآن تعمل في مستشفى كبير.\nЕё раб+очий день начин+ается в семь +утра.|يبدأ يوم عملها في السابعة صباحا.\nИногд+а он+а раб+отает и н+очью.|أحيانا تعمل في الليل أيضا.\nРаб+ота тр+удная, но интер+есная.|العمل صعب لكنه ممتع.\nЛ+ейла говор+ит, что +это её призв+ание.|تقول ليلى إن هذه رسالتها في الحياة.","gloss":""}],"dialogues":[{"title":"في متجر الملابس","lines":"A|Здр+авствуйте! Вам пом+очь?|مرحباً! هل أساعدك؟\nB|Да, я ищ+у тёплую к+уртку.|نعم، أبحث عن سترة دافئة.\nA|Как+ой у вас разм+ер?|ما مقاسك؟\nB|С+орок восьм+ой.|ثمانية وأربعون.\nA|Вот, посмотр+ите. +Эта к+уртка +очень попул+ярная.|تفضّل، انظر. هذه السترة رائجة جداً.\nB|М+ожно прим+ерить?|هل يمكنني قياسها؟\nA|Кон+ечно, прим+ерочная там.|طبعاً، غرفة القياس هناك.\nB|Отл+ично, мне подх+одит. Ск+олько он+а ст+оит?|ممتاز، تناسبني. كم سعرها؟\nA|Пять т+ысяч рубл+ей.|خمسة آلاف روبل.\nB|Я возьм+у. М+ожно к+артой?|سآخذها. هل يمكن الدفع بالبطاقة؟"},{"title":"في الفندق","lines":"A|Здр+авствуйте! У мен+я бр+онь на +имя Ахм+ад.|مرحبا! عندي حجز باسم أحمد.\nB|Д+обрый день! Ваш п+аспорт, пож+алуйста.|نهارك سعيد! جواز سفرك من فضلك.\nA|Вот, пож+алуйста.|تفضل.\nB|Ваш н+омер на тр+етьем этаж+е. Вот ключ.|غرفتك في الطابق الثالث. هذا هو المفتاح.\nA|Во ск+олько з+автрак?|متى الفطور؟\nB|С сем+и до десят+и в рестор+ане.|من السابعة حتى العاشرة في المطعم.\nA|А в н+омере есть интерн+ет?|هل يوجد إنترنت في الغرفة؟\nB|Да, пар+оль на к+арточке.|نعم، كلمة المرور على البطاقة.\nA|Спас+ибо!|شكرا!\nB|При+ятного +отдыха!|إقامة سعيدة!"},{"title":"خطط للعطلة","lines":"A|Что ты д+елаешь в субб+оту?|ماذا ستفعل يوم السبت؟\nB|Пок+а не зн+аю. А что?|لا أعرف بعد. لماذا؟\nA|Дав+ай пойдём в г+оры!|لنذهب إلى الجبال!\nB|Хор+ошая ид+ея. А как+ая б+удет пог+ода?|فكرة جيدة. وكيف سيكون الطقس؟\nA|Говор+ят, б+удет с+олнечно.|يقولون إنه سيكون مشمسا.\nB|Отл+ично! Во ск+олько встр+етимся?|ممتاز! متى نلتقي؟\nA|В в+осемь +утра у метр+о.|في الثامنة صباحا عند المترو.\nB|Договор+ились. Я возьм+у в+оду и бутербр+оды.|اتفقنا. سأحضر الماء والشطائر."},{"title":"عند الطبيب","lines":"A|Что с в+ами?|ما بك؟\nB|У мен+я к+ашель и н+асморк.|عندي سعال وزكام.\nA|Температ+ура есть?|هل عندك حمى؟\nB|Да, вчер+а был+а тр+идцать в+осемь.|نعم، كانت أمس ثمانية وثلاثين.\nA|+Это прост+уда. П+ейте мн+ого тёплого ч+ая.|هذا زكام. اشرب كثيرا من الشاي الدافئ.\nB|А табл+етки н+ужно?|وهل أحتاج إلى حبوب؟\nA|Да, вот рец+епт. Три р+аза в день.|نعم، هذه وصفة. ثلاث مرات يوميا.\nB|Спас+ибо, д+октор.|شكرا يا دكتور."}]},"B1":{"vocab":[{"t":"العمل","w":"💰|зарпл+ата|راتب\n👔|нач+альник|مدير / رئيس\n🤝|колл+ега|زميل\n🗂️|собес |دعيت إلى مقابلة عمل.\nУ вас есть +опыт раб+оты?|هل لديك خبرة في العمل؟\nКак+ая зарпл+ата на +этой д+олжности?|كم الراتب في هذا المنصب؟\nЯ бер+у +отпуск в и+юле.|سآخذ إجازة في يوليو.\nМо+и колл+еги +очень дружел+юбные.|زملائي ودودون جدا.\nОн+а сд+елала хор+ошую карь+еру.|حققت مسيرة مهنية جيدة.\nЯ уч+усь на тр+етьем к+урсе.|أدرس في السنة الثالثة.\nЗ+автра у мен+я экз+амен по ист+ории.|غدا عندي امتحان في التاريخ.\nЯ сдал экз+амен на пятёрку!|نجحت في الامتحان بعلامة ممتازة!\nПреподав+атель +очень пон+ятно объясн+яет.|المحاضر يشرح بوضوح شديد.\nЯ жив+у в общеж+итии.|أسكن في سكن طلابي.\nМне н+ужен хор+оший слов+арь.|أحتاج قاموسا جيدا.\nЯ хоч+у стать перев+одчиком.|أريد أن أصبح مترجما.\nКак+ой предм+ет теб+е нр+авится б+ольше всег+о?|أي مادة تعجبك أكثر من غيرها؟\nБез зн+аний тр+удно найт+и раб+оту.|من دون معرفة يصعب إيجاد عمل.\nУ мен+я аллерг+ия на ор+ехи.|عندي حساسية من المكسرات.\nВрач в+ыписал мне лек+арство.|وصف لي الطبيب دواء.\nПриним+айте +это лек+арство п+осле ед+ы.|تناول هذا الدواء بعد الأكل.\nМне н+адо сдать ан+ализ кр+ови.|يجب أن أجري تحليل دم.\nУ д+едушки выс+окое давл+ение.|عند جدي ضغط دم مرتفع.\nОн слом+ал н+огу, кат+аясь на л+ыжах.|كسر رجله وهو يتزلج.\nКур+ить вр+едно для здор+овья.|التدخين مضر بالصحة.\nЯ д+елаю зар+ядку к+аждое +утро.|أمارس التمارين كل صباح.\nЯ на ди+ете, по+этому не ем сл+адкое.|أنا أتبع حمية، لذلك لا آكل الحلوى.\nБерег+ите себ+я!|اعتن بنفسك!\nЯ заб+ыл пар+оль от п+очты.|نسيت كلمة مرور بريدي.\nСкач+ай +это прилож+ение, он+о +очень пол+езное.|نزل هذا التطبيق، إنه مفيد جدا.\nУ мен+я сел телеф+он.|نفدت بطارية هاتفي.\nГде м+ожно заряд+ить телеф+он?|أين يمكنني شحن هاتفي؟\nПришл+и мне файл по п+очте.|أرسل لي الملف بالبريد.\nЗдесь пл+охо раб+отает интерн+ет.|الإنترنت ضعيف هنا.\nНе заб+удь сохран+ить докум+ент.|لا تنس أن تحفظ المستند.\nЯ ч+асто чит+аю н+овости в соцс+етях.|أقرأ الأخبار غالبا في شبكات التواصل.\nОн+а +очень терпел+ивая.|هي صبورة جدا.\nМой брат упр+ямый, как осёл.|أخي عنيد مثل الحمار.\nНе будь так+им лен+ивым!|لا تكن كسولا هكذا!\nЯ н+ервничаю п+еред выступл+ением.|أنا متوتر قبل العرض.\nОн+а был+а в вост+орге от под+арка.|كانت مسرورة جدا بالهدية.\nМне ст+ыдно за своё повед+ение.|أنا خجل من تصرفي.\nЯ на теб+я не серж+усь.|لست غاضبا منك.\nМы приглас+или на св+адьбу сто гост+ей.|دعونا مئة ضيف إلى حفل الزفاف.\nПоздравл+яю теб+я с днём рожд+ения!|أهنئك بعيد ميلادك!\nОн+и посс+орились из-за пустяк+а.|تشاجرا بسبب أمر تافه.\nМы др+ужим с д+етства.|نحن أصدقاء منذ الطفولة.\nСпас+ибо за подд+ержку.|شكرا على دعمك.\nПрош+у прощ+ения, я был непр+ав.|أعتذر، كنت مخطئا.\nЯ хоч+у откр+ыть счёт в б+анке.|أريد أن أفتح حسابا في البنك.\nКак+ой сег+одня курс д+оллара?|كم سعر صرف الدولار اليوم؟\nЯ плач+у за кварт+иру к+аждый м+есяц.|أدفع إيجار الشقة كل شهر.\nМы к+опим на н+овую маш+ину.|ندخر لشراء سيارة جديدة.\nЯ потр+атил вс+е д+еньги.|أنفقت كل النقود.\nТы м+ожешь дать мне в долг?|هل يمكنك أن تقرضني؟\nБанком+ат не раб+отает.|الصراف الآلي لا يعمل.\nМы сним+аем кварт+иру в ц+ентре.|نستأجر شقة في وسط المدينة.\nНаш дом на п+ятом этаж+е.|بيتنا في الطابق الخامس.\nЛифт оп+ять сл+оман.|المصعد معطل مرة أخرى.\nВ кварт+ире д+елают рем+онт.|يرممون الشقة.\nМы пере+ехали в н+овый рай+он.|انتقلنا إلى حي جديد.\nЗим+ой у нас хор+ошее отопл+ение.|عندنا تدفئة جيدة في الشتاء.\n+Если б+удет вр+емя, я теб+е позвон+ю.|إذا كان عندي وقت سأتصل بك.\nЯ д+умаю, что ты прав.|أظن أنك على حق.\nЯ не согл+асен.|أنا لست موافقا.\nМне к+ажется, что б+удет дождь.|يبدو لي أنها ستمطر.\nЯ над+еюсь, что всё б+удет хорош+о.|آمل أن يكون كل شيء بخير.\nЯ давн+о мечт+аю побыв+ать в Яп+онии.|أحلم منذ زمن بزيارة اليابان.\nОбъясн+и, пож+алуйста, ещё раз.|اشرح من فضلك مرة أخرى.\nЯ не п+омню, где ост+авил ключ+и.|لا أتذكر أين تركت المفاتيح.\nОн предлож+ил мне п+омощь.|عرض علي المساعدة.\nОн+а отказ+алась от приглаш+ения.|رفضت الدعوة.\nНам н+адо договор+иться о встр+ече.|يجب أن نتفق على موعد.\nМы +ездили в Каз+ань на маш+ине.|ذهبنا إلى قازان بالسيارة.\nОн пришёл дом+ой п+оздно.|عاد إلى البيت متأخرا.\nЯ чит+ал весь в+ечер.|كنت أقرأ طوال المساء.\nЯ сд+елаю +это з+автра.|سأفعل ذلك غدا.\nОн д+олго иск+ал раб+оту и након+ец нашёл.|بحث عن عمل طويلا وأخيرا وجد.\nВ н+ашем г+ороде нет м+оря.|لا يوجد بحر في مدينتنا.\nМне нр+авится мо+я н+овая раб+ота.|يعجبني عملي الجديد.\nМне н+ужно б+ольше вр+емени.|أحتاج إلى وقت أكثر.\nЯ позвон+ю м+аме в+ечером.|سأتصل بأمي في المساء.\nПомог+и мне, пож+алуйста.|ساعدني من فضلك.\nЯ интерес+уюсь ист+орией.|أهتم بالتاريخ.\nОн+а заним+ается т+анцами.|هي تمارس الرقص.\nЯ пиш+у р+учкой.|أكتب بالقلم.\nЯ пью чай с лим+оном.|أشرب الشاي بالليمون.\nЧ+ем ты заним+аешься в своб+одное вр+емя?|ماذا تفعل في وقت فراغك؟\nМне нр+авится гул+ять по ст+арому г+ороду.|أحب التجول في المدينة القديمة.\nЧт+обы в+ыучить яз+ык, н+ужно мн+ого практик+оваться.|لتتعلم لغة يجب أن تتدرب كثيرا.\nЯ д+елаю ош+ибки, но не бо+юсь говор+ить.|أرتكب أخطاء لكني لا أخاف من الكلام.","grammar":[{"title":"حالة الإضافة (Родительный падеж)","body":"<p>تُستخدم في معانٍ كثيرة، أهمها:</p>\n<p><b>1. الملكية والإضافة</b> (مثل «كتابُ الطالبِ»): [[кн+ига студ+ента]].</p>\n<p><b>2. النفي بـ [[нет]]</b> (لا يوجد): [[У мен+я нет маш+ины.]]</p>\n<p><b>3. بعد الأعداد:</b> 2، 3، 4 + مفرد بالإضافة: [[два час+а]]؛ 5 فما فوق + جمع بالإضافة: [[пять час+ов]].</p>\n<p><b>4. بعد حروف</b> [[из]]، [[от]]، [[до]]، [[без]]، [[у]]: [[чай без с+ахара]].</p>\n<table><tr><th>الرفع</th><th>الإضافة</th></tr>\n<tr><td>[[брат]]</td><td>[[бр+ата]] (‎-а)</td></tr><tr><td>[[м+ама]]</td><td>[[м+амы]] (‎-ы)</td></tr>\n<tr><td>[[кн+ига]]</td><td>[[кн+иги]] (‎-и)</td></tr><tr><td>[[м+оре]]</td><td>[[м+оря]] (‎-я)</td></tr></table>","ex":"У мен+я нет вр+емени.|ليس لدي وقت.\nСтак+ан вод+ы, пож+алуйста.|كأس ماء من فضلك.\nЯ из Иорд+ании.|أنا من الأردن.\nПять лет.|خمس سنوات.","quiz":[["У мен+я нет ___.","маш+ины","маш+ина","маш+ину"],["Два ___ (ساعتان).","час+а","час+ов","час"],["Чай без ___.","с+ахара","с+ахар","с+ахаром"]]},{"title":"وجه الفعل: الناقص والتام","body":"<p>أغلب الأفعال الروسية تأتي <b>زوجين</b>:</p>\n<table><tr><th>ناقص (العملية، التكرار)</th><th>تام (النتيجة، مرة واحدة)</th></tr>\n<tr><td>[[чит+ать]]</td><td>[[прочит+ать]]</td></tr>\n<tr><td>[[д+елать]]</td><td>[[сд+елать]]</td></tr>\n<tr><td>[[пис+ать]]</td><td>[[напис+ать]]</td></tr>\n<tr><td>[[покуп+ать]]</td><td>[[куп+ить]]</td></tr>\n<tr><td>[[говор+ить]]</td><td>[[сказ+ать]]</td></tr></table>\n<p><b>الناقص:</b> كنت أقرأ / أقرأ عادة: [[Я чит+ал весь в+ечер.]]</p>\n<p><b>التام:</b> قرأتُه وأنهيته: [[Я прочит+ал кн+игу.]] — ومضارعه يعني المستقبل: [[Я прочит+аю.]] (سأقرأه).</p>","ex":"Я к+аждый день пиш+у письм+о.|أكتب رسالة كل يوم.\nЯ напис+ал письм+о.|كتبت الرسالة (أنهيتها).\nЧто ты д+елаешь?|ماذا تفعل؟\nЯ сд+елаю +это з+автра.|سأفعل هذا غداً.","quiz":[["Я уж+е ___ +эту кн+игу (أنهيته).","прочит+ал","чит+ал","чит+аю"],["Я к+аждый день ___ газ+ету (عادة).","чит+аю","прочит+аю","прочит+ал"]]},{"title":"أفعال الحركة","body":"<p>للذهاب فعلان في الروسية: <b>مشياً</b> و<b>بوسيلة نقل</b>، ولكلٍّ منهما صيغتان:</p>\n<table><tr><th></th><th>اتجاه واحد / الآن</th><th>ذهاب وعودة / عادة</th></tr>\n<tr><td>مشياً</td><td>[[идт+и]]: я ид+у</td><td>[[ход+ить]]: я хож+у</td></tr>\n<tr><td>بوسيلة نقل</td><td>[[+ехать]]: я +еду</td><td>[[+ездить]]: я +езжу</td></tr></table>\n<p>[[Сейч+ас я ид+у в шк+олу.]] الآن أنا في الطريق إلى المدرسة.</p>\n<p>[[Я к+аждый день хож+у в шк+олу.]] أذهب إلى المدرسة كل يوم (عادة).</p>","ex":"Куд+а ты ид+ёшь?|إلى أين تذهب (الآن)؟\nЯ +еду на раб+оту на метр+о.|أنا ذاهب إلى العمل بالمترو.\nМы ч+асто +ездим в Самарк+анд.|نحن نسافر إلى سمرقند كثيراً.","quiz":[["Сейч+ас я ___ в магаз+ин (مشياً).","ид+у","хож+у","+езжу"],["Я к+аждый день ___ на раб+оту на маш+ине.","+езжу","+еду","ид+у"]]},{"title":"حالة المُعطى إليه (Дательный падеж)","body":"<p>تُستخدم مع من نُعطيه أو نتصل به أو نُساعده، ومع تعابير الشعور والحاجة:</p>\n<table><tr><th>الضمير</th><th>الحالة</th></tr>\n<tr><td>[[я]]</td><td>[[мне]]</td></tr><tr><td>[[ты]]</td><td>[[теб+е]]</td></tr><tr><td>[[он]]</td><td>[[ем+у]]</td></tr><tr><td>[[он+а]]</td><td>[[ей]]</td></tr><tr><td>[[мы]]</td><td>[[нам]]</td></tr><tr><td>[[он+и]]</td><td>[[им]]</td></tr></table>\n<p>تعابير مهمة: [[мне нр+авится]] (يعجبني)، [[мне н+ужно]] (أحتاج)، [[мне х+олодно]] (أشعر بالبرد)، [[мне дв+адцать лет]] (عمري عشرون).</p>\n<p>الأسماء: ‎-у للمذكر: [[бр+ату]]، ‎-е للمؤنث: [[м+аме]].</p>","ex":"Я позвон+ю м+аме.|سأتصل بأمي.\nЕм+у н+ужно лек+арство.|هو يحتاج دواءً.\nНам нр+авится Ташк+ент.|تعجبنا طشقند.","quiz":[["___ нр+авится м+узыка (يعجبني).","Мне","Я","Мен+я"],["Я позвон+ю ___ (لأمي).","м+аме","м+аму","м+ама"]]}],"readings":[{"title":"Раб+ота мечт+ы","tr":"وظيفة الأحلام","sents":"Мой друг Серг+ей д+олго иск+ал раб+оту.|صديقي سيرغي بحث عن عمل طويلاً.\nОн отпр+авил резюм+е в д+есять комп+аний, но ем+у никт+о не отв+етил.|أرسل سيرته الذاتية إلى عشر شركات، لكن لم يردّ عليه أحد.\nНакон+ец ег+о приглас+или на собес+едование.|أخيراً دُعي إلى مقابلة عمل.\nОн +очень волнов+ался, но отв+етил на все вопр+осы.|كان قلقاً جداً، لكنه أجاب على كل الأسئلة.\nЧ+ерез нед+елю ем+у позвон+или и сказ+али, что раб+ота ег+о.|بعد أسبوع اتصلوا به وقالوا إن الوظيفة له.\nТеп+ерь Серг+ей раб+отает программ+истом и дов+олен сво+ей зарпл+атой.|الآن يعمل سيرغي مبرمجاً وهو راضٍ عن راتبه.","gloss":"друг|صديق\nсергей|سيرغي (اسم)\nдолго|طويلاً\nискал|بحث / كان يبحث\nработу|عملاً\nотправил|أرسل\nрезюме|سيرة ذاتية\nдесять|عشرة\nкомпаний|شركات\nему|له\nникто|لا أحد\nответил|أجاب\nнаконец|أخيراً\nпригласили|دعَوه\nсобеседование|مقابلة عمل\nволновался|كان قلقاً\nвопросы|الأسئلة\nчерез|بعد / عبر\nнеделю|أسبوع\nпозвонили|اتصلوا\nсказали|قالوا\nработа|العمل / الوظيفة\nтеперь|الآن\nработает|يعمل\nпрограммистом|مبرمجاً\nдоволен|راضٍ\nзарплатой|الراتب"},{"title":"П+ервый раб+очий день","tr":"يوم العمل الأول","sents":"П+ервый раб+очий день — +это всегд+а волн+ительно.|يوم العمل الأول مثير دائما.\nЯ пришёл в +офис р+аньше всех, в в+осемь час+ов.|وصلت إلى المكتب قبل الجميع، في الثامنة.\nМен+я встр+етил нач+альник и познак+омил с колл+егами.|استقبلني المدير وعرفني إلى زملائي.\nВсе б+ыли +очень дружел+юбными.|كان الجميع ودودين جدا.\nМне показ+али моё раб+очее м+есто и компь+ютер.|أروني مكان عملي والحاسوب.\nСнач+ала я чит+ал докум+енты и изуч+ал про+екты.|في البداية قرأت المستندات ودرست المشاريع.\nВ об+ед мы вм+есте пошл+и в стол+овую.|في الغداء ذهبنا معا إلى المطعم.\nП+осле об+еда у нас б+ыло совещ+ание.|بعد الغداء كان عندنا اجتماع.\nЯ немн+ого н+ервничал, но всё прошл+о хорош+о.|كنت متوترا قليلا لكن كل شيء مر بخير.\nВ+ечером я уст+ал, но был дов+олен.|في المساء كنت متعبا لكني راض.\nЯ д+умаю, что мне здесь понр+авится.|أظن أن المكان سيعجبني.","gloss":""},{"title":"Здор+овый +образ ж+изни","tr":"نمط حياة صحي","sents":"Сейч+ас мн+огие л+юди д+умают о здор+овье.|يفكر كثير من الناس اليوم في صحتهم.\nВрач+и сов+етуют б+ольше дв+игаться.|ينصح الأطباء بالحركة أكثر.\nПол+езно ход+ить пешк+ом хот+я бы полчас+а в день.|من المفيد المشي نصف ساعة يوميا على الأقل.\nТ+акже в+ажно пр+авильно пит+аться.|من المهم أيضا أن نأكل بشكل صحيح.\nН+ужно есть б+ольше овощ+ей и фр+уктов.|يجب أكل المزيد من الخضار والفواكه.\nЛ+учше пить в+оду, а не сл+адкие нап+итки.|الأفضل شرب الماء لا المشروبات الحلوة.\nСон т+оже +очень в+ажен.|النوم أيضا مهم جدا.\nВзр+ослому челов+еку н+ужно спать с+емь-в+осемь час+ов.|يحتاج الشخص البالغ إلى النوم سبع إلى ثماني ساعات.\nИ, кон+ечно, не н+адо кур+ить.|وطبعا لا ينبغي التدخين.\nЗдор+овье — +это с+амое гл+авное.|الصحة أهم شيء.","gloss":""},{"title":"Как я уч+у р+усский","tr":"كيف أتعلم الروسية","sents":"Я уч+у р+усский яз+ык уж+е год.|أتعلم اللغة الروسية منذ سنة.\nСнач+ала б+ыло +очень тр+удно.|في البداية كان الأمر صعبا جدا.\nЯ не поним+ал падеж+и и п+утал оконч+ания.|لم أفهم حالات الإعراب وكنت أخلط النهايات.\nПот+ом я н+ачал к+аждый день сл+ушать подк+асты.|ثم بدأت أستمع إلى البودكاستات كل يوم.\nЯ т+акже смотр+ю ф+ильмы с субт+итрами.|أشاهد أيضا الأفلام مع الترجمة.\nМне +очень помогл+и мо+и р+усские друзь+я.|ساعدني أصدقائي الروس كثيرا.\nОн+и исправл+яют мо+и ош+ибки и не сме+ются.|يصححون أخطائي ولا يضحكون.\nТеп+ерь я мог+у говор+ить в магаз+ине и на раб+оте.|الآن أستطيع الكلام في المتجر وفي العمل.\nГл+авное — не бо+яться ош+ибок.|الأهم ألا تخاف من الأخطاء.","gloss":""}],"dialogues":[{"title":"عند الطبيب","lines":"A|Здр+авствуйте! На что ж+алуетесь?|مرحباً! مِمَّ تشكو؟\nB|У мен+я бол+ит г+орло и голов+а.|يؤلمني حلقي ورأسي.\nA|Давн+о?|منذ متى؟\nB|Уж+е три дня. И вчер+а был+а температ+ура.|منذ ثلاثة أيام. وأمس كانت عندي حرارة.\nA|Откр+ойте рот, пож+алуйста. Да, г+орло кр+асное.|افتح فمك من فضلك. نعم، الحلق أحمر.\nB|+Это серьёзно?|هل هذا خطير؟\nA|Нет, не волн+уйтесь. Я в+ыпишу вам лек+арство.|لا، لا تقلق. سأكتب لك دواءً.\nB|Как ег+о приним+ать?|كيف آخذه؟\nA|Три р+аза в день п+осле ед+ы. И п+ейте б+ольше тёплой вод+ы.|ثلاث مرات يومياً بعد الأكل. واشرب ماءً دافئاً أكثر.\nB|Спас+ибо, д+октор!|شكراً يا دكتور!"},{"title":"مقابلة عمل","lines":"A|Расскаж+ите о себ+е, пож+алуйста.|حدثني عن نفسك من فضلك.\nB|Мен+я зов+ут Ом+ар. Я програм+ист, у мен+я пять лет +опыта.|اسمي عمر. أنا مبرمج ولدي خبرة خمس سنوات.\nA|Почем+у вы хот+ите раб+отать у нас?|لماذا تريد العمل عندنا؟\nB|В+аша комп+ания изв+естная, и мне интер+есны в+аши про+екты.|شركتكم مشهورة، ومشاريعكم تهمني.\nA|Как+ие у вас с+ильные ст+ороны?|ما نقاط قوتك؟\nB|Я отв+етственный и б+ыстро уч+усь.|أنا مسؤول وأتعلم بسرعة.\nA|Когд+а вы м+ожете нач+ать?|متى يمكنك أن تبدأ؟\nB|Со сл+едующего м+есяца.|من الشهر القادم.\nA|Хорош+о. Мы вам позвон+им.|حسنا. سنتصل بك."},{"title":"في البنك","lines":"A|Здр+авствуйте! Я хоч+у откр+ыть счёт.|مرحبا! أريد أن أفتح حسابا.\nB|Хорош+о. Ваш п+аспорт, пож+алуйста.|حسنا. جواز سفرك من فضلك.\nA|Вот. А к+арту м+ожно получ+ить ср+азу?|تفضل. وهل يمكنني الحصول على البطاقة فورا؟\nB|Нет, к+арта б+удет гот+ова ч+ерез нед+елю.|لا، ستكون البطاقة جاهزة بعد أسبوع.\nA|Ск+олько ст+оит обслуж+ивание?|كم تكلف الخدمة؟\nB|П+ервый год беспл+атно.|السنة الأولى مجانية.\nA|я мог+у помен+ять д+оллары?|ممتاز. وأيضا: هل يمكنني تبديل الدولارات؟\nB|Да, к+асса сл+ева.|نعم، الصندوق على اليسار."},{"title":"مشكلة في الشقة","lines":"A|Алл+о, +это хоз+яин кварт+иры?|ألو، هل أنت صاحب الشقة؟\nB|Да, сл+ушаю вас.|نعم، أسمعك.\nA|У нас не раб+отает отопл+ение, в кварт+ире +очень х+олодно.|التدفئة لا تعمل عندنا، والشقة باردة جدا.\nB|Пон+ятно. Давн+о?|فهمت. منذ متى؟\nA|Со вчер+ашнего в+ечера.|منذ مساء الأمس.\nB|Я пришл+ю м+астера з+автра +утром.|سأرسل عامل صيانة غدا صباحا.\nA|А сег+одня ник+ак нельз+я?|ألا يمكن اليوم؟\nB|Попр+обую. Я перезвон+ю вам ч+ерез час.|سأحاول. سأعاود الاتصال بك بعد ساعة."}]},"B2":{"vocab":[{"t":"المجتمع والسياسة","w":"🏙️|+общество|مجتمع\n🏛️|прав+ительство|حكومة\n⚖️|зак+он|قانون\n🗳️|в+ыборы|انتخابات\n📉|экон+омика|اقتصاد\n💸|инфл+яция|تضخّم\n🧑‍💼|безраб+отица|بطالة\n💼|б+изнес|أعمال تجارية"},{"t":"البيئة","w":"🌳|прир+ода|طبيعة\n🏭|загрязн+ение|تلوّث\n🌍|кл+имат|مناخ\n🗑️|м+усор|نفايات\n♻️|перераб+отка|إعادة تدوير\n⚡|эн+ергия|طاقة"},{"t":"الإعلام","w":"📰|н+овости|أخبار\n🗞️|стать+я|مقالة\n🎙️|журнал+ист|صحفي\n📢|рекл+ама|إعلان\n💭|мн+ение|رأي"},{"t":"مفاهيم عامة","w":"⚠️|пробл+ема|مشكلة\n💡|реш+ение|حلّ / قرار\n📈|разв+итие|تطوّر\n🤝|отнош+ения|علاقات\n🧭|отв+етственность|مسؤولية\n🚪|возм+ожность|فرصة / إمكانية\n✅|преим+ущество|ميزة\n❌|недост+аток|عيب / نقص\n🌀|вли+яние|تأثير\n⭐|к+ачество|جودة\n🔢|кол+ичество|كمية\n📜|усл+овие|شرط\n🫱|подд+ержка|دعم\n🎯|цель|هدف"},{"t":"المجتمع","w":"👥|насел+ение|سكان\n🧓|покол+ение|جيل\n⚖️|нер+авенство|عدم المساواة\n🤝|равнопр+авие|المساواة في الحقوق\n🏚️|б+едность|فقر\n💰|бог+атство|ثروة\n🌍|мигр+ация|هجرة\n🏘️|городск+ая жизнь|حياة المدن\n🎓|образов+ание|تعليم\n🛡️|безоп+асность|أمن\n🙋|волонтёр|متطوع\n🫶|благотвор+ительность|عمل خيري\n🧭|трад+иция|تقليد\n🕌|рел+игия|دين\n🗣️|общ+ественное мн+ение|الرأي العام\n👨‍👩‍👧|сем+ейные ц+енности|القيم العائلية\n🏥|здравоохран+ение|الرعاية الصحية\n👴|п+енсия|معاش تقاعدي"},{"t":"الاقتصاد والأعمال","w":"🏭|произв+одство|إنتاج\n📦|тов+ар|بضاعة\n💲|спр+ос|طلب\n🏷️|предлож+ение|عرض\n📈|пр+ибыль|ربح\n📉|уб+ыток|خسارة\n🏦|инвест+иции|استثمارات\n🧾|нал+ог|ضريبة\n🤝|сд+елка|صفقة\n🏢|предпри+ятие|مؤسسة\n👔|предприним+атель|رائد أعمال\n🌐|+экспорт|تصدير\n🚢|+импорт|استيراد\n🥇|конкур+енция|منافسة\n🛍️|потреб+итель|مستهلك\n💼|акцион+ер|مساهم\n📊|стат+истика|إحصاءات\n🧮|бухгалт+ерия|محاسبة"},{"  لا تُستخدم إلا مع ‎-ся: [[сме+яться]] يضحك، [[нр+авиться]] يُعجب.</p>","ex":"Я уч+усь в университ+ете.|أدرس في الجامعة.\nМы встр+етились в каф+е.|التقينا في المقهى.\nОн+а улыб+ается.|هي تبتسم.","quiz":[["Я ___ в университ+ете.","уч+усь","уч+у","уч+ит"],["Мы ___ в каф+е (التقينا).","встр+етились","встр+етили","встр+етим"]]},{"title":"حالة الأداة (Творительный падеж)","body":"<p>تُستخدم مع:</p>\n<p><b>1. حرف [[с]] بمعنى «مع»:</b> [[с др+угом]]، [[с м+амой]].</p>\n<p><b>2. المهنة بعد [[раб+отать]] و[[быть]] و[[стать]]:</b> [[Он раб+отает врач+ом.]]</p>\n<p><b>3. الأداة:</b> [[пис+ать ручк+ой]] (يكتب بالقلم).</p>\n<p><b>4. أفعال مثل</b> [[интересов+аться]] (يهتم بـ)، [[заним+аться]] (يمارس).</p>\n<table><tr><th>الرفع</th><th>الأداة</th></tr><tr><td>[[друг]]</td><td>[[др+угом]] (‎-ом)</td></tr><tr><td>[[м+ама]]</td><td>[[м+амой]] (‎-ой)</td></tr><tr><td>[[я]]</td><td>[[мной]]</td></tr><tr><td>[[ты]]</td><td>[[тоб+ой]]</td></tr></table>","ex":"Я пь+ю чай с молок+ом.|أشرب الشاي بالحليب.\nОн+а х+очет стать врач+ом.|تريد أن تصبح طبيبة.\nЯ заним+аюсь сп+ортом.|أمارس الرياضة.","quiz":[["Он раб+отает ___.","врач+ом","врач","врач+а"],["Я пь+ю ч+ай с ___.","молок+ом","молок+о","молок+а"]]},{"title":"الاسم الموصول «который»","body":"<p>[[кот+орый]] = الذي/التي. يأخذ <b>جنس وعدد</b> الاسم الذي يعود إليه، أما <b>حالته</b> فحسب دوره في الجملة الثانية:</p>\n<p>[[Челов+ек, кот+орый живёт р+ядом.]] الرجل الذي يسكن بجانبنا.</p>\n<p>[[Д+евушка, кот+орая раб+отает здесь.]] الفتاة التي تعمل هنا.</p>\n<p>[[Кн+ига, кот+орую я чит+аю.]] الكتاب الذي أقرؤه (مفعول به ← ‎-ую).</p>\n<p class=\"tip\">قبل [[кот+орый]] نضع دائماً فاصلة.</p>","ex":"Фильм, кот+орый я смотр+ел, был интер+есный.|الفيلم الذي شاهدته كان ممتعاً.\nДруг, кот+орому я позвон+ил, не отв+етил.|الصديق الذي اتصلت به لم يرد.","quiz":[["Д+евушка, ___ раб+отает здесь.","кот+орая","кот+орый","кот+орое"],["Кн+ига, ___ я чит+аю.","кот+орую","кот+орая","кот+орой"]]}],"readings":[{"title":"Г+ород б+удущего","tr":"مدينة المستقبل","sents":"Как+им б+удет г+ород б+удущего?|كيف ستكون مدينة المستقبل؟\nМн+огие эксп+ерты счит+ают, что в нём б+удет б+ольше з+елени и м+еньше маш+ин.|يرى كثير من الخبراء أنها ستضم خضرة أكثر وسيارات أقل.\nЛ+юди б+удут +ездить на электромоб+илях и велосип+едах.|سيتنقل الناس بالسيارات الكهربائية والدراجات.\nДом+а б+удут получ+ать эн+ергию от с+олнца и в+етра.|ستحصل البيوت على الطاقة من الشمس والريح.\nОдн+ако у +этой ид+еи есть и кр+итики.|لكن لهذه الفكرة منتقدون أيضاً.\nОн+и говор+ят, что так+ие технол+огии сл+ишком дорог+ие для б+едных стран.|يقولون إن هذه التقنيات مكلفة جداً للدول الفقيرة.\nСл+ожно сказ+ать, кто прав, но +ясно одн+о: г+ород д+олжен быть уд+обным для люд+ей.|من الصعب القول من على حق، لكن أمراً واحداً واضح: يجب أن تكون المدينة مريحة للناس.","gloss":"каким|كيف / بأي شكل\nбудет|سيكون\nгород|المدينة\nбудущего|المستقبل\nмногие|كثير من\nэксперты|الخبراء\nсчитают|يعتقدون\nнём|فيه / فيها\nбольше|أكثر\nзелени|الخضرة\nменьше|أقل\nмашин|سيارات\nлюди|الناس\nбудут|سوف\nездить|يتنقّلون\nэлектромобилях|السيارات الكهربائية\nвелосипедах|الدراجات\nдома|البيوت\nполучать|يحصلون على\nэнергию|الطاقة\nсолнца|الشمس\nветра|الريح\nоднако|لكن / غير أنّ\nэтой|هذه\nидеи|الفكرة\nкритики|منتقدون\nговорят|يقولون\nтакие|مثل هذه\nтехнологии|التقنيات\nслишком|أكثر من اللازم\nдорогие|غالية\nдля|من أجل / لـ\nбедных|الفقيرة\nстран|الدول\nсложно|صعب\nсказать|أن يقول\nправ|محق\nясно|واضح\nодно|أمر واحد\nдолжен|يجب\nбыть|أن يكون\nудобным|مريحاً\nлюдей|الناس"},{"title":"Г+ород б+удущего","tr":"مدينة المستقبل","sents":"Как+им б+удет г+ород б+удущего?|كيف ستكون مدينة المستقبل؟\nМн+огие эксп+ерты счит+ают, что в нём б+удет б+ольше з+елени и м+еньше маш+ин.|يرى كثير من الخبراء أنها ستضم خضرة أكثر وسيارات أقل.\nЛ+юди б+удут +ездить на электромоб+илях и велосип+едах.|سيتنقل الناس بالسيارات الكهربائية والدراجات.\nДом+а б+удут получ+ать эн+ергию от с+олнца и в+етра.|ستحصل البيوت على الطاقة من الشمس والرياح.\n+Умные сист+емы б+удут управл+ять св+етом и тепл+ом.|ستتحكم أنظمة ذكية في الإضاءة والتدفئة.\nОдн+ако у +эт говор+ила и мен+я.|في الشهر الماضي أقنعتني آنيا أيضا.\nТеп+ерь мы х+одим туд+а вм+есте.|الآن نذهب إلى هناك معا.\nЯ п+онял, что помог+ать друг+им — +это сч+астье.|فهمت أن مساعدة الآخرين سعادة.","gloss":""}],"dialogues":[{"title":"مقابلة عمل","lines":"A|Расскаж+ите немн+ого о себ+е.|حدّثنا قليلاً عن نفسك.\nB|Я ок+ончил университ+ет по специ+альности «экон+омика».|تخرّجت من الجامعة في تخصص الاقتصاد.\nB|Пять лет я раб+отал в междунар+одной комп+ании.|عملت خمس سنوات في شركة دولية.\nA|Почем+у вы хот+ите раб+отать у нас?|لماذا تريد العمل لدينا؟\nB|Мне интер+есна в+аша сф+ера, и я хоч+у разв+иваться.|يهمّني مجالكم وأريد أن أتطوّر.\nA|Как+ие у вас с+ильные ст+ороны?|ما نقاط قوّتك؟\nB|Я отв+етственный и ум+ею раб+отать в ком+анде.|أنا مسؤول وأجيد العمل ضمن فريق.\nA|А как+ие у вас сл+абые ст+ороны?|وما نقاط ضعفك؟\nB|Иногд+а я сл+ишком крит+ичен к себ+е.|أحياناً أنتقد نفسي أكثر من اللازم.\nA|Спас+ибо. Мы св+яжемся с в+ами в теч+ение нед+ели.|شكراً. سنتواصل معك خلال أسبوع."},{"title":"نقاش: المدينة أم الريف؟","lines":"A|Я бы хот+ел жить в дер+евне. Там т+ихо и ч+истый в+оздух.|أود أن أعيش في الريف. هناك هدوء وهواء نقي.\nB|Но в г+ороде б+ольше возм+ожностей.|لكن الفرص في المدينة أكثر.\nA|Как+их, наприм+ер?|مثل ماذا؟\nB|Раб+ота, хор+ошие шк+олы, больн+ицы, те+атры.|العمل والمدارس الجيدة والمستشفيات والمسارح.\nA|Согл+асен, но в г+ороде мн+ого стр+есса и пр+обок.|أوافق، لكن في المدينة ضغط وازدحام كثير.\nB|+Это пр+авда. М+ожет, л+учше всег+о жить в пр+игороде?|هذا صحيح. ربما الأفضل أن نعيش في الضاحية؟\nA|Хор+ошая ид+ея! И прир+ода р+ядом, и г+ород недалек+о.|فكرة جيدة! الطبيعة قريبة والمدينة ليست بعيدة.\nB|Вот и договор+ились.|إذن اتفقنا."},{"title":"بعد مشاهدة فيلم","lines":"A|Ну как теб+е фильм?|إذن، كيف وجدت الفيلم؟\nB|Ч+естно говор+я, я ожид+ал б+ольшего.|بصراحة، كنت أتوقع أكثر.\nA|Пр+авда? А мне понр+авилось. Акт+ёры игр+али прекр+асно.|حقا؟ أما أنا فأعجبني. أدى الممثلون أدوارهم بشكل رائع.\nB|С +этим я согл+асен. Но сюж+ет был сл+ишком предсказ+уемым.|أوافق على ذلك. لكن القصة كا ем не м+еньше, чем р+аньше, но чит+аем ин+аче.|نحن لا نقرأ أقل من ذي قبل، لكننا نقرأ بشكل مختلف.\nТ+ексты ст+али кор+оче, а вним+ание — рассе+яннее.|أصبحت النصوص أقصر والانتباه أكثر تشتتا.\nТак+им +образом, страд+ает не кол+ичество, а глубин+а чт+ения.|وبالتالي فإن الذي يتضرر ليس كمية القراءة بل عمقها.\nУчёные подчёркивают, что ум+ение сосредот+очиться — +это н+авык.|يؤكد العلماء أن القدرة على التركيز مهارة.\nКак и люб+ой н+авык, ег+о н+ужно трениров+ать.|ومثل أي مهارة، يجب تدريبها.\nНапр+имер, пол+езно чит+ать бум+ажные кн+иги без телеф+она р+ядом.|مثلا، من المفيد قراءة الكتب الورقية دون هاتف بالقرب.\nВ ц+елом, цифров+ые технол+огии сам+и по себ+е не вредн+ы.|بشكل عام، التقنيات الرقمية ليست ضارة في حد ذاتها.\nВсё зав+исит от тог+о, как мы их исп+ользуем.|كل شيء يعتمد على كيفية استخدامنا لها.","gloss":""},{"title":"Уст+ойчивое разв+итие","tr":"التنمية المستدامة","sents":"Пон+ятие уст+ойчивого разв+ития появ+илось в конц+е двадц+атого в+ека.|ظهر مفهوم التنمية المستدامة في نهاية القرن العشرين.\nЕг+о с+ущность прост+а: удовлетвор+ять потр+ебности сег+одняшнего дня, не вред+я б+удущим покол+ениям.|جوهره بسيط: تلبية احتياجات اليوم دون الإضرار بالأجيال القادمة.\nОдн+ако на пр+актике +это оказ+алось намн+ого сложн+ее.|غير أن ذلك تبين في الواقع أنه أصعب بكثير.\nЭконом+ический рост ч+асто вступ+ает в противор+ечие с охр+аной прир+оды.|كثيرا ما يتعارض النمو الاقتصادي مع حماية الطبيعة.\nТем не м+енее мн+огие стр+аны внедр+яют «зелёные» технол+огии.|ومع ذلك، تطبق دول كثيرة تقنيات «خضراء».\nКомп+ании т+оже уч+итывают эколог+ические ф+акторы.|تأخذ الشركات أيضا العوامل البيئية في الاعتبار.\nБезусл+овно, без уч+астия к+аждого из нас усп+еха не б+удет.|لا شك أنه لن يكون هناك نجاح من دون مشاركة كل واحد منا.","gloss":""},{"title":"Иск+усство сп+орить","tr":"فن الجدال","sents":"Ум+ение сп+орить — одн+о из важн+ейших в соврем+енном м+ире.|القدرة على الجدال من أهم القدرات في العالم المعاصر.\nЦель сп+ора — не побед+ить собес+едника, а прибл+изиться к +истине.|هدف الجدال ليس هزيمة المحاور بل الاقتراب من الحقيقة.\nПр+ежде всег+о, н+ужно вним+ательно в+ыслушать оппон+ента.|قبل كل شيء، يجب الإصغاء إلى المحاور بانتباه.\nЗат+ем сл+едует привод+ить аргум+енты, а не эм+оции.|بعد ذلك ينبغي تقديم الحجج لا العواطف.\nВ+ажно отлич+ать ф+акты от мн+ений.|من المهم التمييز بين الحقائق والآراء.\n+Если вы непр+авы, призн+айте +это — +это пр+изнак с+илы, а не сл+абости.|إذا كنت مخطئا فاعترف بذلك، فهذا علامة قوة لا ضعف.\nВ кон+ечном счёте хор+оший спор обогащ+ает +обе стор+оны.|في نهاية المطاف يثري الجدال الجيد الطرفين.","gloss":""}],"dialogues":[{"title":"نقاش: العمل عن بُعد","lines":"A|Как вы отн+оситесь к удалённой раб+оте?|ما رأيك في العمل عن بُعد؟\nB|С одн+ой сторон+ы, он+а экон+омит вр+емя.|من جهة، يوفّر الوقت.\nB|С друг+ой сторон+ы, л+юди тер+яют жив+ое общ+ение.|ومن جهة أخرى، يفقد الناس التواصل المباشر.\nA|Но иссл+едования пок+азывают, что продукт+ивность растёт.|لكن الدراسات تُظهر أن الإنتاجية ترتفع.\nB|Возм+ожно. Одн+ако не все м+огут организов+ать себ+я.|ربما. غير أنه ليس الجميع قادراً على تنظيم نفسه.\nA|Согл+асен. В+идимо, л+учше всег+о — гибр+идный форм+ат.|موافق. يبدو أن الأفضل هو النظام الهجين.\nB|Безусл+овно.|بلا شك."},{"title":"نقاش: الذكاء الاصطناعي","lines":"A|Как вы оц+ениваете вли+яние иск+усственного интелл+екта на р+ынок труд+а?|كيف تقيم تأثير الذكاء الاصطناعي على سوق العمل؟\nB|С одн+ой ст+ороны, он автоматиз+ирует рут+инные зад+ачи.|من جهة، يؤتمت المهام الروتينية.\nB|С друг+ой ст+ороны, появл+яются н+овые проф+ессии.|ومن جهة أخرى، تظهر مهن جديدة.\nA|Но не все усп+еют переуч+иться.|لكن ليس الجميع سيتمكن من إعادة التأهيل.\nB|Им+енно по+этому госуд+арство должн+о вкл+адывать в образов+ание.|لهذا السبب تحديدا يجب أن تستثمر الدولة في التعليم.\nA|Согл+асен, одн+ако +это тр+ебует вр+емени.|أوافق، غير أن ذلك يتطلب وقتا.\nB|Безусл+овно. По+этому начин+ать н+адо уж+е сег+одня.|بلا شك. لذلك يجب أن نبدأ اليوم."},{"title":"اجتماع عمل","lines":"A|Предлаг+аю перейт+и к гл+авному вопр+осу.|أقترح أن ننتقل إلى المسألة الرئيسية.\nB|Да, дав+айте обс+удим усл+овия д +арой +улице, звон колокол+ов, г+олос торг+овца на р+ынке.|رائحة المطر في شارع قديم، ورنين الأجراس، وصوت تاجر في السوق.\nВсё +это внез+апно всплыв+ает в п+амяти.|كل ذلك يطفو فجأة في الذاكرة.\nНостальг+ия — +это не пр+осто тоск+а по пр+ошлому.|الحنين ليس مجرد شوق إلى الماضي.\n+Это поп+ытка верн+уть ч+асть себ+я, кот+орая ост+алась там.|إنه محاولة لاستعادة جزء من ذاتك بقي هناك.\nВозвращ+аясь туд+а спуст+я г+оды, мы ч+асто не узнаём ни г+орода, ни себ+я.|عندما نعود إلى هناك بعد سنوات، كثيرا ما لا نتعرف على المدينة ولا على أنفسنا.\nИ всё же +эта встр+еча д+арит стр+анное умиротвор+ение.|ومع ذلك يمنح هذا اللقاء طمأنينة غريبة.","gloss":""}],"dialogues":[{"title":"حديث عن رواية","lines":"A|Ну что, дочит+ал ром+ан?|إذن، أنهيت الرواية؟\nB|Дочит+ал. Ч+естно говор+я, фин+ал мен+я обескур+ажил.|أنهيتها. بصراحة، النهاية أربكتني.\nA|Да уж, +автор л+юбит недоговорённости.|نعم فعلاً، المؤلف يحب ترك الأمور معلّقة.\nB|Вот-в+от. Всё д+ержится на подт+ексте.|بالضبط. كل شيء قائم على المعنى الضمني.\nA|Зат+о яз+ык как+ой! Не оторв+аться.|لكن يا لها من لغة! لا يمكن التوقف عن القراءة.\nB|Что пр+авда, то пр+авда.|هذا صحيح، لا جدال."},{"title":"حديث عن رواية","lines":"A|Ну что, дочит+ал ром+ан?|إذن، هل أنهيت الرواية؟\nB|Дочит+ал. Ч+естно говор+я, фин+ал мен+я обескур+ажил.|أنهيتها. بصراحة، النهاية أربكتني.\nA|Да уж, +автор л+юбит недоговорённости.|نعم فعلا، المؤلف يحب ترك الأمور معلقة.\nB|Вот-в+от. Всё д+ержится на подт+ексте.|بالضبط. كل شيء قائم على المعنى الضمني.\nA|Зат+о яз+ык как+ой! Не оторв+аться.|لكن يا لها من لغة! لا يمكن التوقف عن القراءة.\nB|Что пр+авда, то пр+авда.|هذا صحيح، لا جدال."},{"title":"خلاف بين صديقين","lines":"A|Ты на мен+я ещё об+ижен?|هل ما زلت مستاء مني؟\nB|Не то чт+обы об+ижен, скор+ее разочар+ован.|لست مستاء بقدر ما أنا خائب الأمل.\nA|Я поним+аю. Я погоряч+ился и сказ+ал л+ишнее.|أفهم. انفعلت وقلت ما لا ينبغي.\nB|Сл+ово — не вороб+ей, в+ылетит — не п+оймаешь.|الكلمة إذا خرجت لا تعود.\nA|Зн+аю. Прост+и мен+я, пож+алуйста.|أعرف. سامحني من فضلك.\nB|Л+адно, кто ст+арое пом+янет, том+у глаз вон.|حسنا، عفا الله عما سلف.\nA|Спас+ибо. Ты насто+ящий друг.|شكرا. أنت صديق حقيقي."},{"title":"في معرض فني","lines":"A|Что ск+ажешь об +этом полотн+е?|ما رأيك في هذه اللوحة؟\nB|Колор+ит пораз+ительный, но композ+иция, по-мо+ему, перегр+ужена.|الألوان مدهشة، لكن التكوين مزدحم في رأيي.\nA|А мне к+ажется, в +этом и з+амысел худ+ожника.|أما أنا فأظن أن هذه هي فكرة الرسام.\nB|Возм+ожно. Х+аос как отраж+ение эп+охи?|ربما. الفوضى كانعكاس للعصر؟\nA|Им+енно. Посмотр+и на мазк+и — ск+олько в них трев+оги.|بالضبط. انظر إلى ضربات الفرشاة، ما أكثر القلق فيها.\nB|Ты мен+я почт+и убед+ил.|لقد أقنعتني تقريبا."}]}}};
