lops, society changes too.|مع تطور التقنيات يتغير المجتمع أيضا.|По мере развития технологий меняется и общество.\nMoreover, prices continue to rise.|بل إن الأسعار تستمر في الارتفاع.|Более того, цены продолжают расти.\nIn particular, we are talking about young people.|على وجه الخصوص، الحديث عن الشباب.|В частности, речь идёт о молодёжи.\nOn the contrary, he was very pleased.|على العكس، كان راضيا جدا.|Напротив, он был очень доволен.\nUltimately, everything depends on us.|في نهاية المطاف كل شيء يتوقف علينا.|В конечном счёте всё зависит от нас.\nShe speaks Arabic without an accent.|تتكلم العربية دون لكنة.|Она говорит по-арабски без акцента.\nI'm used to expressing my thoughts clearly.|اعتدت أن أعبر عن أفكاري بوضوح.|Я привык выражать мысли чётко.\nOne should not underestimate resistance to change.|لا ينبغي الاستهانة بمقاومة التغيير.|Не стоит недооценивать сопротивление переменам.\nHis act cannot be justified.|لا يمكن تبرير تصرفه.|Его поступок нельзя оправдать.\nWe encountered unforeseen difficulties.|واجهنا صعوبات غير متوقعة.|Мы столкнулись с непредвиденными трудностями.\nSuch cases are not rare.|مثل هذه الحالات ليست نادرة.|Подобные случаи не редкость.\nHis views have changed over time.|تغيرت آراؤه مع الوقت.|Его взгляды со временем изменились.\nShe has always had a sense of humor.|تميزت دائما بحس الدعابة.|Она всегда отличалась чувством юмора.\nI value your opinion highly.|أقدر رأيك كثيرا.|Я высоко ценю ваше мнение.\nThis topic requires a separate discussion.|هذا الموضوع يتطلب نقاشا منفصلا.|Эта тема требует отдельного обсуждения.\nThe survey results turned out to be unexpected.|جاءت نتائج الاستطلاع غير متوقعة.|Результаты опроса оказались неожиданными.\nWe proceed from the assumption that all participants agree.|ننطلق من أن كل المشاركين موافقون.|Мы исходим из того, что все участники согласны.\nThese two phenomena are closely related.|هاتان الظاهرتان مرتبطتان ارتباطا وثيقا.|Эти два явления тесно связаны.\nScientists identified a pattern.|كشف العلماء عن نمط منتظم.|Учёные выявили закономерность.\nLife is not just work.|الحياة ليست عملا فقط.|Жизнь — это не только работа.\nHis conscience did not allow him to lie.|لم يسمح له ضميره بالكذب.|Совесть не позволила ему солгать.\nWisdom comes with experience.|الحكمة تأتي مع الخبرة.|Мудрость приходит с опытом.\nThe truth is somewhere in the middle.|الحقيقة في مكان ما في الوسط.|Истина где-то посередине.\nUrbanization leads to the growth of cities.|يؤدي التحضر إلى نمو المدن.|Урбанизация ведёт к росту городов.\nDigitalization has affected all spheres of life.|طالت الرقمنة كل مجالات الحياة.|Цифровизация затронула все сферы жизни.\nCybersecurity is becoming more and more relevant.|يزداد الأمن السيبراني أهمية.|Кибербезопасность становится всё актуальнее.\nPopulation aging is a challenge for the economy.|شيخوخة السكان تحد للاقتصاد.|Старение населения — вызов для экономики.\nTolerance is the basis of peaceful coexistence.|التسامح أساس التعايش السلمي.|Толерантность — основа мирного сосуществования.\nWithout developed infrastructure, growth is impossible.|لا يمكن النمو دون بنية تحتية متطورة.|Без развитой инфраструктуры рост невозможен.\nThe reform received a mixed reception.|قوبل الإصلاح بردود فعل متباينة.|Реформа была встречена неоднозначно.\nCivil society plays an important role.|يلعب المجتمع المدني دورا مهما.|Гражданское общество играет важную роль.\nDiscrimination is unacceptable.|التمييز غير مقبول.|Дискриминация недопустима.\nThe economic downturn affected many industries.|أثر الركود الاقتصادي على قطاعات كثيرة.|Экономический спад затронул многие отрасли.\nThe literacy of the population is constantly growing.|ترتفع نسبة المتعلمين بين السكان باستمرار.|Грамотность населения постоянно растёт.\nExperts differ in their opinions.|تختلف آراء الخبراء.|Эксперты расходятся во мнениях.\nSolidarity helped overcome the crisis.|ساعد التضامن على تجاوز الأزمة.|Солидарность помогла преодолеть кризис.\nHe became a victim of propaganda.|وقع ضحية للدعاية.|Он стал жертвой пропаганды.\nThe integration of migrants takes time.|يتطلب اندماج المهاجرين وقتا.|Интеграция мигрантов требует времени.\nInteraction with clients is the key to success.|التفاعل مع العملاء مفتاح النجاح.|Взаимодействие с клиентами — ключ к успеху.\nOne cannot reduce everything to economics.|لا يمكن اختزال كل شيء في الاقتصاد.|Нельзя сводить всё к экономике.\nThis problem is systemic in nature.|هذه المشكلة ذات طابع منهجي.|Данная проблема носит системный характер.\nWe are guided by the principle of openness.|نسترشد بمبدأ الانفتاح.|Мы руководствуемся принципом открытости.\nSumming up, I want to thank all participants.|وفي الختام أود أن أشكر جميع المشاركين.|Подводя итог, хочу поблагодарить всех участников.","grammar":[{"title":"الشرط الثالث والمختلط::Третий и смешанный тип условных","body":["<p><b>الثالث</b> (ماضٍ لم يحدث): [[If]] + [[had]] + تصريف ثالث، [[would have]] + تصريف ثالث.</p>\n<p>[[If I had studied, I would have passed.]] لو درست لنجحت (لكني لم أدرس).</p>\n<p><b>المختلط:</b> شرط في الماضي ونتيجة في الحاضر: [[If I had taken that job, I would be rich now.]]</p>","<p><b>Третий тип</b> (нереальное прошлое): [[If]] + [[had]] + 3-я форма, [[would have]] + 3-я форма.</p>\n<p>[[If I had studied, I would have passed.]] Если бы я занимался, я бы сдал (но не занимался).</p>\n<p><b>Смешанный:</b> условие в прошлом, результат в настоящем: [[If I had taken that job, I would be rich now.]]</p>"],"ex":"If we had left earlier, we wouldn't have missed the train.|لو غادرنا أبكر لما فاتنا القطار.|Если бы мы вышли раньше, мы бы не опоздали на поезд.","quiz":[["If I had known, I ___ have told you.","would","will","had"],["If she ___ harder, she would have passed.","had studied","studied","would study"]]},{"title":"القلب (التقديم والتأخير)::Инверсия","body":["<p>في الأسلوب الأدبي والرسمي نقدّم الفعل المساعد بعد كلمات النفي والتقييد للتوكيد:</p>\n<p>[[Never have I seen...]]، [[Rarely do we...]]، [[Not only did he..., but...]]، [[Hardly had I arrived when...]]</p>\n<p class=\"tip\">الترتيب مثل السؤال تماماً: فعل مساعد + فاعل + فعل.</p>","<p>В формальном и литературном стиле после отрицательных и ограничительных наречий вспомогательный глагол выходит вперёд — для эмфазы:</p>\n<p>[[Never have I seen...]], [[Rarely do we...]], [[Not only did he..., but...]], [[Hardly had I arrived when...]]</p>\n<p class=\"tip\">Порядок как в вопросе: вспомогательный глагол + подлежащее + глагол.</p>"],"ex":"Not only did he win, but he also broke the record.|لم يفُز فقط، بل حطّم الرقم القياسي أيضاً.|Он не только победил, но и побил рекорд.","quiz":[["Never ___ I seen such a view.","have","I have","did"],["Rarely ___ we go out these days.","do","we do","are"]]}],"readings":[{"title":"Reading in the Digital Age","tr":"القراءة في العصر الرقمي::Чтение в цифровую эпоху","sents":"Recently, many people have complained that nobody reads anymore.|في الآونة الأخيرة اشتكى كثيرون من أن لا أحد يقرأ بعد الآن.|В последнее время многие жалуются, что никто больше не читает.\nHowever, research reveals a more complex picture.|غير أن الأبحاث تكشف صورة أكثر تعقيداً.|Однако исследования показывают более сложную картину.\nWe read no less than before, but we read differently: in short bursts, quickly, and on screens.|نحن لا نقرأ أقل من ذي قبل، لكننا نقرأ بشكل مختلف: بدفعات قصيرة وبسرعة وعلى الشاشات.|Мы читаем не меньше, чем раньше, но иначе: урывками, быстро и с экрана.\nConsequently, it is not the quantity but the depth of reading that suffers.|وبالتالي فإن الذي يتضرّر ليس كمية القراءة بل عمقها.|Следовательно, страдает не количество, а глубина чтения.\nScientists emphasize that the ability to concentrate is a skill that must be trained.|يؤكد العلماء أن القدرة على التركيز مهارة يجب تدريبها.|Учёные подчёркивают, что умение сосредоточиться — навык, который нужно тренировать.","gloss":"recently|مؤخراً|недавно\ncomplained|اشتكوا|жаловались\nnobody|لا أحد|никто\nreads|يقرأ|читает\nanymore|بعد الآن|больше (не)\nresearch|الأبحاث|исследования\nreveals|تكشف|показывает\ncomplex|معقّدة|сложная\npicture|صورة|картина\nless|أقل|меньше\nthan|من|чем\nbefore|سابقاً|раньше\ndifferently|بشكل مختلف|иначе\nshort|قصيرة|короткие\nbursts|دفعات|урывки\nquickly|بسرعة|быстро\nscreens|الشاشات|экраны\nconsequently|وبالتالي|следовательно\nquantity|الكمية|количество\ndepth|العمق|глубина\nreading|القراءة|чтение\nsuffers|يتضرّر|страдает\nscientists|العلماء|учёные\nemphasize|يؤكدون|подчёркивают\nability|القدرة|способность\nconcentrate|يركّز|сосредоточиться\nskill|مهارة|навык\nmust|يجب|должен\ntrained|مُدرَّب|тренироваться"},{"title":"Reading in the Digital Age","tr":"القراءة في العصر الرقمي::Чтение в цифровую эпоху","sents":"Lately many people complain that people have stopped reading.|يشكو كثيرون مؤخرا من أن الناس توقفوا عن القراءة.|В последнее время многие жалуются, что люди перестали читать.\nHowever, research shows a more complex picture.|غير أن الدراسات تظهر صورة أكثر تعقيدا.|Однако исследования показывают более сложную картину.\nWe read no less than before, but we read differently.|نحن لا نقرأ أقل من ذي قبل، لكننا نقرأ بشكل مختلف.|Мы читаем не меньше, чем раньше, но читаем иначе.\nTexts have become shorter, and attention more scattered.|أصبحت النصوص أقصر والانتباه أكثر تشتتا.|Тексты стали короче, а внимание — рассеяннее.\nThus, it is not the quantity but the depth of reading that suffers.|وبالتالي فإن الذي يتضرر ليس كمية القراءة بل عمقها.|Таким образом, страдает не количество, а глубина чтения.\nScientists emphasize that the ability to concentrate is a skill.|يؤكد العلماء أن القدرة على التركيز مهارة.|Учёные подчёркивают, что умение сосредоточиться — это навык.\nLike any skill, it needs to be trained.|ومثل أي مهارة، يجب تدريبها.|Как и любой навык, его нужно тренировать.\nFor example, it is useful to read paper books without a phone nearby.|مثلا، من المفيد قراءة الكتب الورقية دون هاتف بالقرب.|Например, полезно читать бумажные книги без телефона рядом.\nOn the whole, digital technologies are not harmful in themselves.|بشكل عام، التقنيات الرقمية ليست ضارة في حد ذاتها.|В целом, цифровые технологии сами по себе не вредны.\nEverything depends on how we use them.|كل شيء يعتمد على كيفية استخدامنا لها.|Всё зависит от того, как мы их используем.","gloss":""},{"title":"Sustainable Development","tr":"التنمية المستدامة::Устойчивое развитие","sents":"The concept of sustainable development appeared at the end of the twentieth century.|ظهر مفهوم التنمية المستدامة في نهاية القرن العشرين.|Понятие устойчивого развития появилось в конце двадцатого века.\nIts essence is simple: meet today's needs without harming future generations.|جوهره بسيط: تلبية احتياجات اليوم دون الإضرار بالأجيال القادمة.|Его сущность проста: удовлетворять потребности сегодняшнего дня, не вредя будущим поколениям.\nHowever, in practice this turned out to be much more difficult.|غير أن ذلك تبين في الواقع أنه أصعب بكثير.|Однако на практике это оказалось намного сложнее.\nEconomic growth often contradicts environmental protection.|كثيرا ما يتعارض النمو الاقتصادي مع حماية الطبيعة.|Экономический рост часто вступает в противоречие с охраной природы.\nNevertheless, many countries are introducing \"green\" technologies.|ومع ذلك، تطبق دول كثيرة تقنيات «خضراء».|Тем не менее многие страны внедряют «зелёные» технологии.\nCompanies also take environmental factors into account.|تأخذ الشركات أيضا العوامل البيئية في الاعتبار.|Компании тоже учитывают экологические факторы.\nUndoubtedly, without the participation of each of us there will be no success.|لا شك أنه لن يكون هناك نجاح من دون مشاركة كل واحد منا.|Безусловно, без участия каждого из нас успеха не будет.","gloss":""},{"title":"The Art of Arguing","tr":"فن الجدال::Искусство спорить","sents":"The ability to argue is one of the most important in the modern world.|القدرة على الجدال من أهم القدرات في العالم المعاصر.|Умение спорить — одно из важнейших в современном мире.\nThe goal of an argument is not to defeat the other person but to get closer to the truth.|هدف الجدال ليس هزيمة المحاور بل الاقتراب من الحقيقة.|Цель спора — не победить собеседника, а приблизиться к истине.\nFirst of all, you need to listen carefully to your opponent.|قبل كل شيء، يجب الإصغاء إلى المحاور بانتباه.|Прежде всего, нужно внимательно выслушать оппонента.\nThen you should give arguments, not emotions.|بعد ذلك ينبغي تقديم الحجج لا العواطف.|Затем следует приводить аргументы, а не эмоции.\nIt is important to distinguish facts from opinions.|من المهم التمييز بين الحقائق والآراء.|Важно отличать факты от мнений.\nIf you are wrong, admit it — it's a sign of strength, not weakness.|إذا كنت مخطئا فاعترف بذلك، فهذا علامة قوة لا ضعف.|Если вы неправы, признайте это — это признак силы, а не слабости.\nUltimately, a good argument enriches both sides.|في نهاية المطاف يثري الجدال الجيد الطرفين.|В конечном счёте хороший спор обогащает обе стороны.","gloss":""}],"dialogues":[{"title":"نقاش: العمل عن بُعد::Дискуссия: удалённая работа","lines":"A|What's your take on remote work?|ما رأيك في العمل عن بُعد؟|Как вы относитесь к удалённой работе?\nB|On the one hand, it saves a lot of time.|من جهة، يوفّر الكثير من الوقت.|С одной стороны, это экономит много времени.\nB|On the other hand, people miss face-to-face contact.|ومن جهة أخرى، يفتقد الناس التواصل المباشر.|С другой стороны, людям не хватает живого общения.\nA|But studies show that productivity is rising.|لكن الدراسات تُظهر أن الإنتاجية ترتفع.|Но исследования показывают, что продуктивность растёт.\nB|Perhaps. Nevertheless, not everyone can organize themselves.|ربما. ومع ذلك ليس الجميع قادراً على تنظيم نفسه.|Возможно. Тем не менее не все умеют себя организовать.\nA|Fair point. A hybrid model seems to be the best option.|نقطة وجيهة. يبدو أن النظام الهجين هو الخيار الأفضل.|Справедливо. Похоже, гибридный формат — лучший вариант.\nB|Absolutely.|بالتأكيد.|Безусловно."},{"title":"نقاش: الذكاء الاصطناعي::Дискуссия об ИИ","lines":"A|How do you assess the impact of artificial intelligence on the labor market?|كيف تقيم تأثير الذكاء الاصطناعي على سوق العمل؟|Как вы оцениваете влияние искусственного интеллекта на рынок труда?\nB|On the one hand, it automates routine tasks.|من جهة، يؤتمت المهام الروتينية.|С одной стороны, он автоматизирует рутинные задачи.\nB|On the other hand, new professions are emerging.|ومن جهة أخرى، تظهر مهن جديدة.|С другой стороны, появляются новые профессии.\nA|But not everyone will manage to retrain.|لكن ليس الجميع سيتمكن من إعادة التأهيل.|Но не все успеют переучиться.\nB|That's exactly why the state should invest in education.|لهذا السبب تحديدا يجب أن تستثمر الدولة في التعليم.|Именно поэтому государство должно вкладывать в образование.\nA|I agree, but it takes time.|أوافق، غير أن ذلك يتطلب وقتا.|Согласен, однако это требует времени.\nB|Certainly. That's why we must start today.|بلا شك. لذلك يجب أن نبدأ اليوم.|Безусловно. Поэтому начинать надо уже сегодня."},{"title":"اجتماع عمل::Деловая встреча","lines":"A|I suggest we move on to the main issue.|أقترح أن ننتقل إلى المسألة الرئيسية.|Предлагаю перейти к главному вопросу.\nB|Yes, let's discuss the terms of the contract.|نعم، لنناقش شروط العقد.|Да, давайте обсудим условия договора.\nA|The delivery terms do not suit us.|مواعيد التوريد لا تناسبنا.|Нас не устраивают сроки поставки.\nB|We can shorten them by a week.|يمكننا تقصيرها بأسبوع.|Мы можем сократить их на неделю.\nA|And what about the price?|وماذا عن السعر؟|А что насчёт цены?\nB|For a large order we are ready to provide a discount.|عند الطلبية الكبيرة نحن مستعدون لتقديم تخفيض.|При крупном заказе мы готовы предоставить скидку.\nA|In that case we can sign the agreement.|في هذه الحالة يمكننا توقيع الاتفاق.|В таком случае мы можем подписать соглашение.\nB|Excellent. I'll prepare the documents by tomorrow.|ممتاز. سأعد المستندات بحلول الغد.|Отлично. Я подготовлю документы к завтрашнему дню."},{"title":"عن الكتب::О литературе","lines":"A|What book are you reading now?|أي كتاب تقرأ الآن؟|Какую книгу вы сейчас читаете?\nB|I'm rereading \"Crime and Punishment\".|أعيد قراءة «الجريمة والعقاب».|Перечитываю «Преступление и наказание».\nA|Isn't it too gloomy?|أليست قاتمة جدا؟|Не слишком ли мрачно?\nB|Gloomy, but deep. Every time I find something new.|قاتمة لكنها عميقة. في كل مرة أجد شيئا جديدا.|Мрачно, но глубоко. Каждый раз нахожу что-то новое.\nA|What attracts you most in it?|ما الذي يجذبك فيها أكثر؟|Что вас в ней больше всего привлекает?\nB|The psychology of the characters and the eternal questions about conscience.|نفسية الشخصيات والأسئلة الأبدية عن الضمير.|Психология героев и вечные вопросы о совести.\nA|Perhaps I should reread it too.|ربما علي أنا أيضا أن أعيد قراءتها.|Пожалуй, и мне стоит её перечитать."}]},"C2":{"vocab":[{"t":"تعابير اصطلاحية::Идиомы","w":"🧊|break the ice|يكسر الجليد (يبدأ الحديث)|растопить лёд|بريك ذي آيس|брэйк зэ айс\n🎯|hit the nail on the head|أصاب كبد الحقيقة|попасть в точку|هِت ذَ نيل أون ذَ هِد|хит зэ нэйл он зэ хэд\n🌧️|under the weather|متوعّك|неважно себя чувствовать|أندَر ذَ وِذَر|андэ зэ уэ́зэ\n🐱|let the cat out of the bag|أفشى السر|проболтаться|لِت ذَ كات آوت أوڤ ذَ باگ|лет зэ кэт аут ов зэ бэг\n💰|cost an arm and a leg|كلّف ثروة|стоить целое состояние|كوست آن آرم أند أ لِگ|кост эн арм энд э лэг\n🦢|once in a blue moon|نادراً جداً|раз в сто лет|وَنس إن أ بلو مون|уанс ин э блю мун\n🍰|a piece of cake|سهل جداً|проще простого|أ پيس أوڤ كيك|э пис ов кейк\n⏰|better late than never|أن تأتي متأخراً خير من ألّا تأتي|лучше поздно, чем никогда|بِتَر ليت ذان نِڤَر|бэ́тэ лейт зэн нэ́вэ\n🔥|play with fire|يلعب بالنار|играть с огнём|پلِي وِذ فاير|плэй уиз файэ\n🌳|can't see the wood for the trees|لا يرى الصورة الكاملة بسبب التفاصيل|за деревьями не видеть леса|كانت سي ذَ وُد فور ذَ تريز|кант си зэ вуд фо зэ триз\n🤐|bite your tongue|يحبس لسانه|прикусить язык|بايت يور تانگ|байт ё тан\n👂|all ears|كلّه آذان صاغية|весь внимание|أول إيرز|ол иэз"},{"t":"الأسلوب الأدبي::Стилистика","w":"🎭|irony|سخرية|ирония|آيروني|а́йрони\n🪞|metaphor|استعارة|метафора|مِتَفور|мэ́тэфо\n🧵|subtext|معنى ضمني|подтекст|سَبتِكست|са́бтэкст\n🗣️|rhetoric|بلاغة|риторика|رِتورِك|рэ́торик"},{"t":"صفات دقيقة::Тонкие оттенки значений","w":"🎭|hypocritical|منافق|лицемерный\n🙄|arrogant|متعجرف|высокомерный\n🧊|impertur терей.\nIt is impossible to grasp everything at once.|من المستحيل إدراك كل شيء دفعة واحدة.|Невозможно постичь всё сразу.\nIndignation sounded in his voice.|كان السخط واضحا في صوته.|В его голосе звучало негодование.\nI was overcome by longing for my homeland.|غمرني الحنين إلى الوطن.|Меня охватила тоска по родине.\nHer speech was distinguished by elegance.|تميز خطابها بالأناقة.|Её речь отличалась изяществом.\nWe are facing a difficult dilemma.|أمامنا معضلة صعبة.|Перед нами стоит сложная дилемма.\nTherein lies the paradox.|هنا تكمن المفارقة.|В этом и заключается парадокс.\nThe changes happened gradually and imperceptibly.|حدثت التغيرات شيئا فشيئا.|Перемены происходили исподволь.\nHe mentioned this only in passing.|ذكر ذلك عرضا فقط.|Он упомянул об этом лишь вскользь.\nThey will hardly make it by the deadline.|بالكاد سيلحقون بالموعد.|Вряд ли они успеют к сроку.\nHe studied the question thoroughly.|درس المسألة بدقة تامة.|Он изучил вопрос досконально.\nFrom time immemorial people have striven for freedom.|سعى الناس إلى الحرية منذ القدم.|Испокон веков люди стремились к свободе.\nThe painting is striking in its colors.|تدهش اللوحة بألوانها.|Картина поражает своим колоритом.\nThis canvas is considered a masterpiece.|تعد هذه اللوحة تحفة فنية.|Это полотно считается шедевром.\nThe novel's climax comes in the last chapter.|تأتي ذروة الرواية في الفصل الأخير.|Кульминация романа приходится на последнюю главу.\nThe denouement turned out to be unexpected.|جاءت الخاتمة غير متوقعة.|Развязка оказалась неожиданной.\nThe narrator does not inspire trust.|الراوي لا يثير الثقة.|Рассказчик не вызывает доверия.\nThe court decision can be appealed.|يمكن استئناف قرار المحكمة.|Решение суда можно обжаловать.\nThe powers were delegated to the deputy.|فوضت الصلاحيات إلى النائب.|Полномочия были делегированы заместителю.\nTransparency is the basis of trust.|الشفافية أساس الثقة.|Прозрачность — основа доверия.\nBureaucracy slows down any reforms.|البيروقراطية تعيق أي إصلاحات.|Бюрократия тормозит любые реформы.\nThis precedent changed judicial practice.|غيرت هذه السابقة الممارسة القضائية.|Этот прецедент изменил судебную практику.\nThe universe still holds many secrets.|ما زال الكون يخفي أسرارا كثيرة.|Вселенная по-прежнему хранит много тайн.\nScientists recorded a strange anomaly.|رصد العلماء شذوذا غريبا.|Учёные зафиксировали странную аномалию.\nEvolution is a slow but relentless process.|التطور عملية بطيئة لكنها لا تتوقف.|Эволюция — медленный, но неукротимый процесс.\nThe authenticity of the manuscript is in doubt.|أصالة المخطوطة موضع شك.|Подлинность рукописи вызывает сомнения.\nNo sooner said than done.|قيل وفعل.|Сказано — сделано.\nMorning is wiser than evening.|الصباح أحكم من المساء.|Утро вечера мудренее.\nPatience and work overcome everything.|الصبر والعمل يتغلبان على كل شيء.|Терпение и труд всё перетрут.\nHe deliberately kept silent.|سكت عمدا.|Он нарочно промолчал.\nShe inadvertently touched on a sore subject.|تطرقت سهوا إلى موضوع حساس.|Она невзначай задела больную тему.\nAll we can do is hope for the best.|لا يبقى لنا إلا أن نأمل الأفضل.|Нам остаётся лишь уповать на лучшее.\nWe reap the fruits of our decisions.|نحن نحصد ثمار قراراتنا.|Мы пожинаем плоды своих решений.\nHe defended his point of view to the end.|دافع عن وجهة نظره حتى النهاية.|Он отстаивал свою точку зрения до конца.\nIt takes time to make sense of the past.|يحتاج استيعاب الماضي إلى وقت.|Чтобы осмыслить прошлое, нужно время.\nHer success overshadowed all competitors.|طغى نجاحها على جميع المنافسين.|Её успех затмил всех конкурентов.\nHis behavior borders on rudeness.|سلوكه يقترب من الوقاحة.|Его поведение граничит с грубостью.\nHowever hard you try, you can't please everyone.|مهما حاولت لن ترضي الجميع.|Как ни старайся, всем не угодишь.\nWhat's more, he was also late.|وفوق ذلك تأخر أيضا.|Мало того, он ещё и опоздал.\nIf only everything goes smoothly.|المهم أن يمر كل شيء بسلاسة.|Лишь бы всё прошло гладко.\nIt's not that I'm against it, but I have doubts.|ليس أني معارض، لكن عندي شكوك.|Не то чтобы я был против, но сомнения есть.\nAs soon as he entered, everyone fell silent.|ما إن دخل حتى سكت الجميع.|Стоило ему войти, как все замолчали.\nWhatever happens, I'll be there.|مهما حدث سأكون بجانبك.|Что бы ни случилось, я буду рядом.\nShe spoke as if nothing had happened.|تكلمت كأن شيئا لم يحدث.|Она говорила так, будто ничего не произошло.\nAs far as I know, the issue has already been resolved.|على حد علمي، المسألة قد حسمت.|Насколько мне известно, вопрос уже решён.\nIn the end everything fell into place.|في النهاية عاد كل شيء إلى مكانه.|В конце концов всё встало на свои места.\nNevertheless, unresolved questions remained.|ومع ذلك بقيت مسائل دون حل.|Тем не менее, остались нерешённые вопросы.\nHis contribution can hardly be overestimated.|يصعب المبالغة في تقدير إسهامه.|Его вклад трудно переоценить.\nTruly, wisdom knows no bounds.|حقا، الحكمة لا تعرف حدودا.|Поистине, мудрость не знает границ.\nShe remained steadfast in her convictions.|بقيت راسخة في قناعاتها.|Она осталась непоколебимой в своих убеждениях.\nVanity was his undoing.|كان غروره سبب هلاكه.|Тщеславие его и погубило.\nHis smugness irritated his colleagues.|كان إعجابه بنفسه يزعج زملاءه.|Его самодовольство раздражало коллег.\nIn this choice there are neither right nor wrong.|في هذا الاختيار لا يوجد محق ولا مخطئ.|В этом выборе нет ни правых, ни виноватых.\nThe future is shrouded in uncertainty.|المستقبل يكتنفه الغموض.|Будущее окутано неопределённостью.\nDiversity of opinion is a wealth.|تنوع الآراء ثروة.|Многообразие мнений — это богатство.\nThis book is the fruit of many years of work.|هذا الكتاب ثمرة عمل سنوات طويلة.|Эта книга — плод многолетнего труда.\nThe poet's words sound new.|تبدو كلمات الشاعر جديدة.|Слова поэта звучат по-новому.\nOne thought gives me no peace.|فكرة واحدة لا تفارقني.|Мне не даёт покоя одна мысль.\nFame did not spoil him.|لم تفسده الشهرة.|Слава его не испортила.\nWe corresponded for a long time.|تراسلنا مدة طويلة.|Мы долго вели переписку.\nThe will to live is stronger than fear.|إرادة الحياة أقوى من الخوف.|Воля к жизни сильнее страха.\nThey miraculously avoided disaster.|نجوا من الكارثة بأعجوبة.|Они чудом избежали беды.\nHis speech abounded in quotations.|كان خطابه مليئا بالاقتباسات.|Его речь изобиловала цитатами.\nPerhaps it was for the best.|ربما كان ذلك خيرا.|Наверное, это было к лучшему.\nTime will tell.|سنرى مع الوقت.|Поживём — увидим.\nHis zeal knew no bounds.|لم يعرف حماسه حدودا.|Его рвение не знало границ.\nEverything in this world is transient.|كل شيء في هذا العالم فان.|Всё в этом мире бренно.\nHer patience ran out.|نفد صبرها.|Её терпение иссякло.\nShe unraveled his plan.|كشفت مخططه.|Она разгадала его замысел.\nHaving weighed all the pros and cons, he refused.|بعد أن وازن بين الإيجابيات والسلبيات رفض.|Взвесив все «за» и «против», он отказался.\nA strange premonition came over me.|تملكني هاجس غريب.|Мною овладело странное предчувствие.\nIn the twilight the city looked ghostly.|بدت المدينة وهمية في الغسق.|В сумерках город выглядел призрачным.\nHappiness is fleeting, like spring rain.|السعادة عابرة كمطر الربيع.|Счастье мимолётно, как весенний дождь.\nHis taste was distinguished by refinement.|تميز ذوقه بالرقي.|Его вкус отличался изысканностью.\nCompassion is not weakness.|الشفقة ليست ضعفا.|Сострадание — это не слабость.\nShe confided her innermost thoughts to him.|أفضت إليه بأفكارها الدفينة.|Она поверила ему свои сокровенные мысли.\nAll his efforts proved futile.|ذهبت كل جهوده سدى.|Все его усилия оказались тщетными.\nWe bow before his talent.|ننحني إجلالا أمام موهبته.|Мы преклоняемся перед его талантом.\nA pre-dawn silence fell.|حل سكون ما قبل الفجر.|Наступило предрассветное безмолвие.\nHe chose his path in youth.|اختار سبيله منذ شبابه.|Он выбрал свою стезю ещё в юности.\nThe chronicle preserves the memory of those events.|تحفظ الحوليات ذكرى تلك الأحداث.|Летопись хранит память о тех событиях.\nOur job is to do our duty.|مهمتنا أن نؤدي واجبنا.|Наше дело — исполнить свой долг.\nThis book is an intricate web of fates.|هذا الكتاب تشابك للأقدار.|В этой книге хитросплетение судеб.\nHis speech was chaotic.|كان خطابه مشوشا.|Его речь была сумбурной.\nHe had an epiphany.|جاءه إلهام مفاجئ.|Ему пришло озарение.\nBeauty will save the world.|الجمال سينقذ العالم.|Красота спасёт мир.\nLife is not a walk in the park.|الحياة ليست نزهة.|Жизнь прожить — не поле перейти.\nBetter late than never.|أن تأتي متأخرا خير من ألا تأتي.|Лучше поздно, чем никогда.\nA drowning man clutches at a straw.|الغريق يتعلق بقشة.|Утопающий хватается за соломинку.\nThere's no smoke without fire.|لا دخان بلا نار.|Нет дыма без огня.\nBusiness before pleasure.|للعمل وقته وللهو ساعته.|Делу время, потехе час.\nA friend in need is a friend indeed.|الصديق وقت الضيق.|Люди познаются в беде.\nStrength lies in truth.|القوة في الحق.|Сила в правде.","grammar":[{"title":"صيغة الالتماس::Сослагательное наклонение (Subjunctive)","body":["<p>بعد أفعال وصفات الطلب والضرورة في الأسلوب الرسمي، يأتي الفعل بصيغته الأصلية دون ‎-s ودون تصريف:</p>\n<p>[[It is essential that he be present.]] من الضروري أن يكون حاضراً.</p>\n<p>[[They suggested that she take a break.]] اقترحوا أن تأخذ استراحة.</p>","<p>После глаголов и прилагательных требования и необходимости в формальном стиле глагол стоит в начальной форме, без ‎-s и без изменений:</p>\n<p>[[It is essential that he be present.]] Крайне важно, чтобы он присутствовал.</p>\n<p>[[They suggested that she take a break.]] Они предложили, чтобы она сделала перерыв.</p>"],"ex":"I insist that he leave immediately.|أُصرّ على أن يغادر فوراً.|Я настаиваю, чтобы он немедленно ушёл.","quiz":[["It is vital that she ___ on time.","be","is","will be"],["They recommended that he ___ a lawyer.","consult","consults","consulted"]]},{"title":"الجمل المشطورة للتوكيد::Расщеплённые предложения","body":["<p>لإبراز جزء من الجملة: [[It was ... that ...]] أو [[What ... is ...]]:</p>\n<p>[[It was Anna who called.]] آنا هي التي اتصلت (وليس غيرها).</p>\n<p>[[What I need is time.]] ما أحتاجه هو الوقت.</p>","<p>Чтобы выделить часть предложения: [[It was ... that ...]] или [[What ... is ...]]:</p>\n<p>[[It was Anna who called.]] Звонила именно Анна.</p>\n<p>[[What I need is time.]] Что мне нужно, так это время.</p>"],"ex":"It was in Tashkent that we first met.|في طشقند التقينا لأول مرة.|Именно в Ташкенте мы впервые встретились.","quiz":[["___ I really want is a holiday.","What","That","Which"],["It was my brother ___ fixed the car.","who","what","which"]]}],"readings":[{"title":"The Art of Silence","tr":"فنّ الصمت::Искусство молчать","sents":"They say that speech is silver, but silence is golden.|يُقال إن الكلام من فضة والسكوت من ذهب.|Говорят, что слово — серебро, а молчание — золото.\nIn an age of endless notifications, this proverb sounds almost like a challenge.|في عصر الإشعارات اللامتناهية يبدو هذا المثل تحدّياً تقريباً.|В эпоху бесконечных уведомлений эта пословица звучит почти как вызов.\nWe rush to reply, to comment, to have our say — and rarely stop to ask whether it was worth it.|نسارع إلى الرد والتعليق وإبداء الرأي، ونادراً ما نتوقف لنسأل هل كان ذلك يستحق.|Мы спешим ответить, прокомментировать, высказаться — и редко задумываемся, стоило ли.\nYet knowing when to stay silent is a sign not of weakness, but of maturity.|ومع ذلك فإن معرفة متى نصمت علامة نضج لا ضعف.|Между тем умение вовремя промолчать — признак не слабости, а зрелости.","gloss":"say|يقولون|говорят\nspeech|الكلام|речь\nsilver|فضة|серебро\nsilence|الصمت|молчание\ngolden|ذهبي|золотой\nage|عصر|эпоха\nendless|لا متناهية|бесконечные\nnotifications|إشعارات|уведомления\nproverb|مثل|пословица\nsounds|يبدو|звучит\nalmost|تقريباً|почти\nchallenge|تحدٍّ|вызов\nrush|نسارع|спешим\nreply|نرد|ответить\ncomment|نعلّق|комментировать\nrarely|نادراً|редко\nstop|نتوقف|останавливаться\nwhether|ما إذا|ли\nworth|يستحق|стоящий\nyet|ومع ذلك|однако\nknowing|معرفة|знание\nstay|نبقى|оставаться\nsilent|صامتين|молчаливый\nsign|علامة|признак\nweakness|ضعف|слабость\nmaturity|نضج|зрелость"},{"title":"The Art of Silence","tr":"فن الصمت::Искусство молчать","sents":"They say that speech is silver, but silence is gold.|يقال إن الكلام من فضة والسكوت من ذهب.|Говорят, что слово — серебро, а молчание — золото.\nIn the age of endless messages, this proverb sounds almost like a challenge.|في عصر الرسائل اللامتناهية يبدو هذا المثل تحديا تقريبا.|В эпоху бесконечных сообщений эта пословица звучит почти как вызов.\nWe rush to answer, comment, have our say.|نسارع إلى الرد والتعليق وإبداء الرأي.|Мы спешим ответить, прокомментировать, высказаться.\nAnd rarely wonder whether it was worth it.|ونادرا ما نتساءل هل كان ذلك يستحق.|И редко задумываемся, стоило ли.\nMeanwhile, the ability to keep silent at the right moment is a sign not of weakness but of maturity.|ومع ذلك فإن القدرة على السكوت في الوقت المناسب علامة نضج لا ضعف.|Между тем умение вовремя промолчать — признак не слабости, а зрелости.\nSilence gives time to make sense of what was heard.|يمنح الصمت وقتا لاستيعاب ما سمع.|Молчание даёт время осмыслить услышанное.\nIt turns out that listening is no less important than speaking.|يتبين أن الإصغاء لا يقل أهمية عن الكلام.|Оказывается, слушать — не менее важно, чем говорить.\nIt is no coincidence that sages of all ages valued taciturnity.|ليس من قبيل الصدفة أن حكماء كل العصور قدروا قلة الكلام.|Не случайно мудрецы всех эпох ценили немногословность.","gloss":""},{"title":"On Translation","tr":"عن الترجمة::О переводе","sents":"Translation is not a simple replacement of words.|الترجمة ليست مجرد استبدال للكلمات.|Перевод — это не простая замена слов.\nEvery language holds within itself a special vision of the world.|كل لغة تحمل في ذاتها رؤية خاصة للعالم.|Каждый язык хранит в себе особое видение мира.\nIdioms, wordplay, subtext — all this is hard to translate.|التعابير الاصطلاحية والتلاعب بالألفاظ والمعنى الضمني، كل ذلك يصعب ترجمته.|Идиомы, игра слов, подтекст — всё это с трудом поддаётся переводу.\nA translator has to choose between accuracy and beauty.|يضطر المترجم إلى الاختيار بين الدقة والجمال.|Переводчику приходится выбирать между точностью и красотой.\nNo wonder they say a translator is a co-author.|ليس عبثا أن يقال إن المترجم مؤلف مشارك.|Не случайно говорят, что переводчик — соавтор.\nA good translation preserves not only the meaning but also the spirit of the original.|الترجمة الجيدة تحفظ لا المعنى فحسب بل روح الأصل أيضا.|Хороший перевод сохраняет не только смысл, но и дух оригинала.\nThat is precisely why great books are translated again and again.|لهذا السبب تحديدا تترجم الكتب العظيمة مرة بعد مرة.|Именно поэтому великие книги переводят снова и снова.","gloss":""},{"title":"The Memory of a Place","tr":"ذاكرة المكان::Память места","sents":"There are cities that live in us long after we have left them.|هناك مدن تعيش فينا طويلا بعد أن نغادرها.|Есть города, которые живут в нас долго после того, как мы их покинули.\nThe smell of rain on an old street, the ringing of bells, the voice of a merchant at the market.|رائحة المطر في شارع قديم، ورنين الأجراس، وصوت تاجر في السوق.|Запах дождя на старой улице, звон колоколов, голос торговца на рынке.\nAll this suddenly surfaces in memory.|كل ذلك يطفو فجأة في الذاكرة.|Всё это внезапно всплывает в памяти.\nNostalgia is not just longing for the past.|الحنين ليس مجرد شوق إلى الماضي.|Ностальгия — это не просто тоска по прошлому.\nIt is an attempt to bring back a part of yourself that stayed there.|إنه محاولة لاستعادة جزء من ذاتك بقي هناك.|Это попытка вернуть часть себя, которая осталась там.\nReturning there years later, we often recognize neither the city nor ourselves.|عندما نعود إلى هناك بعد سنوات، كثيرا ما لا نتعرف على المدينة ولا على أنفسنا.|Возвращаясь туда спустя годы, мы часто не узнаём ни города, ни себя.\nAnd yet this meeting gives a strange serenity.|ومع ذلك يمنح هذا اللقاء طمأنينة غريبة.|И всё же эта встреча дарит странное умиротворение.","gloss":""}],"dialogues":[{"title":"حديث عن رواية::Разговор о романе","lines":"A|So, did you finish the novel?|إذن، هل أنهيت الرواية؟|Ну что, дочитал роман?\nB|I did. To be honest, the ending left me puzzled.|نعم. بصراحة، النهاية حيّرتني.|Дочитал. Честно говоря, финал меня озадачил.\nA|Yes, the author loves leaving things unsaid.|نعم، المؤلف يحب ترك الأمور دون قول.|Да уж, автор любит недоговорённости.\nB|Exactly. It all hinges on the subtext.|بالضبط. كل شيء يعتمد على المعنى الضمني.|Вот-вот. Всё держится на подтексте.\nA|But what language! I couldn't put it down.|لكن يا لها من لغة! لم أستطع تركها.|Зато язык какой! Не оторваться.\nB|You can say that again.|معك حق تماماً.|Что правда, то правда."},{"title":"حديث عن رواية::Разговор о романе","lines":"A|So, did you finish the novel?|إذن، هل أنهيت الرواية؟|Ну что, дочитал роман?\nB|I did. Honestly, the ending baffled me.|أنهيتها. بصراحة، النهاية أربكتني.|Дочитал. Честно говоря, финал меня обескуражил.\nA|Yes, the author likes to leave things unsaid.|نعم فعلا، المؤلف يحب ترك الأمور معلقة.|Да уж, автор любит недоговорённости.\nB|Exactly. Everything rests on the subtext.|بالضبط. كل شيء قائم على المعنى الضمني.|Вот-вот. Всё держится на подтексте.\nA|But what language! I couldn't put it down.|لكن يا لها من لغة! لا يمكن التوقف عن القراءة.|Зато язык какой! Не оторваться.\nB|That's true, no arguing.|هذا صحيح، لا جدال.|Что правда, то правда."},{"title":"خلاف بين صديقين::Размолвка","lines":"A|Are you still offended with me?|هل ما زلت مستاء مني؟|Ты на меня ещё обижен?\nB|Not so much offended as disappointed.|لست مستاء بقدر ما أنا خائب الأمل.|Не то чтобы обижен, скорее разочарован.\nA|I understand. I lost my temper and said too much.|أفهم. انفعلت وقلت ما لا ينبغي.|Я понимаю. Я погорячился и сказал лишнее.\nB|A word is not a sparrow; once it flies out, you can't catch it.|الكلمة إذا خرجت لا تعود.|Слово — не воробей, вылетит — не поймаешь.\nA|I know. Please forgive me.|أعرف. سامحني من فضلك.|Знаю. Прости меня, пожалуйста.\nB|All right, let bygones be bygones.|حسنا، عفا الله عما سلف.|Ладно, кто старое помянет, тому глаз вон.\nA|Thank you. You're a true friend.|شكرا. أنت صديق حقيقي.|Спасибо. Ты настоящий друг."},{"title":"في معرض فني::На выставке","lines":"A|What do you say about this canvas?|ما رأيك في هذه اللوحة؟|Что скажешь об этом полотне?\nB|The colors are striking, but the composition is overloaded, in my opinion.|الألوان مدهشة، لكن التكوين مزدحم في رأيي.|Колорит поразительный, но композиция, по-моему, перегружена.\nA|And I think that's exactly the artist's intention.|أما أنا فأظن أن هذه هي فكرة الرسام.|А мне кажется, в этом и замысел художника.\nB|Possibly. Chaos as a reflection of the era?|ربما. الفوضى كانعكاس للعصر؟|Возможно. Хаос как отражение эпохи?\nA|Exactly. Look at the brushstrokes — how much anxiety there is in them.|بالضبط. انظر إلى ضربات الفرشاة، ما أكثر القلق فيها.|Именно. Посмотри на мазки — сколько в них тревоги.\nB|You've almost convinced me.|لقد أقنعتني تقريبا.|Ты меня почти убедил."}]}}};

؟|Ты говоришь по-арабски?\nأَتَكَلَّمُ الْعَرَبِيَّةَ قَلِيلًا.|Я немного говорю по-арабски.\nبِكَمْ هَذَا؟|Сколько это стоит?\nأَيْنَ الْحَمَّامُ؟|Где туалет?\nأُرِيدُ مَاءً مِنْ فَضْلِكَ.|Воды, пожалуйста.\nهَذَا أَخِي.|Это мой брат.\nهَذِهِ أُخْتِي.|Это моя сестра.\nعِنْدِي قِطَّةٌ.|У меня есть кошка.\nأُحِبُّ الشَّايَ.|Я люблю чай.\nالْجَوُّ بَارِدٌ الْيَوْمَ.|Сегодня холодно.\nكَمِ السَّاعَةُ؟|Который час?\nأَعْمَلُ فِي مَكْتَبٍ.|Я работаю в офисе.\nأَتَعَلَّمُ اللُّغَةَ الْعَرَبِيَّةَ.|Я изучаю арабский язык.\nمَا هَذَا؟|Что это?\nلَا أَعْرِفُ.|Я не знаю.\nإِلَى اللِّقَاءِ!|До встречи!\nكَمْ عُمْرُكَ؟|Сколько тебе лет?\nعُمْرِي ثَلَاثُونَ سَنَةً.|Мне тридцать лет.\nأَنَا جَائِعٌ.|Я голоден.\nالْحِسَابُ مِنْ فَضْلِكَ.|Счёт, пожалуйста.\nهَذِهِ قِطَّتِي.|Это моя кошка.\nعِنْدِي كَلْبٌ.|У меня есть собака.\nالْكَلْبُ كَبِيرٌ.|Собака большая.\nالْقِطَّةُ صَغِيرَةٌ.|Кошка маленькая.\nأُحِبُّ الْحَيَوَانَاتِ.|Я люблю животных.\nأَيْنَ قَلَمِي؟|Где моя ручка?\nالْقَلَمُ عَلَى الطَّاوِلَةِ.|Ручка на столе.\nالْكِتَابُ فِي الْحَقِيبَةِ.|Книга в рюкзаке.\nهَذَا بَيْتِي.|Это мой дом.\nبَيْتِي جَدِيدٌ.|Мой дом новый.\nعِنْدَنَا ثَلَاثُ غُرَفٍ.|У нас три комнаты.\nالْمَطْبَخُ صَغِيرٌ لَكِنَّهُ مُرِيحٌ.|Кухня маленькая, но удобная.\nأَسْكُنُ فِي شَقَّةٍ.|Я живу в квартире.\nأَسْتَيْقِظُ فِي السَّاعَةِ السَّابِعَةِ.|Я встаю в семь часов.\nأَشْرَبُ الْقَهْوَةَ فِي الصَّبَاحِ.|Я пью кофе утром.\nفِي الْفُطُورِ آكُلُ الْخُبْزَ وَالْجُبْنَ.|На завтрак я ем хлеб и сыр.\nلَا آكُلُ اللَّحْمَ.|Я не ем мясо.\nأُحِبُّ الْفَوَاكِهَ.|Я люблю фрукты.\nالتُّفَّاحَةُ حَمْرَاءُ.|Яблоко красное.\nالْمَوْزَةُ صَفْرَاءُ.|Банан жёлтый.\nالْعُشْبُ أَخْضَرُ.|Трава зелёная.\nالسَّمَاءُ زَرْقَاءُ.|Небо синее.\nالْجَوُّ الْيَوْمَ دَافِئٌ وَمُشْمِسٌ.|Сегодня тепло и солнечно.\nالْمَاءُ بَارِدٌ.|Вода холодная.\nالشَّايُ سَاخِنٌ.|Чай горячий.\nأُرِيدُ فِنْجَانَ شَايٍ.|Я хочу чашку чая.\nأَعْطِنِي مِلْعَقَةً مِنْ فَضْلِكَ.|Дай мне, пожалуйста, ложку.\nأَيْنَ السِّكِّينُ وَالشَّوْكَةُ؟|Где нож и вилка?\nالْحَلِيبُ فِي الثَّلَّاجَةِ.|Молоко в холодильнике.\nأُمِّي تَطْبُخُ الْحَسَاءَ.|Мама готовит суп.\nأَبِي يَقْرَأُ الْجَرِيدَةَ.|Папа читает газету.\nأَخِي يَلْعَبُ كُرَةَ الْقَدَمِ.|Мой брат играет в футбол.\nأُخْتِي تُحِبُّ الْغِنَاءَ.|Моя сестра любит петь.\nالْأَطْفَالُ يَلْعَبُونَ فِي الْحَدِيقَةِ.|Дети играют в парке.\nصَدِيقِي يَسْكُنُ قَرِيبًا.|Мой друг живёт рядом.\nأَنَا ذَاهِبٌ إِلَى الْمَدْرَسَةِ.|Я иду в школу.\nالْمُعَلِّمُ يَكْتُبُ عَلَى السَّبُّورَةِ.|Учитель пишет на доске.\nأَكْتُبُ فِي الدَّفْتَرِ.|Я пишу в тетради.\nعِنْدِي سُؤَالٌ.|У меня есть вопрос.\nأَعْرِفُ الْجَوَابَ.|Я знаю ответ.\nمَا هَذِهِ الْكَلِمَةُ؟|Какое это слово?\nكَيْفَ نَقُولُ «كِتَابٌ» بِالرُّوسِيَّةِ؟|Как по-русски «книга»?\nأَتَعَلَّمُ كَلِمَاتٍ جَدِيدَةً.|Я учу новые слова.\nنَتَمَشَّى غَالِبًا فِي الْحَدِيقَةِ.|Мы часто гуляем в парке.\nفِي الْمَسَاءِ نُشَاهِدُ التِّلْفَازَ.|Вечером мы смотрим телевизор.\nأَنَامُ ثَمَانِيَ سَاعَاتٍ.|Я сплю восемь часов.\nفِي اللَّيْلِ أَنَامُ.|Ночью я сплю.\nهُوَ يَعْمَلُ فِي مُسْتَشْفًى.|Он работает в больнице.\nهِيَ تَعْمَلُ فِي مَدْرَسَةٍ.|Она работает в школе.\nنَحْنُ ذَاهِبُونَ بِالْحَافِلَةِ.|Мы едем на автобусе.\nأَذْهَبُ إِلَى الْعَمَلِ بِالْمِتْرُو.|Я езжу на работу на метро.\nأَيْنَ مَوْقِفُ الْحَافِلَةِ؟|Где остановка автобуса?\nالْمَتْجَرُ بِجَانِبِ الْبَيْتِ.|Магазин рядом с домом.\nالصَّيْدَلِيَّةُ مُقَابِلَ الْبَنْكِ.|Аптека напротив банка.\nأَشْتَرِي خُبْزًا وَحَلِيبًا.|Я покупаю хлеб и молоко.\nبِكَمِ الْخُبْزُ؟|Сколько стоит хлеб?\nهَذَا غَالٍ.|Это дорого.\nهَذَا رَخِيصٌ.|Это дёшево.\nأُرِيدُ هَذَا.|Я хочу это.\nيُعْجِبُنِي هَذَا اللَّوْنُ.|Мне нравится этот цвет.\nلَوْنِي الْمُفَضَّلُ هُوَ الْأَزْرَقُ.|Мой любимый цвет — синий.\nرَأْسِي يُؤْلِمُنِي.|У меня болит голова.\nأَنَا مُتْعَبٌ.|Я устал.\nأَنَا سَعِيدٌ بِرُؤْيَتِكَ.|Я рад тебя видеть.\nأَيْنَ تَعْمَلُ؟|Где ты работаешь?\nمَاذَا تَفْعَلُ؟|Что ты делаешь?\nأَقْرَأُ كِتَابًا.|Я читаю книгу.\nمَنْ هَذَا؟|Кто это?\nهَذَا جَارِي.|Это мой сосед.\nهِيَ لَطِيفَةٌ جِدًّا.|Она очень добрая.\nهُوَ طَوِيلٌ وَقَوِيٌّ.|Он высокий и сильный.\nجَدِّي كَبِيرٌ فِي السِّنِّ لَكِنَّهُ مَرِحٌ.|Мой дедушка старый, но весёлый.\nجَدَّتِي تَصْنَعُ كَعْكَةً لَذِيذَةً.|Бабушка готовит вкусный торт.\nلَا أُحِبُّ الِانْتِظَارَ.|Я не люблю ждать.\nانْتَظِرْ مِنْ فَضْلِكَ.|Подожди, пожалуйста.\nافْتَحِ النَّافِذَةَ مِنْ فَضْلِكَ.|Открой окно, пожалуйста.\nأَغْلِقِ الْبَابَ.|Закрой дверь.\nاجْلِسْ مِنْ فَضْلِكَ.|Садись, пожалуйста.\nأَنَا ذَاهِبٌ إِلَى الْبَيْتِ.|Я иду домой.\nهَلْ أَنْتَ فِي الْبَيْتِ؟|Ты дома?\nنَعَمْ، أَنَا فِي الْبَيْتِ.|Да, я дома.\nلَا، أَنَا فِي الْعَمَلِ.|Нет, я на работе.\nأَتَّصِلُ بِأُمِّي كُلَّ يَوْمٍ.|Я звоню маме каждый день.\nنُحِبُّ السِّبَاحَةَ فِي الْبَحْرِ.|Мы любим плавать в море.\nالْجَوُّ حَارٌّ فِي الصَّيْفِ.|Летом жарко.\nفِي الشِّتَاءِ يَكُونُ الْجَوُّ بَارِدًا وَيَتَسَاقَطُ الثَّلْجُ.|Зимой холодно и идёт снег.\nفِي الْغَابَةِ أَشْجَارٌ كَثِيرَةٌ.|В лесе много деревьев.\nالطُّيُورُ تُغَرِّدُ.|Птицы поют.\nأَرَى جَبَلًا.|Я вижу гору.\nالْيَوْمُ هُوَ الِاثْنَيْنِ.|Сегодня понедельник.\nغَدًا السَّبْتُ.|Завтра суббота.\nأَنَا مُتَفَرِّغٌ يَوْمَ الْأَحَدِ.|Я свободен в воскресенье.\nنَرَاكَ غَدًا!|Увидимся завтра!\nتُصْبِحُ عَلَى خَيْرٍ!|Спокойной ночи!\nبِالْهَنَاءِ وَالشِّفَاءِ!|Приятного аппетита!\nعِيدُ مِيلَادٍ سَعِيدٌ!|С днём рождения!\nكُلُّ شَيْءٍ بِخَيْرٍ.|Всё хорошо.\nلَا بَأْسَ.|Ничего страшного.","grammar":[{"title":"Огласовки (харакаты)","body":"<p>В арабском письме обычно пишутся только согласные и долгие гласные. Краткие гласные обозначаются значками над и под буквой — <b>харакатами</b>. Во всех текстах курса они проставлены.</p>\n<table><tr><th>Знак</th><th>Название</th><th>Звук</th><th>Пример</th></tr>\n<tr><td>[[بَ]]</td><td>фатха</td><td>а</td><td>[[بَ]] ба</td></tr>\n<tr><td>[[بِ]]</td><td>кясра</td><td>и</td><td>[[بِ]] би</td></tr>\n<tr><td>[[بُ]]</td><td>дамма</td><td>у</td><td>[[بُ]] бу</td></tr>\n<tr><td>[[بْ]]</td><td>сукун</td><td>нет гласной</td><td>[[أَبْ]] аб</td></tr>\n<tr><td>[[بّ]]</td><td>шадда</td><td>удвоение</td><td>[[حُبّ]] хубб</td></tr>\n<tr><td>[[بٌ]]</td><td>танвин</td><td>-ун / -ан / -ин</td><td>[[كِتَابٌ]] кита̄бун</td></tr></table>\n<p class=\"tip\">Арабский пишется справа налево, а большинство букв соединяются друг с другом и меняют форму.</p>","ex":"بَيْتٌ|дом\nكِتَابٌ|книга\nقَلَمٌ|ручка","quiz":[["Какая огласовка даёт звук «и»?","кясра ( ِ )","фатха ( َ )","дамма ( ُ )"],["Что обозначает шадда ( ّ )?","удвоение согласной","отсутствие гласной","долгое «а»"]]},{"title":"Именное предложение без связки","body":"<p>Как и в русском, в арабском настоящем времени связка «быть» не нужна:</p>\n<p>[[أَنَا طَالِبٌ.]] Я студент. [[الْبَيْتُ كَبِيرٌ.]] Дом большой.</p>\n<p>Первое слово (мубтада) обычно определённое, второе (хабар) — неопределённое, с танвином.</p>","ex":"أَنَا طَبِيبٌ.|Я врач.\nهِيَ مُعَلِّمَةٌ.|Она учительница.\nالسَّيَّارَةُ جَدِيدَةٌ.|Машина новая.","quiz":[["«Я студент» по-арабски:","أَنَا طَالِبٌ.","أَنَا كَانَ طَالِبٌ.","طَالِبٌ أَنَا هُوَ."],["«Дом большой»:","الْبَيْتُ كَبِيرٌ.","بَيْتٌ الْكَبِيرُ.","الْبَيْتُ الْكَبِيرُ هُوَ."]]},{"title":"Артикль الـ и «солнечные» буквы","body":"<p>Определённый артикль [[الْ]] (аль-) присоединяется к слову: [[كِتَابٌ]] книга → [[الْكِتَابُ]] (эта) книга.</p>\n<p>Перед 14 <b>«солнечными»</b> буквами (т, с̱, д, з̱, р, з, с, ш, с̣, д̣, т̣, з̣, л, н) звук «л» не произносится, а следующая буква удваивается:</p>\n<p>[[الشَّمْسُ]] — аш-шамсу (не «аль-шамс»). [[النُّورُ]] — ан-нӯру.</p>\n<p>Перед <b>«лунными»</b> буквами «л» слышен: [[الْقَمَرُ]] — аль-қамару.</p>","ex":"الشَّمْسُ|солнце (аш-шамсу)\nالْقَمَرُ|луна (аль-қамару)\nالسَّلَامُ|мир (ас-салāму)","quiz":[["Как читается [[الشَّمْسُ]]?","аш-шамсу","аль-шамсу","а-шамсу"],["Как читается [[الْقَمَرُ]]?","аль-қамару","ак-қамару","а-қамару"]]},{"title":"Род: мужской и женский","body":"<p>В арабском два рода. Женский род чаще всего узнаётся по окончанию <b>ة</b> (та-марбута):</p>\n<table><tr><th>Мужской</th><th>Женский</th></tr>\n<tr><td>[[طَالِبٌ]] студент</td><td>[[طَالِبَةٌ]] студентка</td></tr>\n<tr><td>[[مُعَلِّمٌ]] учитель</td><td>[[مُعَلِّمَةٌ]] учительница</td></tr>\n<tr><td>[[كَبِيرٌ]] большой</td><td>[[كَبِيرَةٌ]] большая</td></tr></table>\n<p class=\"tip\">Прилагательное согласуется с существительным в роде и стоит <b>после</b> него: [[بَيْتٌ كَبِيرٌ]] большой дом.</p>","ex":"سَيَّارَةٌ جَدِيدَةٌ|новая машина\nبَيْتٌ جَدِيدٌ|новый дом","quiz":[["Женский род от [[طَبِيبٌ]] (врач):","طَبِيبَةٌ","طَبِيبٌةٌ","طَبِيبَانِ"],["«Новая машина»:","سَيَّارَةٌ جَدِيدَةٌ","جَدِيدَةٌ سَيَّارَةٌ","سَيَّارَةٌ جَدِيدٌ"]]},{"title":"Притяжательные окончания","body":"<p>«Мой», «твой», «его» в арабском — это окончания, которые прикрепляются к слову:</p>\n<table><tr><th>Окончание</th><th>Значение</th><th>[[كِتَابٌ]] книга</th></tr>\n<tr><td>ـِي</td><td>мой</td><td>[[كِتَابِي]]</td></tr>\n<tr><td>ـكَ</td><td>твой (м.)</td><td>[[كِتَابُكَ]]</td></tr>\n<tr><td>ـكِ</td><td>твой (ж.)</td><td>[[كِتَابُكِ]]</td></tr>\n<tr><td>ـهُ</td><td>его</td><td>[[كِتَابُهُ]]</td></tr>\n<tr><td>ـهَا</td><td>её</td><td>[[كِتَابُهَا]]</td></tr>\n<tr><td>ـنَا</td><td>наш</td><td>[[كِتَابُنَا]]</td></tr>\n<tr><td>ـهُمْ</td><td>их</td><td>[[كِتَابُهُمْ]]</td></tr></table>\n<p class=\"tip\">Та-марбута перед окончанием читается как «т»: [[سَيَّارَةٌ]] → [[سَيَّارَتِي]] моя машина.</p>","ex":"هَذَا بَيْتِي.|Это мой дом.\nمَا اسْمُكَ؟|Как тебя зовут? (букв. «каково твоё имя?»)\nأُمُّهَا طَبِيبَةٌ.|Её мать — врач.","quiz":[["«Моя книга»:","كِتَابِي","كِتَابُكَ","كِتَابُهُ"],["«Его дом»:","بَيْتُهُ","بَيْتُهَا","بَيْتِي"]]}],"readings":[{"title":"عَائِلَتِي","tr":"Моя семья","sents":"اِسْمِي إِيفَانُ.|Меня зовут Иван.\nأَنَا مِنْ رُوسِيَا، وَأَسْكُنُ الْآنَ فِي طَشْقَنْدَ.|Я из России, а сейчас живу в Ташкенте.\nعِنْدِي عَائِلَةٌ كَبِيرَةٌ.|У меня большая семья.\nأُمِّي مُعَلِّمَةٌ، وَأَبِي مُهَنْدِسٌ.|Моя мама — учительница, а папа — инженер.\nعِنْدِي أَخٌ وَأُخْتٌ.|У меня есть брат и сестра.\nأَخِي يَعْمَلُ فِي بَنْكٍ، وَأُخْتِي طَالِبَةٌ.|Мой брат работает в банке, а сестра — студентка.\nأُحِبُّ عَائِلَتِي كَثِيرًا.|Я очень люблю свою семью.","gloss":"اسمي|меня зовут (моё имя)\nإيفان|Иван\nروسيا|Россия\nوأسكن|и живу\nأسكن|живу\nالآن|сейчас\nطشقند|Ташкент\nعندي|у меня есть\nعائلة|семья\nكبيرة|большая\nأمي|моя мама\nمعلمة|учительница\nوأبي|а мой папа\nمهندس|инженер\nأخ|брат\nوأخت|и сестра\nأخي|мой брат\nيعمل|работает\nبنك|банк\nوأختي|а моя сестра\nطالبة|студентка\nأحب|люблю\nعائلتي|мою семью\nكثيرا|очень, много"},{"title":"فِي شَقَّتِي","tr":"В моей квартире","sents":"أَسْكُنُ فِي شَقَّةٍ فِي وَسَطِ الْمَدِينَةِ.|Я живу в квартире в центре города.\nالشَّقَّةُ لَيْسَتْ كَبِيرَةً لَكِنَّهَا مُضِيئَةٌ.|Квартира не большая, но светлая.\nفِيهَا غُرْفَةُ نَوْمٍ وَغُرْفَةُ جُلُوسٍ وَمَطْبَخٌ وَحَمَّامٌ.|Там есть спальня, гостиная, кухня и ванная.\nفِي غُرْفَةِ النَّوْمِ سَرِيرٌ وَخِزَانَةٌ.|В спальне стоит кровать и шкаф.\nفِي غُرْفَةِ الْجُلُوسِ أَرِيكَةٌ وَطَاوِلَةٌ وَتِلْفَازٌ.|В гостиной есть диван, стол и телевизор.\nغُرْفَتِي الْمُفَضَّلَةُ هِيَ الْمَطْبَخُ.|Моя любимая комната — кухня.\nهُنَاكَ أُحَضِّرُ الْفُطُورَ وَأَشْرَبُ الشَّايَ.|Там я готовлю завтрак и пью чай.\nمِنَ النَّافِذَةِ أَرَى حَدِيقَةً وَأَشْجَارًا.|Из окна я вижу парк и деревья.\nجِيرَانِي هَادِئُونَ وَلُطَفَاءُ.|Мои соседи тихие и добрые.\nتُعْجِبُنِي شَقَّتِي كَثِيرًا.|Мне очень нравится моя квартира.","gloss":""},{"title":"فِي السُّوقِ","tr":"На рынке","sents":"يَوْمَ السَّبْتِ أَذْهَبُ إِلَى السُّوقِ.|В субботу я хожу на рынок.\nهُنَاكَ فَوَاكِهُ وَخُضَارٌ كَثِيرَةٌ.|Там много фруктов и овощей.\nأَشْتَرِي التُّفَّاحَ وَالطَّمَاطِمَ وَالْخِيَارَ.|Я покупаю яблоки, помидоры и огурцы.\nالْبَائِعُ لَطِيفٌ جِدًّا.|Продавец очень добрый.\nيَقُولُ: «مَرْحَبًا! مَاذَا تُرِيدُ؟»|Он говорит: «Здравствуйте! Что вы хотите?»\nأُجِيبُ: «كِيلُو عِنَبٍ مِنْ فَضْلِكَ».|Я отвечаю: «Кило винограда, пожалуйста».\nالْعِنَبُ حُلْوٌ وَلَيْسَ غَالِيًا.|Виноград сладкий и не дорогой.\nأَشْتَرِي أَيْضًا الْخُبْزَ وَالْجُبْنَ وَالْعَسَلَ.|Я тоже покупаю хлеб, сыр и мёд.\nثُمَّ أَذْهَبُ إِلَى الْبَيْتِ وَأُحَضِّرُ سَلَطَةً.|Потом я иду домой и готовлю салат.","gloss":""},{"title":"صَدِيقِي إِيفَانُ","tr":"Мой друг Иван","sents":"عِنْدِي صَدِيقٌ. اسْمُهُ إِيفَانُ.|У меня есть друг. Его зовут Иван.\nعُمْرُهُ ثَمَانِيَةٌ وَعِشْرُونَ عَامًا.|Ему двадцать восемь лет.\nيَسْكُنُ إِيفَانُ فِي مُوسْكُو.|Иван живёт в Москве.\nهُوَ يَعْمَلُ فِي بَنْكٍ.|Он работает в банке.\nإِيفَانُ طَوِيلٌ، وَشَعْرُهُ دَاكِنٌ.|Иван высокий, у него тёмные волосы.\nهُوَ يُحِبُّ الرِّيَاضَةَ كَثِيرًا.|Он очень любит спорт.\nكُلَّ صَبَاحٍ يَرْكُضُ فِي الْحَدِيقَةِ.|Каждое утро он бегает в парке.\nفِي الْمَسَاءِ يَقْرَأُ أَوْ يُشَاهِدُ فِيلْمًا.|Вечером он читает или смотрит фильм.\nعِنْدَ إِيفَانَ كَلْبٌ. اسْمُهُ بُوبِيكُ.|У Ивана есть собака. Её зовут Бобик.\nنَتَمَشَّى مَعًا غَالِبًا.|Мы часто гуляем вместе.","gloss":""}],"dialogues":[{"title":"Знакомство","lines":"A|مَرْحَبًا! أَنَا سَارَةُ. مَا اسْمُكَ؟|Привет! Я Сара. Как тебя зовут?\nB|أَهْلًا يَا سَارَةُ! أَنَا إِيفَانُ.|Здравствуй, Сара! Я Иван.\nA|تَشَرَّفْنَا. مِنْ أَيْنَ أَنْتَ؟|Очень приятно. Откуда ты?\nB|أَنَا مِنْ رُوسِيَا. وَأَنْتِ؟|Я из России. А ты?\nA|أَنَا مِنَ الْأُرْدُنِّ. هَلْ تَتَكَلَّمُ الْعَرَبِيَّةَ؟|Я из Иордании. Ты говоришь по-арабски?\nB|قَلِيلًا. أَنَا أَتَعَلَّمُ.|Немного. Я учусь.\nA|مُمْتَازٌ!|Отлично!\nB|شُكْرًا!|Спасибо!"},{"title":"В кафе","lines":"A|أَهْلًا وَسَهْلًا! مَاذَا تُرِيدُ؟|Добро пожаловать! Что желаете?\nB|كُوبَ شَايٍ مِنْ فَضْلِكَ.|Чашку чая, пожалуйста.\nA|بِسُكَّرٍ؟|С сахаром?\nB|لَا، بِدُونِ سُكَّرٍ. وَقِطْعَةَ كَعْكٍ.|Нет, без сахара. И кусок торта.\nA|حَسَنًا. شَيْءٌ آخَرُ؟|Хорошо. Что-нибудь ещё?\nB|لَا، شُكْرًا. كَمِ الْحِسَابُ؟|Нет, спасибо. Сколько с меня?\nA|خَمْسَةُ دَنَانِيرَ.|Пять динаров.\nB|تَفَضَّلْ.|Пожалуйста (вот, возьмите)."},{"title":"В ресторане","lines":"A|مَسَاءُ الْخَيْرِ! تَفَضَّلْ قَائِمَةَ الطَّعَامِ.|Добрый вечер! Вот меню.\nB|شُكْرًا. بِمَاذَا تَنْصَحُ؟|Спасибо. Что вы советуете?\nA|الْحَسَاءُ الْيَوْمَ لَذِيذٌ جِدًّا.|Сегодня очень вкусный суп.\nB|حَسَنًا. حَسَاءٌ وَسَلَطَةٌ مِنْ فَضْلِكَ.|Хорошо. Суп и салат, пожалуйста.\nA|مَاذَا تَشْرَبُ؟|Что вы будете пить?\nB|كَأْسَ مَاءٍ وَشَايًا.|Стакан воды и чай.\nA|حَسَنًا. شَيْءٌ آخَرُ؟|Хорошо. Что-нибудь ещё?\nB|لَا، شُكْرًا. الْحِسَابُ بَعْدَ ذَلِكَ مِنْ فَضْلِكَ.|Нет, спасибо. Потом счёт, пожалуйста."},{"title":"Где аптека?","lines":"A|عَفْوًا، أَيْنَ الصَّيْدَلِيَّةُ؟|Извините, где аптека?\nB|الصَّيْدَلِيَّةُ هُنَاكَ، مُقَابِلَ الْبَنْكِ.|Аптека там, напротив банка.\nA|هَلْ هِيَ بَعِيدَةٌ؟|Это далеко?\nB|لَا، قَرِيبَةٌ. خَمْسُ دَقَائِقَ مَشْيًا.|Нет, близко. Пять минут пешком.\nA|هَلْ أَمْشِي إِلَى الْأَمَامِ؟|Идти прямо?\nB|نَعَمْ، إِلَى الْأَمَامِ ثُمَّ إِلَى الْيَمِينِ.|Да, прямо, потом направо.\nA|شُكْرًا جَزِيلًا!|Большое спасибо!\nB|لَا شُكْرَ عَلَى وَاجِبٍ!|Не за что!"},{"title":"О семье","lines":"A|هَلْ عَائِلَتُكَ كَبِيرَةٌ؟|У тебя большая семья?\nB|نَعَمْ. عِنْدِي أَخَوَانِ وَأُخْتٌ.|Да. У меня два брата и сестра.\nA|أَيْنَ يَسْكُنُونَ؟|Где они живут?\nB|أَخَوَايَ يَسْكُنَانِ فِي عَمَّانَ، وَأُخْتِي هُنَا.|Братья живут в Аммане, а сестра — здесь.\nA|وَوَالِدَاكَ؟|А родители?\nB|وَالِدَايَ أَيْضًا فِي عَمَّانَ.|Родители тоже в Аммане.\nA|هَلْ تَشْتَاقُ إِلَيْهِمْ؟|Ты скучаешь по ним?\nB|نَعَمْ، كَثِيرًا. أَتَّصِلُ بِهِمْ كُلَّ يَوْمٍ.|Да, очень. Я звоню им каждый день."}]},"A2":{"vocab":[{"t":"Погода и времена года","w":"🌦️|طَقْسٌ|погода\n☀️|شَمْسٌ|солнце\n🌧️|مَطَرٌ|дождь\n❄️|ثَلْجٌ|снег\n💨|رِيحٌ|ветер\n⛄|شِتَاءٌ|зима\n🌱|رَبِيعٌ|весна\n🏖️|صَيْفٌ|лето\n🍂|خَرِيفٌ|осень"},{"t":"Одежда","w":"👔|قَمِيصٌ|рубашка\n👗|فُسْتَانٌ|платье\n👖|بِنْطَالٌ|брюки\n👞|حِذَاءٌ|обувь\n🧥|مِعْطَفٌ|пальто\n👜|حَقِيبَةٌ|сумка"},{"t":"Покупки","w":"💵|نُقُودٌ|деньги\n🏷️|سِعْرٌ|цена\n🪙|رَخِيصٌ|дешёвый\n💎|غَالٍ|дорогой\n🛍️|سُوقٌ|рынок"},{"t":"Профессии","w":"🩺|طَبِيبٌ|врач\n🧑‍🏫|مُعَلِّمٌ|учитель\n👷|مُهَنْدِسٌ|инженер\n🧑‍🍳|طَبَّاخٌ|повар\n🚕|سَائِقٌ|водитель\n🎓|طَالِبٌ|студент"},{"t":"Путешествия и хобби","w":"🌍|سَفَرٌ|путешествие\n🎫|تَذْكِرَةٌ|билет\n🚆|قِطَ тье.\nبِكَمْ هَذَا الْحِذَاءُ؟|Сколько стоят эти туфли?\nهَذَا الْقَمِيصُ صَغِيرٌ عَلَيَّ.|Эта рубашка мне мала.\nهَلْ عِنْدَكُمْ هَذِهِ الْكَنْزَةُ بِلَوْنٍ آخَرَ؟|У вас есть этот свитер другого цвета?\nهَلْ يُمْكِنُ الدَّفْعُ بِالْبِطَاقَةِ؟|Можно заплатить картой?\nهُنَاكَ تَخْفِيضَاتٌ كَبِيرَةٌ الْيَوْمَ.|Сегодня большие скидки.\nأَبْحَثُ عَنْ هَدِيَّةٍ لِأُمِّي.|Я ищу подарок для мамы.\nأَحْتَاجُ مَقَاسًا أَكْبَرَ.|Мне нужен размер побольше.\nإِنَّهَا تُمْطِرُ الْيَوْمَ.|Сегодня идёт дождь.\nخُذْ مِظَلَّةً.|Возьми зонтик.\nسَيَكُونُ الْجَوُّ مُشْمِسًا غَدًا.|Завтра будет солнечно.\nكَانَتْ هُنَاكَ رِيحٌ قَوِيَّةٌ أَمْسِ.|Вчера был сильный ветер.\nفِي الشِّتَاءِ يَكُونُ الْجَوُّ بَارِدًا جِدًّا فِي مُوسْكُو.|Зимой в Москве очень холодно.\nفِي الصَّيْفِ يَكُونُ الْجَوُّ حَارًّا فِي طَشْقَنْدَ.|Летом в Ташкенте жарко.\nفَصْلِي الْمُفَضَّلُ هُوَ الرَّبِيعُ.|Моё любимое время года — весна.\nعِيدُ مِيلَادِي فِي مَايُو.|У меня день рождения в мае.\nفِي أُغُسْطُسَ سَنَذْهَبُ إِلَى الْبَحْرِ.|В августе мы поедем на море.\nحَجَزْتُ غُرْفَةً فِي الْفُنْدُقِ.|Я забронировал номер в гостинице.\nأَيْنَ جَوَازُ سَفَرِي؟|Где мой паспорт?\nأَحْتَاجُ تَذْكِرَةً إِلَى سَمَرْقَنْدَ.|Мне нужен билет до Самарканда.\nيَنْطَلِقُ الْقِطَارُ فِي السَّاعَةِ التَّاسِعَةِ.|Поезд отправляется в девять часов.\nالطَّائِرَةُ مُتَأَخِّرَةٌ سَاعَةً.|Самолёт опаздывает на час.\nكُنَّا فِي الْمَتْحَفِ وَفِي الْمَسْرَحِ.|Мы были в музее и в театре.\nالْتَقَطْتُ صُوَرًا كَثِيرَةً.|Я сделал много фотографий.\nأَقَمْنَا فِي فُنْدُقٍ عَلَى الْبَحْرِ.|Мы жили в гостинице у моря.\nأُرِيدُ أَنْ أُسَافِرَ إِلَى رُوسِيَا.|Я хочу поехать в Россию.\nكَيْفَ أَصِلُ إِلَى مَحَطَّةِ الْقِطَارِ؟|Как дойти до вокзала?\nامْشِ إِلَى الْأَمَامِ ثُمَّ إِلَى الْيَسَارِ.|Идите прямо, потом налево.\nالْمَكْتَبَةُ عِنْدَ الزَّاوِيَةِ.|Библиотека за углом.\nمَكْتَبُ الْبَرِيدِ بِجَانِبِ السَّاحَةِ.|Почта рядом с площадью.\nاعْبُرِ الشَّارِعَ عِنْدَ الْإِشَارَةِ.|Перейдите улицу на светофоре.\nهَلْ هُوَ بَعِيدٌ مِنْ هُنَا؟|Это далеко отсюда?\nأَخِي يَعْمَلُ سَائِقًا.|Мой брат работает водителем.\nصَدِيقَتِي مُمَرِّضَةٌ.|Моя подруга — медсестра.\nأُرِيدُ أَنْ أُصْبِحَ مُبَرْمِجًا.|Я хочу стать программистом.\nمَاذَا تَعْمَلُ؟|Кем ты работаешь?\nعَمِلَ أَبِي مُهَنْدِسًا.|Мой отец работал инженером.\nفِي عُطْلَةِ نِهَايَةِ الْأُسْبُوعِ أَلْعَبُ التِّنِسَ.|По выходным я играю в теннис.\nأَذْهَبُ إِلَى النَّادِي ثَلَاثَ مَرَّاتٍ فِي الْأُسْبُوعِ.|Я хожу в спортзал три раза в неделю.\nهَلْ تَعْرِفُ الْعَزْفَ عَلَى الْقِيثَارَةِ؟|Ты умеешь играть на гитаре?\nشَاهَدْنَا أَمْسِ فِيلْمًا مُمْتِعًا.|Вчера мы смотрели интересный фильм.\nفَازَ فَرِيقُنَا بِالْمُبَارَاةِ.|Наша команда выиграла матч.\nأُحِبُّ قِرَاءَةَ الْقِصَصِ الْبُولِيسِيَّةِ.|Я люблю читать детективы.\nأَبِي يُحِبُّ صَيْدَ السَّمَكِ.|Мой папа любит рыбалку.\nعِنْدِي حُمَّى.|У меня температура.\nحَلْقِي يُؤْلِمُنِي.|У меня болит горло.\nخُذْ حَبَّةَ دَوَاءٍ وَارْتَحْ.|Прими таблетку и отдохни.\nاتَّصِلُوا بِالْإِسْعَافِ!|Вызовите скорую помощь!\nأَنَا بِخَيْرٍ الْآنَ.|Я уже здоров.\nأَسْتَيْقِظُ فِي السَّاعَةِ السَّادِسَةِ.|Я просыпаюсь в шесть часов.\nثُمَّ أَسْتَحِمُّ وَأَتَنَاوَلُ الْفُطُورَ.|Потом я принимаю душ и завтракаю.\nأَخْرُجُ مِنَ الْبَيْتِ فِي الثَّامِنَةِ.|Я ухожу из дома в восемь.\nأَعُودُ إِلَى الْبَيْتِ فِي الْمَسَاءِ.|Я возвращаюсь домой вечером.\nأَذْهَبُ إِلَى النَّوْمِ فِي الْحَادِيَةَ عَشْرَةَ.|Я ложусь спать в одиннадцать.\nآسِفٌ، تَأَخَّرْتُ.|Извини, я опоздал.\nيَوْمَ السَّبْتِ أُنَظِّفُ الشَّقَّةَ.|В субботу я убираю квартиру.\nمَنْ سَيَغْسِلُ الصُّحُونَ؟|Кто будет мыть посуду?\nأُخْرِجُ الْقُمَامَةَ كُلَّ مَسَاءٍ.|Я выношу мусор каждый вечер.\nأُمِّي تَكْوِي الْقُمْصَانَ.|Мама гладит рубашки.\nأُحَضِّرُ الْعَشَاءَ لِكُلِّ الْعَائِلَةِ.|Я готовлю ужин для всей семьи.\nقَطِّعِ الْبَصَلَ وَالطَّمَاطِمَ.|Нарежь лук и помидоры.\nالْحَسَاءُ مَالِحٌ جِدًّا.|Суп очень солёный.\nهَذِهِ اللَّيْمُونَةُ حَامِضَةٌ جِدًّا.|Этот лимон очень кислый.\nمَا وَصْفَتُكَ؟|Какой у тебя рецепт?\nعَادَةً أَتَغَدَّى فِي مَقْهًى.|Я обычно обедаю в кафе.\nنَتَعَشَّى فِي السَّابِعَةِ.|Мы ужинаем в семь.\nمُوسْكُو أَكْبَرُ مِنْ طَشْقَنْدَ.|Москва больше, чем Ташкент.\nهَذِهِ السُّتْرَةُ أَدْفَأُ.|Эта куртка теплее.\nأَخِي أَكْبَرُ مِنِّي.|Мой брат старше меня.\nالْمِتْرُو أَسْرَعُ وَسِيلَةِ نَقْلٍ.|Метро — самый быстрый транспорт.\nأَخَافُ مِنَ الْكِلَابِ.|Я боюсь собак.\nلَا تَقْلَقْ، سَيَكُونُ كُلُّ شَيْءٍ بِخَيْرٍ.|Не волнуйся, всё будет хорошо.\nأَشْتَاقُ إِلَى الْبَيْتِ كَثِيرًا.|Я очень скучаю по дому.\nشُكْرًا عَلَى الْهَدِيَّةِ!|Спасибо за подарок!\nكُنْتُ مُتَفَاجِئًا جِدًّا.|Я был очень удивлён.\nتَعَارَفْنَا فِي الْعَامِ الْمَاضِي.|Мы познакомились в прошлом году.\nمَاذَا سَتَفْعَلُ فِي الْمَسَاءِ؟|Что ты будешь делать вечером?\nسَأُشَاهِدُ مُسَلْسَلًا.|Я буду смотреть сериал.\nلِنَلْتَقِ فِي وَسَطِ الْمَدِينَةِ.|Давай встретимся в центре.\nمَتَى تَكُونُ مُتَفَرِّغًا؟|Во сколько ты свободен?\nسَأَتَّصِلُ بِكَ لَاحِقًا.|Я позвоню тебе позже.\nنَذْهَبُ إِلَى السِّينِمَا كَثِيرًا.|Мы часто ходим в кино.\nهُوَ لَا يَتَأَخَّرُ أَبَدًا.|Он никогда не опаздывает.\nأَطْبُخُ الْبِلَوْفَ أَحْيَانًا.|Я иногда готовлю плов.\nعَمِلْتُ طُوَالَ الْيَوْمِ أَمْسِ.|Вчера я весь день работал.\nلَمْ أَزُرْ سَانْت بِطَرْسْبُورْغ بَعْدُ.|Я ещё не был в Санкт-Петербурге.\nسَنَسْكُنُ فِي شَقَّةٍ جَدِيدَةٍ.|Мы будем жить в новой квартире.\nانْتَقَلُوا إِلَى مَدِينَةٍ أُخْرَى.|Они переехали в другой город.\nنَسِيتُ الْمَفَاتِيحَ فِي الْبَيْتِ.|Я забыл ключи дома.\nهَلْ تَتَذَكَّرُ أَيْنَ كُنَّا فِي الْعَامِ الْمَاضِي؟|Помнишь, где мы были в прошлом году?\nنِمْتُ نَوْمًا سَيِّئًا اللَّيْلَةَ الْمَاضِيَةَ.|Я плохо спал этой ночью.\nيَجِبُ أَنْ نَشْتَرِيَ الْمَوَادَّ الْغِذَائِيَّةَ.|Нам нужно купить продукты.\nهَلْ يُمْكِنُنِي رُؤْيَةُ قَائِمَةِ الطَّعَامِ؟|Можно посмотреть меню?\nأُرِيدُ أَنْ أَطْلُبَ سَيَّارَةَ أُجْرَةٍ.|Я хочу заказать такси.\nخُذْنِي إِلَى الْمَطَارِ مِنْ فَضْلِكَ.|Отвезите меня в аэропорт, пожалуйста.","grammar":[{"title":"Прошедшее время","body":"<p>Прошедшее время образуется окончаниями, которые прибавляются к основе глагола. Пример — [[كَتَبَ]] (писал):</p>\n<table><tr><th>Лицо</th><th>Форма</th><th>Перевод</th></tr>\n<tr><td>[[أَنَا]]</td><td>[[كَتَبْتُ]]</td><td>я писал(а)</td></tr>\n<tr><td>[[أَنْتَ]]</td><td>[[كَتَبْتَ]]</td><td>ты писал</td></tr>\n<tr><td>[[أَنْتِ]]</td><td>[[كَتَبْتِ]]</td><td>ты писала</td></tr>\n<tr><td>[[هُوَ]]</td><td>[[كَتَبَ]]</td><td>он писал</td></tr>\n<tr><td>[[هِيَ]]</td><td>[[كَتَبَتْ]]</td><td>она писала</td></tr>\n<tr><td>[[نَحْنُ]]</td><td>[[كَتَبْنَا]]</td><td>мы писали</td></tr>\n<tr><td>[[هُمْ]]</td><td>[[كَتَبُوا]]</td><td>они писали</td></tr></table>\n<p class=\"tip\">Форма [[كَتَبَ]] («он писал») — словарная форма арабского глагола.</p>","ex":"ذَهَبْتُ إِلَى الْعَمَلِ.|Я пошёл на работу.\nشَرِبَتْ قَهْوَةً.|Она выпила кофе.\nسَافَرْنَا إِلَى دُبَيّ.|Мы ездили в Дубай.","quiz":[["«Я написал»:","كَتَبْتُ","كَتَبَ","كَتَبَتْ"],["«Она пошла»:","ذَهَبَتْ","ذَهَبْتُ","ذَهَبُوا"]]},{"title":"Настоящее время","body":"<p>Настоящее время образуется <b>приставками</b> и окончаниями:</p>\n<table><tr><th>Лицо</th><th>[[يَكْتُبُ]] пишет</th></tr>\n<tr><td>[[أَنَا]]</td><td>[[أَكْتُبُ]]</td></tr>\n<tr><td>[[أَنْتَ]]</td><td>[[تَكْتُبُ]]</td></tr>\n<tr><td>[[أَنْتِ]]</td><td>[[تَكْتُبِينَ]]</td></tr>\n<tr><td>[[هُوَ]]</td><td>[[يَكْتُبُ]]</td></tr>\n<tr><td>[[هِيَ]]</td><td>[[تَكْتُبُ]]</td></tr>\n<tr><td>[[نَحْنُ]]</td><td>[[نَكْتُبُ]]</td></tr>\n<tr><td>[[هُمْ]]</td><td>[[يَكْتُبُونَ]]</td></tr></table>\n<p class=\"tip\">Приставки легко запомнить по слову «أنيت»: أ — я, ن — мы, ي — он, ت — ты/она.</p>","ex":"أَشْرَبُ الشَّايَ.|Я пью чай.\nنَسْكُنُ فِي طَشْقَنْدَ.|Мы живём в Ташкенте.\nهِيَ تَدْرُسُ.|Она учится.","quiz":[["«Мы пишем»:","نَكْتُبُ","أَكْتُبُ","يَكْتُبُ"],["«Она пьёт»:","تَشْرَبُ","يَشْرَبُ","أَشْرَبُ"]]},{"title":"Предлоги","body":"<table><tr><th>Предлог</th><th>Значение</th><th>Пример</th></tr>\n<tr><td>[[فِي]]</td><td>в</td><td>[[فِي الْبَيْتِ]] дома</td></tr>\n<tr><td>[[عَلَى]]</td><td>на</td><td>[[عَلَى الطَّاوِلَةِ]] на столе</td></tr>\n<tr><td>[[مِنْ]]</td><td>из, от</td><td>[[مِنْ رُوسِيَا]] из России</td></tr>\n<tr><td>[[إِلَى]]</td><td>к, в (куда)</td><td>[[إِلَى الْمَدْرَسَةِ]] в школу</td></tr>\n<tr><td>[[مَعَ]]</td><td>с</td><td>[[مَعَ صَدِيقِي]] с другом</td></tr></table>\n<p class=\"tip\">После предлога существительное стоит в родительном падеже — окончание «-и»: [[فِي الْبَيْتِ]].</p>","ex":"أَنَا فِي الْعَمَلِ.|Я на работе.\nذَهَبْتُ إِلَى السُّوقِ مَعَ أُمِّي.|Я пошёл на рынок с мамой.","quiz":[["«Книга ___ столе»: الْكِتَابُ ___ الطَّاوِلَةِ","عَلَى","إِلَى","مِنْ"],["«Я из России»: أَنَا ___ رُوسِيَا","مِنْ","فِي","مَعَ"]]},{"title":"Указательные местоимения","body":"<table><tr><th></th><th>Мужской род</th><th>Женский род</th></tr>\n<tr><td>этот / эта</td><td>[[هَذَا]]</td><td>[[هَذِهِ]]</td></tr>\n<tr><td>тот / та</td><td>[[ذَلِكَ]]</td><td>[[تِلْكَ]]</td></tr></table>\n<p>[[هَذَا كِتَابٌ.]] Это книга. [[هَذَا الْكِتَابُ...]] Эта книга... (с артиклем — «этот»).</p>","ex":"هَذِهِ سَيَّارَتِي.|Это моя машина.\nتِلْكَ الْمَدْرَسَةُ قَدِيمَةٌ.|Та школа старая.","quiz":[["«Это (ж.р.) моя сестра»:","هَذِهِ أُخْتِي","هَذَا أُخْتِي","ذَلِكَ أُخْتِي"],["«Тот мужчина»:","ذَلِكَ الرَّجُلُ","تِلْكَ الرَّجُلُ","هَذِهِ الرَّجُلُ"]]}],"readings":[{"title":"رِحْلَةٌ إِلَى سَمَرْقَنْدَ","tr":"Поездка в Самарканд","sents":"فِي السَّبْتِ الْمَاضِي سَافَرْتُ مَعَ أَصْدِقَائِي إِلَى سَمَرْقَنْدَ.|В прошлую субботу я ездил с друзьями в Самарканд.\nرَكِبْنَا الْقِطَارَ، وَاسْتَغْرَقَتِ الرِّحْلَةُ سَاعَتَيْنِ.|Мы ехали на поезде, поездка заняла два часа.\nكَانَ الطَّقْسُ رَائِعًا وَدَافِئًا.|Погода была прекрасной и тёплой.\nتَجَوَّلْنَا فِي الْمَدِينَةِ وَصَوَّرْنَا الْمَبَانِيَ الْقَدِيمَةَ.|Мы гуляли по городу и фотографировали старые здания.\nثُمَّ أَكَلْنَا الْبِلَوْفَ فِي مَطْعَمٍ.|Потом мы ели плов в ресторане.\nكَانَ لَذِيذًا جِدًّا!|Это было очень вкусно!\nسَأَذْهَبُ إِلَى هُنَاكَ مَرَّةً أُخْرَى بِالتَّأْكِيدِ.|Я обязательно поеду туда ещё раз.","gloss":"السبت|суббота\nالماضي|прошлый\nسافرت|я ездил\nأصدقائي|моих друзей\nسمرقند|Самарканд\nركبنا|мы сели (на транспорт)\nالقطار|поезд\nواستغرقت|и заняла\nالرحلة|поездка\nساعتين|два часа\nكان|был\nالطقس|погода\nرائعا|прекрасный\nودافئا|и тёплый\nتجولنا|мы гуляли\nالمدينة|город\nوصورنا|и фотографировали\nالمباني|здания\nالقديمة|старые\nأكلنا|мы ели\nالبلوف|плов\nمطعم|ресторан\nلذيذا|вкусный\nسأذهب|я пойду / поеду\nهناك|туда, там\nمرة|раз\nأخرى|ещё, другой\nبالتأكيد|обязательно"},{"title":"عُطْلَتِي","tr":"Мои выходные","sents":"يَوْمَ السَّبْتِ اسْتَيْقَظْتُ مُتَأَخِّرًا، فِي السَّاعَةِ الْعَاشِرَةِ.|В субботу я проснулся поздно, в десять часов.\nتَنَاوَلْتُ الْفُطُورَ وَاتَّصَلْتُ بِصَدِيقِي.|Я позавтракал и позвонил другу.\nقَرَّرْنَا أَنْ نَذْهَبَ إِلَى الْحَدِيقَةِ.|Мы решили пойти в парк.\nكَانَ الطَّقْسُ رَائِعًا: دَافِئًا وَمُشْمِسًا.|Погода была прекрасная: тепло и солнечно.\nفِي الْحَدِيقَةِ تَمَشَّيْنَا وَأَكَلْنَا الْمُثَلَّجَاتِ.|В парке мы гуляли и ели мороженое.\nثُمَّ ذَهَبْنَا إِلَى السِّينِمَا.|Потом мы пошли в кино.\nكَانَ الْفِيلْمُ مُضْحِكًا وَضَحِكْنَا كَثِيرًا.|Фильм был смешной, и мы много смеялись.\nيَوْمَ الْأَحَدِ نَظَّفْتُ الشَّقَّةَ وَحَضَّرْتُ الْغَدَاءَ.|В воскресенье я убрал квартиру и приготовил обед.\nفِي الْمَسَاءِ جَاءَ وَالِدَايَ لِزِيَارَتِي.|Вечером ко мне пришли родители.\nشَرِبْنَا الشَّايَ وَتَحَدَّثْنَا عَنِ الْعَائِلَةِ.|Мы пили чай и говорили о семье.\nكَانَتْ عُطْلَةً رَائِعَةً.|Это были отличные выходные.","gloss":""},{"title":"فِي الْمَطَارِ","tr":"В аэропорту","sents":"فِي الْأُسْبُوعِ الْمَاضِي سَافَرْتُ بِالطَّائِرَةِ إِلَى مُوسْكُو.|На прошлой неделе я летал в Москву.\nوَصَلْتُ إِلَى الْمَطَارِ قَبْلَ الرِّحْلَةِ بِسَاعَتَيْنِ.|Я приехал в аэропорт за два часа до вылета.\nأَوَّلًا سَلَّمْتُ حَقِيبَةَ السَّفَرِ.|Сначала я сдал чемодан.\nثُمَّ أَظْهَرْتُ جَوَازَ السَّفَرِ وَالتَّذْكِرَةَ.|Потом я показал паспорт и билет.\nتَأَخَّرَتِ الطَّائِرَةُ سَاعَةً.|Самолёт опоздал на час.\nجَلَسْتُ فِي مَقْهًى وَشَرِبْتُ الْقَهْوَةَ وَقَرَأْتُ كِتَابًا.|Я сидел в кафе, пил кофе и читал книгу.\nاسْتَغْرَقَتِ الرِّحْلَةُ ثَلَاثَ سَاعَاتٍ.|Полёт продолжался три часа.\nكَانَ الْجَوُّ بَارِدًا فِي مُوسْكُو وَكَانَ الثَّلْجُ يَتَسَاقَطُ.|В Москве было холодно, шёл снег.\nمِنَ الْجَيِّدِ أَنَّنِي أَخَذْتُ سُتْرَةً دَافِئَةً!|Хорошо, что я взял тёплую куртку!","gloss":""},{"title":"مِهْنَةُ الْأَحْلَامِ","tr":"Профессия мечты","sents":"أُخْتِي لَيْلَى تَعْمَلُ طَبِيبَةً.|Моя сестра Лейла работает врачом.\nمُنْذُ الْمَدْرَسَةِ كَانَتْ تُرِيدُ مُسَاعَدَةَ النَّاسِ.|Ещё в школе она хотела помогать людям.\nدَرَسَتْ فِي الْجَامِعَةِ سِتَّ سَنَوَاتٍ.|Она училась в университете шесть лет.\nالْآنَ تَعْمَلُ فِي مُسْتَشْفًى كَبِيرٍ.|Теперь она работает в большой больнице.\nيَبْدَأُ يَوْمُ عَمَلِهَا فِي السَّابِعَةِ صَبَاحًا.|Её рабочий день начинается в семь утра.\nأَحْيَانًا تَعْمَلُ فِي اللَّيْلِ أَيْضًا.|Иногда она работает и ночью.\nالْعَمَلُ صَعْبٌ لَكِنَّهُ مُمْتِعٌ.|Работа трудная, но интересная.\nتَقُولُ لَيْلَى إِنَّ هَذِهِ رِسَالَتُهَا فِي الْحَيَاةِ.|Лейла говорит, что это её призвание.","gloss":""}],"dialogues":[{"title":"В магазине одежды","lines":"A|مَرْحَبًا! هَلْ أُسَاعِدُكَ؟|Здравствуйте! Вам помочь?\nB|نَعَمْ، أَبْحَثُ عَنْ مِعْطَفٍ دَافِئٍ.|Да, я ищу тёплое пальто.\nA|مَا مَقَاسُكَ؟|Какой у вас размер?\nB|مُتَوَسِّطٌ.|Средний.\nA|تَفَضَّلْ، هَذَا الْمِعْطَفُ مَشْهُورٌ جِدًّا.|Пожалуйста, это пальто очень популярное.\nB|هَلْ يُمْكِنُنِي أَنْ أُجَرِّبَهُ؟|Можно примерить?\nA|طَبْعًا، غُرْفَةُ الْقِيَاسِ هُنَاكَ.|Конечно, примерочная там.\nB|مُمْتَازٌ، إِنَّهُ مُنَاسِبٌ. بِكَمْ هُوَ؟|Отлично, подходит. Сколько стоит?\nA|بِخَمْسِينَ دِينَارًا.|Пятьдесят динаров.\nB|سَآخُذُهُ. هَلْ يُمْكِنُ الدَّفْعُ بِالْبِطَاقَةِ؟|Беру. Можно оплатить картой?"},{"title":"В гостинице","lines":"A|مَرْحَبًا! عِنْدِي حَجْزٌ بِاسْمِ أَحْمَدَ.|Здравствуйте! У меня бронь на имя Ахмад.\nB|نَهَارُكَ سَعِيدٌ! جَوَازُ سَفَرِكَ مِنْ فَضْلِكَ.|Добрый день! Ваш паспорт, пожалуйста.\nA|تَفَضَّلْ.|Вот, пожалуйста.\nB|غُرْفَتُكَ فِي الطَّابِقِ الثَّالِثِ. هَذَا هُوَ الْمِفْتَاحُ.|Ваш номер на третьем этаже. Вот ключ.\nA|مَتَى الْفُطُورُ؟|Во сколько завтрак?\nB|مِنَ السَّابِعَةِ حَتَّى الْعَاشِرَةِ فِي الْمَطْعَمِ.|С семи до десяти в ресторане.\nA|هَلْ يُوجَدُ إِنْتَرْنِتْ فِي الْغُرْفَةِ؟|А в номере есть интернет?\nB|نَعَمْ، كَلِمَةُ الْمُرُورِ عَلَى الْبِطَاقَةِ.|Да, пароль на карточке.\nA|شُكْرًا!|Спасибо!\nB|إِقَامَةً سَعِيدَةً!|Приятного отдыха!"},{"title":"Планы на выходные","lines":"A|مَاذَا سَتَفْعَلُ يَوْمَ السَّبْتِ؟|Что ты делаешь в субботу?\nB|لَا أَعْرِفُ بَعْدُ. لِمَاذَا؟|Пока не знаю. А что?\nA|لِنَذْهَبْ إِلَى الْجِبَالِ!|Давай пойдём в горы!\nB|فِكْرَةٌ جَيِّدَةٌ. وَكَيْفَ سَيَكُونُ الطَّقْسُ؟|Хорошая идея. А какая будет погода?\nA|يَقُولُونَ إِنَّهُ سَيَكُونُ مُشْمِسًا.|Говорят, будет солнечно.\nB|مُمْتَازٌ! مَتَى نَلْتَقِي؟|Отлично! Во сколько встретимся?\nA|فِي الثَّامِنَةِ صَبَاحًا عِنْدَ الْمِتْرُو.|В восемь утра у метро.\nB|اتَّفَقْنَا. سَأُحْضِرُ الْمَاءَ وَالشَّطَائِرَ.|Договорились. Я возьму воду и бутерброды."},{"title":"У врача","lines":"A|مَا بِكَ؟|Что с вами?\nB|عِنْدِي سُعَالٌ وَزُكَامٌ.|У меня кашель и насморк.\nA|هَلْ عِنْدَكَ حُمَّى؟|Температура есть?\nB|نَعَمْ، كَانَتْ أَمْسِ ثَمَانِيَةً وَثَلَاثِينَ.|Да, вчера была тридцать восемь.\nA|هَذَا زُكَامٌ. اشْرَبْ كَثِيرًا مِنَ الشَّايِ الدَّافِئِ.|Это простуда. Пейте много тёплого чая.\nB|وَهَلْ أَحْتَاجُ إِلَى حُبُوبٍ؟|А таблетки нужно?\nA|نَعَمْ، هَذِهِ وَصْفَةٌ. ثَلَاثَ مَرَّاتٍ يَوْمِيًّا.|Да, вот рецепт. Три раза в день.\nB|شُكْرًا يَا دُكْتُورُ.|Спасибо, доктор."}]},"B1":{"vocab":[{"t":"Работа","w":"💼|عَمَلٌ|работа\n💰|رَاتِبٌ|зарплата\n👔|مُدِيرٌ|начальник\n🤝|زَمِيلٌ|коллега\n🗂️|مُقَابَلَةٌ|собеседование\n🏝️|عُطْلَةٌ|отпуск\n🧠|خِبْرَةٌ|опыт\n📊|اِجْتِمَاعٌ|совещание"},{"t":"Здоровье и эмоции","w":"💪|صِحَّةٌ|здоровье\n🤒|مَرَضٌ|болезнь\n💊|دَوَاءٌ|лекарство\n🤕|أَلَمٌ|боль\n😄|فَرَحٌ|радость\n😢|حُزْنٌ|грусть\n😱|خَوْفٌ|страх\n😠|غَضَبٌ|гнев\n😩|مُتْعَبٌ|уставший"},{"t":"Учёба и технологии","w":"🏛️|جَامِعَةٌ|университет\n
